<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semester execution workspace</title><style>body{font:16px system-ui;margin:24px;color:#17332d;background:#f5f3ee}button{padding:10px;margin:5px}table{border-collapse:collapse;background:white}td,th{padding:10px;min-width:110px;border:1px solid #aaa;text-align:left}.scroll{overflow:auto}button:focus-visible,td:focus-visible{outline:3px solid #926d26}</style><h1>Semester Native Business</h1><p>Local planning only. No live production connection, login, tenant isolation or encrypted storage. Do not enter personal candidate information, student records, privileged advice or sensitive investor details. Export backups.</p><nav id="nav"></nav><button id="add">Add row</button><button id="export">Export current CSV</button><button id="backup">Export JSON</button><p id="msg" role="status" aria-live="polite"></p><div id="view"></div><script>const seed={"roadmap": {"headers": ["days", "start", "end", "phase", "role", "deliverables", "exit_gate", "status"], "rows": [["1-15", "2026-10-08", "2026-10-22", "Audit and scope", "CEO / technical lead", "Inspect canonical routes/models/grants; assign owners/backups; scope pilot", "Canonical source map and blockers reviewed", "Not assessed"], ["16-30", "2026-10-23", "2026-11-06", "Access and capacity", "Platform / operations", "G01 discovery; G02 authorization; Inbox; approved staffing coverage", "Allowed/denied tests and one real owned work item", "Not assessed"], ["31-45", "2026-11-07", "2026-11-21", "Controlled execution", "Backend / implementation", "Approval binding; idempotency; receipts; obligations; failure recovery", "Complete staging workflow with fault evidence", "Not assessed"], ["46-60", "2026-11-22", "2026-12-06", "Readiness rehearsal", "Implementation / trust", "Integration reconciliation; legal/accessibility review; incident/restore training", "Current signed readiness package", "Not assessed"], ["6 ication, entitlement and module state", "Disallowed classification or inactive entitlement denied", "", "", "Not assessed", ""], ["A06", "API/RPC/command", "Authorize every request and execution-time workflow state", "Direct call and altered payload cannot bypass checks", "", "", "Not assessed", ""], ["A07", "Database/RLS", "Inventory policies, views and privileged function exposure", "Other tenant and company-to-student reads/writes denied", "", "", "Not assessed", ""], ["A08", "Files/storage", "Authorize upload/download/object scope; define signed-link lifetime", "Cross-tenant file denied; expiry checked; revocation limitations explicit", "", "", "Not assessed", ""], ["A09", "Search/export/analytics", "Scope retrieval, counts, previews, jobs and export download", "Hidden title/count leak and broader export denied", "", "", "Not assessed", ""], ["A10", "AI/tools/providers", "Check access before retrieval/tool; enforce data/provider policy", "Unauthorized retrieval denied; student records blocked from providers", "", "", "Not assessed", ""], ["A11", "Approval/segregation", "Bind approval to digest/version, approver authority and expiry", "Changed request, stale approval and prohibited self-approval denied", "", "", "Not assessed", ""], ["A12", "Revocation/workers", "Revalidate in active tabs and jobs; reconcile enforcement", "Revoked authority cannot complete queued work", "", "", "Not assessed", ""], ["A13", "Audit/safe errors", "Record actor/scope/decision/correlation without sensitive payload", "Denied requests safe; audit failures follow fail-closed policy", "", "", "Not assessed", ""], ["A14", "Release evidence", "Synthetic allow/deny tests, reviewer signoff, runtime revision", "Missing mandatory evidence blocks activation", "", "", "Not assessed", ""]]}, "funnel_metrics": {"headers": ["funnel", "metric", "definition", "actual", "target_policy"], "rows": [["Hiring", "Screen-to-loop", "Candidates entering loop / screened candidates in same entry cohort", "Not measured", "Baseline first; no assumed benchmark"], ["Hiring", "Offer acceptance", "Accepted offers / issued offers in same cohort", "Not measured", "Review reasons and workload"], ["Hiring", "Time in stage", "Stage exit minus entry; report active-item age separately", "Not measured", "Configure approved service target"], ["Investors", "Positive response", "Unique investors with substantive positive response / unique contacted investors", "Not measured", "Define response taxonomy; baseline first"], ["Investors", "Meeting-to-diligence", "Investors entering diligence / investors with held meetings in same cohort", "Not measured", "No invented conversion target"], ["Investors", "Signed-to-funded", "Investors with reconciled receipts / investors with executed commitments", "Not measured", "Never count interest as cash"], ["Pilot", "Gate pass rate", "Passed applicable checks / applicable reviewed checks; mandatory blocker count separately", "Not measured", "100% mandatory passes before activation"], ["Pilot", "First value", "Eligible onboarded users completing agreed first action / eligible onboarded users in same cohort", "Not measured", "Approve cohort/action before measurement"]]}};let data=seed,key=Object.keys(seed)[0];try{const s=localStorage.getItem('semester-execution-v4');if(s)data=JSON.parse(s)}catch(e){}const $=id=>document.getElementById(id);function el(t,s){const n=document.createElement(t);if(s!==undefined)n.textContent=s;return n}function save(){try{localStorage.setItem('semester-execution-v4',JSON.stringify(data));$('msg').textContent='Saved locally, not server-synced.'}catch(e){$('msg').textContent='Storage unavailable. Export backup.'}}function render(){const v=$('view');v.replaceChildren(el('h2',key.replaceAll('_',' ')));const wrap=el('div');wrap.className='scroll';const tab=el('table'),head=el('tr');data[key].headers.forEach(h=>head.append(el('th',h)));tab.append(head);data[key].rows.forEach((row,i)=>{const r=el('tr');data[key].headers.forEach((h,j)=>{co
