<!-- @dsCard group="Governance & trust" viewport="1280x900" name="Document review board" subtitle="68 missing-document drafts + 7 priority expansions: read each draft, see dependency blockers, assign reviewers, move through review, export the register" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><title>Semester — Document review board</title>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.wrap{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);height:100vh}@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}}.left{border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;min-height:0;background:var(--surface-base)}.head{padding:16px;display:grid;gap:10px;border-bottom:1px solid var(--border-subtle)}.k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin:0}h1{font:600 22px var(--font-heading);margin:0}.muted{color:var(--text-secondary);font-size:12.5px}.chips{display:flex;gap:5px;flex-wrap:wrap}.chips button,.btn2{white-space:nowrap}.chips button{all:unset;cursor:pointer;padding:3px 9px;border-radius:999px;border:1px solid var(--border-default);background:var(--surface-base);font-size:12px}.chips button[aria-pressed=true]{white-space:nowrap;border-color:var(--action-primary);background:var(--action-secondary);font-weight:600}.chips button:focus-visible,.item:focus-visible{outline:2px solid var(--action-primary)}input,select,textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);color:var(--text-primary)}.list{overflow:auto;flex:1;padding:6px}.item{all:unset;box-sizing:border-box;display:grid;gap:2px;width:100%;padding:8px 10px;border-radius:6px;cursor:pointer;border-left:3px solid transparent}.item:hover{background:var(--surface-raised)}.item.on{border-left-color:var(--action-primary);background:var(--surface-raised)}.item b{font-size:13px}.item span{font-size:11.5px;color:var(--text-secondary)}.pill{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid currentColor;margin-right:4px}.p0{color:var(--status-danger)}.p1{color:var(--status-pending)}.ok{color:var(--status-success)}.right{overflow:auto;min-height:0}.doc{max-width:860px;margin:0 auto;padding:24px 28px 64px;display:grid;gap:16px}.panel{border:1px solid var(--border-subtle);border-radius:8px;padding:12px 14px;background:var(--surface-base);display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row label{display:grid;gap:3px;font-size:12px;color:var(--text-secondary)}.md{line-height:1.55;font-size:14px}.md h1{font:600 24px var(--font-heading);margin:0 0 8px}.md h2{font:600 18px var(--font-heading);margin:18px 0 6px}.md h3{font:600 15px var(--font-heading);margin:14px 0 4px}.md table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}.md th,.md td{border-bottom:1px solid var(--border-subtle);padding:5px 7px;text-align:left;vertical-align:top}.md th{color:var(--text-secondary);font-weight:600}.md code{font-family:var(--font-mono);font-size:12px;background:var(--surface-raised);padding:1px 4px;border-radius:3px}.md ul,.md ol{padding-left:20px;margin:6px 0}.btn2{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;border:1px solid var(--border-default);font-size:13px;background:var(--surface-base)}.btn2.pri{background:var(--action-primary);color:var(--action-primary-fg,#fff);border-color:var(--action-primary)}.btn2[disabled]{opacity:.45;cursor:not-allowed}.btn2:focus-visible{outline:2px solid var(--action-primary)}.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-raised)}.bar i{display:block}</style></head><body>
<div class="wrap"><div class="left"><div class="head"><p class="k">Documents · review</p><h1>Draft review board</h1><p class="muted" id="sum">Loading…</p><div class="bar" id="bar"></div><input id="q" placeholder="Search title, owner, dependency" aria-label="Search drafts"><div class="chips" id="pri" role="group" aria-label="Priority"></div><div class="chips" id="st" role="group" aria-label="Review status"></div><select id="cat" aria-label="Category"></select><div class="row"><a class="btn2" href="audit.html">Audit workbench</a><button class="btn2" id="exp">Export register CSV</button><button class="btn2" id="rst">Reset review state</button></div></div><div class="list" id="list"></div></div>
<div class="right"><div class="doc" id="doc"><p class="muted">Pick a draft.</p></div></div></div>
<script>
const BASE='./', ST=['Not reviewed','In review','Changes requested','Approved for scope'], KEY='sem-draft-review';
let D=[], S={}, sel=null, f={q:'',pri:[],st:[],cat:''};
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const csv=(t)=>{const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!='\r')c+=ch}if(c||r.length){r.push(c);rows.push(r)}const h=rows.shift();return rows.filter(x=>x.length>1).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||''])))};
const esc=(s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const inl=(s)=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="#" data-link="$2">$1</a>');
function md(t){const L=t.split('\n'),o=[];let i=0;while(i<L.length){const l=L[i];if(/^#{1,3} /.test(l)){const n=l.match(/^#+/)[0].length;o.push('<h'+n+'>'+inl(l.slice(n+1))+'</h'+n+'>');i++}else if(/^\|/.test(l)){const rs=[];while(i<L.length&&/^\|/.test(L[i]))rs.push(L[i++]);const cells=rs.filter(r=>!/^\|[\s:|-]+\|?$/.test(r)).map(r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));o.push('<table><thead><tr>'+cells[0].map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+cells.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>')}else if(/^\s*[-*] /.test(l)){const it=[];while(i<L.length&&/^\s*[-*] /.test(L[i]))it.push('<li>'+inl(L[i++].replace(/^\s*[-*] /,''))+'</li>');o.push('<ul>'+it.join('')+'</ul>')}else if(/^\d+\. /.test(l)){const it=[];while(i<L.length&&/^\d+\. /.test(L[i]))it.push('<li>'+inl(L[i++].replace(/^\d+\. /,''))+'</li>');o.push('<ol>'+it.join('')+'</ol>')}else if(!l.trim()){i++}else{const p=[];while(i<L.length&&L[i].trim()&&!/^(#|\||\s*[-*] |\d+\. )/.test(L[i]))p.push(L[i++]);o.push('<p>'+inl(p.join(' '))+'</p>')}}return o.join('')}
const st=(d)=>(S[d.document]||{}).status||d.approval_status||'Not reviewed';
const deps=(d)=>(d.dependencies||'').split(';').map(x=>x.trim()).filter(Boolean);
const blockers=(d)=>deps(d).filter(x=>{const e=D.find(y=>y.document===x);return !e||st(e)!=='Approved for scope'});
function chips(id,opts,arr,key){const el=document.getElementById(id);el.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');const n=D.filter(d=>(key==='pri'?d.priority:st(d))===o).length;b.textContent=o+' · '+n;b.setAttribute('aria-pressed',arr.includes(o));b.onclick=()=>{f[key]=arr.includes(o)?arr.filter(x=>x!==o):[...arr,o];render()};el.appendChild(b)})}
function render(){const vis=D.filter(d=>(!f.q||(d.document+d.proposed_owner+d.dependencies+d.category).toLowerCase().includes(f.q.toLowerCase()))&&(!f.pri.length||f.pri.includes(d.priority))&&(!f.st.length||f.st.includes(st(d)))&&(!f.cat||d.category===f.cat));
 chips('pri',['P0','P1','Expansion'],f.pri,'pri');chips('st',ST,f.st,'st');
 const c=ST.map(s=>D.filter(d=>st(d)===s).length);document.getElementById('sum').textContent=D.length+' drafts · '+c[3]+' approved for scope · '+c[1]+' in review · '+c[2]+' need changes · '+c[0]+' not reviewed. Approval here is a review state, not activation.';
 document.getElementById('bar').innerHTML=c.map((n,i)=>'<i style="width:'+(n/D.length*100)+'%;background:'+['var(--border-strong)','var(--status-pending)','var(--status-danger)','var(--status-success)'][i]+'"></i>').join('');
 const L=document.getElementById('list');L.innerHTML='';vis.forEach(d=>{const b=document.createElement('button');b.className='item'+(sel===d.document?' on':'');const s=st(d),bl=blockers(d).length;b.innerHTML='<b>'+esc(d.title)+'</b><span><i class="pill '+(d.priority==='P0'?'p0':d.priority==='P1'?'p1':'')+'">'+d.priority+'</i>'+esc(d.category)+' · <span class="'+(s==='Approved for scope'?'ok':s==='Changes requested'?'p0':'')+'">'+s+'</span>'+(bl?' · '+bl+' blocking dep'+(bl>1?'s':''):'')+'</span>';b.onclick=()=>open(d.document);L.appendChild(b)});if(!vis.length)L.innerHTML='<p class="muted" style="padding:10px">No drafts match.</p>'}
async function open(id){sel=id;render();const d=D.find(x=>x.document===id);const s=S[id]||{};const el=document.getElementById('doc');el.innerHTML='<p class="muted">Loading draft…</p>';let t='';try{t=await (await fetch(BASE+d.path)).text()}catch(e){t='# '+d.title+'\n\nCouldn’t load '+d.path}
 const bl=blockers(d),status=st(d);
 el.innerHTML='<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><span class="k">'+esc(d.category)+' · '+d.priority+' · '+esc(d.proposed_owner||'')+'</span><a href="'+BASE+d.path+'" target="_blank" rel="noreferrer">Open .md ↗</a></div>'
 +'<div class="row"><label>Institutional owner<input id="io" value="'+esc(s.io||'')+'" placeholder="Named person"></label><label>Reviewer<input id="rv" value="'+esc(s.rv||'')+'" placeholder="Qualified reviewer"></label><label>Review due<input id="due" type="date" value="'+(s.due||'')+'"></label></div>'
 +'<label style="display:grid;gap:3px;font-size:12px;color:var(--text-secondary)">Review notes<textarea id="nt" rows="2">'+esc(s.notes||'')+'</textarea></label>'
 +(bl.length?'<p class="muted" style="margin:0"><b class="p0">Blocked for approval:</b> depends on '+bl.map(x=>'<a href="#" data-doc="'+x+'">'+x+'</a>').join(', ')+' (not yet approved for scope).</p>':deps(d).length?'<p class="muted ok" style="margin:0">All dependencies approved for scope.</p>':'')
 +'<div class="row" style="align-items:center"><span class="muted">Status: <b>'+status+'</b></span>'+ST.map(x=>'<button class="btn2'+(x==='Approved for scope'?' pri':'')+'" data-st="'+x+'"'+((x==='Approved for scope'&&(bl.length||!s.rv||!s.io))||x===status?' disabled':'')+'>'+x+'</button>').join('')+'</div>'
 +((!s.rv||!s.io)?'<p class="muted" style="margin:0">Approval needs a named institutional owner and reviewer.</p>':'')+'<p class="muted" style="margin:0">Approved for scope means the text is accepted for a named scope. It doesn’t mean implemented, tested, deployed or production-enabled.</p></div><article class="md">'+md(t)+'</article>';
 const upd=(p)=>{S[id]={...(S[id]||{}),...p,at:new Date().toISOString()};save()};
 ['io','rv','due','nt'].forEach(k=>{const x=document.getElementById(k);x.onchange=()=>{upd({[k==='nt'?'notes':k]:x.value});open(id)}});
 el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{upd({status:b.dataset.st});open(id)});
 el.querySelectorAll('[data-doc]').forEach(a=>a.onclick=(e)=>{e.preventDefault();open(a.dataset.doc)});
 el.querySelectorAll('[data-link]').forEach(a=>a.onclick=(e)=>{e.preventDefault();const m=a.dataset.link.match(/(\d{2})-/);const t=m&&D.find(x=>x.path.includes('/'+m[1]+'-'));if(t)open(t.document)});
 document.querySelector('.right').scrollTop=0}
document.getElementById('q').oninput=(e)=>{f.q=e.target.value;render()};
document.getElementById('cat').onchange=(e)=>{f.cat=e.target.value;render()};
document.getElementById('rst').onclick=()=>{if(!confirm('Clear all review notes, owners and statuses on this device?'))return;S={};save();sel&&open(sel);render()};
document.getElementById('exp').onclick=()=>{const H=['document','category','priority','proposed_owner','path','dependencies','institutional_owner','reviewer','review_due','approval_status','notes'];const q=(v)=>'"'+String(v||'').replace(/"/g,'""')+'"';const rows=[H.join(','),...D.map(d=>{const s=S[d.document]||{};return [d.document,d.category,d.priority,d.proposed_owner,d.path,d.dependencies,s.io,s.rv,s.due,st(d),s.notes].map(q).join(',')})];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\r\n')],{type:'text/csv'}));a.download='semester-review-register.csv';a.click()};
(async()=>{const [r1,r2]=await Promise.all([fetch(BASE+'missing-docs/review-register.csv').then(r=>r.text()),fetch(BASE+'priority-register.csv').then(r=>r.text())]);const pr=Object.fromEntries(csv(r2).map(x=>[x.document,x.review_priority]));
 D=csv(r1).map(x=>({...x,title:x.document.replace(/_/g,' ').toLowerCase().replace(/^./,c=>c.toUpperCase()).replace(/\b(ai|os|sis|erp|lti|hecvat|kpi|slo|sdlc|api|edu)\b/gi,m=>m.toUpperCase()),priority:pr[x.document]||'P1',path:'missing-docs/'+x.draft_path}));
 [['Control evidence register','Trust & compliance','expansions/trust-compliance/01-control-evidence-register.md'],['Data, subprocessor and transfer register','Trust & compliance','expansions/trust-compliance/02-data-subprocessor-and-transfer-register.md'],['Privacy rights and retention operations','Trust & compliance','expansions/trust-compliance/03-privacy-rights-and-retention-operations.md'],['Trust Center and procurement evidence','Trust & compliance','expansions/trust-compliance/04-trust-center-and-procurement-evidence.md'],['Trust exercise plan','Trust & compliance','expansions/trust-compliance/05-trust-exercise-plan.md'],['Engineering reliability and release gates','Engineering & operations','expansions/engineering-reliability-release-gates.md'],['AI policy and audit review','AI governance','expansions/ai-policy-and-audit-review.md']].forEach(([t,c,p])=>D.push({document:'PRIORITY_'+t.toUpperCase().replace(/[^A-Z]+/g,'_'),title:t,category:c,priority:'Expansion',proposed_owner:'See document',path:'priority-pack/'+p,dependencies:'',approval_status:'Not reviewed'}));
 ['ACADEMIC_INTEGRITY_POLICY','ACADEMIC_RECORD_LEDGER_SPEC','ASSESSMENT_AND_GRADEBOOK_SPEC','COURSE_STUDIO_SPEC','DEGREE_AUDIT_SPEC','FACULTY_WORKSPACE_SPEC','LEARNING_OBJECTIVE_MODEL','REGISTRATION_ENGINE_SPEC','STUDENT_SUCCESS_MODEL','TRANSFER_AND_ARTICULATION_SPEC'].forEach(n=>D.push({document:'AUDIT_'+n,title:n.replace(/_/g,' ').toLowerCase().replace(/^./,c=>c.toUpperCase())+' (expanded)',category:'Audit pack · academic',priority:'Expansion',proposed_owner:'Registrar + faculty + SIS owner',path:'audit-pack/academic/'+n+'.md',dependencies:n,approval_status:'Not reviewed'}));
 [['AI red team execution plan','AI_RED_TEAM_EXECUTION_PLAN.md'],['Security and privacy review','SECURITY_PRIVACY_REVIEW.md']].forEach(([t,p])=>D.push({document:'AUDIT_'+p.replace('.md',''),title:t,category:'Audit pack',priority:'Expansion',proposed_owner:'Security/privacy + AI governance',path:'audit-pack/'+p,dependencies:'',approval_status:'Not reviewed'}));
 const cs=[...new Set(D.map(d=>d.category))];const c=document.getElementById('cat');c.innerHTML='<option value="">All categories ('+cs.length+')</option>'+cs.map(x=>'<option>'+esc(x)+'</option>').join('');render();open(D[0].document)})().catch(e=>{document.getElementById('sum').textContent='Couldn’t load the registers: '+e.message});
</script></body></html>
