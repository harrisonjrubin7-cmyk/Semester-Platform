<!-- @dsCard group="Governance & trust" viewport="1280x900" name="Audit workbench" subtitle="78 audit checks in 13 families, 36 AI red-team cases, 12 security/privacy findings: record evidence, see what blocks activation, export" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><title>Semester — Audit workbench</title>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.page{max-width:1240px;margin:0 auto;padding:22px 24px 64px;display:grid;gap:16px}.k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin:0}h1{font:600 26px var(--font-heading);margin:2px 0 0}.muted{color:var(--text-secondary);font-size:12.5px}.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-subtle)}.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-size:14px;border-bottom:2px solid transparent}.tabs button[aria-selected=true]{border-bottom-color:var(--action-primary);font-weight:600}.tabs button:focus-visible,.chips button:focus-visible{outline:2px solid var(--action-primary)}.chips{display:flex;gap:5px;flex-wrap:wrap}.chips button{all:unset;cursor:pointer;padding:3px 9px;border-radius:999px;border:1px solid var(--border-default);background:var(--surface-base);font-size:12px;white-space:nowrap}.chips button[aria-pressed=true]{border-color:var(--action-primary);background:var(--action-secondary);font-weight:600}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.tile{border:1px solid var(--border-subtle);border-radius:8px;padding:10px 12px;background:var(--surface-base)}.tile b{display:block;font:600 24px var(--font-heading)}table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border-strong);padding:6px;position:sticky;top:0;background:var(--surface-canvas)}td{border-bottom:1px solid var(--border-subtle);padding:6px;vertical-align:top}select,input{font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid var(--border-default);border-radius:5px;background:var(--surface-base);color:var(--text-primary);max-width:100%}.p0{color:var(--status-danger)}.ok{color:var(--status-success)}.warn{color:var(--status-pending)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn2{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;border:1px solid var(--border-default);font-size:13px;background:var(--surface-base);white-space:nowrap}.btn2:focus-visible{outline:2px solid var(--action-primary)}.fam{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}.fam div{border:1px solid var(--border-subtle);border-radius:6px;padding:8px 10px;background:var(--surface-base);font-size:12.5px;display:grid;gap:4px}.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-raised)}.bar i{display:block}</style></head><body><div class="page">
<header class="row" style="justify-content:space-between;align-items:end"><div><p class="k">Master control · comprehensive audit pack (2026-10-07)</p><h1>Audit workbench</h1><p class="muted" style="margin:4px 0 0">Proposed audit materials. Nothing here is a completed audit, a test run, or a certification. Statuses you set stay on this device.</p></div><div class="row"><a href="index.html">Document review board</a><button class="btn2" id="exp">Export CSV</button><button class="btn2" id="rst">Reset</button></div></header>
<div class="tabs" role="tablist"><button role="tab" data-t="chk" aria-selected="true">Audit checklist</button><button role="tab" data-t="rt" aria-selected="false">AI red team</button><button role="tab" data-t="sp" aria-selected="false">Security & privacy findings</button></div>
<div id="tiles" class="tiles"></div><div id="ctl"></div><div id="body"></div></div>
<script>
const KEY='sem-audit-wb';let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const csv=(t)=>{const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!='\r')c+=ch}if(c||r.length){r.push(c);rows.push(r)}const h=rows.shift();return rows.filter(x=>x.length>1).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||''])))};
const esc=(s)=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let C=[],R=[],F=[],tab='chk',flt={fam:[],st:[],sev:[]};
const CST=['Not assessed','In progress','Pass','Fail','Exception (time-bound)'],RST=['Not run','Pass','Fail','Blocked'],FST=['Open','Evidence requested','Resolved (evidence attached)'];
const get=(id,k,d)=>(S[id]||{})[k]||d;const set=(id,k,v)=>{S[id]={...(S[id]||{}),[k]:v,at:new Date().toISOString()};save();draw()};
const tile=(l,v,c)=>'<div class="tile"><span class="muted">'+l+'</span><b class="'+(c||'')+'">'+v+'</b></div>';
function chips(label,opts,key){return '<div class="row" style="margin:4px 0"><span class="muted" style="min-width:64px">'+label+'</span><div class="chips">'+opts.map(o=>'<button data-f="'+key+'" data-v="'+esc(o)+'" aria-pressed="'+flt[key].includes(o)+'">'+esc(o)+'</button>').join('')+'</div></div>'}
function draw(){document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));const T=document.getElementById('tiles'),X=document.getElementById('ctl'),B=document.getElementById('body');
 if(tab==='chk'){const st=c=>get(c.control_id,'status','Not assessed');const fams=[...new Set(C.map(c=>c.domain))];const fail=C.filter(c=>st(c)==='Fail'),p0open=C.filter(c=>c.priority==='P0'&&st(c)!=='Pass'),exp=C.filter(c=>st(c)==='Exception (time-bound)'&&!get(c.control_id,'expiry',''));
  T.innerHTML=tile('Checks',C.length)+tile('Passed with evidence',C.filter(c=>st(c)==='Pass'&&get(c.control_id,'ev','')).length,'ok')+tile('Failed',fail.length,fail.length?'p0':'')+tile('P0 not yet passed',p0open.length,p0open.length?'warn':'ok')+tile('Activation',fail.length||p0open.length?'Blocked':'Not blocked by checklist',fail.length||p0open.length?'p0':'ok');
  X.innerHTML='<div class="fam">'+fams.map(f=>{const cs=C.filter(c=>c.domain===f);const n=CST.map(s=>cs.filter(c=>st(c)===s).length);return '<div><b>'+esc(f)+'</b><div class="bar">'+n.map((v,i)=>'<i style="width:'+(v/cs.length*100)+'%;background:'+['var(--border-strong)','var(--status-pending)','var(--status-success)','var(--status-danger)','var(--action-primary)'][i]+'"></i>').join('')+'</div><span class="muted">'+n[2]+' pass · '+n[3]+' fail · '+n[0]+' not assessed</span></div>'}).join('')+'</div>'+chips('Family',fams,'fam')+chips('Status',CST,'st')+(exp.length?'<p class="muted p0">'+exp.length+' exception(s) without an expiry date. Exceptions must expire.</p>':'');
  const vis=C.filter(c=>(!flt.fam.length||flt.fam.includes(c.domain))&&(!flt.st.length||flt.st.includes(st(c))));
  B.innerHTML='<div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>Assertion</th><th>P</th><th>Status</th><th>Evidence reference</th><th>Reviewer</th><th>Exception expiry</th></tr></thead><tbody>'+vis.map(c=>{const id=c.control_id,s=st(c);const needEv=s==='Pass'&&!get(id,'ev','');return '<tr><td><b>'+id+'</b></td><td>'+esc(c.audit_assertion)+'<div class="muted">'+esc(c.blocking_rule)+'</div></td><td class="'+(c.priority==='P0'?'p0':'')+'">'+c.priority+'</td><td><select data-id="'+id+'" data-k="status">'+CST.map(x=>'<option'+(x===s?' selected':'')+'>'+x+'</option>').join('')+'</select>'+(needEv?'<div class="muted p0">Pass needs evidence</div>':'')+'</td><td><input data-id="'+id+'" data-k="ev" value="'+esc(get(id,'ev',''))+'" placeholder="Run ID, hash or link"></td><td><input data-id="'+id+'" data-k="rv" value="'+esc(get(id,'rv',''))+'" placeholder="Independent reviewer"></td><td>'+(s==='Exception (time-bound)'?'<input type="date" data-id="'+id+'" data-k="expiry" value="'+esc(get(id,'expiry',''))+'">':'—')+'</td></tr>'}).join('')+'</tbody></table></div>'}
 if(tab==='rt'){const st=r=>get(r.case_id,'status','Not run');const surf=[...new Set(R.map(r=>r.surface))];const critFail=R.filter(r=>r.severity_if_failed==='Critical'&&st(r)==='Fail');const critNot=R.filter(r=>r.severity_if_failed==='Critical'&&st(r)!=='Pass');
  T.innerHTML=tile('Cases',R.length)+tile('Passed',R.filter(r=>st(r)==='Pass').length,'ok')+tile('Failed',R.filter(r=>st(r)==='Fail').length,'p0')+tile('Critical not passed',critNot.length,critNot.length?'warn':'ok')+tile('AI release',critFail.length?'Stopped: critical failure':critNot.length?'Not eligible':'Eligible for review',critFail.length?'p0':critNot.length?'warn':'ok');
  X.innerHTML=chips('Surface',surf,'fam')+chips('Status',RST,'st')+chips('Severity',[...new Set(R.map(r=>r.severity_if_failed))],'sev')+'<p class="muted">Synthetic fixtures only. Provider sandboxes only if approved. A critical failure stops the run and blocks AI release until a fix passes a re-run.</p>';
  const vis=R.filter(r=>(!flt.fam.length||flt.fam.includes(r.surface))&&(!flt.st.length||flt.st.includes(st(r)))&&(!flt.sev.length||flt.sev.includes(r.severity_if_failed)));
  B.innerHTML='<div style="overflow-x:auto"><table><thead><tr><th>Case</th><th>Scenario</th><th>Fixture and expected result</th><th>Severity</th><th>Status</th><th>Actual result</th></tr></thead><tbody>'+vis.map(r=>{const id=r.case_id,s=st(r);return '<tr><td><b>'+id+'</b><div class="muted">'+esc(r.surface)+'</div></td><td>'+esc(r.scenario)+'</td><td class="muted">'+esc(r.fixture_and_expected_result)+'</td><td class="'+(r.severity_if_failed==='Critical'?'p0':r.severity_if_failed==='High'?'warn':'')+'">'+esc(r.severity_if_failed)+'</td><td><select data-id="'+id+'" data-k="status">'+RST.map(x=>'<option'+(x===s?' selected':'')+'>'+x+'</option>').join('')+'</select></td><td><input data-id="'+id+'" data-k="ev" value="'+esc(get(id,'ev',''))+'" placeholder="What happened">'+(s!=='Not run'&&!get(id,'ev','')?'<div class="muted p0">Record the actual result</div>':'')+'</td></tr>'}).join('')+'</tbody></table></div>'}
 if(tab==='sp'){const st=f=>get(f.id,'status','Open');const p0=F.filter(f=>f.p==='P0'&&st(f)!=='Resolved (evidence attached)');
  T.innerHTML=tile('Findings',F.length)+tile('P0 open',p0.length,p0.length?'p0':'ok')+tile('Resolved with evidence',F.filter(f=>st(f).startsWith('Resolved')).length,'ok');X.innerHTML='<p class="muted">From SECURITY_PRIVACY_REVIEW.md. Resolving needs an evidence reference; a finding isn’t closed by saying so.</p>';
  B.innerHTML='<div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>P</th><th>Finding</th><th>Required resolution</th><th>Status</th><th>Evidence</th></tr></thead><tbody>'+F.map(f=>{const s=st(f),ev=get(f.id,'ev','');return '<tr><td><b>'+f.id+'</b></td><td class="'+(f.p==='P0'?'p0':'')+'">'+f.p+'</td><td>'+esc(f.f)+'</td><td class="muted">'+esc(f.r)+'</td><td><select data-id="'+f.id+'" data-k="status">'+FST.map(x=>'<option'+(x===s?' selected':'')+(x.startsWith('Resolved')&&!ev?' disabled':'')+'>'+x+'</option>').join('')+'</select></td><td><input data-id="'+f.id+'" data-k="ev" value="'+esc(ev)+'" placeholder="Evidence reference"></td></tr>'}).join('')+'</tbody></table></div>'}
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const k=b.dataset.f,v=b.dataset.v;flt[k]=flt[k].includes(v)?flt[k].filter(x=>x!==v):[...flt[k],v];draw()});
 document.querySelectorAll('[data-id]').forEach(el=>el.onchange=()=>set(el.dataset.id,el.dataset.k,el.value))}
document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;flt={fam:[],st:[],sev:[]};draw()});
document.getElementById('rst').onclick=()=>{if(confirm('Clear every status, evidence reference and reviewer you recorded here?')){S={};save();draw()}};
document.getElementById('exp').onclick=()=>{const q=v=>'"'+String(v||'').replace(/"/g,'""')+'"';const rows=[['kind','id','priority_or_severity','title','status','evidence','reviewer','expiry'].join(',')];C.forEach(c=>rows.push(['check',c.control_id,c.priority,c.audit_assertion,get(c.control_id,'status','Not assessed'),get(c.control_id,'ev',''),get(c.control_id,'rv',''),get(c.control_id,'expiry','')].map(q).join(',')));R.forEach(r=>rows.push(['red_team',r.case_id,r.severity_if_failed,r.scenario,get(r.case_id,'status','Not run'),get(r.case_id,'ev',''),'',''].map(q).join(',')));F.forEach(f=>rows.push(['finding',f.id,f.p,f.f,get(f.id,'status','Open'),get(f.id,'ev',''),'',''].map(q).join(',')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\r\n')],{type:'text/csv'}));a.download='semester-audit-workbench.csv';a.click()};
(async()=>{const b='audit-pack/';const [c,r,s]=await Promise.all([fetch(b+'audit-checklist.csv').then(x=>x.text()),fetch(b+'ai-red-team-cases.csv').then(x=>x.text()),fetch(b+'SECURITY_PRIVACY_REVIEW.md').then(x=>x.text())]);C=csv(c);R=csv(r);F=s.split('\n').filter(l=>/^\| SP-\d+/.test(l)).map(l=>{const p=l.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());return {id:p[0],p:p[1],f:p[2],r:p[3]}});draw()})().catch(e=>{document.getElementById('body').innerHTML='<p class="p0">Couldn’t load the audit pack: '+esc(e.message)+'</p>'});
</script></body></html>
