<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semester — Launch grant traction tracker</title><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:#f4f1ea;color:#1b1a17;font-family:'Barlow',sans-serif}a{color:#416180}a:hover{color:#1d2d3d}.w{max-width:1080px;margin:0 auto;padding:36px 24px 64px;display:grid;gap:22px}h1{font:600 34px 'Barlow Condensed',sans-serif;margin:0}.k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#5d5d60}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}.m{background:#fbf9f4;border:1px solid rgba(27,26,23,.16);border-radius:8px;padding:14px 16px;display:grid;gap:8px}.m label{font-size:13.5px;color:#424244}.m input{font:600 26px 'Barlow Condensed',sans-serif;width:100%;box-sizing:border-box;padding:6px 10px;border:1px solid rgba(27,26,23,.3);border-radius:4px;background:#fff;min-height:44px}.m input:focus-visible,button:focus-visible{outline:2px solid #4f7397;outline-offset:2px}.bar{height:6px;background:rgba(27,26,23,.1);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:#416180}.t{font-size:12.5px;color:#5d5d60;font-variant-numeric:tabular-nums}.st{font-size:12.5px;font-weight:600}.list{display:grid;border-top:1px solid rgba(27,26,23,.16)}.list label{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(27,26,23,.1);cursor:pointer;align-items:flex-start}.list input{width:18px;height:18px;margin:2px 0 0;accent-color:#416180}.done span{text-decoration:line-through;color:#5d5d60}button{font:inherit;padding:10px 16px;border-radius:6px;border:1px solid rgba(27,26,23,.3);background:#fff;cursor:pointer;min-height:44px}</style></head><body><div class="w">
<img src="../../assets/logo-horizontal.svg" alt="Semester" style="height:28px;justify-self:start">
<div><div class="k">Chancellor’s Launch Grants · 2–3 month traction window</div><h1>Traction tracker</h1><p class="t" style="margin:6px 0 0">Saved on this device. Update weekly; the numbers feed the follow-up pitch and the weekly sponsor email.</p></div>
<div class="g" id="metrics"></div>
<div class="k">Milestones</div><div class="list" id="ms"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap"><button id="copy">Copy weekly summary</button><span class="t" id="msg" role="status"></span></div>
</div><script>
const KEY='sem-grant-traction-v1';const M=[['accounts','Named target accounts',40],['discovery','Discovery calls held',15],['demos','Demos given',6],['designs','Pilot designs in review',3],['signed','Paid pilots signed (incl. Vanderbilt)',3],['wau','Vanderbilt weekly active students',300],['ready','Cohort ready for registration (%)',60],['revenue','Contracted revenue ($)',30000]];
const S=['Incorporated (entity + EIN)','83(b) filed within 30 days','Business bank account open','Grant check deposited','Insurance bound','Counsel review of MSA/DPA/order form','Vanderbilt DPA signed','Vanderbilt pilot live','Tracker reviewed with master mentor','Midpoint review held','Case-study permission in writing','Follow-up pitch deck updated'];
let st=JSON.parse(localStorage.getItem(KEY)||'{}');st.v=st.v||{};st.d=st.d||{};const save=()=>localStorage.setItem(KEY,JSON.stringify(st));
const fmt=(k,v)=>k==='revenue'?'$'+(+v||0).toLocaleString('en-US'):(+v||0).toLocaleString('en-US');
function render(){document.getElementById('metrics').innerHTML=M.map(([k,l,g])=>{const v=+st.v[k]||0;const p=Math.min(100,Math.round(v/g*100));const s=p>=100?'✓ Target met':p>=60?'On track':p>0?'Behind':'Not started';return '<div class="m"><label for="'+k+'">'+l+'</label><input id="'+k+'" type="number" min="0" inputmode="numeric" value="'+(st.v[k]??'')+'"><div class="bar"><i style="width:'+p+'%"></i></div><div class="t">'+fmt(k,v)+' of '+fmt(k,g)+' · <span class="st">'+s+'</span></div></div>'}).join('');
M.forEach(([k])=>document.getElementById(k).addEventListener('change',e=>{st.v[k]=e.target.value;save();render();document.getElementById(k).focus();}));
document.getElementById('ms').innerHTML=S.map((s,i)=>'<label class="'+(st.d[i]?'done':'')+'"><input type="checkbox" data-i="'+i+'" '+(st.d[i]?'checked':'')+'><span>'+s+'</span></label>').join('');
document.querySelectorAll('#ms input').forEach(c=>c.addEventListener('change',e=>{st.d[e.target.dataset.i]=e.target.checked;save();render();}));}
document.getElementById('copy').addEventListener('click',()=>{const t='Semester traction · week of '+new Date().toLocaleDateString('en-US')+'\n'+M.map(([k,l,g])=>'• '+l+': '+fmt(k,st.v[k])+' / '+fmt(k,g)).join('\n')+'\nMilestones: '+S.filter((s,i)=>st.d[i]).length+' of '+S.length+' done';navigator.clipboard?.writeText(t).then(()=>document.getElementById('msg').textContent='Copied.',()=>document.getElementById('msg').textContent='Copy failed; select and copy manually.');});
render();</script></body></html>
