<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><script src="../platform/appearance.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><title>Semester — Native operations OS</title>
<style>html,body,#root{height:100%}body{margin:0;overflow:hidden}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}.main{display:flex;flex-direction:column;min-width:0;height:100%}.scroll{flex:1;overflow:auto}.page{max-width:1240px;margin:0 auto;padding:24px var(--page-pad) 64px;display:grid;gap:20px}.ph{padding-bottom:16px;border-bottom:1px solid var(--border-subtle)}.ph h1{margin:4px 0 0;text-wrap:pretty}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.lead{color:var(--text-secondary);max-width:76ch;margin:6px 0 0;line-height:1.55;text-wrap:pretty}.muted{color:var(--text-secondary);font-size:13px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}.card{border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);padding:14px 16px;display:grid;gap:8px;align-content:start}.card h3{margin:0;font:600 17px var(--font-heading)}button.card{all:unset;box-sizing:border-box;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);padding:14px 16px;display:grid;gap:8px;align-content:start;cursor:pointer}button.card:hover,button.card:focus-visible{border-color:var(--focus-color);outline:none}button.card[aria-pressed=true]{border-color:var(--action-primary);box-shadow:inset 0 0 0 1px var(--action-primary)}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;border:1px solid var(--border-default);border-radius:3px;padding:2px 7px;font-size:12px}.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{text-align:left;font-weight:500;color:var(--text-secondary);border-bottom:1px solid var(--border-strong);padding:6px 8px}.tbl td{border-bottom:1px solid var(--border-subtle);padding:7px 8px;vertical-align:top}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:18px;align-items:start}@media(max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}.drawer{position:sticky;top:12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-base);padding:16px;display:grid;gap:10px}.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 10px;font-size:13px}.kv b{font-weight:500;color:var(--text-secondary)}.pipe{display:grid;gap:4px}.pipe div{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;padding:7px 10px;border:1px solid var(--border-subtle);border-radius:4px;font-size:13.5px;background:var(--surface-base)}.pipe div.on{border-color:var(--text-primary);box-shadow:inset 3px 0 0 var(--text-primary)}.pipe div.done{background:var(--surface-sunken)}.pipe div.stop{border-color:#a33b3b;box-shadow:inset 3px 0 0 #a33b3b}.pipe i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--text-secondary)}.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font-size:13px;color:var(--text-secondary)}.form select,.form input{font:inherit;font-size:14px;color:var(--text-primary,#1b1a17);padding:7px 9px;border:1px solid var(--border-default);border-radius:4px;background:var(--surface-base)}.ok{color:#2f7a4f}.bad{color:#a33b3b}.tok{font-family:ui-monospace,monospace;font-size:12px}.score{display:flex;gap:4px}.score button{all:unset;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--border-default);border-radius:3px;font-size:12px}.score button[aria-pressed=true]{background:var(--text-primary);color:var(--surface-base);border-color:var(--text-primary)}.score button:focus-visible{outline:2px solid var(--focus-color)}</style></head>
<body><div id="root"></div>
<script src="ops-data.js"></script>
<script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba; const O = window.NOPS; const KEY = 'sem-native-ops-v1';
const allConsoles = O.LAYERS.flatMap((l) => l.consoles.map((c) => ({ ...c, layer: l.id, layerName: l.name })));
const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 9);
function Layer({ layer, sel, setSel }) {
  const L = O.LAYERS.find((x) => x.id === layer); const c = L.consoles.find((x) => x.id === sel);
  return <div className="two"><div style={{ display: 'grid', gap: 16 }}><div className="ph"><div className="kicker">{L.consoles.length} consoles</div><h1>{L.name}</h1><p className="lead">{L.blurb}</p></div>
    <div className="grid">{L.consoles.map((k) => <button className="card" key={k.id} aria-pressed={sel === k.id} onClick={() => setSel(k.id)}><div className="kicker">{k.p} · {k.owner}</div><h3>{k.name}</h3><p className="muted">{k.controls}</p></button>)}</div></div>
    {c ? <aside className="drawer"><div className="kicker">{c.p} · {L.name}</div><h3 style={{ margin: 0, font: '700 22px var(--font-heading)' }}>{c.name}</h3><div className="kv"><b>Users</b><span>{c.users}</span><b>Controls</b><span>{c.controls}</span><b>Route</b><code className="tok">{c.route}</code><b>Owner</b><span>{c.owner}</span><b>Scope</b><span>{layer === 'company' ? 'Semester company — business data only, no student records' : 'Tenant-scoped; every query, RPC and export re-checks tenant and capability'}</span></div>
      <div className="kicker">Screens</div><div className="chips">{c.screens.map((s) => <span className="chip" key={s}>{s}</span>)}</div>
      <div className="kicker">Controlled actions (need the 13-step pattern)</div><ul style={{ margin: 0, paddingLeft: 18, fontSize: 13.5 }}>{c.approvals.map((a) => <li key={a}>{a}</li>)}</ul>
      <div className="kicker">Every console must be</div><div className="chips">{O.REQUIRED.map((r) => <span className="chip" key={r} style={{ fontSize: 11 }}>{r}</span>)}</div>
      {c.kit && <a href={c.kit}>Open what's built so far →</a>}</aside> : <aside className="drawer"><p className="muted">Pick a console for its users, route, screens, controlled actions and owner.</p></aside>}</div>;
}
function Actions({ S, setS }) {
  const [aid, setAid] = React.useState(O.ACTIONS[0].id); const [op, setOp] = React.useState(O.OPERATORS[0][0]); const [run, setRun] = React.useState(null); const [reason, setReason] = React.useState('');
  const A = O.ACTIONS.find((x) => x.id === aid); const opCaps = (O.OPERATORS.find((o) => o[0] === op) || [])[2] || [];
  const start = () => { const ok = opCaps.includes(A.cap); const r = { id: uid('req'), action: A, operator: op, reason, step: ok ? 4 : 2, stopped: ok ? null : 'Capability ' + A.cap + ' not granted to ' + op, approvals: [], idem: uid('idem'), events: [] }; setRun(r); };
  const need = run ? run.action.approvers.filter((x) => x !== run.operator) : [];
  const approve = (who) => { const ap = [...run.approvals, who]; const done = need.every((n) => ap.includes(n)); setRun({ ...run, approvals: ap, step: done ? 5 : 5 }); };
  const execute = () => { const audit = { id: uid('aud'), at: new Date().toISOString(), actor: run.operator, action: run.action.cap, approvals: run.approvals, reason: run.reason, idem: run.idem }; setS({ ...S, audit: [audit, ...S.audit], receipts: [{ id: uid('rcpt'), name: run.action.name, at: audit.at, by: run.operator, rollback: run.action.reversible }, ...S.receipts] }); setRun({ ...run, step: 12, audit }); };
  const approved = run && need.every((n) => run.approvals.includes(n));
  const stepCls = (i) => !run ? '' : run.stopped && i === run.step ? 'stop' : i < run.step ? 'done' : i === run.step ? 'on' : '';
  return <><div className="ph"><div className="kicker">Controlled action pattern</div><h1>Run a high-impact action</h1><p className="lead">One pattern for every high-impact command in both operating systems. Try it: pick an action and an operator. Missing capabilities stop at validation; approvers must differ from the requester; execution writes an immutable audit event and a receipt with the rollback path.</p></div>
    <div className="two"><div className="card"><div className="pipe">{O.PATTERN.map((p, i) => <div key={p} className={stepCls(i)}><i>{String(i + 1).padStart(2, '0')}</i><span>{p}{run && i === 2 && run.stopped && <b className="bad"> — {run.stopped}</b>}{run && i === 3 && run.step > 3 && <span className="muted"> — {run.action.authority}</span>}{run && i === 4 && run.step > 4 && <span className="muted"> — {run.action.impact}. Affected: {run.action.affected}</span>}{run && i === 5 && run.step >= 5 && !run.stopped && <span className="muted"> — {need.length ? need.map((n) => (run.approvals.includes(n) ? '✓ ' : '○ ') + n).join(' · ') : 'none required'}</span>}{run && i === 6 && run.audit && <span className="tok"> {run.idem}</span>}{run && i === 7 && run.audit && <span className="tok"> {run.audit.id}</span>}{run && i === 12 && run.audit && <span className="muted"> — {run.action.reversible}</span>}</span></div>)}</div></div>
      <aside className="drawer form"><h3 style={{ margin: 0 }}>Request</h3><label>Action<select value={aid} onChange={(e) => { setAid(e.target.value); setRun(null); }}>{O.ACTIONS.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}</select></label><label>Requesting operator<select value={op} onChange={(e) => { setOp(e.target.value); setRun(null); }}>{O.OPERATORS.map((o) => <option key={o[0]}>{o[0]}</option>)}</select></label><label>Reason (required)<input value={reason} onChange={(e) => setReason(e.target.value)} placeholder="Why, and the ticket or decision it comes from" /></label>
        <p className="muted">Needs <code className="tok">{A.cap}</code>. Approvers: {A.approvers.length ? A.approvers.join(', ') : 'none (responder judgement)'}.</p>
        {!run && <N.Button disabled={!reason.trim()} onClick={start}>Submit request</N.Button>}
        {run && run.stopped && <N.Button variant="secondary" onClick={() => setRun(null)}>Start over</N.Button>}
        {run && !run.stopped && run.step < 12 && <>{need.filter((n) => !run.approvals.includes(n)).map((n) => <N.Button key={n} size="sm" variant="secondary" onClick={() => approve(n)}>Approve as {n}</N.Button>)}{run.step >= 4 && approved && <N.Button onClick={execute}>Execute (idempotent)</N.Button>}</>}
        {run && run.step === 12 && <><p className="ok">Executed. Receipt issued; outbox event emitted; read models refreshed; affected people notified.</p><N.Button variant="ghost" onClick={() => { setRun(null); setReason(''); }}>New request</N.Button></>}
        {S.receipts.length > 0 && <><div className="kicker">Receipts</div><table className="tbl"><tbody>{S.receipts.slice(0, 6).map((r) => <tr key={r.id}><td>{r.name}<div className="muted">{r.by} · {r.at.slice(11, 19)}</div></td></tr>)}</tbody></table></>}</aside></div></>;
}
function Permission() {
  const [f, setF] = React.useState({ role: 'Advisor', tenant: 'match', org: 'match', rel: 'assigned', cap: true, policy: true, consent: 'na', breakglass: false });
  const u = (k) => (e) => setF({ ...f, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value });
  const checks = [['Role', true, f.role], ['Tenant scope', f.tenant === 'match', f.tenant === 'match' ? 'same tenant' : 'different tenant'], ['Organizational scope', f.org === 'match' || f.breakglass, f.org === 'match' ? 'inside unit' : f.breakglass ? 'outside unit — break-glass' : 'outside unit'], ['Resource relationship', f.rel !== 'none' || f.breakglass, f.rel], ['Capability grant', f.cap, f.cap ? 'granted' : 'not granted'], ['Policy conditions', f.policy, f.policy ? 'satisfied' : 'blocked by policy'], ['Consent conditions', f.consent !== 'denied', f.consent === 'na' ? 'not required' : f.consent]];
  const allow = checks.every((c) => c[1]);
  return <><div className="ph"><div className="kicker">Permission model</div><h1>No broad admin role</h1><p className="lead">Role + tenant scope + organizational scope + resource relationship + capability grant + policy conditions + consent conditions = permission decision. Routes alone are not security: every screen, API, RPC, query, storage operation, workflow action and export enforces this independently.</p></div>
    <div className="two"><div className="card"><table className="tbl"><tbody>{checks.map(([n, ok, d]) => <tr key={n}><td>{n}</td><td>{d}</td><td className={ok ? 'ok' : 'bad'}>{ok ? 'pass' : 'deny'}</td></tr>)}</tbody></table><h3 className={allow ? 'ok' : 'bad'}>{allow ? 'Allow' : 'Deny'}{allow && f.breakglass ? ' — time-limited, reasoned, logged, reviewed' : ''}</h3><p className="muted">Decision and inputs are written to the audit log on every sensitive read and write.</p></div>
      <aside className="drawer form"><label>Role<select value={f.role} onChange={u('role')}>{O.OPERATORS.map((o) => <option key={o[0]}>{o[0]}</option>)}</select></label><label>Tenant<select value={f.tenant} onChange={u('tenant')}><option value="match">Same tenant as the record</option><option value="other">Different tenant</option></select></label><label>Organizational unit<select value={f.org} onChange={u('org')}><option value="match">Inside my unit</option><option value="other">Outside my unit</option></select></label><label>Relationship to the record<select value={f.rel} onChange={u('rel')}><option value="assigned">Assigned (caseload, course, case)</option><option value="owner">Owner</option><option value="none">No relationship</option></select></label><label style={{ display: 'flex', gap: 8, alignItems: 'center' }}><input type="checkbox" checked={f.cap} onChange={u('cap')} />Capability granted</label><label style={{ display: 'flex', gap: 8, alignItems: 'center' }}><input type="checkbox" checked={f.policy} onChange={u('policy')} />Policy conditions met</label><label>Consent<select value={f.consent} onChange={u('consent')}><option value="na">Not required</option><option value="granted">Granted</option><option value="denied">Denied / revoked</option></select></label><label style={{ display: 'flex', gap: 8, alignItems: 'center' }}><input type="checkbox" checked={f.breakglass} onChange={u('breakglass')} />Approved incident (break-glass)</label><p className="muted">Break-glass never overrides tenant, capability, policy or consent.</p></aside></div>
    <div className="card"><h3>Operator capabilities</h3><table className="tbl"><thead><tr><th>Operator</th><th>Scope</th><th>High-impact capabilities</th></tr></thead><tbody>{O.OPERATORS.map(([r, d, c]) => <tr key={r}><td style={{ fontWeight: 600 }}>{r}</td><td>{d}</td><td>{c.length ? c.map((x) => <code key={x} className="tok" style={{ display: 'block' }}>{x}</code>) : <span className="muted">—</span>}</td></tr>)}</tbody></table></div></>;
}
function Routes() {
  return <><div className="ph"><div className="kicker">Console and route map</div><h1>Routes</h1><p className="lead">Company operators live under <code>/app/ops</code>. Institution operators use tenant-scoped routes under <code>/app/institution/:tenantSlug</code>.</p></div>
    {O.LAYERS.map((l) => <div className="card" key={l.id}><h3>{l.name}</h3><table className="tbl"><tbody>{l.consoles.map((c) => <tr key={c.id}><td><code className="tok">{c.route}</code></td><td>{c.name}</td><td>{c.p}</td></tr>)}</tbody></table></div>)}</>;
}
function Plan({ S, setS }) {
  const tick = (k) => setS({ ...S, done: { ...S.done, [k]: !S.done[k] } });
  const L = (t, list, pre) => <div className="card"><h3>{t}</h3><ol style={{ margin: 0, paddingLeft: 0, listStyle: 'none', display: 'grid', gap: 4 }}>{list.map((x, i) => <li key={x}><label style={{ display: 'flex', gap: 8, alignItems: 'flex-start', fontSize: 14 }}><input type="checkbox" checked={!!S.done[pre + i]} onChange={() => tick(pre + i)} />{i + 1}. {x}</label></li>)}</ol></div>;
  return <><div className="ph"><div className="kicker">Build order</div><h1>P0 first: make the pilot safe to deliver</h1><p className="lead">Don't build every console at once. P0 (first 90 days) supports the registration-readiness pilot and makes the company able to deliver it safely. Tick items only when they have code, tests and evidence. Saved on this device.</p></div>
    {L('P0 · first 90 days', O.P0, 'p0-')}{L('P1 · months 4–12', O.P1, 'p1-')}{L('P2 · months 12–36', O.P2, 'p2-')}
    <div className="card"><h3>First 10 branches</h3><table className="tbl"><tbody>{O.BRANCHES.map(([b, s], i) => <tr key={b}><td>{i + 1}</td><td><code className="tok">{b}</code></td><td>{s}</td></tr>)}</tbody></table><p className="muted">Prompt: <a href="../../handoff/execute/16-native-operations.md">handoff/execute/16-native-operations.md</a> · Docs: <a href="../../docs/operations/README.md">docs/operations</a></p></div></>;
}
function Score({ S, setS }) {
  const lv = ['None', 'Designed', 'Prototype', 'Built, untested', 'Pilot with evidence', 'Production'];
  const set = (k, v) => setS({ ...S, score: { ...S.score, [k]: v } });
  const avg = allConsoles.reduce((a, c) => a + (S.score[c.id] ?? (c.kit ? 2 : 1)), 0) / allConsoles.length;
  return <><div className="ph"><div className="kicker">Readiness scorecard</div><h1>Readiness by console · {avg.toFixed(2)} / 5</h1><p className="lead">Defaults are honest: 2 where a prototype exists, 1 where it is designed only. Raise a score only with evidence. {lv.map((l, i) => i + ' ' + l).join(' · ')}.</p></div>
    {O.LAYERS.map((l) => <div className="card" key={l.id}><h3>{l.name}</h3><table className="tbl"><tbody>{l.consoles.map((c) => { const v = S.score[c.id] ?? (c.kit ? 2 : 1); return <tr key={c.id}><td>{c.name}<div className="muted">{c.p}</div></td><td><div className="score" role="group" aria-label={c.name + ' readiness'}>{[0, 1, 2, 3, 4, 5].map((n) => <button key={n} aria-pressed={v === n} onClick={() => set(c.id, n)} title={lv[n]}>{n}</button>)}</div></td><td className="muted">{lv[v]}</td></tr>; })}</tbody></table></div>)}</>;
}
function Overview({ go }) {
  return <><div className="ph"><div className="kicker">Native operations</div><h1>Three operating layers, one platform</h1><p className="lead">The same authoritative data, policies, capabilities, workflows, evidence and audit trails power student experiences, institutional administration and Semester's own business. No generic admin dashboards, duplicate records, broad unscoped admin access or disconnected back-office tools.</p></div>
    <div className="grid">{O.LAYERS.map((l) => <button key={l.id} className="card" onClick={() => go(l.id)}><div className="kicker">{l.consoles.length} consoles</div><h3>{l.name}</h3><p className="muted">{l.blurb}</p></button>)}</div>
    <div className="card"><h3>Shared graph</h3><div className="chips">{['Identity: person, account, membership, role, capability, session', 'Institution: tenant, campus, department, program, course, section, enrollment, requirement, academic record, credential', 'Student experience: plan, task, action, support case, appointment, community, opportunity, family grant', 'Commercial: customer, billing account, product, price, quote, contract, subscription, entitlement, invoice, payment event', 'Operations: work item, approval, policy, audit event, risk, incident, release, integration, migration', 'Intelligence: classification, consent, source, freshness, provenance, AI interaction, evidence, outcome'].map((x) => <span key={x} className="chip" style={{ whiteSpace: 'normal' }}>{x}</span>)}</div><p className="muted">Every entity carries canonical ID, tenant, owner, authority, source, freshness, classification, consent scope, capability, policy, version, audit history, retention, export, deletion, migration source and verification status — so there is never a second "truth".</p></div>
    <div className="card"><h3>Controlled action pattern</h3><p className="muted">{O.PATTERN.join(' → ')}</p><div><N.Button size="sm" onClick={() => go('actions')}>Try the simulator</N.Button></div></div></>;
}
function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
  const [view, setView] = React.useState(saved.view || 'overview'); const [sel, setSel] = React.useState(null); const [S, setS] = React.useState(saved.S || { audit: [], receipts: [], done: {}, score: {} });
  React.useEffect(() => { localStorage.setItem(KEY, JSON.stringify({ view, S })); }, [view, S]);
  React.useEffect(() => { const s = document.querySelector('.scroll'); if (s) s.scrollTop = 0; setSel(null); }, [view]);
  const T = [['overview', 'Overview', 'hub'], ['institution', 'Institution OS', 'apps'], ['company', 'Company OS', 'star'], ['control', 'Control plane', 'connect'], ['actions', 'Controlled actions', 'runway'], ['permission', 'Permissions', 'sources'], ['routes', 'Routes', 'pane'], ['plan', 'Build order', 'check'], ['score', 'Readiness', 'analyse']];
  const cur = T.find((t) => t[0] === view) || T[0];
  return <div className="shell"><N.SideRail current={view} onNavigate={setView} groups={[{ label: 'Native operations', items: T.map(([id, label, icon]) => ({ id, label, icon })) }]} foot={<span style={{ fontSize: 12, color: 'var(--chrome-text-secondary)' }}>{allConsoles.length} consoles · {S.receipts.length} receipts</span>} />
    <div className="main"><N.SystemContextBar location={'Native operations · ' + cur[1]} term="Institution · Company · Control plane" sync="device-only" /><div className="scroll"><div className="page">
      {view === 'overview' && <Overview go={setView} />}{['institution', 'company', 'control'].includes(view) && <Layer layer={view} sel={sel} setSel={setSel} />}{view === 'actions' && <Actions S={S} setS={setS} />}{view === 'permission' && <Permission />}{view === 'routes' && <Routes />}{view === 'plan' && <Plan S={S} setS={setS} />}{view === 'score' && <Score S={S} setS={setS} />}
    </div></div></div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
