<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><script src="../platform/appearance.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><title>Semester — Grading workspace</title>
<style>
body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}
.top{display:flex;align-items:center;gap:18px;padding:0 18px;background:#090a0e;color:#eceef2;min-height:48px;flex-wrap:wrap}.tt{font-family:var(--font-heading);font-weight:600;font-size:16px}
.page{max-width:1280px;margin:0 auto;padding:24px 20px 64px;display:grid;gap:18px}
h1{margin:4px 0 0;font-family:var(--font-heading);font-weight:600;font-size:28px;letter-spacing:-.015em;line-height:1.15;text-wrap:pretty}.h2{margin:0;font-family:var(--font-heading);font-weight:600;font-size:21px;overflow-wrap:anywhere}
.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);line-height:1.4}.muted{color:var(--text-secondary);font-size:13px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}code{font-family:ui-monospace,Menlo,monospace;font-size:12px;overflow-wrap:anywhere}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:14px;min-width:0}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.split{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:14px;align-items:start}@media (max-width:820px){.split{grid-template-columns:1fr}}
.card{border:1px solid var(--border-default);border-radius:6px;padding:14px 16px;display:grid;align-content:start;gap:10px;background:var(--surface-base);min-width:0}.card>*{min-width:0}
.side{position:sticky;top:12px}.tlist{display:grid;max-height:60vh;overflow:auto}
.tlist button{all:unset;cursor:pointer;padding:6px 8px;border-radius:3px;overflow-wrap:anywhere}.tlist button:hover{background:var(--surface-canvas)}.tlist button[aria-current]{background:var(--action-secondary);font-weight:600}.tlist button:focus-visible,.tchip:focus-visible,.lnk:focus-visible{outline:2px solid var(--action-primary);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{all:unset;cursor:pointer;font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:3px 8px;border:1px solid var(--border-default);border-radius:3px;background:var(--surface-base);overflow-wrap:anywhere}.tchip:hover{border-color:var(--border-strong)}
.tchip[data-rw=w]{border-color:var(--action-primary);color:var(--text-link)}.tchip:disabled{cursor:default;opacity:.7}
.lnk{all:unset;cursor:pointer;color:var(--text-link);text-decoration:underline}
.scrollx{overflow-x:auto}table.cols{width:100%;border-collapse:collapse;font-size:13px}table.cols th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);font-weight:600;border-bottom:1px solid var(--border-strong);padding:6px 8px}table.cols td{border-bottom:1px solid var(--border-subtle);padding:6px 8px;vertical-align:top}
ul.plain{margin:0;padding-left:16px;display:grid;gap:3px}
ol.fl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.seg-field{display:grid;gap:4px;justify-items:start;min-width:0}.seg-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}
.cxs{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid}.cxs[data-state=confirmed]{color:var(--status-success);border-color:var(--status-success-line)}.cxs[data-state=blocked]{color:var(--status-danger);border-color:var(--status-danger-line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.clist{display:grid;max-height:64vh;overflow:auto}.clist button{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;padding:7px 8px;border-radius:3px}.clist button .muted{grid-column:1;font-size:12px}.clist button .dots{grid-column:2;grid-row:1/3;align-self:center;display:flex;gap:3px}
.clist button:hover{background:var(--surface-canvas)}.clist button[aria-current]{background:var(--action-secondary)}.clist button:focus-visible{outline:2px solid var(--action-primary)}
.dots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--border-strong);display:block}.dots i[data-on]{background:var(--status-success);border-color:var(--status-success)}.dots i[data-p]{background:linear-gradient(90deg,var(--status-success) 50%,transparent 50%)}.dots i[data-na]{border-style:dashed;opacity:.5}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--border-default);color:var(--text-secondary)}.pill[data-on=y]{color:var(--status-success);border-color:var(--status-success-line)}.pill[data-on=p]{color:var(--status-pending);border-color:var(--status-pending-line)}
a.tchip{text-decoration:none;color:inherit}.tchip[data-on]{border-color:var(--status-success-line)}
table.mx{border-collapse:collapse;font-size:13px;width:100%}table.mx th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);font-weight:600;border-bottom:1px solid var(--border-strong);padding:6px 8px;white-space:nowrap}table.mx td{border-bottom:1px solid var(--border-subtle);padding:5px 8px}
.top .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}@media (max-width:900px){.top .muted{display:none}}
.fhead{display:grid;gap:4px}.fhead b{min-width:0}.fhead code{overflow-wrap:anywhere}
.side{display:grid;gap:2px}.side button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:3px;font-size:14px}.side button:hover{background:var(--surface-canvas)}.side button[aria-current]{background:var(--action-secondary);font-weight:600}.side button:focus-visible{outline:2px solid var(--action-primary)}
.tag{font-size:11px;color:var(--status-pending);border:1px solid var(--status-pending-line);border-radius:999px;padding:1px 7px;white-space:nowrap;align-self:center}
.sm{display:flex;flex-wrap:wrap;gap:6px}.sm span{font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:4px 8px;border:1px solid var(--border-default);border-radius:3px;color:var(--text-tertiary)}.sm span[data-now]{border-color:var(--action-primary);background:var(--action-secondary);color:var(--text-primary);font-weight:600}.sm span[data-bad]{border-style:dashed}
table.t{border-collapse:collapse;width:100%;font-size:13px}table.t th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);font-weight:600;border-bottom:1px solid var(--border-strong);padding:6px 8px}table.t td{border-bottom:1px solid var(--border-subtle);padding:5px 8px;vertical-align:top}table.t tr[data-on] td{background:var(--action-secondary)}
.topstat{margin-left:auto;color:rgba(236,238,242,.64)}
.crumb{font-size:13px;color:rgba(236,238,242,.72)}.split{grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr)}
.doc{border:1px solid var(--border-subtle);border-radius:4px;padding:18px 20px;background:var(--surface-base);min-height:320px;font-size:15px;line-height:1.55}
.aibox{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--border-strong);border-radius:4px;font-size:14px}
.crit{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.crit label{font-size:14px;font-weight:500}
.crit input{width:64px;font:inherit;padding:6px 8px;border:1px solid var(--border-default);border-radius:3px;text-align:right}.crit input[aria-invalid]{border-color:var(--status-danger)}.crit input:focus-visible{outline:2px solid var(--action-primary);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text-primary);color:var(--surface-base);padding:10px 14px;border-radius:6px;display:flex;gap:14px;align-items:center;max-width:min(92vw,640px);font-size:14px}.toast .lnk{color:#c8d8ea}
.cxs[data-state=pending]{color:var(--status-pending);border-color:var(--status-pending-line)}
</style></head>
<body><div id="root"></div>
<script type="text/babel" src="Grading.jsx"></script>
</body></html>
