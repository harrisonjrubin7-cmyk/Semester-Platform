<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}.rail{background:var(--surface-base);border-right:1px solid var(--border-subtle);padding:14px 8px;display:grid;gap:2px;align-content:start}.rail button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:14px;color:var(--text-primary)}.rail button[aria-current=page]{background:var(--surface-raised);font-weight:600}.rail button:focus-visible,.btn:focus-visible{outline:2px solid var(--action-primary)}.main{padding:20px 26px 56px;display:grid;gap:14px;align-content:start;min-width:0}h1{margin:0;font-size:22px}h2{margin:0;font-size:16px}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px}.sm{font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{border:1px solid var(--border-subtle);border-radius:8px;padding:14px;background:var(--surface-base);display:grid;gap:8px;align-content:start;min-width:0}.ox{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--border-subtle);font-size:13px;text-align:left;vertical-align:top}th{font-size:11px;color:var(--text-secondary);font-weight:600}.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border-subtle);white-space:nowrap}.ok{color:var(--status-success);border-color:currentColor}.bad{color:var(--status-danger);border-color:currentColor}.warn{color:var(--status-pending);border-color:currentColor}.btn{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;border:1px solid var(--border-subtle);font-size:13px;background:var(--surface-base);color:var(--text-primary)}.btn.p{background:var(--action-primary);color:var(--text-on-action,#fff);border-color:var(--action-primary)}input,select,textarea{font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-base);color:var(--text-primary)}label.f{display:grid;gap:3px;font-size:12px;color:var(--text-secondary)}.note{border-left:3px solid var(--status-pending);padding:8px 10px;font-size:13px;background:var(--surface-raised);color:var(--text-primary)}.note.bad{border-left-color:var(--status-danger)}.note.ok{border-left-color:var(--status-success)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.ph{border:1px dashed var(--border-subtle);border-radius:6px;height:96px;display:grid;place-items:center;font-size:11px;color:var(--text-secondary);font-family:var(--font-mono)}.seg{display:flex;gap:2px;border-bottom:1px solid var(--border-subtle)}.seg button{all:unset;cursor:pointer;padding:8px 12px;font-size:14px;border-bottom:2px solid transparent}.seg button[aria-selected=true]{border-bottom-color:var(--action-primary);font-weight:600}.seg button:focus-visible{outline:2px solid var(--action-primary)}.three{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}@media(max-width:1000px){.three{grid-template-columns:minmax(0,1fr)}}input[type=search]{width:100%;box-sizing:border-box}</style></head>

 {id:'l7',title:'Room in 3-bed apartment · 21st Ave',cat:'Housing',kind:'housing',price:920,cond:'Lease takeover, Jan 1',seller:'A. Lopez',aff:'verified',idc:true,rights:true,mode:'offer',state:'published',alt:'Apartment bedroom'},
 {id:'l5',title:'CHEM 2210 answer key',cat:'Academic work',price:20,cond:'—',seller:'anon',aff:'unverified',mode:'buy',state:'blocked',alt:''}];
const S0={page:'groups',tab:'mine',q:'',f:'All',sel:null,joined:['g2'],pending:[],groups:G0,listings:L0,saved:[],offer:null,order:null,pickup:null,qa:[{q:'Is the CHEM 2210 midterm cumulative?',a:[{by:'Peer',kind:'community',t:'I think it covers ch 1–6'},{by:'Prof. Ortiz',kind:'faculty_endorsed',t:'Chapters 1–6 only. See the syllabus.'}]}],reports:[],actions:[],paymentsEnabled:false,dropsEnabled:false,protection:'none',escrowProvider:'',escrowAgreement:'',scope:'all',posts:[{id:'p1',g:'g2',by:'Climbing club',t:'Trip sign-up for Red River Gorge opens Monday.',at:'2 h'},{id:'p2',g:'g1',by:'CHEM 2210 Study Circle',t:'Practice set 4 solutions posted in Resources.',at:'5 h'},{id:'p3',g:'g4',by:'Econ RAs',t:'Two RA openings in labor econ.',at:'1 d'}],log:[]};
let S=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(S0));for(const k of ['posts','protection','scope','escrowProvider','escrowAgreement'])if(S[k]==null)S[k]=S0[k];if(!S.listings.find(l=>l.id==='l6'))S.listings=[...S.listings,...S0.listings.filter(l=>l.kind==='housing')];const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const L=t=>S.log.unshift([new Date().toLocaleTimeString(),t]);const act=t=>{S.actions=S.actions.filter(a=>a.k!==t.k);S.actions.unshift(t)};
const chip=(t,c)=>'<span class="chip '+(c||'')+'">'+esc(t)+'</span>';
const isMember=g=>S.joined.includes(g.id);
const canSee=g=>g.disc!=='hidden'||isMember(g);
function memberAction(g){if(isMember(g))return['Continue','open'];if(S.pending.includes(g.id))return['Request sent','none'];return {open:['Join','join'],request_to_join:['Request access','req'],invitation_only:['Invitation only','none'],course_eligible:ME.courses.includes(g.course)?['Join','join']:['Course participants only','none'],institution_managed:['Managed by Residence Life','none']}[g.mode]}
function card(g){const [lab,a]=memberAction(g);const showDetail=!g.sensitive||isMember(g);return '<div class="card" style="gap:6px"><div class="row" style="justify-content:space-between"><b>'+esc(g.name)+'</b>'+chip(g.type)+'</div><div class="sm">'+esc(g.purpose)+'</div><div class="muted">'+(g.members!=null&&showDetail?g.members+' members · ':'')+'Campus affiliation verified for members</div>'+(g.next&&showDetail?'<div class="sm">Next: '+g.next+'</div><div class="muted">'+(isMember(g)?'Location: '+g.loc:'Location visible to members')+'</div>':'')+'<div class="muted">Membership: '+g.mode.replace(/_/g,' ')+'</div><div class="row"><button class="btn" data-view="'+g.id+'">View group</button>'+(a==='none'?'<span class="muted">'+lab+'</span>':'<button class="btn p" data-mem="'+g.id+'|'+a+'">'+lab+'</button>')+'</div></div>'}
function vGroups(){const G=S.groups.filter(canSee);const q=S.q.toLowerCase();const list={mine:G.filter(isMember),discover:G.filter(g=>!isMember(g)),inv:[]}[S.tab].filter(g=>(S.f==='All'||g.type===S.f)&&(!q||(g.name+g.purpose).toLowerCase().includes(q)));
 const up=G.filter(g=>isMember(g)&&g.next);return '<div class="three"><div class="stack" style="display:grid;gap:12px"><div class="row" style="justify-content:space-between"><div><div class="kicker">Vanderbilt University · Community</div><h1>Find your people</h1></div><button class="btn" id="startg">Start a group</button></div><input type="search" id="gq" placeholder="Search groups…" value="'+esc(S.q)+'" aria-label="Search groups"><div class="seg" role="tablist">'+[['mine','My groups'],['discover','Discover'],['inv','Invitations']].map(([k,l])=>'<button role="tab" aria-selected="'+(S.tab===k)+'" data-tab="'+k+'">'+l+'</button>').join('')+'</div><div class="row">'+['All','Course','Club','Interest','Rec'].map(f=>'<button class="chip" aria-pressed="'+(S.f===f)+'" data-f="'+f+'" style="cursor:pointer;'+(S.f===f?'font-weight:600':'')+'">'+f+'</button>').join('')+'</div>'+(list.length?'<div class="cards">'+list.map(card).join('')+'</div>':'<div class="card"><span class="muted">'+(S.tab==='inv'?'No invitations right now.':S.tab==='mine'?'You haven’t joined a group yet. Try Discover.':'No groups match.')+'</span></div>')+(up.length?'<div class="card"><h2>Upcoming group activities</h2>'+up.map(g=>'<div class="row sm" style="justify-content:space-between"><span><b>'+g.next+'</b> · '+esc(g.name)+'</span><span class="muted">'+g.loc+'</span></div>').join('')+'</div>':'')+'</div><aside class="stack" style="display:grid;gap:12px;align-content:start"><div class="card"><h3>Your activity</h3>'+(S.pending.length?S.pending.map(id=>'<div class="sm">Join request · '+esc(S.groups.find(g=>g.id===id).name)+' · waiting</div>').join(''):'<span class="muted">No pending requests.</span>')+'</div><div class="card"><h3>Campus context</h3><div class="sm">'+chip('Your affiliation: verified','ok')+'</div><div class="sm">'+chip('Institution relationship: pilot in discussion','warn')+'</div><span class="muted">Your verified affiliation isn’t an institutional endorsement of any group. Hidden groups never appear in search or suggestions.</span></div></aside></div>'}
function gtab(g,m){const t=S.gtab||'Overview';if(t==='About')return '<div class="sm">Type: '+g.type+' · Membership: '+g.mode.replace(/_/g,' ')+' · Moderated by group leads under campus community rules.</div>';if(!m)return '<div class="note">Join to see '+(t==='Overview'?'discussion, resources, members and location':t.toLowerCase())+'.</div>';return '<div class="sm">'+({Overview:'Next: <b>'+(g.next||'—')+'</b> · '+(g.loc||'')+' <button class="btn" id="rsvp">RSVP</button>',Discussion:'Latest: “Practice set 4 — anyone stuck on Q3?” · 3 replies',Events:(g.next?g.next+' · '+g.loc:'No upcoming events.'),Resources:'Shared notes (2) · Meeting slides (1)',Members:g.sensitive?'Member list visible to group leads only.':(g.members||1)+' members'})[t]+'</div>'}
function vGroup(){const g=S.groups.find(x=>x.id===S.sel);if(!g||!canSee(g))return '<div class="card"><span class="muted">This group isn’t available to you.</span></div>';const m=isMember(g),[lab,a]=memberAction(g);const T=S.gtab||'Overview';return '<div><button class="btn" data-pg="groups">← Groups</button></div><div class="card"><div class="row" style="justify-content:space-between"><h1>'+esc(g.name)+'</h1>'+(a==='none'?chip(lab):'<button class="btn p" data-mem="'+g.id+'|'+a+'">'+lab+'</button>')+'</div><div class="sm">'+esc(g.purpose)+'</div><div class="seg" role="tablist">'+['Overview','Discussion','Events','Resources','Members','About'].map(t=>'<button role="tab" data-gt="'+t+'" aria-selected="'+(T===t)+'">'+t+'</button>').join('')+'</div>'+gtab(g,m)+'<div class="row"><button class="btn" data-rep="group|'+g.id+'">Report group</button></div></div>'}
function vQA(){return '<div><div class="kicker">Community</div><h1>Q&amp;A</h1></div>'+S.qa.map((x,i)=>'<div class="card"><b>'+esc(x.q)+'</b>'+x.a.map(a=>'<div class="sm" style="border-top:1px solid var(--border-subtle);padding-top:6px">'+chip({community:'Community answer',faculty_endorsed:'Faculty-endorsed',institution_official:'Institution-official',ai:'AI-assisted'}[a.kind],a.kind==='faculty_endorsed'||a.kind==='institution_official'?'ok':'')+' <b>'+esc(a.by)+'</b> — '+esc(a.t)+'</div>').join('')+'<div class="row"><input id="qa'+i+'" placeholder="Your answer" style="flex:1"><button class="btn" data-ans="'+i+'">Post as community answer</button></div><span class="muted">Only the course’s faculty can endorse; only the institution can mark an answer official. Upvotes don’t change authority.</span></div>').join('')}
const MODE={buy:'Buy now',offer:'Make an offer',free:'Request — free',reserve:'Reserve for pickup'};
const isH=l=>l.kind==='housing'||l.cat==='Housing';
function verif(l){return chip('Campus affiliation verified','ok')+(l.idc?chip('Seller identity checked','ok'):'')+(isH(l)?chip(l.rights?'Housing rights reviewed':'Housing rights not reviewed',l.rights?'ok':'warn'):'')}
function txLabel(l){if(isH(l))return 'Housing payments need a separately approved arrangement — no in-app payment';if(!S.paymentsEnabled)return 'Pay in person at pickup';if(S.protection==='authorized_escrow'&&S.escrowProvider&&S.escrowAgreement)return 'Escrow via '+S.escrowProvider;if(S.protection==='processor_delayed_release')return 'Payment protected — release pending after pickup';return 'Paid through campus processor'}
function lcard(l){const sv=S.saved.includes(l.id);return '<div class="card" style="gap:6px"><div class="ph" role="img" aria-label="'+esc(l.alt)+'">photo</div><b>'+esc(l.title)+'</b><div class="sm">'+(l.price?'$'+l.price+(isH(l)?' / month':''):'Free')+' · '+esc(l.cat)+'</div><div class="muted">'+esc(l.cond)+'</div><div class="row">'+verif(l)+chip(l.state)+'</div><div class="muted">'+esc(txLabel(l))+'</div><div class="row"><button class="btn" data-ls="'+l.id+'">View details</button><button class="btn" data-sv="'+l.id+'" aria-pressed="'+sv+'">'+(sv?'Saved':'Save')+'</button></div></div>'}
function vMarket(){const q=S.q.toLowerCase(),sc=S.scope||'all';const LS=S.listings.filter(l=>l.state==='published'||l.state==='reserved').filter(l=>!q||(l.title+l.cat).toLowerCase().includes(q)).filter(l=>sc==='all'||(sc==='textbooks'&&!isH(l))||(sc==='housing'&&isH(l)));const CL=S.groups.filter(canSee).filter(g=>!q||(g.name+g.purpose).toLowerCase().includes(q));const FE=S.posts.filter(x=>S.joined.includes(x.g));
 const scopes='<nav aria-label="Discovery filters" class="row">'+[['all','All campus'],['textbooks','Textbooks & supplies'],['housing','Housing'],['clubs','Clubs'],['following','Following']].map(([k,l])=>'<button class="chip" aria-pressed="'+(sc===k)+'" data-sc="'+k+'" style="cursor:pointer;'+(sc===k?'font-weight:600':'')+'">'+l+'</button>').join('')+'</nav>';
 return '<div class="three"><div class="stack" style="display:grid;gap:12px"><div class="row" style="justify-content:space-between"><div><div class="kicker">Vanderbilt University · Marketplace</div><h1>Campus connections</h1></div><button class="btn" id="newl">Create listing</button></div><input type="search" id="gq" placeholder="Textbooks, housing, clubs, events…" value="'+esc(S.q)+'" aria-label="Search campus">'+scopes+(['all','textbooks','housing'].includes(sc)?(LS.length?'<div class="cards">'+LS.map(lcard).join('')+'</div>':'<div class="card"><span class="muted">No matching listings.</span></div>'):'')+(['all','clubs'].includes(sc)?'<h2>Discover clubs</h2><div class="cards">'+CL.slice(0,sc==='all'?3:99).map(card).join('')+'</div>':'')+(['all','following'].includes(sc)?'<h2>Following</h2>'+(FE.length?FE.map(x=>'<div class="card" style="gap:4px"><b class="sm">'+esc(x.by)+'</b><span class="muted">Members of '+esc(S.groups.find(g=>g.id===x.g).name)+' · '+x.at+'</span><div class="sm">'+esc(x.t)+'</div></div>').join(''):'<div class="card"><span class="muted">Join a group to see its posts here.</span></div>'):'')+'</div><aside class="stack" style="display:grid;gap:12px;align-content:start"><div class="card"><h3>Your campus</h3><div class="sm">Vanderbilt University</div><div class="sm">'+chip('Campus affiliation verified','ok')+'</div><span class="muted">A verified campus identity doesn’t prove a seller owns an item, may sublet, or is endorsed by the university.</span></div><div class="card"><h3>Transaction guidance</h3><div class="sm">'+chip(S.paymentsEnabled?'In-app payment enabled':'In-app payment not enabled',S.paymentsEnabled?'ok':'warn')+' '+chip(S.dropsEnabled?'Drops enabled':'Drops not enabled',S.dropsEnabled?'ok':'')+'</div><span class="muted">Review the seller, listing terms and payment mode. Housing payments require separately approved arrangements.</span></div><div class="card"><h3>Suggested pickup locations</h3><div class="sm">Sarratt desk · Library lobby · Campus safety office</div><span class="muted">Source: Vanderbilt campus safety list (sample). Suggested, not guaranteed safe.</span></div></aside></div>'}
const OF=['open','accepted'],OR=['created','payment_pending','confirmed','fulfillment_pending','completed'],PK=['proposed','agreed','confirmed'];
const tl=(st,cur)=>'<div class="row">'+st.map(s=>chip(s.replace(/_/g,' '),st.indexOf(s)<=st.indexOf(cur)?'ok':'')).join('')+'</div>';
const PAYST=['pending','succeeded'],TRST=['not_requested','requested','confirmed'],POST=['not_requested','pending','paid'];
function gates(){const o=S.order||{};return [['Category approved for payment protection',S.protection!=='none'],['Seller onboarding valid',true],['Payment succeeded',o.pay==='succeeded'],['No open dispute or refund',!o.disputed],['Fulfillment confirmed (pickup)',!!(S.pickup&&S.pickup.st==='confirmed')],['Amount, currency, account and order match',true],['Stable idempotency key',!!o.idem]]}
function moneyPanel(){const o=S.order;if(!o||!S.paymentsEnabled)return '';o.pay=o.pay||'pending';o.tr=o.tr||'not_requested';o.po=o.po||'not_requested';const G=gates(),ok=G.every(g=>g[1]);return '<h3>Money</h3><div class="sm">Payment</div>'+tl(PAYST,o.pay)+'<div class="sm">Seller transfer</div>'+tl(TRST,o.tr)+'<div class="sm">Bank payout</div>'+tl(POST,o.po)+'<div class="muted">A payment success isn’t a seller transfer, and a transfer isn’t a bank payout.</div>'+(o.pay==='succeeded'&&o.tr==='not_requested'?'<h3>Release gates</h3>'+G.map(g=>'<div class="sm">'+(g[1]?'✓':'✗')+' '+g[0]+'</div>').join('')+'<button class="btn p" id="rel"'+(ok?'':' disabled')+'>Approve release to seller</button>':'')+(o.tr==='requested'?'<button class="btn" id="trc">Processor confirms transfer</button>':'')+(o.tr==='confirmed'&&o.po!=='paid'?'<button class="btn" id="poa">'+(o.po==='not_requested'?'Schedule manual payout':'Bank confirms payout')+'</button><div class="muted">Holding period comes from the reviewed provider configuration, not app code.</div>':'')}
function handoffUI(){const c=S.pickup.code;if(!c)return '<button class="btn p" id="hcode">Show handoff code</button><div class="muted">Share it only after you’ve received and inspected the textbook. It records the handoff; it doesn’t remove your right to report a problem.</div>';const left=Math.max(0,Math.round((c.exp-Date.now())/60000));return '<div class="note"><b class="mono" style="font-size:20px;letter-spacing:.15em">'+c.v.slice(0,4)+' '+c.v.slice(4)+'</b><div class="muted">Expires in '+left+' min · '+(5-c.fails)+' attempts left · never sent in chat</div></div><h3>Seller’s screen</h3><div class="row"><input id="hin" inputmode="numeric" maxlength="8" placeholder="8-digit code" aria-label="Handoff code" style="width:130px"><button class="btn" id="hred">Redeem</button><button class="btn" id="hre">Buyer reissues</button></div>'+(c.locked?'<div class="note bad">Locked after 5 wrong codes. The buyer can reissue.</div>':'')}
function vListing(){const l=S.listings.find(x=>x.id===S.sel);if(!l)return'';const mine=S.offer&&S.offer.l===l.id;return '<div><button class="btn" data-pg="market">← Marketplace</button></div><div class="three"><div class="card"><div class="ph" style="height:180px" role="img" aria-label="'+esc(l.alt)+'">photo</div><h1>'+esc(l.title)+'</h1><div class="sm">'+(l.price?'$'+l.price+(isH(l)?' / month':''):'Free')+' · '+esc(l.cond)+'</div><div class="sm">Seller: '+esc(l.seller)+'</div><div class="row">'+verif(l)+'</div><div class="note">'+esc(txLabel(l))+'</div>'+(isH(l)?'<div class="muted">A verified campus identity doesn’t prove the seller can sublet. '+(l.rights?'Supporting lease authority was reviewed under housing policy.':'Ask for the lease and landlord permission before paying anything.')+' The address is shared only after you agree.</div>':'')+(isH(l)&&!mine?'<div class="row"><button class="btn p" id="hview">Request viewing</button><button class="btn" id="hcon">Contact lister</button></div><div class="muted">Rent and deposits aren’t paid in Semester.</div>':'')+(mine||isH(l)?'':'<div class="row">'+(l.mode==='offer'?'<input id="ofa" type="number" value="'+(l.price-10)+'" style="width:90px" aria-label="Offer amount"> <button class="btn p" id="ofs">Send offer</button>':'<button class="btn p" id="ofs">'+MODE[l.mode]+'</button>')+'</div>')+'<div class="row"><button class="btn" data-rep="listing|'+l.id+'">Report listing</button></div><span class="muted">Policy: textbooks and supplies get standard review. Academic work, exams, answer keys and grades are prohibited.</span></div><aside class="card">'+(mine?'<h3>Offer</h3>'+tl(OF,S.offer.st)+(S.offer.st==='open'?'<button class="btn" id="sacc">Simulate seller accepts</button>':'')+(S.order?'<h3>Order</h3>'+tl(OR,S.order.st)+(S.order.st==='created'?(S.paymentsEnabled&&!isH(l)?'<button class="btn p" id="pay">'+(S.protection==='none'?'Pay with campus processor':'Pay — '+esc(txLabel(l)))+'</button>':'<div class="note">In-app payment isn’t enabled. Pay in person at pickup.</div><button class="btn" id="cash">Agree to pay at pickup</button>'):''):'')+(S.pickup?'<h3>Pickup</h3>'+tl(PK,S.pickup.st)+'<div class="sm">'+esc(S.pickup.where)+' · '+esc(S.pickup.when)+'</div>'+(S.pickup.st!=='confirmed'?(S.pickup.st==='proposed'?'<button class="btn" id="pkn">Seller agrees</button>':handoffUI()):''):(S.order&&S.order.st!=='created'?'<div class="row"><select id="pkw"><option>Sarratt desk</option><option>Library lobby</option><option>Campus safety office</option></select><button class="btn" id="pkp">Propose pickup</button></div>':''))+moneyPanel()+(S.order&&S.order.st==='completed'?'<div class="note ok">Completed. Receipt RC-M'+S.order.n+'.</div><button class="btn" id="disp">Open a dispute</button>':''):'<span class="muted">Messages for this listing open in the conversation drawer with the offer attached. No payment details are shared.</span>')+'</aside></div>'}
const IDX=()=>[...S.groups.filter(canSee).map(g=>({k:'Group',t:g.name,go:['group',g.id]})),...S.listings.filter(l=>l.state==='published').map(l=>({k:'Marketplace',t:l.title,go:['listing',l.id]})),{k:'Course',t:'CHEM 2210 Organic Chemistry I',go:null},{k:'Event',t:'Bouldering night',go:['groups']}];
function vSearch(){const q=S.q.toLowerCase();const R=q?IDX().filter(x=>x.t.toLowerCase().includes(q)):[];return '<div><div class="kicker">Search Semester</div><h1>Search</h1></div><input type="search" id="gq" placeholder="Search courses, people, groups, events, marketplace…" value="'+esc(S.q)+'" aria-label="Search Semester"><div class="card">'+(q?(R.length?R.map(x=>'<div class="row" style="justify-content:space-between">'+(x.go?'<button class="btn" data-go="'+x.go.join('|')+'">'+esc(x.t)+'</button>':'<span>'+esc(x.t)+'</span>')+chip(x.k)+'</div>').join(''):'<span class="muted">Nothing you can open matches.</span>'):'<span class="muted">Try “chem” or “peer”.</span>')+'</div><span class="muted">Permission filtering runs before ranking. Hidden groups (try “peer”) never appear — not in results, counts, autocomplete or suggestions.</span>'}
function vAction(){return '<div><div class="kicker">Today</div><h1>Action Center</h1></div><div class="card">'+(S.actions.length?S.actions.map(a=>'<div class="row sm" style="justify-content:space-between"><span>'+esc(a.t)+'</span>'+chip(a.src)+'</div>').join(''):'<span class="muted">Nothing needs you.</span>')+'</div><span class="muted">Only real obligations: join requests, RSVPs, offer responses, pickup confirmations. Each links back to the domain that owns it.</span>'}
function vAdmin(){return '<div><div class="kicker">Authorized console · not in student navigation</div><h1>Campus enablement</h1></div><div class="card"><label class="row sm"><input type="checkbox" id="pe"'+(S.paymentsEnabled?' checked':'')+'> In-app payments (needs processor, refunds, support, reconciliation)</label><label class="sm" style="display:grid;gap:4px">Payment protection mode<select id="pm"><option value="none"'+(S.protection==='none'?' selected':'')+'>None</option><option value="processor_delayed_release"'+(S.protection==='processor_delayed_release'?' selected':'')+'>Processor delayed release (not escrow)</option><option value="authorized_escrow"'+(S.protection==='authorized_escrow'?' selected':'')+'>Authorized escrow provider</option></select></label>'+(S.protection==='authorized_escrow'?'<div class="row"><input id="ep" placeholder="Escrow provider" aria-label="Escrow provider" value="'+esc(S.escrowProvider)+'"><input id="ea" placeholder="Agreement reference" aria-label="Agreement reference" value="'+esc(S.escrowAgreement)+'"></div>'+(!S.escrowProvider||!S.escrowAgreement?'<div class="note bad">No “Escrow” label appears until a provider and signed agreement are recorded.</div>':''):'')+'<span class="muted">Stripe doesn’t provide escrow; delayed payouts only control timing, so they’re labelled “Payment protected — release pending”. Housing never inherits textbook payment rules.</span><label class="row sm"><input type="checkbox" id="de"'+(S.dropsEnabled?' checked':'')+'> Live drops (needs server clock, serialized bids, closing rules)</label></div><div class="card"><h3>Reports</h3>'+(S.reports.length?S.reports.map(r=>'<div class="sm">'+r.kind+' · '+esc(r.t)+' · '+r.at+'</div>').join(''):'<span class="muted">None.</span>')+'</div><div class="card"><h3>Activity</h3>'+(S.log.slice(0,10).map(l=>'<div class="sm"><span class="muted">'+l[0]+'</span> · '+esc(l[1])+'</div>').join('')||'<span class="muted">—</span>')+'</div>'}
const NAV=[['groups','Groups'],['qa','Q&A'],['market','Marketplace'],['search','Search'],['actions','Action Center'],['admin','Campus console']];
S.tx=S.tx||{};
function draw(){if(S.page==='listing'&&S.sel)S.tx[S.sel]={offer:S.offer,order:S.order,pickup:S.pickup};document.getElementById('rail').innerHTML='<div class="kicker" style="padding:4px 10px 10px">Semester · Maya Chen</div>'+NAV.map(([k,l])=>'<button data-pg="'+k+'"'+(S.page===k||(S.page==='group'&&k==='groups')||(S.page==='listing'&&k==='market')?' aria-current="page"':'')+'>'+l+(k==='actions'&&S.actions.length?' · '+S.actions.length:'')+'</button>').join('')+'<button class="btn" id="rst" style="margin:12px 10px 0">Reset demo</button>';
 document.getElementById('main').innerHTML=({groups:vGroups,group:vGroup,qa:vQA,market:vMarket,listing:vListing,search:vSearch,actions:vAction,admin:vAdmin})[S.page]();bind();save()}
function bind(){const $=q=>document.querySelectorAll(q),g=id=>document.getElementById(id);$('[data-pg]').forEach(b=>b.onclick=()=>{S.page=b.dataset.pg;S.q='';draw()});g('rst').onclick=()=>{localStorage.removeItem(KEY);location.reload()};
 if(g('gq'))g('gq').oninput=e=>{S.q=e.target.value;draw();const i=g('gq');i.focus();i.setSelectionRange(i.value.length,i.value.length)};
 $('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;draw()});$('[data-f]').forEach(b=>b.onclick=()=>{S.f=b.dataset.f;draw()});
 $('[data-gt]').forEach(b=>b.onclick=()=>{S.gtab=b.dataset.gt;draw()});$('[data-view]').forEach(b=>b.onclick=()=>{S.gtab='Overview';S.sel=b.dataset.view;S.page='group';draw()});
 $('[data-mem]').forEach(b=>b.onclick=()=>{const [id,a]=b.dataset.mem.split('|');const gr=S.groups.find(x=>x.id===id);if(a==='join'){S.joined.push(id);L('Joined '+gr.name)}else if(a==='req'){S.pending.push(id);act({k:'req'+id,t:'Join request sent · '+gr.name,src:'Community'});L('Requested '+gr.name)}else{S.sel=id;S.page='group'}draw()});
 if(g('rsvp'))g('rsvp').onclick=()=>{const gr=S.groups.find(x=>x.id===S.sel);act({k:'rsvp'+gr.id,t:'RSVP · '+gr.next+' · '+gr.name,src:'Community'});L('RSVP '+gr.name);draw()};
 if(g('startg'))g('startg').onclick=()=>{const n=prompt('Group name');if(!n)return;S.groups.push({id:'g'+Date.now(),name:n,type:'Interest',purpose:'New group',members:1,mode:'request_to_join',disc:'discoverable',next:null,loc:null});S.joined.push(S.groups[S.groups.length-1].id);L('Started '+n);draw()};
 $('[data-rep]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.rep.split('|');const t=(k==='group'?S.groups:S.listings).find(x=>x.id===id);if(!t){alert('That item no longer exists.');return}S.reports.unshift({kind:k,t:t.name||t.title,at:new Date().toLocaleTimeString()});L('Reported '+k);alert('Report received. A moderator will review it.')});
 $('[data-ans]').forEach(b=>b.onclick=()=>{const v=g('qa'+b.dataset.ans).value.trim();if(!v)return;S.qa[+b.dataset.ans].a.push({by:ME.name,kind:'community',t:v});draw()});
 $('[data-sv]').forEach(b=>b.onclick=()=>{const id=b.dataset.sv;S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):[...S.saved,id];draw()});
 $('[data-ls]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.ls;S.page='listing';const t=S.tx[S.sel]||{};S.offer=t.offer||null;S.order=t.order||null;S.pickup=t.pickup||null;draw()});
 if(g('newl'))g('newl').onclick=()=>{const t=prompt('What are you selling?');if(!t)return;if(/answer key|exam|test bank|homework|essay|grades?/i.test(t)){alert('Academic work, exams, answer keys and grades can’t be listed.');return}S.listings.push({id:'l'+Date.now(),title:t,cat:'Other',price:10,cond:'—',seller:ME.name,aff:'verified',mode:'offer',state:'pending_review',alt:t});L('Listing submitted for review: '+t);alert('Submitted for review. It appears once approved.')};
 if(g('ofs'))g('ofs').onclick=()=>{S.order=null;S.pickup=null;const l=S.listings.find(x=>x.id===S.sel);const amt=g('ofa')?+g('ofa').value:l.price;S.offer={l:l.id,amt,st:l.mode==='offer'?'open':'accepted'};if(S.offer.st==='accepted'){S.order={st:'created',n:Date.now()%10000};l.state='reserved'}act({k:'of'+l.id,t:(S.offer.st==='open'?'Waiting for seller · ':'Arrange pickup · ')+l.title,src:'Marketplace'});L('Offer $'+amt+' on '+l.title);draw()};
 if(g('sacc'))g('sacc').onclick=()=>{S.offer.st='accepted';S.order={st:'created',n:Date.now()%10000};S.listings.find(x=>x.id===S.offer.l).state='reserved';act({k:'of'+S.offer.l,t:'Offer accepted — arrange payment and pickup',src:'Marketplace'});L('Offer accepted');draw()};
 if(g('cash'))g('cash').onclick=()=>{S.order.st='fulfillment_pending';L('Pay at pickup agreed');draw()};if(g('pay'))g('pay').onclick=()=>{S.order.st='confirmed';S.order.pay='succeeded';S.order.idem='ord-'+S.order.n;setTimeout(()=>{S.order.st='fulfillment_pending';draw()},600);L('Payment authorized (processor)');draw()};
 if(g('pkp'))g('pkp').onclick=()=>{S.pickup={st:'proposed',where:g('pkw').value,when:'Sat 11:00'};act({k:'pk',t:'Pickup proposed · '+S.pickup.where,src:'Marketplace'});draw()};
 if(g('hcode'))g('hcode').onclick=()=>{const v=String(crypto.getRandomValues(new Uint32Array(1))[0]%1e8).padStart(8,'0');S.pickup.code={v,exp:Date.now()+600000,fails:0,locked:false,gen:(S.pickup.code?S.pickup.code.gen:0)+1};L('Handoff code issued (gen '+S.pickup.code.gen+')');draw()};
 if(g('hre'))g('hre').onclick=()=>{S.pickup.code=null;L('Previous handoff code revoked');draw();g('hcode')&&g('hcode').click()};
 if(g('hred'))g('hred').onclick=()=>{const c=S.pickup.code,v=g('hin').value.trim();if(c.locked)return;if(Date.now()>c.exp){alert('Code expired. The buyer can reissue.');return}if(v!==c.v){c.fails++;if(c.fails>=5)c.locked=true;L('Handoff code attempt failed ('+c.fails+'/5)');draw();return}S.pickup.st='confirmed';S.pickup.code=null;S.pickup.receipt='DR-'+Date.now()%100000;S.order.st='completed';S.listings.find(x=>x.id===S.offer.l).state='sold';S.actions=S.actions.filter(a=>a.src!=='Marketplace');L('Delivery receipt '+S.pickup.receipt+' recorded — release evaluated separately');draw()};
 if(g('pkn'))g('pkn').onclick=()=>{if(S.pickup.st==='proposed')S.pickup.st='agreed';else{S.pickup.st='confirmed';S.order.st='completed';S.listings.find(x=>x.id===S.offer.l).state='sold';S.actions=S.actions.filter(a=>a.src!=='Marketplace')}L('Pickup '+S.pickup.st);draw()};
 if(g('disp'))g('disp').onclick=()=>{S.reports.unshift({kind:'dispute',t:'Order RC-M'+S.order.n,at:new Date().toLocaleTimeString()});S.order.st='disputed';alert('Dispute opened. A person will review it.');draw()};
 $('[data-go]').forEach(b=>b.onclick=()=>{const [p,id]=b.dataset.go.split('|');S.page=p;S.sel=id||null;S.q='';draw()});
 if(g('pe'))g('pe').onchange=e=>{S.paymentsEnabled=e.target.checked;L('In-app payments '+(S.paymentsEnabled?'enabled':'disabled'));save()};if(g('hview'))g('hview').onclick=()=>{const l=S.listings.find(x=>x.id===S.sel);act({k:'hv'+l.id,t:'Viewing requested · '+l.title,src:'Marketplace'});L('Viewing requested');alert('Request sent. The lister proposes a time; the address is shared then.');draw()};if(g('hcon'))g('hcon').onclick=()=>alert('Conversation opened with the lister. No payment details are shared.');if(g('rel'))g('rel').onclick=()=>{S.order.tr='requested';L('Release approved → transfer requested');draw()};if(g('trc'))g('trc').onclick=()=>{S.order.tr='confirmed';draw()};if(g('poa'))g('poa').onclick=()=>{S.order.po=S.order.po==='not_requested'?'pending':'paid';draw()};$('[data-sc]').forEach(b=>b.onclick=()=>{S.scope=b.dataset.sc;draw()});if(g('pm'))g('pm').onchange=e=>{S.protection=e.target.value;L('Protection mode '+S.protection);draw()};if(g('ep'))g('ep').onchange=e=>{S.escrowProvider=e.target.value.trim();draw()};if(g('ea'))g('ea').onchange=e=>{S.escrowAgreement=e.target.value.trim();draw()};if(g('de'))g('de').onchange=e=>{S.dropsEnabled=e.target.checked;save()}}
draw();
</script></body></html>
