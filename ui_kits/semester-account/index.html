<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><script src="../platform/appearance.js"></script><title>Semester Account</title>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}@media(max-width:820px){.app{grid-template-columns:minmax(0,1fr)}}.side{background:var(--surface-base);border-right:1px solid var(--border-subtle);padding:16px 10px;display:grid;gap:3px;align-content:start}.side button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-size:14px}.side button[aria-current=page]{background:var(--surface-raised);font-weight:600}.side button:focus-visible,.btn:focus-visible{outline:2px solid var(--action-primary)}.main{padding:22px 28px 64px;display:grid;gap:14px;align-content:start;min-width:0;max-width:1000px}h1{margin:0;font-size:24px}h2{margin:0;font-size:17px}h3{margin:0;font-size:14px}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px}.sm{font-size:13px}.mono{font-family:var(--font-mono);font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{border:1px solid var(--border-subtle);border-radius:8px;padding:14px;background:var(--surface-base);display:grid;gap:8px;align-content:start}.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-subtle);font-size:14px;flex-wrap:wrap}.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border-subtle);white-space:nowrap}.ok{color:var(--status-success);border-color:currentColor}.bad{color:var(--status-danger);border-color:currentColor}.warn{color:var(--status-pending);border-color:currentColor}.btn{all:unset;cursor:pointer;padding:7px 13px;border-radius:6px;border:1px solid var(--border-subtle);font-size:13px;background:var(--surface-base)}.btn.p{background:var(--action-primary);color:var(--text-on-action,#fff);border-color:var(--action-primary)}.btn[disabled]{opacity:.45;cursor:not-allowed}input,select,textarea{font:inherit;font-size:14px;padding:7px 9px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-base);color:var(--text-primary)}label.f{display:grid;gap:3px;font-size:12px;color:var(--text-secondary)}.note{border-left:3px solid var(--status-pending);padding:8px 10px;font-size:13px;background:var(--surface-raised);color:var(--text-primary)}.note.bad{border-left-color:var(--status-danger)}.note.ok{border-left-color:var(--status-success)}.steps{display:flex;gap:4px;flex-wrap:wrap}.steps span{font-size:11px;padding:4px 8px;border-radius:3px;background:var(--surface-raised);color:var(--text-secondary)}.steps span.on{background:var(--action-primary);color:var(--text-on-action,#fff)}table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--border-subtle);font-size:13px;text-align:left;vertical-align:top}th{font-size:11px;color:var(--text-secondary)}.mail{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);border:1px solid var(--border-subtle);border-radius:8px;overflow:hidden;background:var(--surface-base)}.mail .ls button{all:unset;cursor:pointer;display:grid;gap:2px;padding:10px 12px;border-bottom:1px solid var(--border-subtle);width:100%;box-sizing:border-box}.mail .ls button[aria-current=true]{background:var(--surface-raised)}.mail .rd{padding:14px;display:grid;gap:8px;align-content:start;border-left:1px solid var(--border-subtle)}</style></head>
<body><div class="app"><nav class="side" id="nav" aria-label="Account"></nav><main class="main" id="main"></main></div>
<script>
const KEY='sem-account',esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const RESERVED=['admin','support','security','registrar','semester','help','billing','noreply','postmaster','abuse','vanderbilt','official','staff','root'];
const TAKEN=['maya','alex','jordan'];
const S0={page:'signup',step:0,acct:null,mail:'none',sessions:[['MacBook · Safari · Nashville','now',true],['iPhone · Semester app','2 h ago',false],['Library PC · Chrome','3 days ago',false]],insts:[],apps:[['Slack (Semester app)','Read deadlines · send notifications','2026-10-08']],events:[],sel:0,draft:'',del:null,exp:null};
let S={...S0,...JSON.parse(localStorage.getItem(KEY)||'{}')};const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const ev=t=>S.events.unshift([new Date().toLocaleString(),t]);
const STEPS=['Create account','Verify recovery','Choose username','Sign-in + recovery','Personal workspace','Connect a school (optional)','Semester Mail (optional)'];
const MAILD='@semester.example';
function signup(){const a=S.acct||{};const i=S.step;let body='';
 if(i===0)body='<label class="f">Your name<input id="nm" value="'+esc(a.name||'')+'"></label><label class="f">An email you already use (Gmail, Outlook, iCloud, school…)<input id="em" value="'+esc(a.email||'')+'" type="email"></label><span class="muted">You don’t need a school account to start, and you keep your current inbox.</span>';
 else if(i===1)body='<div class="sm">We sent a 6-digit code to <b>'+esc(a.email)+'</b>.</div><label class="f">Code (demo: any 6 digits)<input id="cd" inputmode="numeric" maxlength="6"></label>';
 else if(i===2)body='<label class="f">Username<input id="un" value="'+esc(a.user||'')+'" autocomplete="off"></label><div id="unm" class="muted">Letters, numbers, dots. 3–30 characters.</div><div class="note">A username is not a mailbox and doesn’t prove you’re enrolled anywhere.</div>';
 else if(i===3)body='<label class="row sm"><input type="checkbox" id="pk"'+(a.passkey?' checked':'')+'> Create a passkey on this device</label><label class="row sm"><input type="checkbox" id="rc"'+(a.codes?' checked':'')+'> I saved my 10 recovery codes</label><span class="muted">Recovery goes to '+esc(a.email)+' — a separately verified address, never your Semester address.</span>';
 else if(i===4)body='<div class="sm">Your personal workspace is ready: notes, plans, files and portfolio. It belongs to you — no school administrator can open it.</div>';
 else if(i===5)body='<div class="sm">Connect a school only through its sign-in, an invitation, or a verified membership. We never link accounts because an email address matches.</div><div class="row"><button class="btn" data-sso="Vanderbilt University|Enrolled student">Sign in with Vanderbilt (SSO)</button><button class="btn" data-sso="Belmont University|Applicant">Use an invitation code</button></div>'+S.insts.map(x=>'<div class="sm">✓ '+x[0]+' · '+x[1]+'</div>').join('');
 else body=mailOpts();
 return '<div class="card"><div class="steps">'+STEPS.map((s,k)=>'<span class="'+(k<=i?'on':'')+'">'+(k+1)+'. '+s+'</span>').join('')+'</div><h2>'+STEPS[i]+'</h2>'+body+'<div id="err" class="muted" role="alert"></div><div class="row">'+(i>0?'<button class="btn" id="back">Back</button>':'')+(i<6?'<button class="btn p" id="next">'+(i>=5?'Continue':'Next')+'</button>':'<button class="btn p" id="done">Go to Account Center</button>')+(i===5?'<button class="btn" id="skip">Skip for now</button>':'')+'</div></div>'}
function mailOpts(){const u=(S.acct&&S.acct.user)||'you';return [['none','Username only','Reserve '+u+' with no mail delivery','Semester username'],['fwd','Forwarding','Mail to '+u+MAILD+' arrives in '+esc((S.acct||{}).email||'your inbox')+'. You can’t send from it.','Semester email forwarding'],['full','Full mailbox','Read, send, search and store mail in Semester','Semester Mail — not available yet (needs a sending provider, abuse handling and storage)']].map(([k,t,d,lab])=>'<label class="li" style="align-items:flex-start"><span><input type="radio" name="ml" value="'+k+'"'+(S.mail===k?' checked':'')+(k==='full'?' disabled':'')+'> <b>'+t+'</b><br><span class="muted">'+d+'</span></span><span class="chip '+(k==='full'?'warn':'')+'">'+lab+'</span></label>').join('')+'<span class="muted">We call it an inbox only when it is one.</span>'}
function vAccount(){const a=S.acct;return '<div class="card"><h2>'+esc(a.name)+'</h2><div class="li"><span>Account ID</span><span class="mono">acct_7f3c9e21</span></div><div class="li"><span>Username</span><span><b>'+esc(a.user)+'</b> <button class="btn" id="chu" style="padding:3px 9px">Change (controlled)</button></span></div><div class="li"><span>Semester address</span><span>'+(S.mail==='fwd'?esc(a.user)+MAILD+' <span class="chip">forwarding</span>':'<span class="chip">none</span>')+'</span></div><div class="li"><span>Verified contact</span><span>'+esc(a.email)+' <span class="chip ok">verified</span></span></div><span class="muted">Your account ID never changes, even if your name, username or email does.</span></div><div class="card"><h3>What this account is — and isn’t</h3><table><tbody><tr><td>Account</td><td>Your persistent home: workspace, settings, sign-in</td></tr><tr><td>Username</td><td>A handle. Not a mailbox, not proof of enrollment</td></tr><tr><td>Email address</td><td>'+(S.mail==='fwd'?'Forwarding only':'Not activated')+'</td></tr><tr><td>Student status</td><td>Comes only from each school’s verification</td></tr></tbody></table></div>'}
function vSecurity(){return '<div class="card"><h2>Sign-in &amp; recovery</h2><div class="li"><span>Passkey</span><span>'+(S.acct.passkey?'<span class="chip ok">This device</span>':'<button class="btn" id="addpk">Add passkey</button>')+'</span></div><div class="li"><span>Recovery codes</span><span>'+(S.acct.codes?'10 saved':'<span class="chip bad">Not saved</span>')+' <button class="btn" id="regen" style="padding:3px 9px">Regenerate</button></span></div><div class="li"><span>Recovery email</span><span>'+esc(S.acct.email)+'</span></div></div><div class="card"><h2>Where you’re signed in</h2>'+S.sessions.map((x,i)=>'<div class="li"><span>'+x[0]+'<br><span class="muted">'+x[1]+(x[2]?' · this device':'')+'</span></span>'+(x[2]?'':'<button class="btn" data-rv="'+i+'">Sign out</button>')+'</div>').join('')+'<span class="muted">Signing out a device ends its session and tokens, not just this row.</span></div><div class="card"><h3>Security events</h3>'+(S.events.slice(0,8).map(e=>'<div class="sm"><span class="muted">'+e[0]+'</span> · '+esc(e[1])+'</div>').join('')||'<span class="muted">None.</span>')+'</div>'}
function vInst(){return '<div class="card"><h2>Connected schools</h2>'+(S.insts.length?S.insts.map((x,i)=>'<div class="li"><span><b>'+x[0]+'</b><br><span class="muted">'+x[1]+' · verified by '+x[2]+'</span></span><button class="btn" data-dc="'+i+'">Disconnect</button></div>').join(''):'<span class="muted">None yet.</span>')+'<div class="row"><button class="btn" data-sso="Vanderbilt University|Enrolled student">Connect with school sign-in</button><button class="btn" data-sso="Nashville State CC|Alumni">Use an invitation</button></div><div class="note">Each school sees only what it provisioned. Disconnecting or graduating doesn’t delete your personal workspace, and a school administrator can’t open it.</div></div><div class="card"><h3>Try to link by email match</h3><div class="sm">A school roster lists <b>'+esc(S.acct.email)+'</b>.</div><button class="btn" id="merge">Link automatically</button><div id="mres"></div></div>'}
function vApps(){return '<div class="card"><h2>Apps using “Continue with Semester”</h2>'+S.apps.map((x,i)=>'<div class="li"><span><b>'+x[0]+'</b><br><span class="muted">'+x[1]+' · since '+x[2]+'</span></span><button class="btn" data-ra="'+i+'">Remove access</button></div>').join('')+(S.apps.length?'':'<span class="muted">No apps.</span>')+'<span class="muted">Apps get only the scopes you approved; removing access revokes their tokens.</span></div>'}
function vPrivacy(){return '<div class="card"><h2>Export</h2>'+(S.exp?'<div class="note ok">Export ready · '+S.exp+' · link valid 7 days</div>':'<button class="btn" id="exp">Prepare my export</button>')+'<span class="muted">Includes your workspace, settings and history. School records come from each school.</span></div><div class="card"><h2>Delete account</h2>'+(S.del?'<div class="note bad">Deletion scheduled · '+S.del+' · 14-day cancel window</div><button class="btn" id="undel">Cancel deletion</button>':'<div class="sm">Deleting removes your personal workspace and Semester username. It doesn’t erase official records your schools keep.</div><label class="f">Type your username to confirm<input id="dconf"></label><button class="btn" id="del">Schedule deletion</button>')+'</div>'}
const MSGS=[['Prof. Triana (via Brightspace)','BUS 1400: Reflection #1 due Nov 10','Reminder from the course. <b>Linked item:</b> Reading reflection #1 · due Nov 10, 11:59 pm · source: Brightspace',true],['Registrar','Spring registration opens Nov 2','Your time ticket is Nov 4, 8:00 am. One hold to clear first.',true],['Dana Chen','Thanksgiving flights?','Can you check your exam dates before I book?',false]];
function vMail(){if(S.mail!=='fwd')return '<div class="card"><h2>Semester Mail</h2><div class="sm">'+(S.mail==='none'?'You reserved <b>'+esc(S.acct.user)+'</b> but mail isn’t on.':'')+'</div>'+mailOpts()+'<button class="btn p" id="savemail">Save</button></div><div class="card"><h3>Preview: how mail connects to school work</h3><span class="muted">Below is a design preview of the full mailbox — not available yet.</span></div>'+mailbox(true);return '<div class="card"><h2>Forwarding is on</h2><div class="sm">'+esc(S.acct.user)+MAILD+' → '+esc(S.acct.email)+'. You can’t send from it yet.</div><button class="btn" id="mailoff">Turn off forwarding</button></div>'+mailbox(true)}
function mailbox(prev){const m=MSGS[S.sel];return '<div class="mail"><div class="ls">'+MSGS.map((x,i)=>'<button data-ms="'+i+'" aria-current="'+(i===S.sel)+'"><b class="sm">'+x[0]+'</b><span class="sm">'+x[1]+'</span>'+(x[3]?'<span class="chip" style="justify-self:start">linked to a course item</span>':'')+'</button>').join('')+'</div><div class="rd"><div class="kicker">'+(prev?'Design preview':'')+'</div><h3>'+m[1]+'</h3><div class="muted">From '+m[0]+'</div><div class="sm">'+m[2]+'</div>'+(m[3]?'<div class="row"><a class="btn" href="../course-workspace/index.html">Open the item</a></div>':'')+'<label class="f">Reply<textarea id="dr" rows="3">'+esc(S.draft)+'</textarea></label><div class="row"><button class="btn" id="aidraft">Draft with AI</button><button class="btn p" disabled title="Sending isn’t available yet">Send</button></div><span class="muted">AI drafts only; you approve every send. Institutional content follows Semester’s AI policy.</span></div></div>'}
function vDomain(){return '<div class="card"><h2>Namespace plan (illustrative)</h2><table><tbody>'+[['Company + product site','semester.example'],['App','app.semester.example'],['Account + security','account.semester.example'],['Mail interface','mail.semester.example'],['Developers','developers.semester.example'],['Status','status.semester.example'],['Personal address','username@semester.example (or a separate mail domain — decide before allocating usernames)']].map(r=>'<tr><td>'+r[0]+'</td><td class="mono">'+r[1]+'</td></tr>').join('')+'</tbody></table></div><div class="card"><h3>Before choosing a domain</h3>'+['Check availability and trademark risk','Register to the company, not an individual','Lock registrar + DNS with strong auth','Own renewals, recovery and change approvals','Reserve service and impersonation-sensitive usernames ('+RESERVED.slice(0,6).join(', ')+'…)','Decide which domain carries user mail, company mail, auth mail and marketing'].map(x=>'<div class="sm">☐ '+x+'</div>').join('')+'<div class="note bad">Semester can’t use a .edu domain — EDUCAUSE limits new .edu to accredited US postsecondary institutions. A Semester account must never be marketed as proof of student status or a route to academic discounts.</div></div>'}
const PAGES=[['account','Account'],['security','Sign-in & security'],['inst','Connected schools'],['apps','Connected apps'],['mail','Semester Mail'],['privacy','Export & delete'],['domain','Domain plan']];
function draw(){const nav=document.getElementById('nav'),m=document.getElementById('main');if(!S.acct||S.page==='signup'){nav.innerHTML='<div class="kicker" style="padding:4px 10px">Semester Account</div><button data-pg="domain"'+(S.page==='domain'?' aria-current="page"':'')+'>Domain plan</button>';m.innerHTML=S.page==='domain'?vDomain()+'<button class="btn" data-pg="signup">Back to sign-up</button>':'<div><div class="kicker">Semester Account</div><h1>Your home for education</h1><p class="muted" style="margin:4px 0 0">From applying and studying to graduating, working and learning again. One account across every school.</p></div>'+signup();bind();save();return}
 nav.innerHTML='<div class="kicker" style="padding:4px 10px">Account Center</div>'+PAGES.map(([k,l])=>'<button data-pg="'+k+'"'+(S.page===k?' aria-current="page"':'')+'>'+l+'</button>').join('')+'<button class="btn" id="rst" style="margin-top:12px">Reset demo</button>';
 m.innerHTML='<div><div class="kicker">Account Center · '+esc(S.acct.user)+'</div><h1>'+PAGES.find(p=>p[0]===S.page)[1]+'</h1></div>'+{account:vAccount,security:vSecurity,inst:vInst,apps:vApps,mail:vMail,privacy:vPrivacy,domain:vDomain}[S.page]();bind();save()}
function bind(){const $=q=>document.querySelectorAll(q),g=id=>document.getElementById(id),err=t=>{const e=g('err');if(e)e.textContent=t};
 $('[data-pg]').forEach(b=>b.onclick=()=>{S.page=b.dataset.pg;draw()});
 if(g('back'))g('back').onclick=()=>{S.step--;draw()};if(g('skip'))g('skip').onclick=()=>{S.step=6;draw()};
 if(g('un'))g('un').oninput=()=>{const v=g('un').value.trim().toLowerCase();const msg=!/^[a-z0-9.]{3,30}$/.test(v)?'Letters, numbers, dots. 3–30 characters.':RESERVED.some(r=>v.includes(r))?'That name is reserved to prevent impersonation.':TAKEN.includes(v)?'Taken. Try '+v+'.c or '+v+'26.':'Available';g('unm').textContent=msg;g('unm').className=msg==='Available'?'sm ok':'muted'};
 if(g('next'))g('next').onclick=()=>{const i=S.step;S.acct=S.acct||{};
  if(i===0){const n=g('nm').value.trim(),e=g('em').value.trim();if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return err('Add your name and a valid email.');if(e.endsWith(MAILD))return err('Use an email outside Semester for recovery.');S.acct={name:n,email:e}}
  if(i===1){if(!/^\d{6}$/.test(g('cd').value))return err('Enter the 6-digit code.');ev('Recovery email verified')}
  if(i===2){const v=g('un').value.trim().toLowerCase();if(!/^[a-z0-9.]{3,30}$/.test(v)||RESERVED.some(r=>v.includes(r))||TAKEN.includes(v))return err('Pick an available username.');S.acct.user=v;ev('Username '+v+' reserved')}
  if(i===3){S.acct.passkey=g('pk').checked;S.acct.codes=g('rc').checked;if(!S.acct.passkey&&!S.acct.codes)return err('Add a passkey or save recovery codes so you can’t get locked out.');ev('Sign-in methods set')}
  S.step++;draw()};
 if(g('done'))g('done').onclick=()=>{const r=document.querySelector('[name=ml]:checked');S.mail=r?r.value:'none';if(S.mail==='fwd')ev('Forwarding activated');S.page='account';draw()};
 $('[data-sso]').forEach(b=>b.onclick=()=>{const [n,role]=b.dataset.sso.split('|');if(!S.insts.find(x=>x[0]===n)){S.insts.push([n,role,b.textContent.includes('SSO')||b.textContent.includes('sign-in')?'school sign-in':'invitation code']);ev('Connected '+n+' ('+role+')')}draw()});
 $('[data-dc]').forEach(b=>b.onclick=()=>{const x=S.insts.splice(+b.dataset.dc,1)[0];ev('Disconnected '+x[0]+' — personal workspace kept');draw()});
 if(g('merge'))g('merge').onclick=()=>{g('mres').innerHTML='<div class="note bad">Not linked. A matching email isn’t proof you control both accounts. Sign in with the school, or use an invitation, to connect.</div>';ev('Blocked automatic link by email match')};
 $('[data-rv]').forEach(b=>b.onclick=()=>{const x=S.sessions.splice(+b.dataset.rv,1)[0];ev('Signed out '+x[0]+' (session + tokens revoked)');draw()});
 if(g('addpk'))g('addpk').onclick=()=>{S.acct.passkey=true;ev('Passkey added');draw()};if(g('regen'))g('regen').onclick=()=>{S.acct.codes=true;ev('Recovery codes regenerated — old codes stop working');draw()};
 if(g('chu'))g('chu').onclick=()=>{const v=(prompt('New username')||'').trim().toLowerCase();if(!v)return;if(!/^[a-z0-9.]{3,30}$/.test(v)||RESERVED.some(r=>v.includes(r))||TAKEN.includes(v)){alert('Not available.');return}ev('Username changed '+S.acct.user+' → '+v+' (old name held 90 days)');S.acct.user=v;draw()};
 $('[data-ra]').forEach(b=>b.onclick=()=>{const x=S.apps.splice(+b.dataset.ra,1)[0];ev('Removed '+x[0]+' access (tokens revoked)');draw()});
 if(g('exp'))g('exp').onclick=()=>{S.exp=new Date().toLocaleString();ev('Export prepared');draw()};
 if(g('del'))g('del').onclick=()=>{if(g('dconf').value.trim().toLowerCase()!==S.acct.user){alert('Type your username to confirm.');return}S.del=new Date(Date.now()+14*864e5).toLocaleDateString();ev('Deletion scheduled');draw()};if(g('undel'))g('undel').onclick=()=>{S.del=null;ev('Deletion cancelled');draw()};
 if(g('savemail'))g('savemail').onclick=()=>{const r=document.querySelector('[name=ml]:checked');S.mail=r?r.value:'none';ev('Mail set to '+S.mail);draw()};if(g('mailoff'))g('mailoff').onclick=()=>{S.mail='none';ev('Forwarding turned off');draw()};
 $('[data-ms]').forEach(b=>b.onclick=()=>{S.sel=+b.dataset.ms;S.draft='';draw()});if(g('dr'))g('dr').oninput=()=>{S.draft=g('dr').value;save()};
 if(g('aidraft'))g('aidraft').onclick=()=>{S.draft=S.sel===2?'Hi Mom — my BUS 1400 final is Dec 7 and ECON is Dec 15 or 16, so the 17th onward is safe. Love, Maya':'Thank you — I’ve added it to my plan.';draw()};
 if(g('rst'))g('rst').onclick=()=>{if(confirm('Reset the demo?')){S=JSON.parse(JSON.stringify(S0));draw()}}}
draw();
</script></body></html>
