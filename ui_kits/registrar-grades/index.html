<!-- @dsCard group="Product domains" viewport="1280x880" name="Grades & academic history" subtitle="Area E of the registrar register on one shared record: course attempts, instructor submission, working vs official grades, registrar posting, signed incomplete contracts with default grades, three-step grade changes, repeat rules and their GPA impact, attempted/earned/GPA credits, calculated academic standing, two-person historical corrections, and versioned supersession that never deletes" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><title>Semester — Grades & academic history</title>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}.rail{background:var(--surface-base);border-right:1px solid var(--border-subtle);padding:14px 8px;display:grid;gap:2px;align-content:start}.rail button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:14px;color:var(--text-primary)}.rail button[aria-current=page]{background:var(--surface-raised);font-weight:600}.rail button:focus-visible,.btn:focus-visible{outline:2px solid var(--action-primary)}.main{padding:20px 26px 56px;display:grid;gap:14px;align-content:start;min-width:0}h1{margin:0;font-size:22px}h2{margin:0;font-size:16px}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px}.sm{font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{border:1px solid var(--border-subtle);border-radius:8px;padding:14px;background:var(--surface-base);display:grid;gap:8px;align-content:start;min-width:0}.ox{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--border-subtle);font-size:13px;text-align:left;vertical-align:top}th{font-size:11px;color:var(--text-secondary);font-weight:600}.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border-subtle);white-space:nowrap}.ok{color:var(--status-success);border-color:currentColor}.bad{color:var(--status-danger);border-color:currentColor}.warn{color:var(--status-pending);border-color:currentColor}.btn{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;border:1px solid var(--border-subtle);font-size:13px;background:var(--surface-base);color:var(--text-primary)}.btn.p{background:var(--action-primary);color:var(--text-on-action,#fff);border-color:var(--action-primary)}input,select,textarea{font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-base);color:var(--text-primary)}label.f{display:grid;gap:3px;font-size:12px;color:var(--text-secondary)}.note{border-left:3px solid var(--status-pending);padding:8px 10px;font-size:13px;background:var(--surface-raised);color:var(--text-primary)}.note.bad{border-left-color:var(--status-danger)}.note.ok{border-left-color:var(--status-success)}</style></head>
<body><div class="app"><nav class="rail" id="rail" aria-label="Grades and academic history"></nav><main class="main" id="main" aria-live="polite"></main></div>
<script>
const KEY='sem-reg-grades',esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const PAGES=[['E01','Course attempts'],['E02','Instructor grade submission'],['E03','Working vs official grades'],['E04','Grade approval and posting'],['E05','Incomplete contracts'],['E06','Grade-change requests'],['E07','Repeat and GPA treatment'],['E08','Credit calculation'],['E09','Academic standing'],['E10','Historical corrections'],['E11','Annotated supersession']];
const PTS={A:4,'A-':3.7,'B+':3.3,B:3,'B-':2.7,'C+':2.3,C:2,'C-':1.7,'D+':1.3,D:1,F:0};
const NONGPA=['W','I','P','NP','AU'];
const S0={page:'E01',
 att:[
  {id:'AT-1',term:'Fall 2025',course:'MATH 1200',title:'Calculus I',cr:4,grade:'D',state:'posted',rep:null,v:1,hist:[]},
  {id:'AT-2',term:'Fall 2025',course:'PSY 1200',title:'General Psychology',cr:3,grade:'A-',state:'posted',rep:null,v:1,hist:[]},
  {id:'AT-3',term:'Spring 2026',course:'CHEM 1020',title:'General Chemistry II',cr:4,grade:'B',state:'posted',rep:null,v:1,hist:[]},
  {id:'AT-4',term:'Spring 2026',course:'ECON 1020',title:'Principles of Microeconomics',cr:3,grade:'B',state:'posted',rep:null,v:1,hist:[]},
  {id:'AT-5',term:'Fall 2026',course:'MATH 1200',title:'Calculus I',cr:4,grade:null,state:'in progress',rep:'AT-1',v:1,hist:[]},
  {id:'AT-6',term:'Fall 2026',course:'BUS 1400',title:'Organizational Behavior',cr:3,grade:null,state:'in progress',rep:null,v:1,hist:[]},
  {id:'AT-7',term:'Fall 2026',course:'SPAN 1010',title:'Elementary Spanish',cr:4,grade:null,state:'in progress',rep:null,v:1,hist:[]}],
 working:{'AT-5':'B+','AT-6':'A-','AT-7':''},sub:{},inc:null,chg:[],corr:[],repeatRule:'last',standingRule:{good:2.0,probation:1.0},log:[]};
let S=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(S0));const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const L=t=>S.log.unshift([new Date().toISOString().slice(0,16).replace('T',' '),t]);
const chip=(t,c)=>'<span class="chip '+(c||'')+'">'+esc(t)+'</span>';
const posted=()=>S.att.filter(a=>a.state==='posted');
function counted(){const P=posted();return P.filter(a=>{if(NONGPA.includes(a.grade))return false;const later=P.find(b=>b.rep===a.id&&!NONGPA.includes(b.grade));if(S.repeatRule==='last'&&later)return false;if(S.repeatRule==='best'){const pair=P.filter(b=>b.course===a.course&&!NONGPA.includes(b.grade));if(pair.length>1){const best=pair.reduce((x,y)=>PTS[y.grade]>PTS[x.grade]?y:x);return best.id===a.id}}return true})}
function gpa(list){list=list||counted();const q=list.reduce((s,a)=>s+PTS[a.grade]*a.cr,0),c=list.reduce((s,a)=>s+a.cr,0);return c?{g:Math.round(q/c*100)/100,q,c}:{g:null,q:0,c:0}}
function earned(){const P=posted();const ids=new Set(counted().map(a=>a.id));return {attempted:P.filter(a=>a.grade!=='AU').reduce((s,a)=>s+a.cr,0),earned:P.filter(a=>(ids.has(a.id)&&a.grade!=='F')||a.grade==='P').reduce((s,a)=>s+a.cr,0),gpaCr:gpa().c}}
function standing(){const g=gpa().g;if(g==null)return ['Not yet determined',''];return g>=S.standingRule.good?['Good standing','ok']:g>=S.standingRule.probation?['Academic probation','warn']:['Academic suspension review','bad']}
const row=a=>'<tr><td class="mono">'+a.id+'</td><td>'+a.term+'</td><td><b>'+a.course+'</b> '+a.title+'</td><td>'+a.cr+'</td><td>'+(a.grade||'—')+(a.v>1?' <span class="chip">v'+a.v+'</span>':'')+'</td><td>'+chip(a.state,a.state==='posted'?'ok':a.state==='in progress'?'':'warn')+(a.rep?' <span class="muted">repeats '+a.rep+'</span>':'')+'</td></tr>';
const tbl=list=>'<table><thead><tr><th>Attempt</th><th>Term</th><th>Course</th><th>Cr</th><th>Grade</th><th>State</th></tr></thead><tbody>'+list.map(row).join('')+'</tbody></table>';
function E01(){return '<div class="card ox"><h2>Maya Chen · every attempt</h2>'+tbl(S.att)+'<span class="muted">An attempt is the unit of history: one student, one course, one term. Repeats link to the attempt they replace; nothing is overwritten.</span></div>'}
function E02(){const ip=S.att.filter(a=>a.state==='in progress'||a.state==='submitted');return '<div class="card ox"><h2>Instructor roster · Fall 2026</h2><table><thead><tr><th>Course</th><th>Working grade</th><th>Final grade</th><th></th></tr></thead><tbody>'+ip.map(a=>'<tr><td><b>'+a.course+'</b></td><td>'+(S.working[a.id]||'—')+'</td><td><select data-fg="'+a.id+'" aria-label="Final grade for '+a.course+'">'+['',...Object.keys(PTS),'I','W'].map(g=>'<option'+((S.sub[a.id]||'')===g?' selected':'')+'>'+g+'</option>').join('')+'</select></td><td>'+(a.state==='submitted'?chip('submitted','warn'):'<button class="btn" data-sb="'+a.id+'">Submit</button>')+'</td></tr>').join('')+'</tbody></table><span class="muted">Instructors submit; the registrar posts (E04). An I needs an incomplete contract first (E05). The working grade from the gradebook is a suggestion, never copied in automatically.</span></div>'}
function E03(){const ip=S.att.filter(a=>a.state!=='posted');return '<div class="card ox"><table><thead><tr><th>Course</th><th>Working (gradebook)</th><th>Official</th><th>What the student sees</th></tr></thead><tbody>'+S.att.slice(-3).map(a=>'<tr><td><b>'+a.course+'</b></td><td>'+(S.working[a.id]||'—')+'</td><td>'+(a.state==='posted'?a.grade:'—')+'</td><td>'+(a.state==='posted'?'Official '+a.grade:S.working[a.id]?'Working '+S.working[a.id]+' — not official':'No grade yet')+'</td></tr>').join('')+'</tbody></table><div class="note">A working grade never counts toward GPA, standing, credits or transcripts. Only posted grades do.</div></div>'}
function E04(){const q=S.att.filter(a=>a.state==='submitted');return '<div class="card ox"><h2>Posting queue</h2>'+(q.length?'<table><tbody>'+q.map(a=>'<tr><td><b>'+a.course+'</b></td><td>'+S.sub[a.id]+'</td><td><button class="btn p" data-post="'+a.id+'">Post as registrar</button> <button class="btn" data-ret="'+a.id+'">Return to instructor</button></td></tr>').join('')+'</tbody></table>':'<span class="muted">Nothing submitted. Submit in E02.</span>')+'<span class="muted">Posting makes a grade official, recalculates GPA, credits and standing, and is logged. Posted grades change only through E06.</span></div>'}
function E05(){const i=S.inc;return '<div class="card"><h2>Incomplete contract</h2>'+(i?'<div class="sm">'+i.course+' · finish by <b>'+i.due+'</b> · remaining: '+esc(i.work)+' · default grade if not finished: <b>'+i.dflt+'</b></div><div class="row">'+chip(i.state,i.state==='Signed'?'ok':'warn')+(i.state==='Draft'?'<button class="btn" data-is="Instructor">Sign as instructor</button>':i.state==='Instructor signed'?'<button class="btn" data-is="Student">Sign as student</button>':i.state==='Signed'?'<button class="btn" id="ilapse">Simulate deadline passing</button>':'')+'</div>':'<div class="row"><select id="ic">'+S.att.filter(a=>a.state==='in progress').map(a=>'<option>'+a.course+'</option>').join('')+'</select><input id="iw" placeholder="Work remaining" style="flex:1"><select id="id"><option>F</option><option>D</option><option>C</option></select><button class="btn" id="icr">Draft contract</button></div>')+'<span class="muted">Both instructor and student sign before an I can be submitted. When the deadline passes, the default grade posts automatically and is logged.</span></div>'}
function E06(){const P=posted();return '<div class="card"><h2>Grade-change requests</h2><div class="row"><select id="gc">'+P.map(a=>'<option value="'+a.id+'">'+a.course+' '+a.term+' ('+a.grade+')</option>').join('')+'</select><select id="gn">'+Object.keys(PTS).map(g=>'<option>'+g+'</option>').join('')+'</select><input id="gr" placeholder="Reason (required)" style="flex:1"><button class="btn" id="gcr">Request as instructor</button></div>'+S.chg.map((c,i)=>'<div class="sm row" style="justify-content:space-between;border-top:1px solid var(--border-subtle);padding-top:6px"><span>'+c.course+' '+c.from+' → <b>'+c.to+'</b> · '+esc(c.why)+'</span><span>'+chip(c.state,c.state==='Posted'?'ok':c.state==='Denied'?'bad':'warn')+(c.state==='Requested'?' <button class="btn" data-ch="'+i+'|chair">Chair approves</button>':c.state==='Chair approved'?' <button class="btn" data-ch="'+i+'|post">Registrar posts</button> <button class="btn" data-ch="'+i+'|deny">Deny</button>':'')+'</span></div>').join('')+'<span class="muted">Instructor → department chair → registrar. Posting creates a new version (E11); the old grade stays in history.</span></div>'}
function E07(){const g=gpa();return '<div class="card"><h2>Repeat rule</h2><div class="row">'+[['last','Last attempt counts'],['best','Best attempt counts'],['all','All attempts count']].map(([k,l])=>'<label class="sm row"><input type="radio" name="rr" value="'+k+'"'+(S.repeatRule===k?' checked':'')+'> '+l+'</label>').join('')+'</div><div class="sm">GPA under this rule: <b>'+(g.g??'—')+'</b> ('+g.q.toFixed(1)+' points / '+g.c+' credits)</div><div class="note">MATH 1200: D in Fall 2025, repeat in progress. Under “last attempt”, the D stops counting only once the repeat is posted. The rule is institution policy, versioned — changing it here shows impact, not a decision.</div></div>'}
function E08(){const e=earned();return '<div class="card"><table><tbody><tr><td>Attempted</td><td><b>'+e.attempted+'</b></td><td class="muted">Every posted attempt except audits</td></tr><tr><td>Earned</td><td><b>'+e.earned+'</b></td><td class="muted">Passing, counted attempts; a repeated course earns credit once</td></tr><tr><td>GPA credits</td><td><b>'+e.gpaCr+'</b></td><td class="muted">Letter grades that count under the repeat rule</td></tr><tr><td>In progress</td><td><b>'+S.att.filter(a=>a.state!=='posted').reduce((s,a)=>s+a.cr,0)+'</b></td><td class="muted">Not counted anywhere until posted</td></tr></tbody></table></div>'}
function E09(){const [t,c]=standing(),g=gpa().g;return '<div class="card"><h2>'+chip(t,c)+'</h2><div class="sm">Cumulative GPA '+(g??'—')+' · good ≥ '+S.standingRule.good+' · probation ≥ '+S.standingRule.probation+'</div><div class="note">Standing is calculated from posted grades only and recalculated after every posting or change. Probation and suspension are decided by the institution; Semester shows the calculation and routes to advising.</div></div>'}
function E10(){return '<div class="card"><h2>Historical correction</h2><div class="row"><select id="hc">'+posted().map(a=>'<option value="'+a.id+'">'+a.course+' '+a.term+'</option>').join('')+'</select><select id="hf"><option value="cr">Credits</option><option value="title">Title</option></select><input id="hv" placeholder="Corrected value"><input id="hr" placeholder="Evidence (e.g. catalog 2025)"><button class="btn" id="hcr">Request</button></div>'+S.corr.map((c,i)=>'<div class="sm">'+c.id+' '+c.field+': '+esc(c.from)+' → <b>'+esc(c.to)+'</b> · '+esc(c.ev)+' · '+chip(c.state,c.state==='Applied'?'ok':'warn')+(c.state==='Requested'?' <button class="btn" data-ha="'+i+'">Second registrar approves</button>':'')+'</div>').join('')+'<span class="muted">Two registrar staff, evidence required. Transcripts already issued keep their snapshot; the correction is annotated.</span></div>'}
function E11(){const v=S.att.filter(a=>a.hist.length);return '<div class="card"><h2>Versions</h2>'+(v.length?v.map(a=>'<div class="sm"><b>'+a.course+' '+a.term+'</b><br>'+a.hist.map(h=>'v'+h.v+': '+esc(h.val)+' <span class="muted">— superseded '+h.at+' · '+esc(h.why)+'</span>').join('<br>')+'<br>v'+a.v+': '+a.grade+' / '+a.cr+' cr · current</div>').join('<hr style="border:0;border-top:1px solid var(--border-subtle)">'):'<span class="muted">No superseded values yet. Post a grade change (E06) or a correction (E10).</span>')+'<span class="muted">Nothing is deleted. Every superseded value keeps who, when and why, and transcripts show the annotation where policy requires it.</span></div><div class="card"><h3>Activity</h3>'+(S.log.slice(0,12).map(l=>'<div class="sm"><span class="muted">'+l[0]+'</span> · '+esc(l[1])+'</div>').join('')||'<span class="muted">Nothing yet.</span>')+'</div>'}
function supersede(a,field,val,why){a.hist.push({v:a.v,val:field==='grade'?a.grade:field+' '+a[field],at:new Date().toISOString().slice(0,10),why});a[field]=val;a.v++}
function draw(){document.getElementById('rail').innerHTML='<div class="kicker" style="padding:4px 10px 10px">Grades · area E</div>'+PAGES.map(([k,l])=>'<button data-pg="'+k+'"'+(S.page===k?' aria-current="page"':'')+'>'+k+' · '+l+'</button>').join('')+'<div class="muted" style="padding:10px">GPA '+(gpa().g??'—')+' · '+standing()[0]+'</div><button class="btn" id="rst" style="margin:0 10px">Reset demo</button>';
 const T=PAGES.find(p=>p[0]===S.page);document.getElementById('main').innerHTML='<div><div class="kicker">'+T[0]+' · Demo University · sample data</div><h1>'+T[1]+'</h1></div>'+({E01,E02,E03,E04,E05,E06,E07,E08,E09,E10,E11})[S.page]();bind();save()}
function bind(){const $=q=>document.querySelectorAll(q),g=id=>document.getElementById(id);$('[data-pg]').forEach(b=>b.onclick=()=>{S.page=b.dataset.pg;draw()});g('rst').onclick=()=>{localStorage.removeItem(KEY);location.reload()};
 $('[data-fg]').forEach(s=>s.onchange=()=>{S.sub[s.dataset.fg]=s.value;save()});
 $('[data-sb]').forEach(b=>b.onclick=()=>{const a=S.att.find(x=>x.id===b.dataset.sb),v=S.sub[a.id];if(!v){alert('Choose a final grade first.');return}if(v==='I'&&!(S.inc&&S.inc.course===a.course&&S.inc.state==='Signed')){alert('An I needs a signed incomplete contract (E05).');return}a.state='submitted';L('Instructor submitted '+a.course+' '+v);draw()});
 $('[data-post]').forEach(b=>b.onclick=()=>{const a=S.att.find(x=>x.id===b.dataset.post);a.grade=S.sub[a.id];a.state='posted';L('Posted '+a.course+' '+a.grade+' — GPA now '+gpa().g);draw()});
 $('[data-ret]').forEach(b=>b.onclick=()=>{const a=S.att.find(x=>x.id===b.dataset.ret);a.state='in progress';L('Returned '+a.course+' to instructor');draw()});
 if(g('icr'))g('icr').onclick=()=>{const w=g('iw').value.trim();if(!w){g('iw').focus();return}S.inc={course:g('ic').value,work:w,dflt:g('id').value,due:'2027-03-01',state:'Draft'};L('Incomplete contract drafted '+S.inc.course);draw()};
 $('[data-is]').forEach(b=>b.onclick=()=>{S.inc.state=b.dataset.is==='Instructor'?'Instructor signed':'Signed';L('Incomplete contract '+S.inc.state);draw()});
 if(g('ilapse'))g('ilapse').onclick=()=>{const a=S.att.find(x=>x.course===S.inc.course&&x.state!=='posted');if(a){a.grade=S.inc.dflt;a.state='posted';L('Incomplete lapsed — default '+a.grade+' posted for '+a.course)}S.inc.state='Lapsed';draw()};
 if(g('gcr'))g('gcr').onclick=()=>{const why=g('gr').value.trim();if(!why){g('gr').focus();return}const a=S.att.find(x=>x.id===g('gc').value);S.chg.push({id:a.id,course:a.course,from:a.grade,to:g('gn').value,why,state:'Requested'});L('Grade change requested '+a.course);draw()};
 $('[data-ch]').forEach(b=>b.onclick=()=>{const [i,act]=b.dataset.ch.split('|');const c=S.chg[+i];if(act==='chair')c.state='Chair approved';else if(act==='deny')c.state='Denied';else{const a=S.att.find(x=>x.id===c.id);supersede(a,'grade',c.to,c.why);c.state='Posted'}L('Grade change '+c.course+' → '+c.state);draw()});
 $('[name=rr]').forEach(r=>r.onchange=()=>{S.repeatRule=r.value;L('Repeat rule preview: '+r.value);draw()});
 if(g('hcr'))g('hcr').onclick=()=>{const v=g('hv').value.trim(),ev=g('hr').value.trim();if(!v||!ev){alert('Value and evidence are required.');return}const a=S.att.find(x=>x.id===g('hc').value),f=g('hf').value;S.corr.push({id:a.id,field:f,from:String(a[f]),to:f==='cr'?+v:v,ev,state:'Requested'});L('Correction requested '+a.course+' '+f);draw()};
 $('[data-ha]').forEach(b=>b.onclick=()=>{const c=S.corr[+b.dataset.ha];const a=S.att.find(x=>x.id===c.id);supersede(a,c.field,c.to,c.ev);c.state='Applied';L('Correction applied '+a.course);draw()})}
draw();
</script></body></html>
