<!-- @dsCard group="Product domains" viewport="1280x880" name="Registrar — degree audit & graduation" subtitle="Batch G of the registrar register (11 capabilities): catalog-bound official audit, what-if kept separate, program changes, substitutions and waivers, residency/GPA/credit checks, graduation applications, department and registrar clearance, pending vs awarded credentials, conferral dates, honors, and rescission or correction" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><title>Semester — Registrar degree audit</title>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}.rail{background:var(--surface-base);border-right:1px solid var(--border-subtle);padding:14px 8px;display:grid;gap:2px;align-content:start}.rail button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:14px;color:var(--text-primary)}.rail button[aria-current=page]{background:var(--surface-raised);font-weight:600}.rail button:focus-visible,.btn:focus-visible{outline:2px solid var(--action-primary)}.main{padding:20px 26px 56px;display:grid;gap:14px;align-content:start;min-width:0}h1{margin:0;font-size:22px}h2{margin:0;font-size:16px}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px}.sm{font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{border:1px solid var(--border-subtle);border-radius:8px;padding:14px;background:var(--surface-base);display:grid;gap:8px;align-content:start;min-width:0}.ox{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--border-subtle);font-size:13px;text-align:left;vertical-align:top}th{font-size:11px;color:var(--text-secondary);font-weight:600}.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border-subtle);white-space:nowrap}.ok{color:var(--status-success);border-color:currentColor}.bad{color:var(--status-danger);border-color:currentColor}.warn{color:var(--status-pending);border-color:currentColor}.btn{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;border:1px solid var(--border-subtle);font-size:13px;background:var(--surface-base);color:var(--text-primary)}.btn.p{background:var(--action-primary);color:var(--text-on-action,#fff);border-color:var(--action-primary)}input,select,textarea{font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-base);color:var(--text-primary)}label.f{display:grid;gap:3px;font-size:12px;color:var(--text-secondary)}.note{border-left:3px solid var(--status-pending);padding:8px 10px;font-size:13px;background:var(--surface-raised);color:var(--text-primary)}.note.bad{border-left-color:var(--status-danger)}.note.ok{border-left-color:var(--status-success)}</style></head>
<body><div class="app"><nav class="rail" id="rail" aria-label="Degree audit and graduation"></nav><main class="main" id="main" aria-live="polite"></main></div>
<script>
const KEY='sem-reg-grad',esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const PAGES=[['G01','Catalog-bound audit'],['G02','What-if'],['G03','Program changes'],['G04','Substitutions and waivers'],['G05','Residency, GPA, credit checks'],['G06','Graduation applications'],['G07','Clearance'],['G08','Pending and awarded credentials'],['G09','Conferral dates'],['G10','Honors'],['G11','Rescission and correction']];
const CAT={'2025':{prog:'Economics BA',req:[['Core','ECON 1020'],['Core','ECON 1030'],['Core','ECON 3010'],['Methods','ECON 3030'],['Writing','ENGL 1100'],['Quantitative','MATH 1200']],credits:120,res:60,gpa:2.0},'2026':{prog:'Economics BA',req:[['Core','ECON 1020'],['Core','ECON 1030'],['Core','ECON 3010'],['Methods','ECON 3030'],['Data','ECON 3040'],['Writing','ENGL 1100'],['Quantitative','MATH 1200']],credits:120,res:60,gpa:2.0}};
const S0={page:'G01',stu:{n:'Maya Chen',id:'S-1001',cat:'2025',prog:'ECON-BA',gpa:3.42,credits:{inst:72,transfer:9,total:81},inProg:['ECON 3030','ECON 3010']},
 hist:['ECON 1020','ECON 1030','ENGL 1100','MATH 1200','PSCI 3550'],plan:{whatif:'2026',on:false},changes:[],subs:[],app:null,clear:{dept:null,reg:null},creds:[],honors:null,rescind:[],log:[]};
let S=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(S0));const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const L=t=>S.log.unshift([new Date().toLocaleTimeString(),t]);
const chip=(t,c)=>'<span class="chip '+(c||'')+'">'+esc(t)+'</span>';const card=(h,b)=>'<div class="card"><h2>'+h+'</h2>'+b+'</div>';
const tbl=(hd,rows)=>'<div class="ox"><table><thead><tr>'+hd.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
function audit(cat,official=true){const C=CAT[cat];const rows=C.req.map(([g,c])=>{const sub=S.subs.find(x=>x.for===c&&x.st==='approved');const done=S.hist.includes(c)||(sub&&S.hist.includes(sub.with));const prog=S.stu.inProg.includes(c);const w=S.subs.find(x=>x.for===c&&x.kind==='waiver'&&x.st==='approved');return [g,c,w?'waived':done?'complete'+(sub?' (via '+sub.with+')':''):prog?'in progress':'not met']});const met=rows.filter(r=>/complete|waived/.test(r[2])).length;const checks=[['Credits',S.stu.credits.total+' / '+C.credits,S.stu.credits.total>=C.credits],['Residency',S.stu.credits.inst+' / '+C.res+' at Vanderbilt',S.stu.credits.inst>=C.res],['Cumulative GPA',S.stu.gpa.toFixed(2)+' (min '+C.gpa.toFixed(2)+')',S.stu.gpa>=C.gpa]];return {rows,met,total:rows.length,checks,ok:met===rows.length&&checks.every(c=>c[2])}}
const auditView=(A,label)=>tbl(['Group','Requirement','Status'],A.rows.map(r=>[r[0],r[1],chip(r[2],/complete|waived/.test(r[2])?'ok':r[2]==='in progress'?'warn':'bad')]))+tbl(['Check','Value','Met'],A.checks.map(c=>[c[0],c[1],c[2]?chip('yes','ok'):chip('not yet','warn')]))+'<div class="sm">'+label+': '+A.met+' of '+A.total+' requirements met · '+(A.ok?chip('eligible to graduate','ok'):chip('not yet eligible','warn'))+'</div>';
const V={
G01:()=>card('Official audit · '+S.stu.n+' · '+CAT[S.stu.cat].prog+' · catalog '+S.stu.cat,auditView(audit(S.stu.cat),'Official')+'<span class="muted">Evaluated against the catalog snapshot the student is bound to. In-progress courses never count as complete; only posted grades do.</span>'),
G02:()=>card('What-if · catalog '+S.plan.whatif,'<div class="note">What-if is a separate calculation. It changes nothing on the official audit and can’t be submitted for graduation.</div>'+auditView(audit(S.plan.whatif,false),'What-if')+'<div class="row"><select id="wic"><option'+(S.plan.whatif==='2025'?' selected':'')+'>2025</option><option'+(S.plan.whatif==='2026'?' selected':'')+'>2026</option></select></div>'),
G03:()=>card('Program changes',(S.changes.length?tbl(['Change','Requested','Status'],S.changes.map(c=>[esc(c.t),c.at,chip(c.st,c.st==='approved'?'ok':'warn')])):'<span class="muted">None.</span>')+(S.clear.reg||S.creds.length?'<div class="note">Program changes after registrar clearance go through Rescission and correction.</div>':'<div class="row"><button class="btn" id="chg">Request move to catalog 2026</button></div>')+'<span class="muted">A catalog or program change needs advisor and registrar approval and re-runs the official audit; the old audit is kept as a snapshot.</span>'+S.changes.map((c,i)=>c.st==='pending'&&!S.clear.reg?'<button class="btn" data-ca="'+i+'">Registrar approves</button>':'').join('')),
G04:()=>card('Substitutions and waivers',(S.subs.length?tbl(['Kind','For','With','Reason','Status',''],S.subs.map((x,i)=>[x.kind,x.for,x.with||'—',esc(x.why),chip(x.st,x.st==='approved'?'ok':'warn'),x.st==='pending'?'<button class="btn" data-sa="'+i+'">Registrar approves</button>':''])):'<span class="muted">None.</span>')+'<div class="row"><button class="btn" id="sub">Substitute PSCI 3550 for ECON 3030</button><button class="btn" id="wv">Waive ECON 3040</button></div><span class="muted">An advisor can recommend; only the registrar approves. A waiver removes the requirement; it doesn’t award credit.</span>'),
G05:()=>card('Residency, GPA and credits',tbl(['Credit source','Credits'],[['Vanderbilt',S.stu.credits.inst],['Transfer (accepted)',S.stu.credits.transfer],['Total',S.stu.credits.total]])+'<span class="muted">Transfer credit counts toward total credits, not residency or GPA. These checks use posted records only.</span>'),
G06:()=>{const A=audit(S.stu.cat);return card('Graduation application',S.app?'<div class="sm">Applied for <b>'+S.app.term+'</b> on '+S.app.at+' · '+chip(S.app.st,'warn')+'</div>':'<div class="sm">Projected: '+A.met+'/'+A.total+' requirements and '+S.stu.credits.total+'/'+CAT[S.stu.cat].credits+' credits.</div><button class="btn p" id="app">Apply for May 2027 graduation</button><span class="muted">Students can apply before finishing — the application is a request, not clearance.</span>')},
G07:()=>{const A=audit(S.stu.cat);return card('Clearance',!S.app?'<span class="muted">No application yet.</span>':'<div class="sm">Department: '+(S.clear.dept?chip('cleared '+S.clear.dept,'ok'):'<button class="btn" id="cd"'+(A.met===A.total?'':' disabled')+'>Department clears major</button>')+'</div><div class="sm">Registrar: '+(S.clear.reg?chip('cleared '+S.clear.reg,'ok'):'<button class="btn p" id="cr"'+(S.clear.dept&&A.ok?'':' disabled')+'>Registrar final clearance</button>')+'</div>'+(!A.ok?'<div class="note bad">Final clearance waits for every requirement and check, using posted grades. Post the in-progress courses first.</div><button class="btn" id="post">Simulate: term grades posted</button>':''))},
G08:()=>card('Credentials',S.creds.length?tbl(['Credential','State','Conferral',''],S.creds.map((c,i)=>[esc(c.n),chip(c.st,c.st==='awarded'?'ok':c.st==='rescinded'?'bad':'warn'),c.date||'—',c.st==='pending'?'<button class="btn" data-aw="'+i+'">Confer on '+c.next+'</button>':''])):'<span class="muted">No credential yet — created at registrar clearance as “pending”.</span>'),
G09:()=>card('Conferral dates',tbl(['Term','Conferral date','Ceremony'],[['Dec 2026','2026-12-18','none'],['May 2027','2027-05-14','2027-05-15'],['Aug 2027','2027-08-09','none']])+'<span class="muted">The conferral date is the official award date, set by the board-approved calendar; the ceremony isn’t.</span>'),
G10:()=>card('Honors',S.honors?'<div class="sm">'+chip(S.honors,'ok')+' — computed from the final cumulative GPA after conferral.</div>':'<span class="muted">Latin honors are computed only from the final posted GPA at conferral: 3.90 summa · 3.75 magna · 3.50 cum laude (sample thresholds). Current GPA '+S.stu.gpa.toFixed(2)+' → none projected.</span>'),
G11:()=>card('Rescission and correction',(S.creds.some(c=>c.st==='awarded')?'<button class="btn" id="rs">Open correction case</button>'+S.rescind.map(x=>'<div class="sm">'+esc(x.t)+' · '+chip(x.st)+'</div>').join(''):'<span class="muted">Nothing awarded.</span>')+'<span class="muted">Correcting or rescinding a degree needs a documented finding, the student’s right to respond, and provost approval. The original award stays in the history.</span>')
};
function draw(){document.getElementById('rail').innerHTML='<div class="kicker" style="padding:4px 10px 10px">Registrar · audit & graduation</div>'+PAGES.map(([k,l])=>'<button data-pg="'+k+'"'+(S.page===k?' aria-current="page"':'')+'><span class="mono" style="font-size:11px">'+k+'</span> '+l+'</button>').join('')+'<button class="btn" id="rst" style="margin:12px 10px 0">Reset</button>';
 document.getElementById('main').innerHTML='<div><div class="kicker">Vanderbilt University · Registrar · sample data</div><h1>'+PAGES.find(p=>p[0]===S.page)[1]+'</h1></div>'+V[S.page]()+(S.log.length?'<div class="card"><h3>Activity</h3>'+S.log.slice(0,6).map(l=>'<div class="sm"><span class="muted">'+l[0]+'</span> · '+esc(l[1])+'</div>').join('')+'</div>':'');bind();save()}
function bind(){const $=q=>document.querySelectorAll(q),g=id=>document.getElementById(id);$('[data-pg]').forEach(b=>b.onclick=()=>{S.page=b.dataset.pg;draw()});g('rst').onclick=()=>{localStorage.removeItem(KEY);location.reload()};
 if(g('wic'))g('wic').onchange=e=>{S.plan.whatif=e.target.value;draw()};
 if(g('chg'))g('chg').onclick=()=>{S.changes.push({t:'Catalog 2025 → 2026',at:new Date().toLocaleDateString(),st:'pending'});L('Catalog change requested');draw()};
 $('[data-ca]').forEach(b=>b.onclick=()=>{S.changes[+b.dataset.ca].st='approved';S.stu.cat='2026';if(S.clear.dept){S.clear.dept=null;if(S.app)S.app.st='submitted';L('Department clearance reset — audit must be re-cleared under catalog 2026')}L('Catalog changed to 2026 — official audit re-run');draw()});
 if(g('sub'))g('sub').onclick=()=>{S.subs.push({kind:'substitution',for:'ECON 3030',with:'PSCI 3550',why:'Equivalent methods content',st:'pending'});L('Substitution requested');draw()};
 if(g('wv'))g('wv').onclick=()=>{S.subs.push({kind:'waiver',for:'ECON 3040',with:null,why:'Requirement added after matriculation',st:'pending'});L('Waiver requested');draw()};
 $('[data-sa]').forEach(b=>b.onclick=()=>{S.subs[+b.dataset.sa].st='approved';L('Registrar approved '+S.subs[+b.dataset.sa].kind);draw()});
 if(g('app'))g('app').onclick=()=>{S.app={term:'May 2027',at:new Date().toLocaleDateString(),st:'submitted'};L('Graduation application submitted');draw()};
 if(g('post'))g('post').onclick=()=>{S.hist.push(...S.stu.inProg.filter(c=>!S.hist.includes(c)));S.stu.inProg=[];S.stu.credits={inst:111,transfer:9,total:120};S.stu.gpa=3.46;L('Spring grades posted');draw()};
 if(g('cd'))g('cd').onclick=()=>{S.clear.dept=new Date().toLocaleDateString();L('Department cleared');draw()};
 if(g('cr'))g('cr').onclick=()=>{S.clear.reg=new Date().toLocaleDateString();S.app.st='cleared';S.creds.push({n:'Bachelor of Arts, Economics',st:'pending',next:'2027-05-14'});L('Registrar cleared — credential pending conferral');draw()};
 $('[data-aw]').forEach(b=>b.onclick=()=>{const c=S.creds[+b.dataset.aw];c.st='awarded';c.date=c.next;const gp=S.stu.gpa;S.honors=gp>=3.9?'Summa cum laude':gp>=3.75?'Magna cum laude':gp>=3.5?'Cum laude':null;L('Conferred '+c.n+' on '+c.date);draw()});
 if(g('rs'))g('rs').onclick=()=>{S.rescind.push({t:'Correction case opened — student notified of right to respond',st:'open'});L('Correction case opened');draw()}}
draw();
</script></body></html>
