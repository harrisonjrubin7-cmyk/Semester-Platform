ointer}.tbl tr.rowbtn:hover td{background:var(--surface-sunken)}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:18px;align-items:start}@media(max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}.form{display:grid;gap:12px}.form label{display:grid;gap:4px;font-size:13px;color:var(--text-secondary)}.form input,.form select{font:inherit;font-size:15px;color:var(--text-primary,#1b1a17);padding:8px 10px;border:1px solid var(--border-default);border-radius:4px;background:var(--surface-base)}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{all:unset;cursor:pointer;border:1px solid var(--border-default);border-radius:4px;padding:10px 12px;display:grid;gap:2px;min-width:140px;background:var(--surface-base)}.seg button[aria-pressed=true]{border-color:var(--action-primary);box-shadow:inset 0 0 0 1px var(--action-primary)}.seg button:focus-visible{outline:2px solid var(--focus-color)}.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}.sum .t{border-top:1px solid var(--border-strong);padding-top:6px;font-weight:600}.steps{display:flex;gap:4px;flex-wrap:wrap}.steps span{font-size:12px;padding:3px 8px;border-radius:3px;border:1px solid var(--border-subtle);color:var(--text-secondary)}.steps span.on{background:var(--text-primary);color:var(--surface-base);border-color:var(--text-primary)}.steps span.done{background:var(--surface-sunken);color:var(--text-primary,#1b1a17)}.tokenbox{border:1px dashed var(--border-strong);border-radius:6px;padding:12px;display:grid;gap:8px;background:var(--surface-sunken)}.tok{font-family:ui-monospace,monospace;font-size:12.5px}.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.flow span{border:1px solid var(--border-default);background:var(--surface-base);border-radius:4px;padding:5px 9px;font-size:13px}.flow i{font-style:normal;color:var(--text-secondary)}.ok{color:#2f7a4f}.bad{color:#a33b3b}.banner{border:1px solid var(--border-strong);background:var(--surface-sunken);border- <script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba; const F = window.FIN; const KEY = 'sem-native-finance-v1'; const $ = F.money;
const BOUNDARY = [['Pricing catalog','Native','—'],['Quotes and order forms','Native','—'],['Contracts and subscriptions','Native','—'],['Entitlements','Native','—'],['Invoices and statements','Native','—'],['Student account ledger','Native','—'],['Payment plans','Native','—'],['Credits / refunds policy','Native workflow','Rail refunds the original payment'],['Dunning and collections','Native workflow','Possibly bank/collections partner'],['Reconciliation','Native','Rail supplies settlement events'],['Checkout UX','Native','Rail tokenizes and processes'],['Card-number storage','Never','Rail tokenization only'],['Card authorization / capture','Later, with payments infrastructure','Rail'],['ACH / bank debit','Later, with bank authorization','Rail'],['Chargebacks','Native case workflow','Network dispute rails'],['KYC / KYB','Native onboarding UI','Verification provider / bank'],['Merchant acquiring','No, until formally established','Acquirer / bank'],['PCI DSS scope','Minimize','Tokenization provider'],['Money transmission','Only with a legal program','Regulated partner']];
const STAGES = [['1 · Launch','Pricing, checkout UX, invoices, subscriptions, entitlements, ledger, reconciliation UI','Authorization, card/ACH, settlement'],['2 · Multi-rail','Provider abstraction, routing, payment plans, institutional invoicing, fraud workflow','Several rails / bank partners'],['3 · Embedded finance','Wallet/credits, campus commerce, sub-merchant onboarding','Licensed partner infrastructure'],['4 · Payments platform','Risk, routing, treasury controls, merchant ops, orchestration','Banks/networks underneath'],['5 · Regulated entity','Direct processing where legally and commercially justified','Direct regulated relationships']];
function Steps({ list, cur }) { const i = list.indexOf(cur); return <div className="steps">{list.map((s, k) => <span key={s} className={k === i ? 'on' : k < i ? 'done' : ''}>{s.replace(/_/g, ' ')}</span>)}</div>; }
function Overview({ S }) {
  const b = F.balances(S); const t = F.trial(S);
  return <><div className="ph"><div className="kicker">Native finance</div><h1>Semester owns the money experience</h1><p className="lead">Checkout, pricing, quotes, contracts, invoices, subscriptions, entitlements, student accounts, payment plans, refunds, the ledger, reconciliation and the finance console are native Semester. A regulated payment rail moves money underneath as an internal adapter — until Semester deliberately becomes a regulated payments business.</p></div>
    <div className="banner">Sandbox only. Every payment here uses a mock rail: no money moves and no card data exists. Ledger design, tax and revenue recognition need review by a qualified accountant and counsel.</div>
    <div className="tiles"><div className="tile"><span className="muted">Cash clearing</span><b>{$(b.CASH)}</b></div><div className="tile"><span className="muted">Accounts receivable</span><b>{$(b.AR)}</b></div><div className="tile"><span className="muted">Deferred revenue</span><b>{$(b.DEF)}</b></div><div className="tile"><span className="muted">Recognized revenue</span><b>{$(b.REV)}</b></div><div className="tile"><span className="muted">Trial balance</span><b className={t.ok ? 'ok' : 'bad'}>{t.ok ? 'Balanced' : 'Off'}</b></div></div>
    <div className="card"><h3>Native checkout architecture</h3><div className="flow">{['Student / institution','Semester checkout','Order + pricing engine','Tax / entitlement / plan validation','Billing account + invoice record','Payment token collection surface','Payment rail adapter','Authorized / failed / pending / settled','Event normalization','Ledger + reconciliation','Entitlement activation','Receipt / invoice / audit'].map((s, i) => <React.Fragment key={s}>{i > 0 && <i>→</i>}<span style={i === 6 ? { borderStyle: 'dashed' } : null}>{s}</span></React.Fragment>)}</div><p className="muted">The dashed step is the only part outside Semester. The user only ever sees Semester.</p></div>
    <div className="card"><h3>Native vs. regulated rail</h3><table className="tbl"><thead><tr><th>Capability</th><th>Semester</th><th>Rail (at first)</th></tr></thead><tbody>{BOUNDARY.map((r) => <tr key={r[0]}><td>{r[0]}</td><td>{r[1]}</td><td>{r[2]}</td></tr>)}</tbody></table></div>
    <div className="card"><h3>Payment maturity path</h3><table className="tbl"><thead><tr><th>Stage</th><th>Semester owns</th><th>Rail handles</th></tr></thead><tbody>{STAGES.map((r) => <tr key={r[0]}><td style={{ whiteSpace: 'nowrap', fontWeight: 600 }}>{r[0]}</td><td>{r[1]}</td><td>{r[2]}</td></tr>)}</tbody></table><p className="muted">Stage 4–5 is a separate regulated business line: banking partners, acquiring, PCI DSS program, HSM tokenization, fraud, KYC/KYB, AML, money-transmitter licensing, treasury, 24/7 payment incident response. Not a launch dependency.</p></div></>;
}
function StudentCheckout({ S, act, go }) {
  const [plan, setPlan] = React.useState('annual'); const [step, setStep] = React.useState(0); const [tok, setTok] = React.useState(null); const [terms, setTerms] = React.useState(false); const [pay, setPay] = React.useState(null); const [err, setErr] = React.useState('');
  const amt = plan === 'annual' ? F.PRICE.premiumAnnual : F.PRICE.premiumMonthly;
  const ST = ['Plan', 'Payment method', 'Terms', 'Review', 'Processing', 'Receipt'];
  const run = () => act((s) => { const p = F.newPayment(s, { amount: amt, label: 'Student Premium (' + plan + ')', entitlement: 'student_premium', deferred: true, customer: 'student@campus-a.test', kind: 'student' }); ['method_collected', 'auth_pending', 'authorized', 'captured', 'processing', 'settled', 'reconciled', 'entitlement_active'].forEach((x) => F.transition(s, p, x, 'rail-webhook')); setPay(p.id); });
  const p = S.payments.find((x) => x.id === pay);
  return <div className="two"><div style={{ display: 'grid', gap: 16 }}><div className="ph"><div className="kicker">Student checkout</div><h1>Semester Premium</h1><p className="lead">Optional. Never required for anything your school provides.</p></div><Steps list={ST} cur={ST[step]} />
    {step === 0 && <div className="card"><div className="seg" role="group" aria-label="Billing period">{[['monthly', $(F.PRICE.premiumMonthly) + ' / month', 'Cancel any time'], ['annual', $(F.PRICE.premiumAnnual) + ' / year', 'About ' + $(F.PRICE.premiumAnnual / 12) + ' a month']].map(([k, a, b]) => <button key={k} aria-pressed={plan === k} onClick={() => setPlan(k)}><b>{k === 'annual' ? 'Annual' : 'Monthly'}</b><span>{a}</span><span className="muted">{b}</span></button>)}</div><p className="muted">Includes Ask Semester at the Premium quota. AI usage beyond the quota is never charged to students; it pauses until the next period.</p><div><N.Button onClick={() => setStep(1)}>Continue</N.Button></div></div>}
    {step === 1 && <div className="card"><h3>Payment method</h3><div className="tokenbox"><span className="kicker">Secure field hosted by the payment rail</span><p className="muted">Card details go straight to the rail. Semester receives only a token.</p>{tok ? <span className="tok">Token {tok} · Visa •••• 4242 (sandbox)</span> : <N.Button variant="secondary" onClick={() => setTok(F.id('pm_tok'))}>Use sandbox test card</N.Button>}</div><div style={{ display: 'flex', gap: 8 }}><N.Button variant="ghost" onClick={() => setStep(0)}>Back</N.Button><N.Button disabled={!tok} onClick={() => setStep(2)}>Continue</N.Button></div></div>}
    {step === 2 && <div className="card"><h3>Terms</h3><label style={{ display: 'flex', gap: 8, alignItems: 'flex-start', fontSize: 14 }}><input type="checkbox" checked={terms} onChange={(e) => setTerms(e.target.checked)} />I agree to the Terms of Service and Privacy Policy. Premium renews {plan === 'annual' ? 'yearly' : 'monthly'} until I cancel in Settings → Plan.</label><div style={{ display: 'flex', gap: 8 }}><N.Button variant="ghost" onClick={() => setStep(1)}>Back</N.Button><N.Button disabled={!terms} onClick={() => setStep(3)}>Review</N.Button></div></div>}
    {step === 3 && <div className="card"><h3>Review</h3><div className="sum"><span>Semester Premium, {plan}</span><span className="num">{$(amt)}</span><span>Tax (tax interface, sandbox 0%)</span><span className="num">{$(0)}</span><span className="t">Due today</span><span className="t num">{$(amt)}</span></div><div style={{ display: 'flex', gap: 8 }}><N.Button variant="ghost" onClick={() => setStep(2)}>Back</N.Button><N.Button onClick={() => { setStep(4); try { run(); setStep(5); } catch (e) { setErr(e.message); } }}>Pay {$(amt)}</N.Button></div></div>}
    {step === 5 && p && <div className="card"><h3>You're on Premium</h3><p className="muted">Receipt sent to student@campus-a.test. Manage or cancel in Settings → Plan.</p><div className="sum"><span>Receipt</span><span className="tok">{p.id}</span><span>Charged</span><span className="num">{$(p.amount)}</span><span>Entitlement</span><span>student_premium · active</span></div><div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}><N.Button variant="secondary" onClick={() => go('payments', p.id)}>See payment states</N.Button><N.Button variant="ghost" onClick={() => go('ledger')}>See ledger entries</N.Button><N.Button variant="ghost" onClick={() => { setStep(0); setTok(null); setTerms(false); setPay(null); }}>New checkout</N.Button></div></div>}
    {err && <p className="bad">{err}</p>}</div>
    <aside className="card"><h3>What happens underneath</h3><ol style={{ margin: 0, paddingLeft: 18, fontSize: 13.5, display: 'grid', gap: 4 }}><li>Checkout validates plan and eligibility</li><li>Rail collects the card and returns a token</li><li>Rail authorizes and captures</li><li>Semester verifies the signed webhook server-side</li><li>Ledger: Cash clearing Dr / Deferred revenue Cr</li><li>Subscription activated, entitlement issued</li><li>Receipt sent, usage metered, renewal scheduled</li></ol><p className="muted">Each step carries an idempotency key, provider event, ledger entry, audit event, notification rule, entitlement effect and reconciliation status.</p></aside></div>;
}
function InstitutionOrder({ S, act, go }) {
  const [o, setO] = React.useState({ inst: 'Campus A University', students: 1200, impl: 'Standard', support: 'Standard', discount: 0, po: '', taxExempt: true, sched: 'Annual upfront' });
  const [stage, setStage] = React.useState('Quote'); const [approved, setApproved] = React.useState(false); const [inv, setInv] = React.useState(null);
  const q = F.quote(o); const total = q.total - q.discountAmt;
  const STG = ['Quote', 'Approval', 'Order form', 'Invoice issued', 'Payment received', 'Reconciled', 'Entitlements active'];
  const u = (k) => (e) => setO({ ...o, [k]: e.target.type === 'number' ? Number(e.target.value) : e.target.type === 'checkbox' ? e.target.checked : e.target.value });
  const issue = () => act((s) => { const id = F.id('inv'); F.post(s, 'Invoice issued · ' + o.inst, [['AR', total, 0], ['DEF', 0, total]], id); s.invoices.unshift({ id, customer: o.inst, amount: total, po: o.po, status: 'issued', due: new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10) }); F.audit(s, 'cfo@semester.test', 'invoice.issued', id, $(total)); setInv(id); setStage('Invoice issued'); });
  const paid = () => act((s) => { const i = s.invoices.find((x) => x.id === inv); const p = F.newPayment(s, { amount: i.amount, label: 'Invoice ' + inv, entitlement: 'tenant_license:' + o.students + ' students', deferred: false, rail: 'institution_po', customer: o.inst, kind: 'institution' }); ['method_collected', 'auth_pending', 'authorized', 'captured', 'processing', 'settled'].forEach((x) => F.transition(s, p, x, 'bank-remittance')); i.status = 'paid'; i.pay = p.id; s.settlements.unshift({ id: F.id('stl'), ref: p.id, amount: i.amount, matched: false }); setStage('Payment received'); });
  const rec = () => act((s) => { const i = s.invoices.find((x) => x.id === inv); const p = s.payments.find((x) => x.id === i.pay); F.transition(s, p, 'reconciled', 'cfo@semester.test'); const st = s.settlements.find((x) => x.ref === p.id); if (st) st.matched = true; i.status = 'reconciled'; setStage('Reconciled'); });
  const activate = () => act((s) => { const i = s.invoices.find((x) => x.id === inv); const p = s.payments.find((x) => x.id === i.pay); F.transition(s, p, 'entitlement_active', 'system'); setStage('Entitlements active'); });
  const recog = () => act((s) => { const m = Math.round(q.license / 12 * 100) / 100; F.post(s, 'Revenue recognized, month 1 · ' + o.inst, [['DEF', m, 0], ['REV', 0, m]], inv); F.audit(s, 'cfo@semester.test', 'revenue.recognized', inv, $(m)); });
  return <div className="two"><div style={{ display: 'grid', gap: 16 }}><div className="ph"><div className="kicker">Institutional order flow</div><h1>Quote to entitlement</h1><p className="lead">{$(F.PRICE.perStudent)} per student per year, {$(F.PRICE.floor)} floor. Implementation by scope. Planning prices from the price book.</p></div><Steps list={STG} cur={stage} />
    <div className="card form"><div className="grid" style={{ gridTemplateColumns: 'repeat(auto-fit,minmax(200px,1fr))' }}><label>Institution<input value={o.inst} onChange={u('inst')} disabled={stage !== 'Quote'} /></label><label>Enrolled students<input type="number" min="0" value={o.students} onChange={u('students')} disabled={stage !== 'Quote'} /></label><label>Implementation<select value={o.impl} onChange={u('impl')} disabled={stage !== 'Quote'}>{Object.keys(F.PRICE.impl).map((k) => <option key={k}>{k}</option>)}</select></label><label>Support level<select value={o.support} onChange={u('support')} disabled={stage !== 'Quote'}><option>Standard</option><option>Premium</option></select></label><label>Discount<select value={o.discount} onChange={u('discount')} disabled={stage !== 'Quote'}>{[0, 0.05, 0.1, 0.15, 0.2].map((d) => <option key={d} value={d}>{d * 100}%</option>)}</select></label><label>Payment schedule<select value={o.sched} onChange={u('sched')} disabled={stage !== 'Quote'}><option>Annual upfront</option><option>Semi-annual</option><option>Quarterly</option></select></label><label>Purchase order #<input value={o.po} onChange={u('po')} placeholder="PO-…" /></label><label style={{ display: 'flex', gap: 8, alignItems: 'center', alignSelf: 'end' }}><input type="checkbox" checked={o.taxExempt} onChange={u('taxExempt')} />Tax-exempt (certificate on file)</label></div></div>
    <div className="card"><h3>Next step</h3>
      {stage === 'Quote' && <><p className="muted">{q.needsApproval ? 'This quote needs finance approval (discount over 10% or total over $150k).' : 'Within standard terms — approval is automatic.'}</p><div><N.Button onClick={() => { act((s) => F.audit(s, 'revops', 'quote.submitted', o.inst, $(total))); setStage(q.needsApproval ? 'Approval' : 'Order form'); setApproved(!q.needsApproval); }}>Submit quote</N.Button></div></>}
      {stage === 'Approval' && <><p className="muted">Approver must differ from the requester (two-person rule).</p><div style={{ display: 'flex', gap: 8 }}><N.Button onClick={() => { act((s) => F.audit(s, 'cfo@semester.test', 'quote.approved', o.inst, $(total))); setApproved(true); setStage('Order form'); }}>Approve as CFO</N.Button><N.Button variant="ghost" onClick={() => setStage('Quote')}>Send back</N.Button></div></>}
      {stage === 'Order form' && <><p className="muted">Order form references the MSA, DPA and SLA. Signature captured, contract version stored.</p><div><N.Button disabled={!o.po} onClick={issue}>{o.po ? 'Mark signed and issue invoice' : 'Enter a PO number first'}</N.Button></div></>}
      {stage === 'Invoice issued' && <><p className="muted">Invoice {inv} sent, net 30. Ledger: Accounts receivable Dr / Deferred revenue Cr.</p><div><N.Button onClick={paid}>Record bank remittance (sandbox)</N.Button></div></>}
      {stage === 'Payment received' && <><p className="muted">Settlement line received from the bank. Match it to the invoice.</p><div><N.Button onClick={rec}>Reconcile</N.Button></div></>}
      {stage === 'Reconciled' && <div><N.Button onClick={activate}>Activate tenant entitlements</N.Button></div>}
      {stage === 'Entitlements active' && <><p className="muted">Tenant licensed for {o.students.toLocaleString()} students. Renewal tracked for 12 months out.</p><div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}><N.Button variant="secondary" onClick={recog}>Recognize month 1 revenue</N.Button><N.Button variant="ghost" onClick={() => go('ledger')}>See ledger</N.Button><N.Button variant="ghost" onClick={() => { setStage('Quote'); setInv(null); }}>New quote</N.Button></div></>}
    </div></div>
    <aside className="card"><h3>Quote</h3><div className="sum"><span>License ({o.students.toLocaleString()} × {$(F.PRICE.perStudent)}){q.floorApplied ? ' — floor applied' : ''}</span><span className="num">{$(q.license)}</span><span>Implementation ({o.impl})</span><span className="num">{$(q.impl)}</span><span>Support ({o.support}){o.support === 'Premium' ? '*' : ''}</span><span className="num">{$(q.sup)}</span>{q.discountAmt > 0 && <><span>Discount</span><span className="num">−{$(q.discountAmt)}</span></>}<span>Tax</span><span className="num">{o.taxExempt ? 'Exempt' : 'Calculated'}</span><span className="t">Year-1 total</span><span className="t num">{$(total)}</span></div>{o.support === 'Premium' && <p className="muted">* Premium support at 15% of license is a planning assumption.</p>}<p className="muted">Approval: {approved ? 'approved' : q.needsApproval ? 'required' : 'automatic'}</p></aside></div>;
}
function Payments({ S, act, sel, setSel }) {
  const p = S.payments.find((x) => x.id === sel) || S.payments[0]; const [err, setErr] = React.useState('');
  const doT = (to) => { setErr(''); try { act((s) => { const q = s.payments.find((x) => x.id === p.id); F.transition(s, q, to, 'cfo@semester.test'); }); } catch (e) { setErr(e.message); } };
  return <><div className="ph"><div className="kicker">Payment state machine</div><h1>Payments</h1><p className="lead">Every transition requires an idempotency key, provider event reference, ledger entry (when money moves), audit event, notification rule, entitlement effect, reconciliation status and support path. Illegal transitions are refused.</p></div>
    {!p ? <p className="muted">No payments yet. Run a student checkout or institutional order.</p> : <div className="two"><div className="card"><h3>{p.label}</h3><Steps list={F.STATES} cur={p.status} />{F.FAIL.includes(p.status) && <span className="chip bad" style={{ justifySelf: 'start' }}>{p.status.replace(/_/g, ' ')}</span>}<div className="chips"><span className="chip">{$(p.amount)}</span><span className="chip">Rail: {p.rail}</span><span className="chip">Recon: {p.recon}</span><span className="chip">Entitlement: {p.active ? 'active' : 'inactive'}</span></div>
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>{(F.NEXT[p.status] || []).map((t) => <N.Button key={t} size="sm" variant={F.FAIL.includes(t) ? 'secondary' : 'primary'} onClick={() => doT(t)}>{t.replace(/_/g, ' ')}</N.Button>)}{!(F.NEXT[p.status] || []).length && <span className="muted">Terminal state.</span>}</div>{err && <p className="bad">{err}</p>}
      <div style={{ overflow: 'auto' }}><table className="tbl"><thead><tr><th>Transition</th><th>Idempotency</th><th>Provider event</th><th>Ledger</th><th>Entitlement</th><th>Notify</th><th>Recon</th><th>Support</th></tr></thead><tbody>{p.history.slice().reverse().map((h, i) => <tr key={i}><td style={{ whiteSpace: 'nowrap' }}>{h.from.replace(/_/g, ' ')} → <b>{h.to.replace(/_/g, ' ')}</b></td><td className="tok">{h.idem}</td><td className="tok">{h.evt}</td><td className="tok">{h.ledger || '—'}</td><td>{h.ent}</td><td>{h.notify}</td><td>{h.recon}</td><td>{h.support}</td></tr>)}</tbody></table></div></div>
      <aside className="card"><h3>All payments</h3><table className="tbl"><tbody>{S.payments.map((x) => <tr key={x.id} className="rowbtn" onClick={() => setSel(x.id)} style={x.id === p.id ? { outline: '2px solid var(--blue-500,#597ea3)' } : null}><td>{x.label}<div className="muted">{x.status.replace(/_/g, ' ')}</div></td><td className="num">{$(x.amount)}</td></tr>)}</tbody></table></aside></div>}</>;
}
function StudentAccount({ S, act }) {
  const sj = S.journals.filter((j) => j.ref === 'sa_demo'); const bal = sj.reduce((a, j) => a + j.lines.filter((l) => l.acct === 'SREC').reduce((b, l) => b + l.dr - l.cr, 0), 0);
  const [n, setN] = React.useState(4); const plan = S.plans[0];
  const seed = () => act((s) => { F.post(s, 'Tuition charge (from bursar)', [['SREC', 2000, 0], ['ICHG', 0, 2000]], 'sa_demo'); F.post(s, 'Scholarship credit', [['SCHOL', 500, 0], ['SREC', 0, 500]], 'sa_demo'); F.audit(s, 'bursar', 'student_account.charged', 'student@campus-a.test', '$2,000'); });
  const pay = () => act((s) => { F.post(s, 'Payment received (sandbox)', [['CASH', 500, 0], ['SREC', 0, 500]], 'sa_demo'); });
  const mk = () => act((s) => { s.plans.unshift({ id: F.id('plan'), balance: bal, items: F.installments(bal, n), status: 'active' }); F.audit(s, 'student@campus-a.test', 'payment_plan.activated', 'student@campus-a.test', n + ' installments'); });
  const payInst = (i) => act((s) => { const pl = s.plans[0]; const it = pl.items[i]; it.status = 'paid'; F.post(s, 'Installment ' + it.n + ' paid', [['CASH', it.amount, 0], ['SREC', 0, it.amount]], 'sa_demo'); if (pl.items.every((x) => x.status === 'paid')) pl.status = 'complete'; });
  const miss = (i) => act((s) => { s.plans[0].items[i].status = 'missed'; F.audit(s, 'system', 'payment_plan.missed', 'installment ' + (i + 1), 'reminder + help link sent'); });
  return <><div className="ph"><div className="kicker">Student account ledger</div><h1>Charges, credits, balance, plans</h1><p className="lead">The bursar's system is official during transition; Semester's ledger mirrors and reconciles it. Students see every entry with its source. Family sees it only with the student's consent.</p></div>
    <div className="two"><div className="card"><div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, flexWrap: 'wrap' }}><h3>Student A · balance {$(bal)}</h3><div style={{ display: 'flex', gap: 6 }}>{!sj.length && <N.Button size="sm" onClick={seed}>Load sample term</N.Button>}{sj.length > 0 && <N.Button size="sm" variant="secondary" onClick={pay}>Pay $500</N.Button>}</div></div>
      <table className="tbl"><thead><tr><th>Entry</th><th>Source</th><th className="num">Charge</th><th className="num">Credit</th></tr></thead><tbody>{sj.slice().reverse().map((j) => { const l = j.lines.find((x) => x.acct === 'SREC'); return <tr key={j.id}><td>{j.memo}</td><td>{/Tuition|Scholarship/.test(j.memo) ? '◆ Bursar' : 'Semester'}</td><td className="num">{l.dr ? $(l.dr) : ''}</td><td className="num">{l.cr ? $(l.cr) : ''}</td></tr>; })}</tbody></table>{!sj.length && <p className="muted">No entries.</p>}</div>
      <aside className="card"><h3>Payment plan</h3>{!plan ? <><label className="muted" style={{ display: 'grid', gap: 4 }}>Installments<select value={n} onChange={(e) => setN(Number(e.target.value))} style={{ font: 'inherit', padding: 6 }}>{[2, 3, 4, 5, 6].map((k) => <option key={k}>{k}</option>)}</select></label><p className="muted">No fees in the sandbox. Real terms come from the institution's policy.</p><N.Button disabled={bal <= 0} onClick={mk}>Set up plan for {$(bal)}</N.Button></> : <><span className="chip" style={{ justifySelf: 'start' }}>{plan.status}</span><table className="tbl"><tbody>{plan.items.map((it, i) => <tr key={i}><td>#{it.n}<div className="muted">{it.due}</div></td><td className="num">{$(it.amount)}</td><td>{it.status === 'scheduled' ? <div style={{ display: 'flex', gap: 4 }}><N.Button size="sm" onClick={() => payInst(i)}>Pay</N.Button><N.Button size="sm" variant="ghost" onClick={() => miss(i)}>Miss</N.Button></div> : it.status}</td></tr>)}</tbody></table><p className="muted">Missed installment: reminder with help link, then a hold only if the institution's policy says so.</p></>}</aside></div></>;
}
function Refunds({ S, act }) {
  const elig = S.payments.filter((p) => p.status === 'entitlement_active'); const [pid, setPid] = React.useState(''); const [reason, setReason] = React.useState('Requested by customer'); const [amt, setAmt] = React.useState(0);
  const p = elig.find((x) => x.id === pid) || elig[0];
  const tier = (a) => a <= 100 ? ['Auto-approved', 0] : a <= 5000 ? ['Finance approval', 1] : ['Two-person approval (finance + CEO)', 2];
  const req = () => act((s) => { const a = amt || p.amount; s.refunds.unshift({ id: F.id('rfd'), pay: p.id, label: p.label, amount: a, reason, need: tier(a)[1], approvals: [], status: tier(a)[1] === 0 ? 'approved' : 'pending' }); F.audit(s, 'support', 'refund.requested', p.id, $(a) + ' · ' + reason); if (tier(a)[1] === 0) exec(s, s.refunds[0]); });
  const exec = (s, r) => { const q = s.payments.find((x) => x.id === r.pay); F.transition(s, q, r.amount >= q.amount ? 'refunded' : 'partially_refunded', 'rail-refund'); r.status = 'executed'; };
  const approve = (rid, who) => act((s) => { const r = s.refunds.find((x) => x.id === rid); if (r.approvals.includes(who)) return; r.approvals.push(who); F.audit(s, who, 'refund.approved', rid); if (r.approvals.length >= r.need) exec(s, r); });
  return <><div className="ph"><div className="kicker">Refund workflow</div><h1>Refunds and credits</h1><p className="lead">Request → reason and source invoice → policy check → approval by threshold → provider refund command → verified event → ledger entry → entitlement adjustment → receipt → audit.</p></div>
    <div className="two"><div className="card"><h3>Pending and executed</h3>{!S.refunds.length ? <p className="muted">None yet.</p> : <table className="tbl"><thead><tr><th>Refund</th><th className="num">Amount</th><th>Approvals</th><th>Status</th></tr></thead><tbody>{S.refunds.map((r) => <tr key={r.id}><td>{r.label}<div className="muted">{r.reason}</div></td><td className="num">{$(r.amount)}</td><td>{r.approvals.length}/{r.need}{r.status === 'pending' && <div style={{ display: 'flex', gap: 4, marginTop: 4, flexWrap: 'wrap' }}>{!r.approvals.includes('cfo@semester.test') && <N.Button size="sm" onClick={() => approve(r.id, 'cfo@semester.test')}>Approve (CFO)</N.Button>}{r.need > 1 && !r.approvals.includes('ceo@semester.test') && <N.Button size="sm" variant="secondary" onClick={() => approve(r.id, 'ceo@semester.test')}>Approve (CEO)</N.Button>}</div>}</td><td>{r.status}</td></tr>)}</tbody></table>}</div>
      <aside className="card form"><h3>New refund request</h3>{!p ? <p className="muted">No active payments to refund. Run a checkout first.</p> : <><label>Payment<select value={p.id} onChange={(e) => setPid(e.target.value)}>{elig.map((x) => <option key={x.id} value={x.id}>{x.label} · {$(x.amount)}</option>)}</select></label><label>Amount (blank = full)<input type="number" min="0" max={p.amount} value={amt || ''} onChange={(e) => setAmt(Number(e.target.value))} placeholder={String(p.amount)} /></label><label>Reason<select value={reason} onChange={(e) => setReason(e.target.value)}><option>Requested by customer</option><option>Duplicate charge</option><option>Service issue (SLA credit)</option><option>Cancelled within policy window</option></select></label><p className="muted">{tier(amt || p.amount)[0]}</p><N.Button onClick={req}>Submit request</N.Button></>}</aside></div></>;
}
function Ledger({ S }) {
  const b = F.balances(S); const t = F.trial(S);
  return <><div className="ph"><div className="kicker">Immutable ledger</div><h1>Journals and balances</h1><p className="lead">Append-only, double-entry. Every journal must balance or it is refused. Corrections are reversals, never edits. Product billing state is kept separate from statutory accounting, which syncs to the accounting system.</p></div>
    <div className="tiles">{Object.entries(F.ACCT).map(([k, [n, ty]]) => <div className="tile" key={k}><span className="muted">{n}</span><b>{$(b[k])}</b><span className="muted" style={{ fontSize: 11 }}>{ty}</span></div>)}</div>
    <div className="card"><div style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8 }}><h3>Journals ({S.journals.length})</h3><span className={t.ok ? 'ok' : 'bad'}>Debits {$(t.d)} · Credits {$(t.c)} · {t.ok ? 'balanced' : 'NOT balanced'}</span></div>{!S.journals.length ? <p className="muted">Empty. Run a checkout or order.</p> : <table className="tbl"><thead><tr><th>Journal</th><th>Account</th><th className="num">Debit</th><th className="num">Credit</th></tr></thead><tbody>{S.journals.map((j) => j.lines.map((l, i) => <tr key={j.id + i}>{i === 0 && <td rowSpan={j.lines.length}><b style={{ fontWeight: 600 }}>{j.memo}</b><div className="muted tok">{j.id} · {j.at.slice(11, 19)}</div></td>}<td>{F.ACCT[l.acct][0]}</td><td className="num">{l.dr ? $(l.dr) : ''}</td><td className="num">{l.cr ? $(l.cr) : ''}</td></tr>))}</tbody></table>}</div></>;
}
function Console({ S, act }) {
  const b = F.balances(S); const open = S.invoices.filter((i) => i.status === 'issued'); const unmatched = S.settlements.filter((x) => !x.matched);
  const dun = S.payments.filter((p) => ['failed', 'chargeback', 'collections'].includes(p.status)).length + S.plans.reduce((a, p) => a + p.items.filter((i) => i.status === 'missed').length, 0);
  return <><div className="ph"><div className="kicker">Finance operations console</div><h1>Finance console</h1><p className="lead">Business data only. No student records — student-account views here are aggregates.</p></div>
    <div className="tiles"><div className="tile"><span className="muted">Cash clearing</span><b>{$(b.CASH)}</b></div><div className="tile"><span className="muted">Open invoices</span><b>{open.length}</b></div><div className="tile"><span className="muted">Unmatched settlements</span><b>{unmatched.length}</b></div><div className="tile"><span className="muted">Dunning cases</span><b>{dun}</b></div><div className="tile"><span className="muted">Pending refunds</span><b>{S.refunds.filter((r) => r.status === 'pending').length}</b></div><div className="tile"><span className="muted">Processor fees</span><b>{$(b.FEES)}</b></div></div>
    <div className="grid"><div className="card"><h3>Invoices</h3>{!S.invoices.length ? <p className="muted">None.</p> : <table className="tbl"><tbody>{S.invoices.map((i) => <tr key={i.id}><td>{i.customer}<div className="muted tok">{i.id} · PO {i.po || '—'} · due {i.due}</div></td><td className="num">{$(i.amount)}</td><td>{i.status}</td></tr>)}</tbody></table>}</div>
      <div className="card"><h3>Reconciliation</h3>{!S.settlements.length ? <p className="muted">No settlement lines.</p> : <table className="tbl"><tbody>{S.settlements.map((x) => <tr key={x.id}><td className="tok">{x.id}<div className="muted">→ {x.ref}</div></td><td className="num">{$(x.amount)}</td><td className={x.matched ? 'ok' : 'bad'}>{x.matched ? 'matched' : 'unmatched'}</td></tr>)}</tbody></table>}</div>
      <div className="card"><h3>Payment rails (adapters)</h3><table className="tbl"><tbody>{F.RAILS.map((r) => <tr key={r.id}><td><b style={{ fontWeight: 600 }}>{r.kind.replace(/_/g, ' ')}</b><div className="muted">{r.provider}</div></td><td>{r.status}</td><td className="muted">{['supportsRefund', 'supportsDispute', 'supportsRecurring'].filter((k) => r[k]).map((k) => k.replace('supports', '')).join(', ')}</td></tr>)}</tbody></table></div>
      <div className="card"><h3>Audit trail</h3>{!S.audit.length ? <p className="muted">Empty.</p> : <table className="tbl" style={{ tableLayout: 'fixed' }}><colgroup><col /><col style={{ width: '34%' }} /><col style={{ width: '72px' }} /></colgroup><tbody>{S.audit.slice(0, 14).map((a) => <tr key={a.id}><td className="tok">{a.action}</td><td className="muted" style={{ overflowWrap: 'anywhere' }}>{a.actor}</td><td className="muted num">{a.at.slice(11, 19)}</td></tr>)}</tbody></table>}</div></div>
    <div><N.Button variant="ghost" onClick={() => { if (confirm('Reset the sandbox ledger on this device?')) act(() => Object.assign({}, F.fresh()), true); }}>Reset sandbox</N.Button></div></>;
}
function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } })();
  const [S, setS] = React.useState(saved && saved.S ? saved.S : F.fresh()); const [view, setView] = React.useState(saved && saved.view || 'overview'); const [sel, setSel] = React.useState(null);
  React.useEffect(() => { localStorage.setItem(KEY, JSON.stringify({ S, view })); }, [S, view]);
  React.useEffect(() => { const s = document.querySelector('.scroll'); if (s) s.scrollTop = 0; }, [view]);
  const act = (fn, replace) => { const next = JSON.parse(JSON.stringify(S)); const r = fn(next); setS(replace && r ? r : next); };
  const go = (v, id) => { if (id) setSel(id); setView(v); };
  const T = [['overview', 'Overview', 'hub'], ['student', 'Student checkout', 'star'], ['institution', 'Institution order', 'apps'], ['payments', 'Payment states', 'runway'], ['account', 'Student account', 'pane'], ['refunds', 'Refunds', 'check'], ['ledger', 'Ledger', 'sources'], ['console', 'Finance console', 'analyse'], ['controls', 'Controls & gates', 'check']];
  const cur = T.find((t) => t[0] === view) || T[0];
  return <div className="shell"><N.SideRail current={view} onNavigate={setView} groups={[{ label: 'Native finance', items: T.map(([id, label, icon]) => ({ id, label, icon })) }]} foot={<span style={{ fontSize: 12, color: 'var(--chrome-text-secondary)' }}>Sandbox rail · {S.journals.length} journals</span>} />
    <div className="main"><N.SystemContextBar location={'Native finance · ' + cur[1]} term="Sandbox — no real money" sync="device-only" /><div className="scroll"><div className="page">
      {view === 'overview' && <Overview S={S} />}{view === 'student' && <StudentCheckout S={S} act={act} go={go} />}{view === 'institution' && <InstitutionOrder S={S} act={act} go={go} />}{view === 'payments' && <Payments S={S} act={act} sel={sel} setSel={setSel} />}{view === 'account' && <StudentAccount S={S} act={act} />}{view === 'refunds' && <Refunds S={S} act={act} />}{view === 'ledger' && <Ledger S={S} />}{view === 'console' && <Console S={S} act={act} />}{view === 'controls' && window.FinanceControls && <window.FinanceControls />}
    </div></div></div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
