<!-- @dsCard group="Company & operations" viewport="1280x880" name="Growth & Content Studio" subtitle="Native Marketing & Growth and Content & Media Studio for Semester’s own company: approved-claims library by audience, governed audiences (purpose, consent, suppression, prohibited targeting), campaign command center that blocks launch on missing consent, unapproved assets, broken destinations, over-budget spend or unsupported claims, content production with brand/claims/accessibility review, and publishing states that keep scheduled, accepted and published separate" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><title>Semester — Growth & Content Studio</title>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}.rail{background:var(--surface-base);border-right:1px solid var(--border-subtle);padding:14px 8px;display:grid;gap:2px;align-content:start}.rail button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:14px;color:var(--text-primary)}.rail button[aria-current=page]{background:var(--surface-raised);font-weight:600}.rail button:focus-visible,.btn:focus-visible{outline:2px solid var(--action-primary)}.main{padding:20px 26px 56px;display:grid;gap:14px;align-content:start;min-width:0}h1{margin:0;font-size:22px}h2{margin:0;font-size:16px}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px}.sm{font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{border:1px solid var(--border-subtle);border-radius:8px;padding:14px;background:var(--surface-base);display:grid;gap:8px;align-content:start;min-width:0}.ox{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--border-subtle);font-size:13px;text-align:left;vertical-align:top}th{font-size:11px;color:var(--text-secondary);font-weight:600}.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border-subtle);white-space:nowrap}.ok{color:var(--status-success);border-color:currentColor}.bad{color:var(--status-danger);border-color:currentColor}.warn{color:var(--status-pending);border-color:currentColor}.btn{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;border:1px solid var(--border-subtle);font-size:13px;background:var(--surface-base);color:var(--text-primary)}.btn.p{background:var(--action-primary);color:var(--text-on-action,#fff);border-color:var(--action-primary)}input,select,textarea{font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-base);color:var(--text-primary)}label.f{display:grid;gap:3px;font-size:12px;color:var(--text-secondary)}.note{border-left:3px solid var(--status-pending);padding:8px 10px;font-size:13px;background:var(--surface-raised);color:var(--text-primary)}.note.bad{border-left-color:var(--status-danger)}.note.ok{border-left-color:var(--status-success)}</style></head>
<body><div class="app"><nav class="rail" id="rail" aria-label="Growth and content"></nav><main class="main" id="main" aria-live="polite"></main></div>
<script>
const KEY='sem-growth',esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const PAGES=[['msg','Positioning & approved claims'],['aud','Audiences & consent'],['camp','Campaign command center'],['cal','Editorial calendar'],['prod','Production & review'],['pub','Publishing & distribution'],['assets','Asset & evidence library'],['meas','Measurement'],['gtm','Go-to-market phases']];
const GTM=[['Phase 1 · days 1–30','Prove the operating loop','Internal operators + a small design-partner cohort','Founder outreach, warm intros, walkthroughs, owned landing page','discovery → workflow qualification → sandbox → first approved publication','5 end-to-end pilot runs; no unresolved critical isolation or authorization defects'],['Phase 2 · days 31–60','Authorized launch','Campus communications teams, program operators, institution-approved orgs','LinkedIn, live workflow webinars, partner intros, consented email','source-tagged visit → qualified request → discovery → authorized pilot → activation','3 activated pilot teams, 2 repeat-use cycles each (illustrative)'],['Phase 3 · days 61–90+','Repeatable expansion','Retained pilots','Permissioned case studies, search content, partner referrals, bounded paid tests','retained pilot → reviewed outcomes → paid conversion → authorized expansion','3 paid conversions or an agreed learning outcome (illustrative)']];
const AUDS=['Students','Faculty & advisors','Institutional buyers','Partners & employers','Investors & media'];
const PURPOSES=[['essential','Essential account & security','always','no opt-out; never promotional'],['institutional','Institution-authorized academic/operational','institution approval','sent on the institution’s authority'],['education','Optional product education','opt-in','topic preferences'],['commercial','Commercial marketing','opt-in + unsubscribe','frequency-capped'],['research','Research invitations','separate opt-in','IRB where required']];
const PROHIBITED=['private assignments','advising notes','disability or accommodation information','financial distress or holds','private AI conversations','grades or GPA'];
const BAN=/FERPA[- ]compliant|\bcertified\b|all-in-one|AI-powered|system of record|replaces? your|guaranteed|\bsecure\b|production[- ]ready|live at/i;
const S0={page:'camp',
 claims:[{id:'CL-1',t:'Shows where each deadline came from and how fresh it is',aud:['Students','Faculty & advisors'],ev:'Product: source labels (design)',st:'approved'},{id:'CL-2',t:'Works alongside your institution’s systems; your institution stays authoritative',aud:['Institutional buyers'],ev:'Placement register',st:'approved'},{id:'CL-3',t:'Signed paid pilot with Vanderbilt — launch Spring 2027, pending institutional activation',aud:['Investors & media','Institutional buyers'],ev:'DEC-PILOT-001 (founder-reported)',st:'approved'},{id:'CL-4',t:'Registration readiness is live at Vanderbilt',aud:['Students'],ev:'none',st:'rejected'}],
 audience:{name:'Students — product education',purpose:'education',filters:['opted into product education','interest: planning'],targeting:[],size:1240,suppressed:86},
 camp:{id:'CMP-07',n:'Spring planning — Today walkthrough',aud:'Students',purpose:'education',owner:'Harrison Rubin',budget:500,spent:120,dest:'https://semester.example/today',destOk:true,msg:'See every deadline in one place, with where it came from. Semester is designed to work alongside Canvas and your registrar.',assets:[['Email','approved'],['Instagram post','in review'],['Landing page','approved']],st:'draft'},
 content:[{id:'CT-11',t:'How Today shows where deadlines come from',fmt:'Article',aud:'Students',owner:'Teo Katz',due:'2026-10-28',st:'draft',review:{brand:false,claims:null,a11y:false},alt:'',captions:false,body:'Semester shows each deadline with its source and how fresh it is, so you know what to trust.'},{id:'CT-12',t:'Pilot readiness for registrars (one-pager)',fmt:'PDF',aud:'Institutional buyers',owner:'Harrison Rubin',due:'2026-11-04',st:'approved',review:{brand:true,claims:true,a11y:true},alt:'n/a',captions:true,body:'Semester works alongside your SIS. Your institution remains authoritative for records.'},{id:'CT-13',t:'Demo video — 90 seconds',fmt:'Video',aud:'Institutional buyers',owner:'Teo Katz',due:'2026-11-10',st:'in review',review:{brand:true,claims:true,a11y:false},alt:'',captions:false,body:'Walkthrough of the student and registrar journeys with sample data.'}],
 pubs:[],log:[]};
let S=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(S0));const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const L=t=>S.log.unshift([new Date().toLocaleTimeString(),t]);
const chip=(t,c)=>'<span class="chip '+(c||'')+'">'+esc(t)+'</span>';const card=(h,b)=>'<div class="card"><h2>'+h+'</h2>'+b+'</div>';
const tbl=(hd,rows)=>'<div class="ox"><table><thead><tr>'+hd.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
function readiness(){const c=S.camp,a=S.audience;const out=[];
 if(a.purpose!==c.purpose)out.push(['bad','Audience purpose ('+a.purpose+') doesn’t match the campaign purpose ('+c.purpose+')']);
 if(a.targeting.length)out.push(['bad','Audience uses prohibited targeting: '+a.targeting.join(', ')]);
 const un=c.assets.filter(x=>x[1]!=='approved');if(un.length)out.push(['bad','Unapproved assets: '+un.map(x=>x[0]).join(', ')]);
 if(!c.destOk)out.push(['bad','Landing destination is broken']);
 if(c.spent>c.budget)out.push(['bad','Spend $'+c.spent+' is over budget $'+c.budget]);
 const m=c.msg.match(BAN);if(m)out.push(['bad','Unsupported claim in message: “'+m[0]+'” — not in the approved claims library']);
 if(!c.owner)out.push(['bad','No accountable owner']);
 return out}
const V={
msg:()=>card('Approved claims by audience',tbl(['ID','Claim','Audiences','Evidence','Status'],S.claims.map(c=>[c.id,esc(c.t),c.aud.join(', '),esc(c.ev),chip(c.st,c.st==='approved'?'ok':'bad')]))+'<div class="row"><input id="nc" placeholder="Propose a claim" style="flex:1"><input id="ne" placeholder="Evidence (required)" style="width:220px"><button class="btn" id="ncb">Propose</button></div><div id="nce" class="muted" role="alert"></div><span class="muted">One audience’s message can’t silently become another audience’s promise: each claim lists who it’s approved for. A claim with no evidence can’t be approved; a designed capability can’t be described as live.</span>'),
aud:()=>{const a=S.audience;return card(esc(a.name),'<div class="sm"><b>Purpose:</b> <select id="ap">'+PURPOSES.map(p=>'<option value="'+p[0]+'"'+(a.purpose===p[0]?' selected':'')+'>'+p[1]+'</option>').join('')+'</select></div><div class="sm"><b>Rules:</b> '+a.filters.map(f=>chip(f)).join(' ')+'</div><div class="sm">Eligible '+a.size.toLocaleString()+' · suppressed (unsubscribed / bounced / frequency cap) '+a.suppressed+' · will receive <b>'+(a.size-a.suppressed).toLocaleString()+'</b></div><h3>Try to add a targeting attribute</h3><div class="row">'+PROHIBITED.map(p=>'<button class="btn" data-tg="'+esc(p)+'">'+esc(p)+'</button>').join('')+'</div>'+(a.targeting.length?'<div class="note bad">Blocked: '+a.targeting.map(esc).join(', ')+' can never be used for promotional targeting. <button class="btn" id="tgx">Remove</button></div>':'')+tbl(['Purpose','Basis','Note'],PURPOSES.map(p=>[p[1],p[2],p[3]]))+'<span class="muted">Audiences come from purpose-specific subscriptions, not from all Semester users. Exports are controlled and logged.</span>')},
camp:()=>{const c=S.camp,R=readiness();return card(c.id+' · '+esc(c.n),'<div class="sm">Audience: '+c.aud+' · purpose '+c.purpose+' · owner '+esc(c.owner)+'</div><label class="sm" style="display:grid;gap:3px">Message<textarea id="cm" rows="3">'+esc(c.msg)+'</textarea></label><div class="row sm">Budget $'+c.budget+' · spent $'+c.spent+' <button class="btn" id="sp">+ $450 ad spend</button> · Destination '+(c.destOk?chip('reachable','ok'):chip('broken','bad'))+' <button class="btn" id="dt">Toggle destination</button></div>'+tbl(['Asset','Status'],c.assets.map(x=>[x[0],chip(x[1],x[1]==='approved'?'ok':'warn')]))+'<h3>Launch readiness</h3>'+(R.length?R.map(r=>'<div class="note bad">'+esc(r[1])+'</div>').join(''):'<div class="note ok">All checks pass.</div>')+'<div class="row"><button class="btn p" id="ln"'+(R.length||c.st!=='draft'?' disabled':'')+'>'+(c.st==='draft'?'Launch campaign':'Launched')+'</button></div>')},
cal:()=>card('Editorial calendar',tbl(['Due','Item','Format','Audience','Owner','Status'],S.content.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(x=>[x.due,esc(x.t),x.fmt,x.aud,esc(x.owner),chip(x.st,x.st==='approved'?'ok':'warn')]))),
prod:()=>S.content.map((x,i)=>{const cl=BAN.test(x.body)?false:true;const a11y=x.fmt==='Video'?x.captions:x.fmt==='Article'?!!x.alt.trim():true;return card(x.id+' · '+esc(x.t),'<div class="sm">'+x.fmt+' · '+x.aud+' · '+chip(x.st,x.st==='approved'?'ok':'warn')+'</div><label class="sm" style="display:grid;gap:3px">Draft · revision '+(x.rev||1)+(x.st==='approved'?' · approved revision '+(x.apRev||x.rev||1):'')+'<textarea data-bd="'+i+'" rows="2">'+esc(x.body)+'</textarea></label>'+(x.fmt==='Article'?'<label class="sm row">Image alt text <input data-alt="'+i+'" value="'+esc(x.alt)+'" style="flex:1"></label>':'')+(x.fmt==='Video'?'<label class="row sm"><input type="checkbox" data-cap="'+i+'"'+(x.captions?' checked':'')+'> Captions and transcript attached</label>':'')+tbl(['Review','Result'],[['Brand',x.review.brand?chip('approved','ok'):'<button class="btn" data-br="'+i+'">Brand approves</button>'],['Claims',cl?chip('no unsupported claims','ok'):chip('unsupported claim','bad')],['Accessibility',a11y?chip('passes','ok'):chip(x.fmt==='Video'?'needs captions':'needs alt text','bad')]])+(x.st!=='approved'?'<button class="btn p" data-ap="'+i+'"'+(x.review.brand&&cl&&a11y?'':' disabled')+'>Approve for publishing</button>':''))}).join(''),
pub:()=>card('Publishing & distribution',S.content.filter(x=>x.st==='approved').map(x=>{const p=S.pubs.find(y=>y.id===x.id);return '<div class="sm"><b>'+esc(x.t)+'</b> · '+(p?chip(p.st,p.st==='published'?'ok':p.st==='failed'||p.st==='unknown'?'bad':'warn')+(p.st!=='published'?' <button class="btn" data-adv="'+x.id+'">Next provider callback</button>':''):'<button class="btn" data-sch="'+x.id+'">Schedule</button>')+'</div>'}).join('')+'<span class="muted">Scheduled isn’t published. States stay separate: requested → accepted by the channel → published, or failed / unknown. Unknown needs a check with the channel, never an automatic retry.</span>'),
assets:()=>card('Asset & evidence library',tbl(['Asset','Rights','Use'],[['Product screenshots (sample data)','Semester-owned','Must show “sample data”'],['Vanderbilt logo','Not licensed','Needs written permission (claims register)'],['Stock photo — study hall','Licensed until 2026-10-01','<span class="chip bad">expired — blocked for new use</span>'],['Founder headshot','Owned','All'],['Student testimonial','—','None collected; don’t fabricate']])+'<span class="muted">Every claim links to an evidence record. Media is used only when its rights are cleared.</span>'),
gtm:()=>{S.gtm=S.gtm||{};return GTM.map((g,i)=>{const open=i===0||S.gtm[i-1];return card(g[0]+' — '+g[1],'<div class="sm"><b>Audience:</b> '+g[2]+'</div><div class="sm"><b>Channels:</b> '+g[3]+'</div><div class="sm"><b>Funnel:</b> '+g[4]+'</div><div class="sm"><b>Exit gate:</b> '+g[5]+'</div>'+(open?'<label class="row sm"><input type="checkbox" data-gx="'+i+'"'+(S.gtm[i]?' checked':'')+'> Exit gate met (evidence attached)</label>':'<div class="note">Locked until the previous phase’s exit gate is met.</div>'))}).join('')+'<span class="muted">Phases progress on evidence, not dates. Paid tests need reliable conversion tracking and an approved budget cap. Packaging and pricing still need validating.</span>'},
meas:()=>card('Measurement',tbl(['Metric','Value','Definition'],[['Delivered',S.camp.st==='launched'?(S.audience.size-S.audience.suppressed).toLocaleString():'—','Accepted by the delivery service'],['Meaningful action','—','Completed a planning action within 7 days (not opens or clicks)'],['Unsubscribes','—','Per campaign; feeds suppression']])+'<span class="muted">Every metric shows its owner, definition, source and refresh time. Forecasts stay separate from actuals.</span>')
};
function draw(){document.getElementById('rail').innerHTML='<div class="kicker" style="padding:4px 10px 10px">Semester LLC · Growth & Content</div>'+PAGES.map(([k,l])=>'<button data-pg="'+k+'"'+(S.page===k?' aria-current="page"':'')+'>'+l+'</button>').join('')+'<button class="btn" id="rst" style="margin:12px 10px 0">Reset</button>';
 document.getElementById('main').innerHTML='<div><div class="kicker">Company workspace · sample data</div><h1>'+PAGES.find(p=>p[0]===S.page)[1]+'</h1></div>'+V[S.page]()+(S.log.length?'<div class="card"><h3>Activity</h3>'+S.log.slice(0,6).map(l=>'<div class="sm"><span class="muted">'+l[0]+'</span> · '+esc(l[1])+'</div>').join('')+'</div>':'');bind();save()}
function bind(){const $=q=>document.querySelectorAll(q),g=id=>document.getElementById(id);$('[data-pg]').forEach(b=>b.onclick=()=>{S.page=b.dataset.pg;draw()});g('rst').onclick=()=>{localStorage.removeItem(KEY);location.reload()};
 if(g('ncb'))g('ncb').onclick=()=>{const t=g('nc').value.trim(),e=g('ne').value.trim();if(!t)return;if(!e){g('nce').textContent='A claim needs evidence before review.';return}if(BAN.test(t)){g('nce').textContent='Prohibited wording — rewrite without “'+t.match(BAN)[0]+'”.';return}S.claims.push({id:'CL-'+(S.claims.length+1),t,aud:['Students'],ev:e,st:'in review'});L('Claim proposed');draw()};
 if(g('ap'))g('ap').onchange=e=>{S.audience.purpose=e.target.value;draw()};
 $('[data-tg]').forEach(b=>b.onclick=()=>{if(!S.audience.targeting.includes(b.dataset.tg))S.audience.targeting.push(b.dataset.tg);L('Blocked targeting attempt: '+b.dataset.tg);draw()});if(g('tgx'))g('tgx').onclick=()=>{S.audience.targeting=[];draw()};
 if(g('cm'))g('cm').onchange=e=>{S.camp.msg=e.target.value;draw()};if(g('sp'))g('sp').onclick=()=>{S.camp.spent+=450;draw()};if(g('dt'))g('dt').onclick=()=>{S.camp.destOk=!S.camp.destOk;draw()};
 if(g('ln'))g('ln').onclick=()=>{S.audience.suppressed+=3;S.camp.st='launched';L(S.camp.id+' launched — suppression re-checked at send (3 new unsubscribes excluded) → '+(S.audience.size-S.audience.suppressed)+' recipients');draw()};
 $('[data-bd]').forEach(t=>t.onchange=()=>{const x=S.content[+t.dataset.bd];if(t.value===x.body)return;x.body=t.value;x.rev=(x.rev||1)+1;if(x.st==='approved'){x.st='in review';x.review.brand=false;S.pubs=S.pubs.filter(y=>y.id!==x.id);L(x.id+' edited after approval — approval of revision '+(x.apRev||x.rev-1||1)+' invalidated')}draw()});
 $('[data-alt]').forEach(i=>i.onchange=()=>{S.content[+i.dataset.alt].alt=i.value;draw()});$('[data-cap]').forEach(c=>c.onchange=()=>{S.content[+c.dataset.cap].captions=c.checked;draw()});
 $('[data-br]').forEach(b=>b.onclick=()=>{S.content[+b.dataset.br].review.brand=true;draw()});
 $('[data-ap]').forEach(b=>b.onclick=()=>{const x=S.content[+b.dataset.ap];x.st='approved';x.apRev=x.rev||1;const a=S.camp.assets.find(y=>y[0]==='Instagram post');if(a&&x.fmt==='Video')a[1]='approved';L(x.id+' approved for publishing');draw()});
 $('[data-gx]').forEach(c=>c.onchange=()=>{S.gtm[+c.dataset.gx]=c.checked;if(!c.checked)for(let k=+c.dataset.gx+1;k<3;k++)S.gtm[k]=false;draw()});
 $('[data-sch]').forEach(b=>b.onclick=()=>{S.pubs.push({id:b.dataset.sch,st:'requested'});L('Publishing requested');draw()});
 $('[data-adv]').forEach(b=>b.onclick=()=>{const p=S.pubs.find(y=>y.id===b.dataset.adv);p.st=p.st==='requested'?'accepted':'published';L('Channel: '+p.st);draw()})}
draw();
</script></body></html>
