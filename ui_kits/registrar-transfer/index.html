<!-- @dsCard group="Product domains" viewport="1280x880" name="Registrar — transfer & credit evaluation" subtitle="Batch F of the registrar register (9 capabilities): external institutions and accreditation, incoming transcript intake with provenance, equivalency rules and articulation agreements, exam and prior-learning credit, a manual evaluation queue, awarded credit and its applicability, re-evaluation and appeal" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><title>Semester — Registrar transfer credit</title>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}.rail{background:var(--surface-base);border-right:1px solid var(--border-subtle);padding:14px 8px;display:grid;gap:2px;align-content:start}.rail button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:14px;color:var(--text-primary)}.rail button[aria-current=page]{background:var(--surface-raised);font-weight:600}.rail button:focus-visible,.btn:focus-visible{outline:2px solid var(--action-primary)}.main{padding:20px 26px 56px;display:grid;gap:14px;align-content:start;min-width:0}h1{margin:0;font-size:22px}h2{margin:0;font-size:16px}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px}.sm{font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{border:1px solid var(--border-subtle);border-radius:8px;padding:14px;background:var(--surface-base);display:grid;gap:8px;align-content:start;min-width:0}.ox{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--border-subtle);font-size:13px;text-align:left;vertical-align:top}th{font-size:11px;color:var(--text-secondary);font-weight:600}.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border-subtle);white-space:nowrap}.ok{color:var(--status-success);border-color:currentColor}.bad{color:var(--status-danger);border-color:currentColor}.warn{color:var(--status-pending);border-color:currentColor}.btn{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;border:1px solid var(--border-subtle);font-size:13px;background:var(--surface-base);color:var(--text-primary)}.btn.p{background:var(--action-primary);color:var(--text-on-action,#fff);border-color:var(--action-primary)}input,select,textarea{font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-base);color:var(--text-primary)}label.f{display:grid;gap:3px;font-size:12px;color:var(--text-secondary)}.note{border-left:3px solid var(--status-pending);padding:8px 10px;font-size:13px;background:var(--surface-raised);color:var(--text-primary)}.note.bad{border-left-color:var(--status-danger)}.note.ok{border-left-color:var(--status-success)}</style></head>
<body><div class="app"><nav class="rail" id="rail" aria-label="Transfer and credit evaluation"></nav><main class="main" id="main" aria-live="polite"></main></div>
<script>
const KEY='sem-reg-xfer',esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const PAGES=[['F01','External institutions'],['F02','Transcript intake'],['F03','Equivalency rules'],['F04','Articulation agreements'],['F05','Exam and prior-learning credit'],['F06','Manual evaluation queue'],['F07','Awarded credit'],['F08','Re-evaluation and appeal'],['F09','Source provenance']];
const GP={A:4,'A-':3.7,'B+':3.3,B:3,'B-':2.7,'C+':2.3,C:2,'C-':1.7,D:1,F:0};
const S0={page:'F01',
 inst:[{id:'NSCC',n:'Nashville State Community College',acc:'SACSCOC',st:'accredited'},{id:'UTK',n:'University of Tennessee, Knoxville',acc:'SACSCOC',st:'accredited'},{id:'XU',n:'Example Online Institute',acc:'none found',st:'unaccredited'}],
 intake:[{id:'TR-301',stu:'Maya Chen',from:'NSCC',via:'Parchment (official, sealed)',recv:'2026-08-02',st:'parsed',hash:'9c1f…a20e',lines:[['ENGL 1010','Composition I',3,'A'],['MATH 1130','College Algebra',3,'B'],['HIST 2010','US History I',3,'C-'],['PSYC 1030','Intro Psychology',3,'B+']]},{id:'TR-302',stu:'Jordan Ali',from:'XU',via:'Student upload (PDF)',recv:'2026-09-14',st:'unverified',hash:'—',lines:[['CS 101','Programming',3,'A']]}],
 rules:[{from:'NSCC',ext:'ENGL 1010',to:'ENGL 1100',cr:3,min:'C',st:'approved',eff:'2024FA'},{from:'NSCC',ext:'MATH 1130',to:'MATH 1010',cr:3,min:'C',st:'approved',eff:'2024FA'},{from:'NSCC',ext:'HIST 2010',to:'HIST 1xxx (elective)',cr:3,min:'C',st:'approved',eff:'2024FA'}],
 agreements:[{id:'ART-NSCC-ECON',n:'NSCC A.S. → Economics BA',from:'NSCC',st:'active',until:'2028-06-30',guarantee:'Completed A.S. satisfies AXLE general education'}],
 exams:[{stu:'Maya Chen',exam:'AP Calculus AB',score:4,rule:'4+ → MATH 1200 (4 cr)',to:'MATH 1200',cr:4,st:'pending score report'}],
 queue:[],awards:[],appeals:[],log:[]};
let S=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(S0));const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const L=t=>S.log.unshift([new Date().toLocaleTimeString(),t]);
const chip=(t,c)=>'<span class="chip '+(c||'')+'">'+esc(t)+'</span>';const card=(h,b)=>'<div class="card"><h2>'+h+'</h2>'+b+'</div>';
const tbl=(hd,rows)=>'<div class="ox"><table><thead><tr>'+hd.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
function evalLine(t,l){const rule=S.rules.find(r=>r.from===t.from&&r.ext===l[0]&&r.st==='approved');if(t.st!=='verified')return ['blocked','Transcript not verified as official'];const inst=S.inst.find(i=>i.id===t.from);if(inst.st!=='accredited')return ['manual','Source institution not accredited — manual review'];if(!rule)return ['manual','No approved rule — manual evaluation'];if(GP[l[3]]<GP[rule.min])return ['no credit','Grade '+l[3]+' below '+rule.min];return ['award',rule.to+' · '+rule.cr+' cr']}
const V={
F01:()=>card('External institutions',tbl(['Institution','Accreditor','Status'],S.inst.map(i=>[esc(i.n),i.acc,chip(i.st,i.st==='accredited'?'ok':'bad')]))+'<span class="muted">Accreditation comes from the accreditor’s directory, checked at evaluation time. Work from an unaccredited institution always goes to manual review.</span>'),
F02:()=>S.intake.map((t,i)=>card(t.id+' · '+esc(t.stu)+' · '+esc(S.inst.find(x=>x.id===t.from).n),'<div class="sm">Received '+t.recv+' via '+esc(t.via)+' · '+chip(t.st,t.st==='verified'?'ok':t.st==='unverified'?'bad':'warn')+'</div>'+tbl(['Course','Title','Credits','Grade'],t.lines.map(l=>[l[0],esc(l[1]),l[2],l[3]]))+(t.st==='parsed'?'<button class="btn p" data-ver="'+i+'">Verify against the sealed original</button>':t.st==='unverified'?'<div class="note bad">A student upload isn’t official. Request an official transcript from the issuing school.</div><button class="btn" data-req="'+i+'">Request official transcript</button>':'<button class="btn" data-ev="'+i+'">Run evaluation</button>'))).join(''),
F03:()=>card('Equivalency rules',tbl(['From','External course','Counts as','Credits','Minimum','Effective','Status'],S.rules.map(r=>[r.from,r.ext,esc(r.to),r.cr,r.min,r.eff,chip(r.st,r.st==='approved'?'ok':'warn')]))+'<span class="muted">Rules are versioned by effective term and approved by the receiving department. A rule changes future evaluations only; awarded credit keeps the rule version it used.</span>'),
F04:()=>card('Articulation agreements',S.agreements.map(a=>'<div class="sm"><b>'+a.id+'</b> · '+esc(a.n)+' · until '+a.until+' '+chip(a.st,'ok')+'</div><div class="muted">'+esc(a.guarantee)+'</div>').join('')+'<span class="muted">An agreement is a signed institutional commitment; it can guarantee a block of requirements, not just single courses.</span>'),
F05:()=>card('Exam and prior-learning credit',tbl(['Student','Exam','Score','Rule','Status',''],S.exams.map((e,i)=>[esc(e.stu),e.exam,e.score,esc(e.rule),chip(e.st,e.st==='awarded'?'ok':'warn'),e.st!=='awarded'?'<button class="btn" data-ex="'+i+'">Official score report received</button>':'']))+'<span class="muted">A self-reported score isn’t enough: credit waits for the official score report from the testing agency.</span>'),
F06:()=>card('Manual evaluation queue · '+S.queue.filter(q=>q.st==='open').length,S.queue.length?tbl(['Student','Course','From','Reason','',''],S.queue.map((q,i)=>[esc(q.stu),q.course,q.from,esc(q.why),chip(q.st,q.st==='open'?'warn':'ok'),q.st==='open'?'<input data-qe="'+i+'" placeholder="Equivalent (or none)" style="width:150px"> <button class="btn" data-qa="'+i+'">Decide</button>':esc(q.decision)])):'<span class="muted">Empty. Run an evaluation from Transcript intake.</span>'),
F07:()=>card('Awarded credit',(S.awards.length?tbl(['Student','External','Awarded as','Credits','Applies to','Rule'],S.awards.map(a=>[esc(a.stu),a.ext,esc(a.to),a.cr,a.applies,esc(a.rule)])):'<span class="muted">Nothing awarded yet.</span>')+'<span class="muted">Transfer credits count toward earned hours and requirements. They don’t enter the institutional GPA.</span>'),
F08:()=>card('Re-evaluation and appeal',(S.awards.length?tbl(['Student','Course','Decision',''],S.awards.map((a,i)=>[esc(a.stu),a.ext,esc(a.to),S.appeals.find(x=>x.i===i)?chip(S.appeals.find(x=>x.i===i).st,'warn'):'<button class="btn" data-ap="'+i+'">Student appeals</button>'])):'<span class="muted">No decisions to appeal yet.</span>')+(S.appeals.length?S.appeals.map((x,j)=>'<div class="sm">Appeal on '+S.awards[x.i].ext+': '+esc(x.why)+' · '+chip(x.st)+(x.st==='filed'?' <button class="btn" data-ad="'+j+'|upheld">Uphold</button> <button class="btn" data-ad="'+j+'|revised">Revise to '+esc(x.want)+'</button>':'')+'</div>').join(''):'')+'<span class="muted">A department chair, not the original evaluator, decides an appeal. A revision supersedes the award with a reason; the old decision stays in the history.</span>'),
F09:()=>card('Source provenance',tbl(['Transcript','Channel','Received','Content hash','Status'],S.intake.map(t=>[t.id,esc(t.via),t.recv,'<span class="mono">'+t.hash+'</span>',chip(t.st)]))+'<span class="muted">Every awarded credit links back to the transcript line, its hash and the rule version used. Re-running an evaluation never edits a past award.</span>')
};
function draw(){document.getElementById('rail').innerHTML='<div class="kicker" style="padding:4px 10px 10px">Registrar · transfer credit</div>'+PAGES.map(([k,l])=>'<button data-pg="'+k+'"'+(S.page===k?' aria-current="page"':'')+'><span class="mono" style="font-size:11px">'+k+'</span> '+l+(k==='F06'&&S.queue.some(q=>q.st==='open')?' · '+S.queue.filter(q=>q.st==='open').length:'')+'</button>').join('')+'<button class="btn" id="rst" style="margin:12px 10px 0">Reset</button>';
 document.getElementById('main').innerHTML='<div><div class="kicker">Vanderbilt University · Registrar · sample data</div><h1>'+PAGES.find(p=>p[0]===S.page)[1]+'</h1></div>'+V[S.page]()+(S.log.length?'<div class="card"><h3>Activity</h3>'+S.log.slice(0,6).map(l=>'<div class="sm"><span class="muted">'+l[0]+'</span> · '+esc(l[1])+'</div>').join('')+'</div>':'');bind();save()}
function bind(){const $=q=>document.querySelectorAll(q),g=id=>document.getElementById(id);$('[data-pg]').forEach(b=>b.onclick=()=>{S.page=b.dataset.pg;draw()});g('rst').onclick=()=>{localStorage.removeItem(KEY);location.reload()};
 $('[data-ver]').forEach(b=>b.onclick=()=>{const t=S.intake[+b.dataset.ver];t.st='verified';L(t.id+' verified as official');draw()});
 $('[data-req]').forEach(b=>b.onclick=()=>{L('Official transcript requested for '+S.intake[+b.dataset.req].stu);alert('Request sent to the issuing school.')});
 $('[data-ev]').forEach(b=>b.onclick=()=>{const t=S.intake[+b.dataset.ev];let a=0,m=0,n=0;t.lines.forEach(l=>{if(S.awards.find(x=>x.tr===t.id&&x.ext===l[0])||S.queue.find(q=>q.tr===t.id&&q.course===l[0]))return;const [r,d]=evalLine(t,l);if(r==='award'){const ru=S.rules.find(x=>x.from===t.from&&x.ext===l[0]);S.awards.push({tr:t.id,stu:t.stu,ext:l[0],to:ru.to,cr:ru.cr,applies:/xxx/.test(ru.to)?'Elective':'Requirement',rule:ru.from+' '+ru.ext+' · '+ru.eff});a++}else if(r==='manual'){S.queue.push({tr:t.id,stu:t.stu,course:l[0],from:t.from,why:d,st:'open'});m++}else n++});L(t.id+': '+a+' awarded, '+m+' to manual review, '+n+' no credit');draw()});
 $('[data-ex]').forEach(b=>b.onclick=()=>{const e=S.exams[+b.dataset.ex];e.st='awarded';S.awards.push({tr:'AP',stu:e.stu,ext:e.exam,to:e.to,cr:e.cr,applies:'Requirement',rule:e.rule});L('Exam credit awarded: '+e.to);draw()});
 $('[data-qa]').forEach(b=>b.onclick=()=>{const q=S.queue[+b.dataset.qa];const v=document.querySelector('[data-qe="'+b.dataset.qa+'"]').value.trim();if(!v)return;q.st='decided';q.decision=v;if(!/^none$/i.test(v))S.awards.push({tr:q.tr,stu:q.stu,ext:q.course,to:v,cr:3,applies:'Elective',rule:'manual · evaluator'});L('Manual decision '+q.course+' → '+v);draw()});
 $('[data-ap]').forEach(b=>b.onclick=()=>{const why=prompt('Student’s reason','Course syllabus matches ECON 1020 content');if(!why)return;S.appeals.push({i:+b.dataset.ap,why,want:prompt('Requested equivalent','HIST 1100')||'—',st:'filed'});L('Appeal filed');draw()});
 $('[data-ad]').forEach(b=>b.onclick=()=>{const [j,d]=b.dataset.ad.split('|');const x=S.appeals[+j];x.st=d;if(d==='revised'){const a=S.awards[x.i];a.rule+=' → revised on appeal (was '+a.to+')';a.to=x.want}L('Appeal '+d+' by department chair');draw()})}
draw();
</script></body></html>
