<style>html,body,#root{height:100%}body{margin:0;overflow:hidden}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}.main{display:flex;flex-direction:column;min-width:0;height:100%}.scroll{flex:1;overflow:auto}.page{max-width:1280px;margin:0 auto;padding:24px var(--page-pad) 64px;display:grid;gap:22px}.ph{padding-bottom:16px;border-bottom:1px solid var(--border-subtle)}.ph h1{margin:4px 0 0;text-wrap:pretty}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.lead{color:var(--text-secondary);max-width:76ch;margin:6px 0 0;line-height:1.55;text-wrap:pretty}.muted{color:var(--text-secondary);font-size:13px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}.card{border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);padding:14px 16px;display:grid;gap:8px;align-content:start}.card h3{margin:0;font:600 17px var(--font-heading)}button.card{all:unset;box-sizing:border-box;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);padding:14px 16px;display:grid;gap:8px;align-content:start;cursor:pointer}button.card:hover,button.card:focus-visible{border-color:var(--focus-color);outline:none}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;border:1px solid var(--border-default);border-radius:3px;padding:2px 7px;font-size:12px;white-space:nowrap}.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{text-align:left;font-weight:500;color:var(--text-secondary);border-bottom:1px solid var(--border-strong);padding:6px 8px;position:sticky;top:0;background:var(--surface-canvas)}.tbl td{border-bottom:1px solid var(--border-subtle);padding:7px 8px;vertical-align:top}.tbl tr.rowbtn{cursor:pointer}.tbl tr.rowbtn:hover td{background:var(--surface-sunken)}.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.flow span{border:1px solid var(--border-default);background:var(--surface-base);border-radius:4px;padding:5px 9px;font-size:13px}.flow i{font-style:normal;color:var(--text-secondary)}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:18px;align-items:start}@media(max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}.drawer{position:sticky;top:12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-base);padding:16px;display:grid;gap:12px}.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 10px;font-size:13px}.kv b{font-weight:500;color:var(--text-secondary)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex:none}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools input,.tools select{font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--border-default);border-radius:4px;background:var(--surface-base);color:inherit}.mini{border:1px solid var(--border-default);border-radius:6px;overflow:hidden;display:grid;grid-template-columns:44px minmax(0,1fr);height:230px;font-size:11px}.mini .rail{background:#1b1a17;display:flex;flex-direction:column;gap:8px;padding:10px 0;align-items:center}.mini .rail i{width:18px;height:4px;border-radius:2px;background:#4a4945}.mini .rail i.on{background:#7d9cbb}.mini .body{background:#f4f1ea;padding:10px 12px;display:grid;gap:7px;align-content:start;overflow:hidden}.mini .h{font:700 15px 'Barlow Condensed','Barlow',sans-serif;display:flex;justify-content:space-between;align-items:center}.mini .btn{background:#416180;color:#fff;border-radius:3px;padding:3px 8px;font:600 11px 'Barlow',sans-serif}.mini .row{display:flex;justify-content:space-between;gap:8px;background:var(--surface-base);border:1px solid #e7e7ea;border-radius:3px;padding:5px 7px}.mini .src{color:#5d5d60}.mini .tile{background:var(--surface-base);border:1px solid #e7e7ea;border-radius:3px;padding:6px}.mini .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mini .field{background:var(--surface-base);border:1px solid #cfcfd3;border-radius:3px;height:16px}.mini .lab{color:#5d5d60;font-size:10px}.gate{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}.gate label{display:flex;gap:6px;align-items:center;font-size:12.5px}.bar{height:6px;background:var(--border-subtle);border-radius:3px;overflow:hidden}.bar>div{height:100%;background:var(--action-primary)}pre.cmd{background:#12141a;color:#eceef2;padding:12px 14px;border-radius:6px;font-size:12.5px;white-space:pre-wrap;margin:0}.mx td,.mx th{text-align:center;padding:5px 4px;font-size:12px}.mx td:first-child,.mx th:first-child{text-align:left;white-space:nowrap}</style></head>

<script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba; const X = window.NATIVE; const KEY = 'sem-native-v1';
const SC = { 'Native and verified':'#2f7a4f','Native but incomplete':'#4d6f91','Integrated only':'#8a6d2b','Transitional':'#a5803a','Static prototype only':'#7a6aa8','Designed/documented only':'#8b8b90','Planned':'#b7b7ba','Not started':'#d0d0d4','Unsafe to activate':'#a33b3b' };
const NATIVE_APP_ROUTES = {"A":[["Student Today","/student/today"],["Faculty home","/faculty/os"],["Phone menu","/student/__menu"]],"B":[["Gradebook","/student/gradebook"],["Course Studio","/faculty/course"],["Grade posting","/faculty/posting"]],"C":[["Academic records","/institution/records"],["Substitutions","/institution/substitutions"],["Plan registration","/student/regplan"]],"D":[["Advising home","/advisor/home"],["Course advisor","/student/advise"],["Executive Advisor","/student/nextsteps"]],"E":[["Studio home","/studio/home"],["Offline sync","/studio/sync"],["Master plan","/student/masterplan"]],"F":[["AI risk","/trust/airisk"],["Explanation guard","/advisor/guard"],["Ask Semester","/student/ai"]],"G":[["Housing","/student/housing"],["Clubs","/student/clubs"]],"H":[["Payments and holds","/finops/payments"],["Refunds","/finops/refunds"],["Forecast","/executive/decisions"]],"I":[["Network","/student/network"],["Alumni","/alumni/directory"],["Employer","/employer/post"]],"J":[["Feed","/student/feed"],["Moderation","/trust/social"]],"K":[["Family billing","/family/billing"],["What’s shared","/family/consent"]],"L":[["Permission checker","/trust/permissions"],["Workflow settings","/institution/workflows"]],"M":[["SIS field map","/trust/fieldmap"],["Integrations","/institution/integrations"]],"N":[["FERPA checklist","/trust/ferpa"],["Contract worksheet","/trust/contract"]],"O":[["Execution plan","/company/execution"],["Pipeline","/company/pipeline"]],"P":[["Operations console","/operations/console"]],"Q":[["Completion program","/os/completion"]],"R":[["Education graph","/os/graph"]],"S":[["Repo verification","/os/repo"]],"U":[["Term calendars","/institution/calendarmodel"]]};
const topDomains = X.D.filter((d) => !d.parent);
const kids = (id) => X.D.filter((d) => d.parent === id);
const mods = (id) => X.all.filter((m) => m.domain === id);
function Status({ s }) { return <span className="chip"><span className="dot" style={{ background: SC[s] || '#999' }}></span>{s}</span>; }
function Flow({ k }) { const f = X.FLOWS[k]; if (!f) return null; return <div style={{ display: 'grid', gap: 6 }}><div className="kicker">{f.name}</div><div className="flow">{f.steps.map((s, i) => <React.Fragment key={i}>{i > 0 && <i>→</i>}<span>{s}</span></React.Fragment>)}</div></div>; }
function Mini({ m }) {
  const rows = (n, f) => Array.from({ length: n }, (_, i) => f(i));
  const body = {
    list: rows(5, (i) => <div className="row" key={i}><span>{m.name} item {i + 1}</span><span className="src">{i % 2 ? '◆ Official' : 'Semester'}</span></div>),
    queue: rows(5, (i) => <div className="row" key={i}><span>#{1040 + i} · {['Due today', 'New', 'Waiting', 'Escalated', 'New'][i]}</span><span className="src">{i + 1}h</span></div>),
    ledger: rows(5, (i) => <div className="row" key={i}><span style={{ fontFamily: 'ui-monospace,monospace' }}>{`2026-10-0${5 - i} · v${5 - i}`}</span><span className="src">{['proposed', 'approved', 'superseded', 'approved', 'created'][i]}</span></div>),
    dashboard: [<div className="tiles" key="t">{['Now', 'Due', 'Health'].map((t) => <div className="tile" key={t}><div className="lab">{t}</div><b>—</b></div>)}</div>, ...rows(3, (i) => <div className="row" key={i}><span>Needs attention {i + 1}</span><span className="src">why →</span></div>)],
    builder: [<div className="lab" key="l1">Title</div>, <div className="field" key="f1"></div>, <div className="lab" key="l2">Content</div>, <div className="field" key="f2" style={{ height: 60 }}></div>, <div className="row" key="r"><span>Accessibility check</span><span className="src">2 to fix</span></div>],
    settings: rows(4, (i) => <div className="row" key={i}><span>Setting {i + 1}</span><span className="src">{['On', 'Off', 'Institution default', 'Locked by policy'][i]}</span></div>).concat([<div className="row" key="p"><span>Preview impact before saving</span><span className="src">142 people</span></div>]),
    calendar: [<div className="tiles" key="c" style={{ gridTemplateColumns: 'repeat(5,1fr)' }}>{['M', 'T', 'W', 'T', 'F'].map((d, i) => <div className="tile" key={i} style={{ height: 70 }}><div className="lab">{d}</div>{i % 2 === 0 && <div style={{ background: '#dfe7ef', borderRadius: 2, height: 18, marginTop: 4 }}></div>}</div>)}</div>],
    assistant: [<div className="row" key="q"><span>Your question…</span></div>, <div className="tile" key="a">Answer from approved course sources <span className="src">[1] [2]</span><div className="lab" style={{ marginTop: 4 }}>✦ AI-assisted · not an official decision</div></div>, <div className="row" key="h"><span>Ask a person</span><span className="src">→</span></div>]
  }[m.arch];
  return <div className="mini" aria-label={'Screen preview: ' + m.name}><div className="rail">{rows(7, (i) => <i key={i} className={i === 2 ? 'on' : ''}></i>)}</div><div className="body"><div className="lab">{m.route}</div><div className="h"><span>{m.name}</span><span className="btn">{m.primary}</span></div><div className="chips"><span className="chip" style={{ fontSize: 10 }}>{m.source}</span></div>{body}</div></div>;
}
function Spec({ m, onClose }) {
  const d = X.D.find((x) => x.id === m.domain);
  return <aside className="drawer" aria-label="Screen spec"><div style={{ display: 'flex', justifyContent: 'space-between', gap: 8 }}><div><div className="kicker">{d.id} · {d.short} · {m.arch} screen</div><h3 style={{ margin: '2px 0 0', font: '700 22px var(--font-heading)' }}>{m.name}</h3></div><N.Button variant="ghost" size="sm" onClick={onClose}>Close</N.Button></div><p className="muted" style={{ fontSize: 14 }}>{m.does}</p><Mini m={m} />
    <div className="kv"><b>Status</b><span><Status s={m.status} /></span><b>Route</b><code>{m.route}</code><b>Capabilities</b><span><code>{m.cap.read}</code><br /><code>{m.cap.write}</code></span><b>Primary action</b><span>{m.primary}</span><b>Data source</b><span>{m.source}</span><b>Classification</b><span>{m.sens ? 'Sensitive — ' : ''}{d.cls}</span><b>Authority</b><span>{d.authority}</span><b>Who uses it</b><span>{d.users.join(', ')}</span><b>AI rule</b><span>{m.ai}</span><b>Audit events</b><span>{m.audit.map((a) => <code key={a} style={{ display: 'block' }}>{a}</code>)}</span><b>States</b><span>{m.states.join(' · ')}</span><b>Reliability</b><span>{m.slo}</span><b>Support owner</b><span>{m.support}</span><b>Transition bridge</b><span>{m.bridge}</span><b>Authority gate</b><span>{d.gate}</span><b>Next action</b><span>{m.next}</span></div>
    <Flow k={m.flow} />{m.high && <p className="muted">High-impact: runs through the command path with approval, idempotency and an audit receipt. Client state is never the authority.</p>}</aside>;
}
function Overview({ go, open }) {
  const counts = {}; X.all.forEach((m) => { counts[m.status] = (counts[m.status] || 0) + 1; });
  return <><div className="ph"><div className="kicker">Native platform</div><h1>One native Education OS</h1><p className="lead">Semester is one company, platform, data model, AI layer, workflow engine, control plane and experience — built native from inception. Integrations are controlled transition bridges; a domain becomes authoritative only after proof. {X.D.length} domains · {X.all.length} modules, each a screen with route, capability, data authority, audit, AI rule and next action.</p></div>
    <div className="chips">{X.DOCTRINE.map((d) => <span className="chip" key={d} style={{ fontSize: 15, padding: '5px 10px', fontWeight: 600 }}>{d}</span>)}</div>
    <div className="card"><h3>Honest status of all {X.all.length} modules</h3><div className="chips">{Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([s, n]) => <span key={s} className="chip"><span className="dot" style={{ background: SC[s] }}></span>{s}: <b style={{ marginLeft: 4 }}>{n}</b></span>)}</div><p className="muted">Nothing is “Native and verified” yet: that needs repo code, tests and release evidence.</p></div>
    <div className="grid">{topDomains.map((d) => <button className="card" key={d.id} onClick={() => open(d.id)}><div className="kicker">{d.id} · {d.owner}</div><h3>{d.name}</h3><p className="muted">{mods(d.id).length + kids(d.id).reduce((a, k) => a + mods(k.id).length, 0)} modules{kids(d.id).length ? ' incl. ' + kids(d.id).map((k) => k.short).join(', ') : ''}</p><Status s={d.status} /></button>)}<button className="card" onClick={() => go('business')}><div className="kicker">T · CEO</div><h3>Market strategy</h3><p className="muted">Software, services, marketplace and the marketing engine</p></button></div></>;
}
function Domain({ id, sel, setSel }) {
  const d = X.D.find((x) => x.id === id); const list = mods(id); const sub = kids(id);
  return <div className="split"><div style={{ display: 'grid', gap: 18 }}><div className="ph"><div className="kicker">{d.parent ? d.parent + ' › ' : ''}{d.id} · owner {d.owner}</div><h1>{d.name}</h1>{d.note && <p className="lead">{d.note}</p>}</div>
    <div className="kv" style={{ gridTemplateColumns: '150px minmax(0,1fr)' }}><b>Users</b><span>{d.users.join(', ')}</span><b>Data authority</b><span>{d.authority}</span><b>Classification</b><span>{d.cls}</span><b>Transition bridge</b><span>{d.bridge}</span><b>Becomes authoritative</b><span>{d.gate}</span><b>Reliability</b><span>{d.slo}</span><b>Revenue</b><span>{d.revenue}</span><b>Branch</b><code>{d.branch}</code>{d.kit && <><b>Built so far</b><a href={d.kit}>Open prototype →</a></>}{(NATIVE_APP_ROUTES[d.id] || NATIVE_APP_ROUTES[d.parent] || []).length > 0 && <><b>In the app</b><span style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>{(NATIVE_APP_ROUTES[d.id] || NATIVE_APP_ROUTES[d.parent]).map(([l, r]) => <a key={r} href={'../semester-app/index.html#' + r}>{l}</a>)}</span></>}</div>
    <Flow k={d.flow} />{sub.length > 0 && <div className="chips">{sub.map((s) => <span key={s.id} className="chip">Sub-domain {s.id}: {s.name} ({mods(s.id).length})</span>)}</div>}
    <table className="tbl"><thead><tr><th>Module / screen</th><th>What it does</th><th>Type</th><th>Status</th></tr></thead><tbody>{list.map((m) => <tr key={m.key} className="rowbtn" onClick={() => setSel(m.key)} aria-selected={sel === m.key} style={sel === m.key ? { outline: '2px solid var(--blue-500,#597ea3)' } : null}><td><b style={{ fontWeight: 600 }}>{m.name}</b>{m.high && <span className="chip" style={{ marginLeft: 6, fontSize: 10.5 }}>command</span>}</td><td>{m.does}</td><td>{m.arch}</td><td><Status s={m.status} /></td></tr>)}</tbody></table></div>
    {sel && X.all.find((m) => m.key === sel && m.domain === id) ? <Spec m={X.all.find((m) => m.key === sel)} onClose={() => setSel(null)} /> : <aside className="drawer"><p className="muted">Pick a module to see its screen spec: preview, route, capabilities, data authority, audit events, AI rule, states, bridge and next action.</p><div className="kicker">16 native artifacts every domain needs</div><div className="chips">{X.ARTIFACTS.map((a) => <span className="chip" key={a}>{a}</span>)}</div></aside>}</div>;
}
function Screens({ sel, setSel }) {
  const [q, setQ] = React.useState(''); const [dom, setDom] = React.useState(''); const [st, setSt] = React.useState(''); const [ar, setAr] = React.useState('');
  const rows = X.all.filter((m) => (!q || (m.name + m.does).toLowerCase().includes(q.toLowerCase())) && (!dom || m.domain === dom) && (!st || m.status === st) && (!ar || m.arch === ar));
  return <div className="split"><div style={{ display: 'grid', gap: 14 }}><div className="ph"><div className="kicker">Screen catalog</div><h1>Every module as a screen</h1><p className="lead">{X.all.length} screens across {X.D.length} domains. Filter, then open any row for its spec.</p></div>
    <div className="tools"><input placeholder="Search screens" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Search" /><select value={dom} onChange={(e) => setDom(e.target.value)} aria-label="Domain"><option value="">All domains</option>{X.D.map((d) => <option key={d.id} value={d.id}>{d.id} · {d.short}</option>)}</select><select value={st} onChange={(e) => setSt(e.target.value)} aria-label="Status"><option value="">All statuses</option>{Object.keys(SC).map((s) => <option key={s}>{s}</option>)}</select><select value={ar} onChange={(e) => setAr(e.target.value)} aria-label="Type"><option value="">All types</option>{['list', 'queue', 'ledger', 'dashboard', 'builder', 'settings', 'calendar', 'assistant'].map((s) => <option key={s}>{s}</option>)}</select><span className="muted">{rows.length} shown</span></div>
    <table className="tbl"><thead><tr><th>Screen</th><th>Domain</th><th>Route</th><th>Status</th></tr></thead><tbody>{rows.map((m) => <tr key={m.key} className="rowbtn" onClick={() => setSel(m.key)} style={sel === m.key ? { outline: '2px solid var(--blue-500,#597ea3)' } : null}><td><b style={{ fontWeight: 600 }}>{m.name}</b><div className="muted">{m.does}</div></td><td>{m.domain}</td><td><code style={{ fontSize: 12 }}>{m.route}</code></td><td><Status s={m.status} /></td></tr>)}</tbody></table></div>
    {sel && X.all.find((m) => m.key === sel) ? <Spec m={X.all.find((m) => m.key === sel)} onClose={() => setSel(null)} /> : <aside className="drawer"><p className="muted">Select a screen.</p></aside>}</div>;
}
function Flows() {
  return <><div className="ph"><div className="kicker">Workflow architecture</div><h1>Shared flows</h1><p className="lead">Every module runs on one of these nine flows. One engine, one audit trail — no parallel workflow systems.</p></div>{Object.keys(X.FLOWS).map((k) => <div className="card" key={k}><Flow k={k} /><p className="muted">Used by {X.all.filter((m) => m.flow === k).length} modules.</p></div>)}
    <div className="grid"><div className="card"><h3>AI can</h3><ul style={{ margin: 0, paddingLeft: 18 }}>{X.AI_CAN.map((a) => <li key={a}>{a}</li>)}</ul></div><div className="card"><h3>AI cannot independently</h3><ul style={{ margin: 0, paddingLeft: 18 }}>{X.AI_CANNOT.map((a) => <li key={a}>{a}</li>)}</ul></div></div></>;
}
function Roles() {
  const cols = X.D.map((d) => d.id); const L = { R: 'Read', W: 'Write', C: 'Command', A: 'Approve' };
  return <><div className="ph"><div className="kicker">Role and capability model</div><h1>Who can do what, by domain</h1><p className="lead">R read · W write own/assigned · C run high-impact commands · A approve. Blank means no access. Company roles never see student records. Every grant is scoped to tenant and checked server-side.</p></div>
    <div style={{ overflow: 'auto' }}><table className="tbl mx"><thead><tr><th>Role</th>{cols.map((c) => <th key={c} title={X.D.find((d) => d.id === c).name}>{c}</th>)}</tr></thead><tbody>{X.ROLES.map(([r, g]) => <tr key={r}><td>{r}</td>{cols.map((c) => { const v = g[c]; return <td key={c} title={v && v !== '—' ? L[v] : 'None'} style={v && v !== '—' ? { background: { R: '#eef2f6', W: '#dfe7ef', C: '#c9d6e3', A: '#b3c5d8' }[v], fontWeight: 600 } : null}>{v && v !== '—' ? v : ''}</td>; })}</tr>)}</tbody></table></div>
    <div className="chips">{X.D.map((d) => <span key={d.id} className="chip">{d.id} {d.short}</span>)}</div></>;
}
function Gates({ g, setG }) {
  return <><div className="ph"><div className="kicker">Authority gates</div><h1>When a domain becomes authoritative</h1><p className="lead">A domain is native-authoritative only when all 16 criteria have evidence. Tick a criterion only when the evidence is in the repo or signed. Saved on this device.</p></div>
    {X.D.map((d) => { const n = X.GATES.filter((x) => g[d.id + x]).length; return <div className="card" key={d.id}><div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, flexWrap: 'wrap' }}><h3>{d.id} · {d.name}</h3><span className="muted">{n}/16 · {d.gate}</span></div><div className="bar"><div style={{ width: (n / 16 * 100) + '%' }}></div></div><div className="gate">{X.GATES.map((x) => <label key={x}><input type="checkbox" checked={!!g[d.id + x]} onChange={(e) => setG({ ...g, [d.id + x]: e.target.checked })} />{x}</label>)}</div></div>; })}</>;
}
function Business() {
  const B = X.BUSINESS;
  return <><div className="ph"><div className="kicker">T · Market strategy</div><h1>Software, services, marketplace and marketing</h1><p className="lead">One company with four engines. Software is the recurring core; services get institutions live and migrate domains; the marketplace and partners add usage revenue; the marketing engine runs on proof, trust and students. Planning prices from the price book — not results.</p></div>
    <div className="grid">{B.lines.map((l) => <div className="card" key={l.name}><div className="kicker">{l.kind}</div><h3>{l.name}</h3><table className="tbl"><tbody>{l.items.map(([a, b]) => <tr key={a}><td style={{ fontWeight: 600 }}>{a}</td><td>{b}</td></tr>)}</tbody></table></div>)}</div>
    <div className="card"><div className="kicker">Entry wedge</div><h3>{B.wedge}</h3><div className="flow">{B.expansion.map((s, i) => <React.Fragment key={s}>{i > 0 && <i>→</i>}<span>{s}</span></React.Fragment>)}</div></div>
    <div className="card"><div className="kicker">Commercial path per institution</div><div className="flow">{B.commercial.map((s, i) => <React.Fragment key={s}>{i > 0 && <i>→</i>}<span>{s}</span></React.Fragment>)}</div></div>
    <div className="grid"><a className="card" href="../../docs/grow/GTM%20Plan.html"><h3>GTM plan &amp; price book</h3><span className="muted">ICP, personas, pipeline</span></a><a className="card" href="../../docs/grow/Partner%20Program.html"><h3>Partner program</h3><span className="muted">Referral, implementation, technology</span></a><a className="card" href="../../docs/grow/Content%20Calendar.html"><h3>Content calendar</h3><span className="muted">12 months</span></a><a className="card" href="../company-site/index.html"><h3>Public site</h3><span className="muted">10 pages</span></a></div></>;
}
function Build() {
  const cmd = 'Read design/handoff/execute/14-native-platform.md and docs/native-platform/README.md. Start Phase 0 on branch audit/native-semester-master-reconciliation. Do not write feature code until the Phase 0 catalogs exist. Stop for my review at the end of each branch.';
  return <><div className="ph"><div className="kicker">Execution</div><h1>Branch plan and Phase 0</h1><p className="lead">Small branches, in order, each with tests and evidence. Phase 0 reconciles these designs against the real repo before any broad code.</p></div>
    <div className="card"><h3>Paste into Claude Code or Codex</h3><pre className="cmd">{cmd}</pre><div><N.Button size="sm" onClick={() => navigator.clipboard && navigator.clipboard.writeText(cmd)}>Copy</N.Button></div></div>
    <table className="tbl"><thead><tr><th>#</th><th>Branch</th><th>Scope</th><th>Priority</th></tr></thead><tbody>{X.BRANCHES.map(([b, s, p], i) => <tr key={b}><td>{i + 1}</td><td><code>{b}</code></td><td>{s}</td><td>{p}</td></tr>)}</tbody></table>
    <div className="grid"><a className="card" href="../../handoff/execute/14-native-platform.md"><h3>Stream 14 prompt</h3><span className="muted">Master native command, rules, phases, gates</span></a><a className="card" href="../../docs/native-platform/README.md"><h3>docs/native-platform</h3><span className="muted">Generated catalogs from this model</span></a></div></>;
}
function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
  const [view, setView] = React.useState(saved.view || 'overview'); const [dom, setDom] = React.useState(saved.dom || 'A1'); const [sel, setSel] = React.useState(null); const [g, setG] = React.useState(saved.g || {});
  React.useEffect(() => { localStorage.setItem(KEY, JSON.stringify({ view, dom, g })); }, [view, dom, g]);
  React.useEffect(() => { const s = document.querySelector('.scroll'); if (s) s.scrollTop = 0; }, [view, dom]);
  const open = (id) => { setDom(id); setSel(null); setView('domain'); };
  const T = [['overview', 'Overview', 'hub'], ['domain', 'Domains', 'apps'], ['screens', 'All screens', 'pane'], ['flows', 'Flows', 'runway'], ['roles', 'Roles', 'sources'], ['gates', 'Authority gates', 'check'], ['business', 'Business', 'star'], ['build', 'Build', 'connect']];
  const cur = T.find((t) => t[0] === view) || T[0];
  return <div className="shell"><N.SideRail current={view} onNavigate={(v) => { setSel(null); setView(v); }} groups={[{ label: 'Native platform', items: T.map(([id, label, icon]) => ({ id, label, icon })) }]} foot={<span style={{ fontSize: 12, color: 'var(--chrome-text-secondary)' }}>{X.D.length} domains · {X.all.length} screens</span>} />
    <div className="main"><N.SystemContextBar location={'Native platform · ' + cur[1] + (view === 'domain' ? ' · ' + X.D.find((d) => d.id === dom).short : '')} term="Native Education OS" sync="device-only" />
      {view === 'domain' && <div className="tools" style={{ padding: '8px var(--page-pad)', borderBottom: '1px solid var(--border-subtle)', overflowX: 'auto', flexWrap: 'nowrap' }}>{X.D.map((d) => <N.Button key={d.id} size="sm" variant={d.id === dom ? 'primary' : 'ghost'} onClick={() => open(d.id)}>{d.id} {d.short}</N.Button>)}</div>}
      <div className="scroll"><div className="page">{view === 'overview' && <Overview go={setView} open={open} />}{view === 'domain' && <Domain id={dom} sel={sel} setSel={setSel} />}{view === 'screens' && <Screens sel={sel} setSel={setSel} />}{view === 'flows' && <Flows />}{view === 'roles' && <Roles />}{view === 'gates' && <Gates g={g} setG={setG} />}{view === 'business' && <Business />}{view === 'build' && <Build />}</div></div></div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
