<style>html,body,#root{height:100%}body{margin:0;overflow:hidden}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}.main{display:flex;flex-direction:column;min-width:0;height:100%}.scroll{flex:1;overflow:auto}.page{max-width:1180px;margin:0 auto;padding:22px var(--page-pad) 64px;display:grid;gap:18px}.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border-subtle)}.ph h1{margin:2px 0 0}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px;margin:0}.card{border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);padding:14px 16px;display:grid;gap:10px;align-content:start}.card h3{margin:0;font:600 17px var(--font-heading)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:16px;align-items:start}@media(max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{text-align:left;font-weight:500;color:var(--text-secondary);border-bottom:1px solid var(--border-strong);padding:6px 8px}.tbl td{border-bottom:1px solid var(--border-subtle);padding:7px 8px;vertical-align:top}.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border-default);border-radius:3px;padding:1px 7px;font-size:12px;white-space:nowrap}.chip.pub{border-color:#2f7a4f;color:#2f7a4f}.chip.draft{color:var(--text-secondary)}.chip.warn{border-color:#a5803a;color:#7a5d22}.chips{display:flex;gap:6px;flex-wrap:wrap}.wk{display:flex;gap:4px;flex-wrap:wrap}.wk button{all:unset;cursor:pointer;min-width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--border-default);border-radius:4px;font-size:13px;background:var(--surface-base)}.wk button[aria-pressed=true]{background:var(--text-primary);color:var(--surface-base);border-color:var(--text-primary)}.wk button:focus-visible,.seg button:focus-visible{outline:2px solid var(--focus-color)}.item{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border-subtle);border-radius:4px;background:var(--surface-base)}.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font-size:13px;color:var(--text-secondary)}.form input,.form select,.form textarea{font:inherit;font-size:14.5px;color:var(--text-primary,#1b1a17);padding:8px 10px;border:1px solid var(--border-default);border-radius:4px;background:var(--surface-base)}.form textarea{min-height:70px;resize:vertical}.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{all:unset;cursor:pointer;padding:6px 10px;border:1px solid var(--border-default);border-radius:4px;font-size:13px;background:var(--surface-base)}.seg button[aria-pressed=true]{background:var(--action-primary);color:#fff;border-color:var(--action-primary)}.seg button[disabled]{opacity:.4;cursor:not-allowed}.banner{border:1px solid var(--border-strong);background:var(--surface-sunken);border-radius:6px;padding:10px 14px;font-size:13.5px}.ok{color:#2f7a4f}.bad{color:#a33b3b}.bars{display:flex;gap:6px;align-items:flex-end;height:120px}.bars div{flex:1;background:var(--action-primary);border-radius:2px 2px 0 0;position:relative}.bars span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--text-secondary)}.tok{font-family:ui-monospace,monospace;font-size:12px}.stuview{border:2px dashed var(--border-strong);border-radius:8px;padding:14px;display:grid;gap:8px;background:#fbfaf7}</style></head>

<script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba; const D = window.CS_DATA; const KEY = 'sem-course-studio-v1';
const AI_LEVELS = ['Off', 'Guided — hints only', 'Allowed with citation'];
const INST_DEFAULT = 2; // institution allows up to "Allowed with citation"
const fresh = () => ({ weeks: JSON.parse(JSON.stringify(D.weeks)), syllabus: JSON.parse(JSON.stringify(D.syllabus)), sylVersion: 3, sylPublished: true, bank: JSON.parse(JSON.stringify(D.bank)), team: JSON.parse(JSON.stringify(D.team)), threads: JSON.parse(JSON.stringify(D.threads)), slots: JSON.parse(JSON.stringify(D.slots)), ai: { Discussions: 2, Assignments: 1, Assessments: 0, Study: 2 }, grades: { q1: 'held' }, receipts: [], quiz: null, archived: false, audit: [] });
const allItems = (S) => S.weeks.flatMap((w) => w.items.map((i) => ({ ...i, week: w.n })));
function Head({ k, title, children }) { return <div className="ph"><div><div className="kicker">{D.course.code} · Section {D.course.section} · {D.course.term} · {k}</div><h1>{title}</h1></div><div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>{children}</div></div>; }
function Home({ S, set, go }) {
  const [wk, setWk] = React.useState(6); const [stu, setStu] = React.useState(false); const w = S.weeks.find((x) => x.n === wk);
  const nums = Array.from({ length: 15 }, (_, i) => i + 1);
  const pub = (id) => { const it = allItems(S).find((x) => x.id === id); if (it.a11y && it.a11y.length) { go('access'); return; } set((s) => ({ ...s, weeks: s.weeks.map((x) => ({ ...x, items: x.items.map((i) => i.id === id ? { ...i, status: 'published' } : i) })), audit: [{ at: new Date().toISOString(), a: 'item.published', t: id }, ...s.audit] })); };
  return <><Head k="Course home" title={D.course.title}><N.Button variant={stu ? 'primary' : 'secondary'} size="sm" onClick={() => setStu(!stu)}>{stu ? 'Back to editing' : 'Preview as student'}</N.Button><N.Button size="sm" onClick={() => go('assign')}>New assignment</N.Button></Head>
    <div className="chips"><span className="chip">{D.course.students} students</span><span className="chip">⇄ Roster from {D.course.lms} · 1h ago</span><span className="chip">Gradebook official in {D.course.lms} until cutover</span>{S.archived && <span className="chip warn">Archived (read-only)</span>}</div>
    <div className="wk" role="group" aria-label="Weeks">{nums.map((n) => <button key={n} aria-pressed={wk === n} onClick={() => setWk(n)}>{n}</button>)}</div>
    {stu ? <div className="stuview" aria-label="Student view"><span className="kicker">What students see · Week {wk}</span>{w ? w.items.filter((i) => i.status === 'published').map((i) => <div key={i.id} className="item"><span className="chip">{i.kind}</span><span>{i.title}{i.due && <span className="muted"> · due {i.due}</span>}</span><span className="muted">◆ From your instructor</span></div>) : <p className="muted">Nothing published this week yet.</p>}<p className="muted">AI in this course: discussions {AI_LEVELS[S.ai.Discussions].toLowerCase()}, assignments {AI_LEVELS[S.ai.Assignments].toLowerCase()}, assessments {AI_LEVELS[S.ai.Assessments].toLowerCase()}.</p></div>
    : <div className="card"><h3>Week {wk}{w ? ' · ' + w.theme : ''}</h3>{w ? w.items.map((i) => <div key={i.id} className="item"><span className="chip">{i.kind}</span><span><b style={{ fontWeight: 600 }}>{i.title}</b>{i.due && <span className="muted"> · due {i.due}</span>}{i.a11y && i.a11y.length > 0 && <span className="chip warn" style={{ marginLeft: 8 }}>{i.a11y.length} accessibility fix</span>}</span>{i.status === 'published' ? <span className="chip pub">Published</span> : <N.Button size="sm" variant="secondary" disabled={S.archived} onClick={() => pub(i.id)}>{i.a11y && i.a11y.length ? 'Fix, then publish' : 'Publish'}</N.Button>}</div>) : <><p className="muted">No items for week {wk}.</p><div><N.Button size="sm" variant="secondary" onClick={() => go('assign')}>Add an assignment</N.Button></div></>}</div>}
    <div className="grid"><div className="card"><h3>Needs you</h3><ul style={{ margin: 0, paddingLeft: 18, fontSize: 14 }}><li><a href="#" onClick={(e) => { e.preventDefault(); go('access'); }}>2 items need accessibility fixes</a></li><li><a href="#" onClick={(e) => { e.preventDefault(); go('discuss'); }}>{S.threads.filter((t) => !t.answered).length} unanswered questions</a></li><li><a href="#" onClick={(e) => { e.preventDefault(); go('grades'); }}>Quiz 1 grades on hold</a></li></ul></div><div className="card"><h3>Objectives</h3>{D.objectives.map((o) => <p key={o.id} style={{ margin: 0, fontSize: 14 }}><b>{o.id}</b> {o.text}</p>)}</div></div></>;
}
function Syllabus({ S, set }) {
  const [draft, setDraft] = React.useState(S.syllabus); const dirty = JSON.stringify(draft) !== JSON.stringify(S.syllabus);
  const publish = () => set((s) => ({ ...s, syllabus: draft, sylVersion: s.sylVersion + 1, sylPublished: true, audit: [{ at: new Date().toISOString(), a: 'syllabus.published', t: 'v' + (s.sylVersion + 1) }, ...s.audit] }));
  return <><Head k="Syllabus" title="Syllabus"><span className="muted" style={{ alignSelf: 'center' }}>Published v{S.sylVersion}{dirty ? ' · unsaved changes' : ''}</span><N.Button size="sm" disabled={!dirty || S.archived} onClick={publish}>Publish v{S.sylVersion + 1}</N.Button></Head>
    <div className="two"><div className="card form">{draft.map((b, i) => <label key={b.id}>{b.label}<textarea value={b.text} onChange={(e) => setDraft(draft.map((x, j) => j === i ? { ...x, text: e.target.value } : x))} disabled={S.archived} /></label>)}<div><span className="kicker">AI policy (from Course AI rules — edit there)</span><p style={{ margin: '4px 0 0', fontSize: 14 }}>{Object.entries(S.ai).map(([k, v]) => k + ': ' + AI_LEVELS[v]).join(' · ')}</p></div></div>
      <aside className="card"><h3>Before you publish</h3><ul style={{ margin: 0, paddingLeft: 18, fontSize: 14 }}><li className="ok">Headings structured</li><li className="ok">Reading level: grade 11</li><li className="ok">Accessibility statement present</li><li className="ok">AI policy matches course rules</li></ul><p className="muted">Students are notified of syllabus changes and see what changed. Earlier versions stay in history.</p></aside></div></>;
}
function Assign({ S, set, go }) {
  const [f, setF] = React.useState({ title: '', kind: 'Lab', week: 6, due: '2026-10-09', obj: ['O3'], rubric: 'Lab report rubric (4 criteria)', late: true, sub: 'File upload' });
  const u = (k) => (e) => setF({ ...f, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value });
  const save = (pub) => { if (!f.title.trim()) return; const it = { id: 'a' + Date.now().toString(36), kind: f.kind, title: f.title, status: pub ? 'published' : 'draft', due: f.due }; set((s) => { const has = s.weeks.find((w) => w.n === Number(f.week)); const weeks = has ? s.weeks.map((w) => w.n === Number(f.week) ? { ...w, items: [...w.items, it] } : w) : [...s.weeks, { n: Number(f.week), theme: '', items: [it] }].sort((a, b) => a.n - b.n); return { ...s, weeks, audit: [{ at: new Date().toISOString(), a: pub ? 'assignment.published' : 'assignment.drafted', t: it.id }, ...s.audit] }; }); go('home'); };
  return <><Head k="Assignments" title="New assignment" />
    <div className="two"><div className="card form"><label>Title<input value={f.title} onChange={u('title')} placeholder="e.g. Lab 6 — Onion root tip mitosis report" /></label><div className="grid" style={{ gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))' }}><label>Type<select value={f.kind} onChange={u('kind')}>{['Lab', 'Essay', 'Problem set', 'Project'].map((x) => <option key={x}>{x}</option>)}</select></label><label>Week<select value={f.week} onChange={u('week')}>{Array.from({ length: 15 }, (_, i) => <option key={i} value={i + 1}>{i + 1}</option>)}</select></label><label>Due<input type="date" value={f.due} onChange={u('due')} /></label><label>Submission<select value={f.sub} onChange={u('sub')}><option>File upload</option><option>Text entry</option><option>In class</option></select></label></div>
      <fieldset style={{ border: 0, padding: 0, margin: 0, display: 'grid', gap: 4 }}><legend className="muted">Objectives assessed</legend>{D.objectives.map((o) => <label key={o.id} style={{ display: 'flex', gap: 8, color: 'inherit' }}><input type="checkbox" checked={f.obj.includes(o.id)} onChange={(e) => setF({ ...f, obj: e.target.checked ? [...f.obj, o.id] : f.obj.filter((x) => x !== o.id) })} />{o.id} — {o.text}</label>)}</fieldset>
      <label>Rubric<select value={f.rubric} onChange={u('rubric')}><option>Lab report rubric (4 criteria)</option><option>Short essay rubric (3 criteria)</option><option>None</option></select></label><label style={{ display: 'flex', gap: 8, color: 'inherit' }}><input type="checkbox" checked={f.late} onChange={u('late')} />Use the syllabus late-work rule</label>
      <div style={{ display: 'flex', gap: 8 }}><N.Button disabled={!f.title.trim() || S.archived} onClick={() => save(true)}>Publish</N.Button><N.Button variant="secondary" disabled={!f.title.trim()} onClick={() => save(false)}>Save draft</N.Button></div></div>
      <aside className="card"><h3>Applied automatically</h3><p style={{ margin: 0, fontSize: 14 }}>Extended deadlines for {D.accommodations.extendedTime} students with accommodation letters.</p><p className="muted">{D.accommodations.note}</p><p style={{ margin: 0, fontSize: 14 }}>AI for assignments: <b>{AI_LEVELS[S.ai.Assignments]}</b></p><p className="muted">Drafts save on this device if you go offline.</p></aside></div></>;
}
function Assess({ S, set }) {
  const [pick, setPick] = React.useState(S.quiz ? S.quiz.items : []); const [rand, setRand] = React.useState(true); const [mins, setMins] = React.useState(30); const [obj, setObj] = React.useState('');
  const bank = S.bank.filter((q) => !obj || q.obj === obj);
  const build = () => set((s) => ({ ...s, quiz: { items: pick, rand, mins, pinned: pick.map((id) => id + ' v' + s.bank.find((q) => q.id === id).v) }, audit: [{ at: new Date().toISOString(), a: 'assessment.built', t: pick.length + ' items' }, ...s.audit] }));
  return <><Head k="Assessments" title="Quiz 2 — Cell cycle" />
    <div className="two"><div className="card"><div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, flexWrap: 'wrap' }}><h3>Question bank</h3><select value={obj} onChange={(e) => setObj(e.target.value)} aria-label="Filter by objective" style={{ font: 'inherit', padding: 6 }}><option value="">All objectives</option>{D.objectives.map((o) => <option key={o.id} value={o.id}>{o.id}</option>)}</select></div>
      <table className="tbl"><thead><tr><th></th><th>Item</th><th>Type</th><th>Obj.</th><th>Version</th></tr></thead><tbody>{bank.map((q) => <tr key={q.id}><td><input type="checkbox" aria-label={'Add ' + q.id} checked={pick.includes(q.id)} onChange={(e) => setPick(e.target.checked ? [...pick, q.id] : pick.filter((x) => x !== q.id))} /></td><td><span className="tok">{q.id}</span> {q.text}<div className="muted">{q.diff}</div></td><td>{q.type}</td><td>{q.obj}</td><td>v{q.v}</td></tr>)}</tbody></table><p className="muted">Each attempt pins the item version it showed, so later edits never change a submitted attempt.</p></div>
      <aside className="card form"><h3>Settings</h3><label style={{ display: 'flex', gap: 8, color: 'inherit' }}><input type="checkbox" checked={rand} onChange={(e) => setRand(e.target.checked)} />Randomize order per student</label><label>Time limit (minutes)<input type="number" min="5" max="180" value={mins} onChange={(e) => setMins(Number(e.target.value))} /></label><p style={{ margin: 0, fontSize: 14 }}>Extended time (×1.5 = {Math.round(mins * 1.5)} min) for {D.accommodations.extendedTime} students; reduced-distraction setting for {D.accommodations.reducedDistraction}.</p><p style={{ margin: 0, fontSize: 14 }}>AI during assessments: <b>{AI_LEVELS[S.ai.Assessments]}</b></p><N.Button disabled={!pick.length} onClick={build}>Build quiz ({pick.length} items)</N.Button>{S.quiz && <p className="ok" style={{ margin: 0 }}>Built: {S.quiz.pinned.join(', ')} · {S.quiz.mins} min{S.quiz.rand ? ' · randomized' : ''}</p>}</aside></div></>;
}
function Grades({ S, set }) {
  const [confirm, setConfirm] = React.useState(false); const st = S.grades.q1; const missing = D.gradebook.filter((g) => g.q1 === 0).length;
  const release = () => { const r = { id: 'rcpt_' + Date.now().toString(36), at: new Date().toISOString(), what: 'Quiz 1 grades released to Section 01', count: D.course.students, passback: 'Queued to ' + D.course.lms + ' (official until cutover)', rollback: 'Hold again within 24 h; later changes use the grade-correction workflow' }; set((s) => ({ ...s, grades: { ...s.grades, q1: 'released' }, receipts: [r, ...s.receipts], audit: [{ at: r.at, a: 'grades:release', t: 'q1' }, ...s.audit] })); setConfirm(false); };
  return <><Head k="Grades" title="Gradebook">{st === 'held' ? <N.Button size="sm" disabled={S.archived} onClick={() => setConfirm(true)}>Release Quiz 1 grades…</N.Button> : <N.Button size="sm" variant="secondary" onClick={() => set((s) => ({ ...s, grades: { ...s.grades, q1: 'held' }, audit: [{ at: new Date().toISOString(), a: 'grades.held', t: 'q1' }, ...s.audit] }))}>Hold Quiz 1 again</N.Button>}</Head>
    <div className="banner">Working grades. <b>{D.course.lms} remains the official gradebook</b> until your institution completes the gradebook cutover. Released grades are passed back automatically.</div>
    {confirm && <div className="card" role="dialog" aria-label="Release grades" style={{ borderColor: '#1b1a17' }}><h3>Release Quiz 1 grades?</h3><ul style={{ margin: 0, paddingLeft: 18, fontSize: 14 }}><li>{D.course.students} students will see their grade and feedback.</li><li>{missing} student has no score — they'll see "Not submitted".</li><li>Grades pass back to {D.course.lms}.</li><li>You can hold again within 24 hours.</li></ul><div style={{ display: 'flex', gap: 8 }}><N.Button onClick={release}>Release</N.Button><N.Button variant="ghost" onClick={() => setConfirm(false)}>Cancel</N.Button></div></div>}
    <div className="card"><table className="tbl"><thead><tr><th>Student</th><th>Lab 1 /10</th><th>Quiz 1 /20</th><th>Status</th></tr></thead><tbody>{D.gradebook.map((g) => <tr key={g.id}><td className="tok">{g.id}</td><td>{g.lab1}</td><td>{g.q1 || '—'}</td><td>{g.late ? <span className="chip warn">Extension active</span> : st === 'released' ? <span className="chip pub">Released</span> : <span className="chip draft">Held</span>}</td></tr>)}</tbody></table><p className="muted">Showing 12 of {D.course.students} (sample IDs).</p></div>
    {S.receipts.length > 0 && <div className="card"><h3>Receipts</h3>{S.receipts.map((r) => <div key={r.id} style={{ fontSize: 14 }}><b>{r.what}</b> · {r.at.slice(0, 16).replace('T', ' ')}<div className="muted">{r.passback} · {r.rollback}</div></div>)}</div>}</>;
}
function AIRules({ S, set }) {
  return <><Head k="Course AI rules" title="AI in this course" />
    <div className="banner">Your institution allows up to <b>{AI_LEVELS[INST_DEFAULT]}</b>. You can be stricter, never looser. AI never sees student records, grades or submissions' identities.</div>
    <div className="card"><table className="tbl"><thead><tr><th>Activity</th><th>Rule</th></tr></thead><tbody>{Object.keys(S.ai).map((k) => <tr key={k}><td style={{ fontWeight: 600 }}>{k}</td><td><div className="seg" role="group" aria-label={k}>{AI_LEVELS.map((l, i) => <button key={l} aria-pressed={S.ai[k] === i} disabled={i > INST_DEFAULT || S.archived} onClick={() => set((s) => ({ ...s, ai: { ...s.ai, [k]: i }, audit: [{ at: new Date().toISOString(), a: 'course:publish · ai_rule.changed', t: k + '=' + i }, ...s.audit] }))}>{l}</button>)}</div></td></tr>)}</tbody></table><p className="muted">Approved sources for the course tutor: syllabus, readings and published resources only.</p></div>
    <div className="stuview"><span className="kicker">Students see</span><p style={{ margin: 0 }}>In BIO 201, Ask Semester can help with discussions ({AI_LEVELS[S.ai.Discussions].toLowerCase()}) and study ({AI_LEVELS[S.ai.Study].toLowerCase()}). For assignments: {AI_LEVELS[S.ai.Assignments].toLowerCase()}. During quizzes and exams: {AI_LEVELS[S.ai.Assessments].toLowerCase()}.</p></div></>;
}
function Team({ S, set }) {
  const [f, setF] = React.useState({ name: '', role: 'Teaching assistant', scope: 'Section 01 labs', until: '2026-12-20' }); const [err, setErr] = React.useState('');
  const add = () => { const days = (new Date(f.until) - new Date()) / 864e5; if (!f.name.trim()) return setErr('Enter a name or campus email.'); if (days > 120) return setErr('Delegations can last up to 120 days. Pick an earlier end date.'); setErr(''); set((s) => ({ ...s, team: [...s.team, { ...f, id: 't' + Date.now().toString(36) }], audit: [{ at: new Date().toISOString(), a: 'delegation.created', t: f.name }, ...s.audit] })); setF({ ...f, name: '' }); };
  return <><Head k="Teaching team" title="Teaching team" />
    <div className="two"><div className="card"><table className="tbl"><thead><tr><th>Person</th><th>Role</th><th>Scope</th><th>Ends</th><th></th></tr></thead><tbody><tr><td>You</td><td>Instructor of record</td><td>Whole course</td><td>—</td><td></td></tr>{S.team.map((t) => <tr key={t.id}><td>{t.name}</td><td>{t.role}</td><td>{t.scope}</td><td>{t.until}</td><td><N.Button size="sm" variant="ghost" onClick={() => set((s) => ({ ...s, team: s.team.filter((x) => x.id !== t.id), audit: [{ at: new Date().toISOString(), a: 'delegation.revoked', t: t.name }, ...s.audit] }))}>Remove</N.Button></td></tr>)}</tbody></table></div>
      <aside className="card form"><h3>Add to team</h3><label>Name or campus email<input value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} /></label><label>Role<select value={f.role} onChange={(e) => setF({ ...f, role: e.target.value })}><option>Teaching assistant</option><option>Grader</option><option>Co-instructor</option></select></label><label>Scope<select value={f.scope} onChange={(e) => setF({ ...f, scope: e.target.value })}><option>Section 01 labs</option><option>Quizzes only</option><option>Discussions only</option><option>Whole course</option></select></label><label>Ends<input type="date" value={f.until} onChange={(e) => setF({ ...f, until: e.target.value })} /></label>{err && <p className="bad" role="alert" style={{ margin: 0 }}>{err}</p>}<N.Button onClick={add}>Add</N.Button><p className="muted">Access ends automatically. Graders can't release grades.</p></aside></div></>;
}
function Access({ S, set }) {
  const issues = allItems(S).filter((i) => i.a11y && i.a11y.length);
  const fix = (id, k) => set((s) => ({ ...s, weeks: s.weeks.map((w) => ({ ...w, items: w.items.map((i) => i.id === id ? { ...i, a11y: i.a11y.filter((x) => x !== k) } : i) })), audit: [{ at: new Date().toISOString(), a: 'a11y.fixed', t: id + ':' + k }, ...s.audit] }));
  const L = { captions: ['Video has no captions', 'Add captions (auto-draft, then review)'], alt: ['Image has no description', 'Describe the image'] };
  return <><Head k="Accessibility review" title="Accessibility review" />
    <p className="muted">Items can't be published until these pass. Checks run on every upload: captions, image descriptions, heading structure, contrast, document tags.</p>
    {issues.length === 0 ? <div className="card"><h3 className="ok">All clear</h3><p className="muted">Every item passes. You can publish from the course home.</p></div> : issues.map((i) => <div key={i.id} className="card"><h3>{i.title}</h3><span className="muted">Week {i.week} · {i.kind}</span>{i.a11y.map((k) => <div key={k} className="item" style={{ gridTemplateColumns: 'minmax(0,1fr) auto' }}><span>{L[k][0]}</span><N.Button size="sm" onClick={() => fix(i.id, k)}>{L[k][1]}</N.Button></div>)}</div>)}</>;
}
function Discuss({ S, set }) {
  return <><Head k="Discussions" title="Course Q&amp;A" /><div className="card"><table className="tbl"><tbody>{S.threads.map((t) => <tr key={t.id}><td><b style={{ fontWeight: 600 }}>{t.title}</b><div className="muted">{t.replies} replies{t.flag ? ' · ' + t.flag : ''}</div></td><td style={{ textAlign: 'right' }}>{t.answered ? <span className="chip pub">Endorsed answer</span> : <N.Button size="sm" variant="secondary" onClick={() => set((s) => ({ ...s, threads: s.threads.map((x) => x.id === t.id ? { ...x, answered: true } : x), audit: [{ at: new Date().toISOString(), a: 'answer.endorsed', t: t.id }, ...s.audit] }))}>Endorse best answer</N.Button>}</td></tr>)}</tbody></table><p className="muted">Endorsement is visible to students. Reputation carries no academic weight. Regrade requests go to Grades, not the forum.</p></div></>;
}
function Hours({ S, set }) {
  return <><Head k="Office hours" title="Office hours"><N.Button size="sm" onClick={() => set((s) => ({ ...s, slots: [...s.slots, { id: 's' + Date.now().toString(36), day: 'Fri', time: '13:00–14:00', where: 'Video', queue: 0 }] }))}>Add a slot</N.Button></Head><div className="grid">{S.slots.map((s) => <div key={s.id} className="card"><h3>{s.day} {s.time}</h3><span className="muted">{s.where}</span><span>{s.queue} waiting</span>{s.queue > 0 && <N.Button size="sm" onClick={() => set((x) => ({ ...x, slots: x.slots.map((y) => y.id === s.id ? { ...y, queue: y.queue - 1 } : y) }))}>Admit next</N.Button>}</div>)}</div></>;
}
function Analytics() {
  return <><Head k="Course analytics" title="How the course is going" /><div className="banner">Aggregates only. Semester doesn't score individual students' risk. To reach a specific student, use Message or refer to advising.</div>
    <div className="grid"><div className="card"><h3>Weekly participation</h3><div className="bars">{D.engagement.map((v, i) => <div key={i} style={{ height: v + '%' }} title={'Week ' + (i + 1) + ': ' + v + '%'}><span>{v}%</span></div>)}</div><span className="muted">Weeks 1–6, % of students who opened at least one item</span></div><div className="card"><h3>Objectives</h3>{D.objectives.map((o, i) => <div key={o.id} style={{ display: 'grid', gridTemplateColumns: '40px 1fr 50px', gap: 8, alignItems: 'center', fontSize: 14 }}><b>{o.id}</b><div style={{ height: 8, background: 'var(--border-subtle)', borderRadius: 4 }}><div style={{ height: '100%', width: [82, 64, 58, 0][i] + '%', background: 'var(--blue-600,#4d6f91)', borderRadius: 4 }}></div></div><span className="muted">{[82, 64, 58][i] ? [82, 64, 58][i] + '%' : 'not yet'}</span></div>)}<span className="muted">Share of students meeting each objective on assessed work so far</span></div><div className="card"><h3>Not submitted Lab 1</h3><b style={{ font: '700 28px var(--font-heading)' }}>7</b><N.Button size="sm" variant="secondary">Message these students</N.Button></div></div></>;
}
function Integrity() {
  return <><Head k="Integrity review" title="Integrity review" /><div className="card"><p style={{ margin: 0 }}>Concerns go to your institution's academic-integrity process. Semester never accuses a student and never uses AI detectors as evidence.</p><table className="tbl"><thead><tr><th>Item</th><th>What you noticed</th><th></th></tr></thead><tbody><tr><td>Lab 1 · two reports</td><td>Identical data tables</td><td><N.Button size="sm" variant="secondary">Start a case (hand-off)</N.Button></td></tr></tbody></table><p className="muted">Cases move to the integrity office with the evidence you attach. The student is notified by that office, not by Semester.</p></div></>;
}
function Archive({ S, set }) {
  const [msg, setMsg] = React.useState('');
  return <><Head k="Import, export, archive" title="Import, export and archive" /><div className="grid"><div className="card"><h3>Import</h3><p className="muted">Common Cartridge from {D.course.lms} or another course. Items arrive as drafts with accessibility checks run.</p><N.Button variant="secondary" onClick={() => setMsg('Imported 14 items as drafts (sample). 3 need accessibility fixes.')}>Import a cartridge</N.Button></div><div className="card"><h3>Export</h3><p className="muted">Course content as Common Cartridge; question bank as QTI 2.1.</p><div style={{ display: 'flex', gap: 8 }}><N.Button variant="secondary" onClick={() => setMsg('Course export prepared (sample).')}>Export course</N.Button><N.Button variant="secondary" onClick={() => setMsg('Question bank exported as QTI (sample).')}>Export bank</N.Button></div></div><div className="card"><h3>Archive at term end</h3><p className="muted">Read-only snapshot kept per retention policy. You can copy it into next term.</p>{S.archived ? <><span className="chip warn">Archived</span><N.Button variant="ghost" onClick={() => set((s) => ({ ...s, archived: false }))}>Undo (demo)</N.Button></> : <N.Button variant="secondary" onClick={() => set((s) => ({ ...s, archived: true, audit: [{ at: new Date().toISOString(), a: 'course.archived', t: D.course.code }, ...s.audit] }))}>Archive course</N.Button>}</div></div>{msg && <p className="ok" role="status">{msg}</p>}
    <div className="card"><h3>Course audit trail</h3>{S.audit.length ? <table className="tbl"><tbody>{S.audit.slice(0, 15).map((a, i) => <tr key={i}><td className="tok">{a.a}</td><td>{a.t}</td><td className="muted">{a.at.slice(11, 19)}</td></tr>)}</tbody></table> : <p className="muted">No changes yet.</p>}</div></>;
}
function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } })();
  const [S, set] = React.useState(saved && saved.S ? saved.S : fresh()); const [v, setV] = React.useState(saved && saved.v || 'home');
  React.useEffect(() => { localStorage.setItem(KEY, JSON.stringify({ S, v })); }, [S, v]);
  React.useEffect(() => { const s = document.querySelector('.scroll'); if (s) s.scrollTop = 0; }, [v]);
  const T = [['home', 'Course home', 'courses'], ['syllabus', 'Syllabus', 'pane'], ['assign', 'Assignments', 'check'], ['assess', 'Assessments', 'star'], ['grades', 'Grades', 'analyse'], ['ai', 'Course AI rules', 'ask'], ['team', 'Teaching team', 'sources'], ['access', 'Accessibility', 'hub'], ['discuss', 'Discussions', 'apps'], ['hours', 'Office hours', 'runway'], ['analytics', 'Analytics', 'analyse'], ['integrity', 'Integrity', 'spam'], ['archive', 'Import & archive', 'connect']];
  const cur = T.find((t) => t[0] === v) || T[0]; const P = { S, set, go: setV };
  const view = { home: <Home {...P} />, syllabus: <Syllabus {...P} />, assign: <Assign {...P} />, assess: <Assess {...P} />, grades: <Grades {...P} />, ai: <AIRules {...P} />, team: <Team {...P} />, access: <Access {...P} />, discuss: <Discuss {...P} />, hours: <Hours {...P} />, analytics: <Analytics />, integrity: <Integrity />, archive: <Archive {...P} /> }[v];
  return <div className="shell"><N.SideRail current={v} onNavigate={setV} groups={[{ label: 'Course Studio · BIO 201', items: T.map(([id, label, icon]) => ({ id, label, icon })) }]} foot={<button onClick={() => { set(fresh()); setV('home'); }} style={{ all: 'unset', cursor: 'pointer', fontSize: 12, color: 'var(--chrome-text-secondary)' }}>Reset sample course</button>} />
    <div className="main"><N.SystemContextBar location={'Course Studio · ' + cur[1]} term={D.course.term} sync="device-only" /><div className="scroll"><div className="page">{view}</div></div></div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
