<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><script src="../platform/appearance.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><title>Semester — Capabilities and permissions</title>
<style>html,body,#root{height:100%}body{margin:0;overflow:hidden}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}.main{display:flex;flex-direction:column;min-width:0;height:100%}.scroll{flex:1;overflow:auto}.page{max-width:1080px;margin:0 auto;padding:22px var(--page-pad) 64px;display:grid;gap:16px}.ph{padding-bottom:14px;border-bottom:1px solid var(--border-subtle)}.ph h1{margin:2px 0 0}.lead{color:var(--text-secondary);max-width:72ch;margin:6px 0 0;line-height:1.55}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px;margin:0}.card{border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);padding:14px 16px;display:grid;gap:10px;align-content:start}.card h3{margin:0;font:600 17px var(--font-heading)}.perm{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:start;padding:14px 0;border-bottom:1px solid var(--border-subtle)}.perm:last-child{border-bottom:0}.perm b{font:600 16px var(--font-heading)}.state{font-size:12.5px;padding:2px 8px;border-radius:3px;border:1px solid var(--border-default);white-space:nowrap}.on{border-color:#2f7a4f;color:#2f7a4f}.off{color:var(--text-secondary)}.denied{border-color:#a33b3b;color:#a33b3b}.detail{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;font-size:13.5px}.detail span b{font:500 12px var(--font-body,'Barlow');color:var(--text-secondary);display:block;letter-spacing:.04em;text-transform:uppercase}.acts{display:flex;gap:6px;flex-wrap:wrap}.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{all:unset;cursor:pointer;padding:5px 10px;border:1px solid var(--border-default);border-radius:4px;font-size:13px;background:var(--surface-base)}.seg button[aria-pressed=true]{background:var(--blue-600,#4d6f91);color:#fff;border-color:var(--blue-600,#4d6f91)}.seg button:focus-visible{outline:2px solid var(--blue-500,#597ea3)}.modal{position:fixed;inset:0;background:rgba(20,20,18,.45);display:grid;place-items:center;z-index:30;padding:16px}.sheet{background:var(--surface-base);border-radius:10px;max-width:420px;width:100%;padding:20px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}.sys{background:#2b2b2e;color:#fff;border-radius:12px;padding:16px;display:grid;gap:10px;text-align:center}.sys button{all:unset;cursor:pointer;padding:8px;border-radius:6px;background:#3d3d42}.sys button:focus-visible{outline:2px solid #7d9cbb}.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl td,.tbl th{border-bottom:1px solid var(--border-subtle);padding:8px;text-align:left;vertical-align:top}.tbl th{font-weight:500;color:var(--text-secondary)}.ok{color:#2f7a4f}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba; const KEY = 'sem-device-perms-v1';
const P = [
  { id: 'camera', name: 'Camera', why: 'Scan a textbook ISBN for a listing, photograph an item, join video office hours.', ask: 'Only when you tap Scan, Add photo or Join video.', fallback: 'Type the ISBN, upload a photo from files, join by audio.', stored: 'Nothing unless you post a photo. Campus ID checks happen with your school\'s sign-in, not the camera.', kind: 'device' },
  { id: 'mic', name: 'Microphone', why: 'Voice notes, dictation in Write, asking Ask Semester out loud.', ask: 'When you press and hold the mic button.', fallback: 'Type instead.', stored: 'Transcribed on your device where possible. Audio is not kept by default.', kind: 'device' },
  { id: 'location', name: 'Location', why: 'Campus map, safe meet-up spots, event check-in, shuttle times.', ask: 'When you open the map or check in. Never in the background.', fallback: 'Pick a building from the list; check in with a code.', stored: 'Only while the app is open. Never sold. Off by default.', kind: 'device', precision: true },
  { id: 'notify', name: 'Notifications', why: 'Deadline reminders, registration windows, replies to your questions.', ask: 'After you ask for a reminder — never on first launch.', fallback: 'Email or in-app inbox.', stored: 'Device push token kept separate from your account; removed when you sign out of the device.', kind: 'device', channels: true },
  { id: 'images', name: 'AI image generation', why: 'Study visuals, club flyers, event promos.', ask: 'When you choose Create image.', fallback: 'Upload your own image.', stored: 'Labelled AI-generated. No real-person likeness. Never uses your records. Content-safety filtered.', kind: 'feature' },
  { id: 'offline', name: 'Offline mode', why: 'Keep notes, tasks and today\'s schedule available without a connection.', ask: 'Turn on here.', fallback: 'Online only.', stored: 'Encrypted on this device; syncs when you reconnect. Official data is a read-only copy.', kind: 'feature' },
  { id: 'install', name: 'Install Semester', why: 'Home-screen icon and faster return.', ask: 'Offered after you\'ve used Semester — optional.', fallback: 'Keep using the browser. Everything works.', stored: 'Same account and data.', kind: 'feature' },
  { id: 'bio', name: 'Biometric sign-in', why: 'Unlock with Face ID, Touch ID or fingerprint on this device.', ask: 'Turn on here; your device confirms.', fallback: 'Passkey, email link or campus sign-in.', stored: 'Biometrics never leave your device; Semester only sees "unlocked".', kind: 'device' }
];
const SESSIONS = [{ id: 'd1', name: 'This browser', where: 'Nashville, TN', last: 'Now', current: true }, { id: 'd2', name: 'iPhone (installed app)', where: 'Nashville, TN', last: '2 h ago' }, { id: 'd3', name: 'Library computer', where: 'Campus network', last: '3 days ago' }];
function Prompt({ p, onAllow, onDeny, onClose }) {
  const [stage, setStage] = React.useState('pre');
  return <div className="modal" role="dialog" aria-modal="true" aria-label={'Allow ' + p.name}><div className="sheet">{stage === 'pre' ? <><div className="kicker">Semester asks first</div><h3 style={{ margin: 0, font: '700 22px var(--font-heading)' }}>Use your {p.name.toLowerCase()}?</h3><p style={{ margin: 0 }}>{p.why}</p><p className="muted">{p.stored}</p><div className="acts"><N.Button onClick={() => p.kind === 'device' ? setStage('sys') : onAllow()}>Continue</N.Button><N.Button variant="ghost" onClick={onClose}>Not now — {p.fallback.split(';')[0].toLowerCase()}</N.Button></div></> : <><p className="muted">Your device now shows its own permission prompt (simulated):</p><div className="sys"><b>"Semester" would like to access your {p.name.toLowerCase()}</b><span style={{ fontSize: 13, opacity: .8 }}>{p.why}</span>{p.precision && <span style={{ fontSize: 13 }}>Precise: On</span>}<button onClick={onAllow}>Allow while using the app</button><button onClick={onDeny}>Don't allow</button></div></>}</div></div>;
}
function Perms({ S, set }) {
  const [ask, setAsk] = React.useState(null);
  const upd = (id, v) => set((s) => ({ ...s, p: { ...s.p, [id]: { ...(s.p[id] || {}), ...v } }, log: [{ at: new Date().toISOString(), what: id + ' → ' + (v.state || JSON.stringify(v)) }, ...s.log].slice(0, 30) }));
  return <><div className="ph"><div className="kicker">You → Settings</div><h1>Capabilities and permissions</h1><p className="lead">Everything is off until you need it. Semester asks right before the feature that uses it, tells you why, and always gives you another way.</p></div>
    <div className="card">{P.map((p) => { const st = (S.p[p.id] || {}).state || 'off'; return <div className="perm" key={p.id}><div><b>{p.name}</b><p className="muted" style={{ marginTop: 2 }}>{p.why}</p></div><span className={'state ' + (st === 'on' ? 'on' : st === 'denied' ? 'denied' : 'off')}>{st === 'on' ? 'On' : st === 'denied' ? 'Blocked in device settings' : 'Off'}</span>
      <div className="detail"><span><b>When we ask</b>{p.ask}</span><span><b>If you say no</b>{p.fallback}</span><span><b>What's kept</b>{p.stored}</span></div>
      {p.precision && st === 'on' && <div className="seg" role="group" aria-label="Location precision" style={{ gridColumn: '1/-1' }}>{['Approximate', 'Precise'].map((x) => <button key={x} aria-pressed={((S.p.location || {}).precision || 'Approximate') === x} onClick={() => upd('location', { precision: x })}>{x}</button>)}</div>}
      {p.channels && st === 'on' && <div className="seg" role="group" aria-label="Notification channels" style={{ gridColumn: '1/-1' }}>{['Push', 'Email', 'SMS'].map((c) => { const ch = (S.p.notify || {}).channels || ['Push', 'Email']; return <button key={c} aria-pressed={ch.includes(c)} onClick={() => upd('notify', { channels: ch.includes(c) ? ch.filter((x) => x !== c) : [...ch, c] })}>{c}</button>; })}</div>}
      <div className="acts" style={{ gridColumn: '1/-1' }}>{st === 'on' ? <N.Button size="sm" variant="secondary" onClick={() => upd(p.id, { state: 'off' })}>Turn off</N.Button> : st === 'denied' ? <span className="muted">To allow later, open your device settings → Semester. {p.fallback}</span> : <N.Button size="sm" onClick={() => setAsk(p)}>Turn on…</N.Button>}</div></div>; })}</div>
    {ask && <Prompt p={ask} onAllow={() => { upd(ask.id, { state: 'on' }); setAsk(null); }} onDeny={() => { upd(ask.id, { state: 'denied' }); setAsk(null); }} onClose={() => setAsk(null)} />}</>;
}
function Sessions({ S, set }) {
  const live = SESSIONS.filter((s) => !S.revoked.includes(s.id));
  return <><div className="ph"><div className="kicker">You → Privacy &amp; data</div><h1>Devices and sessions</h1><p className="lead">Where you're signed in. Signing out a device also removes its notification token and offline copy.</p></div>
    <div className="card"><table className="tbl"><thead><tr><th>Device</th><th>Where</th><th>Last active</th><th></th></tr></thead><tbody>{live.map((d) => <tr key={d.id}><td>{d.name}{d.current && <span className="muted"> · this one</span>}</td><td>{d.where}</td><td>{d.last}</td><td>{!d.current && <N.Button size="sm" variant="secondary" onClick={() => set((s) => ({ ...s, revoked: [...s.revoked, d.id], log: [{ at: new Date().toISOString(), what: 'signed out ' + d.name }, ...s.log] }))}>Sign out</N.Button>}</td></tr>)}</tbody></table>{live.length > 1 && <div><N.Button variant="ghost" onClick={() => set((s) => ({ ...s, revoked: SESSIONS.filter((x) => !x.current).map((x) => x.id) }))}>Sign out everywhere else</N.Button></div>}</div>
    <div className="card"><h3>Continue on another device</h3><p className="muted">Open Semester on your phone and you'll land on the same screen. Links work once and expire in 10 minutes; nothing secret is in them.</p></div></>;
}
function Accounts({ S, set }) {
  const [ctx, setCtx] = React.useState(S.ctx || 'Student · Campus A');
  const [d, setD] = React.useState({ who: '', scope: 'Schedule', until: '2026-12-20' });
  return <><div className="ph"><div className="kicker">You → Accounts</div><h1>Accounts, roles and shared access</h1><p className="lead">One account, more than one role. Switch context without signing out; each role sees only what it's allowed to.</p></div>
    <div className="card"><h3>Switch role</h3><div className="seg" role="group" aria-label="Role">{['Student · Campus A', 'Teaching assistant · BIO 201', 'Personal (no institution)'].map((x) => <button key={x} aria-pressed={ctx === x} onClick={() => { setCtx(x); set((s) => ({ ...s, ctx: x })); }}>{x}</button>)}</div><p className="muted">Switching re-checks your permissions on the server. Your TA role ends Dec 20, 2026.</p></div>
    <div className="card"><h3>Share with someone</h3><p className="muted">A parent, guardian or helper can see only what you choose, until the date you choose. You can end it any time and you'll see every time they look.</p><div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(180px,1fr))', gap: 8 }}><input aria-label="Their email" placeholder="Their email" value={d.who} onChange={(e) => setD({ ...d, who: e.target.value })} style={{ font: 'inherit', padding: 8, border: '1px solid var(--border-default)', borderRadius: 4 }} /><select aria-label="What to share" value={d.scope} onChange={(e) => setD({ ...d, scope: e.target.value })} style={{ font: 'inherit', padding: 8 }}><option>Schedule</option><option>Balance and statements</option><option>Schedule and balance</option></select><input type="date" aria-label="Until" value={d.until} onChange={(e) => setD({ ...d, until: e.target.value })} style={{ font: 'inherit', padding: 8, border: '1px solid var(--border-default)', borderRadius: 4 }} /></div><div><N.Button disabled={!/\S+@\S+\.\S+/.test(d.who)} onClick={() => { set((s) => ({ ...s, grants: [...s.grants, { ...d, id: 'g' + Date.now().toString(36) }] })); setD({ ...d, who: '' }); }}>Send invitation</N.Button></div><p className="muted">Grades are never shared through this. Your school's FERPA rules still apply.</p>
      {S.grants.length > 0 && <table className="tbl"><tbody>{S.grants.map((g) => <tr key={g.id}><td>{g.who}</td><td>{g.scope}</td><td>until {g.until}</td><td><N.Button size="sm" variant="secondary" onClick={() => set((s) => ({ ...s, grants: s.grants.filter((x) => x.id !== g.id) }))}>End now</N.Button></td></tr>)}</tbody></table>}</div></>;
}
function Personal({ S, set }) {
  const pref = S.pref; const u = (k, v) => set((s) => ({ ...s, pref: { ...s.pref, [k]: v } }));
  const Row = ({ k, label, opts }) => <div className="perm"><div><b>{label}</b></div><span></span><div className="seg" role="group" aria-label={label} style={{ gridColumn: '1/-1' }}>{opts.map((o) => <button key={o} aria-pressed={pref[k] === o} onClick={() => u(k, o)}>{o}</button>)}</div></div>;
  return <><div className="ph"><div className="kicker">You → Display</div><h1>Make it yours</h1><p className="lead">Saved to your account so it follows you to every device.</p></div>
    <div className="card"><Row k="density" label="Density" opts={['Comfortable', 'Compact']} /><Row k="text" label="Text size" opts={['Default', 'Large', 'Larger']} /><Row k="motion" label="Motion" opts={['System', 'Reduced', 'None']} /><Row k="calm" label="Calm mode" opts={['Off', 'On']} /><Row k="font" label="Reading font" opts={['Barlow', 'Dyslexia-friendly']} /><Row k="time" label="Time format" opts={['12-hour', '24-hour']} /><Row k="lang" label="Language" opts={['English', 'Español']} /></div></>;
}
function Log({ S }) { return <><div className="ph"><div className="kicker">You → Privacy &amp; data</div><h1>Permission history</h1></div><div className="card">{S.log.length ? <table className="tbl"><tbody>{S.log.map((l, i) => <tr key={i}><td className="muted">{l.at.slice(11, 19)}</td><td>{l.what}</td></tr>)}</tbody></table> : <p className="muted">No changes yet.</p>}</div></>; }
function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } })();
  const fresh = { p: {}, revoked: [], grants: [], log: [], pref: { density: 'Comfortable', text: 'Default', motion: 'System', calm: 'Off', font: 'Barlow', time: '12-hour', lang: 'English' } };
  const [S, set] = React.useState(saved && saved.S ? { ...fresh, ...saved.S } : fresh); const [v, setV] = React.useState(saved && saved.v || 'perms');
  React.useEffect(() => { localStorage.setItem(KEY, JSON.stringify({ S, v })); }, [S, v]);
  const T = [['perms', 'Permissions', 'check'], ['sessions', 'Devices & sessions', 'pane'], ['accounts', 'Accounts & sharing', 'sources'], ['personal', 'Display', 'star'], ['log', 'History', 'runway']];
  return <div className="shell"><N.SideRail current={v} onNavigate={setV} groups={[{ label: 'You', items: T.map(([id, label, icon]) => ({ id, label, icon })) }]} foot={<button onClick={() => set(fresh)} style={{ all: 'unset', cursor: 'pointer', fontSize: 12, color: 'var(--chrome-text-secondary)' }}>Reset</button>} />
    <div className="main"><N.SystemContextBar location={'You · ' + T.find((t) => t[0] === v)[1]} term="Fall 2026" sync="device-only" /><div className="scroll"><div className="page">{v === 'perms' && <Perms S={S} set={set} />}{v === 'sessions' && <Sessions S={S} set={set} />}{v === 'accounts' && <Accounts S={S} set={set} />}{v === 'personal' && <Personal S={S} set={set} />}{v === 'log' && <Log S={S} />}</div></div></div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
