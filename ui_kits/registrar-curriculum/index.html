<!-- @dsCard group="Product domains" viewport="1280x880" name="Registrar — policy, curriculum & catalog" subtitle="Batches A and B of the registrar register (17 capabilities): academic structure, terms and sessions, credit definitions, grading scales, effective-dated academic policies with student-impact analysis, residency and transfer rules, catalog-year assignment, versioned courses with prerequisites and cross-listing, programs and requirement groups, curriculum proposals through approval, immutable catalog snapshots and effective-term activation" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><title>Semester — Registrar policy & curriculum</title>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}.rail{background:var(--surface-base);border-right:1px solid var(--border-subtle);padding:14px 8px;display:grid;gap:2px;align-content:start}.rail button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:14px;color:var(--text-primary)}.rail button[aria-current=page]{background:var(--surface-raised);font-weight:600}.rail button:focus-visible,.btn:focus-visible{outline:2px solid var(--action-primary)}.main{padding:20px 26px 56px;display:grid;gap:14px;align-content:start;min-width:0}h1{margin:0;font-size:22px}h2{margin:0;font-size:16px}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px}.sm{font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{border:1px solid var(--border-subtle);border-radius:8px;padding:14px;background:var(--surface-base);display:grid;gap:8px;align-content:start;min-width:0}.ox{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--border-subtle);font-size:13px;text-align:left;vertical-align:top}th{font-size:11px;color:var(--text-secondary);font-weight:600}.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border-subtle);white-space:nowrap}.ok{color:var(--status-success);border-color:currentColor}.bad{color:var(--status-danger);border-color:currentColor}.warn{color:var(--status-pending);border-color:currentColor}.btn{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;border:1px solid var(--border-subtle);font-size:13px;background:var(--surface-base);color:var(--text-primary)}.btn.p{background:var(--action-primary);color:var(--text-on-action,#fff);border-color:var(--action-primary)}input,select,textarea{font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-base);color:var(--text-primary)}label.f{display:grid;gap:3px;font-size:12px;color:var(--text-secondary)}.note{border-left:3px solid var(--status-pending);padding:8px 10px;font-size:13px;background:var(--surface-raised);color:var(--text-primary)}.note.bad{border-left-color:var(--status-danger)}.note.ok{border-left-color:var(--status-success)}</style></head>
<body><div class="app"><nav class="rail" id="rail" aria-label="Policy, curriculum and catalog"></nav><main class="main" id="main" aria-live="polite"></main></div>
<script>
const KEY='sem-reg-curr',esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const PAGES=[['A01','Institution structure'],['A02','Terms and sessions'],['A03','Credit and contact hours'],['A04','Grading scales and modes'],['A05','Academic policies'],['A06','Residency and transfer rules'],['A07','Catalog-year assignment'],['A08','Effective-dated publication'],['A09','Policy-change impact'],['B01','Course versions'],['B02','Prerequisites and restrictions'],['B03','Cross-listing and equivalencies'],['B04','Programs'],['B05','Requirement groups and substitutions'],['B06','Curriculum proposals'],['B07','Catalog snapshots'],['B08','Effective-term activation']];
const ORG={n:'Vanderbilt University',k:'Institution',c:[{n:'Main campus',k:'Campus',c:[{n:'College of Arts & Science',k:'School',c:[{n:'Chemistry',k:'Department'},{n:'Economics',k:'Department'}]},{n:'Owen Graduate School of Management',k:'School',c:[{n:'Organization Studies',k:'Department'}]}]}],careers:['Undergraduate','Graduate','Professional']};
const STUDENTS=[{id:'S-1001',n:'Maya Chen',matric:'2025F',prog:'ECON-BA',repeat:1,gpa:2.58,withdrawn:0,status:'Good standing'},{id:'S-1002',n:'Jordan Ali',matric:'2024F',prog:'CHEM-BS',repeat:2,gpa:1.92,withdrawn:1,status:'Warning'},{id:'S-1003',n:'Priya Shah',matric:'2026F',prog:'ECON-BA',repeat:0,gpa:3.41,withdrawn:0,status:'Good standing'},{id:'S-1004',n:'Sam Ortiz',matric:'2023F',prog:'CHEM-BS',repeat:1,gpa:2.04,withdrawn:2,status:'Good standing'},{id:'S-1005',n:'Lee Park',matric:'2025F',prog:'BUS-MINOR',repeat:0,gpa:1.98,withdrawn:0,status:'Warning'}];
const S0={page:'A01',terms:[{code:'2026FA',n:'Fall 2026',start:'2026-08-24',end:'2026-12-16',sessions:[['Full term','08-24','12-16'],['First half','08-24','10-14'],['Second half','10-19','12-16']],st:'open'},{code:'2027SP',n:'Spring 2027',start:'2027-01-11',end:'2027-05-07',sessions:[['Full term','01-11','05-07']],st:'planned'}],
 credit:{hourPerCredit:'750 instructional minutes (50 × 15 weeks)',lab:'1 credit = 2–3 contact hours of lab',online:'Equivalent learning time, documented in syllabus'},
 scales:[{id:'UG-STD',n:'Undergraduate standard',v:1,grades:[['A',4],['A-',3.7],['B+',3.3],['B',3],['B-',2.7],['C+',2.3],['C',2],['C-',1.7],['D+',1.3],['D',1],['F',0]],modes:['Graded','Pass/Fail','Audit'],eff:'2020FA'}],
 policies:[{id:'POL-REPEAT',n:'Course repeat',v:2,rule:'last',eff:'2025FA',st:'published',hist:[{v:1,rule:'best',eff:'2018FA'}]},{id:'POL-STANDING',n:'Academic standing',v:1,rule:'warning below 2.00 cumulative',thr:2.0,eff:'2022FA',st:'published',hist:[]},{id:'POL-WD',n:'Withdrawal limit',v:1,rule:'max 3 W grades per career',max:3,eff:'2022FA',st:'published',hist:[]}],
 draft:null,transfer:[{from:'Nashville State CC',course:'ENGL 1010',to:'ENGL 1100',cr:3,st:'approved',min:'C'},{from:'Nashville State CC',course:'MATH 1130',to:'MATH 1010',cr:3,st:'pending review',min:'C'}],residency:{min:'60 of 120 credits at Vanderbilt; last 30 in residence'},
 catYearRule:'matriculation term; student may elect a later catalog once, with advisor approval',catElections:[],
 courses:[{id:'CHEM 2210',title:'Organic Chemistry I',vers:[{v:3,cr:4,eff:'2024FA',st:'active',pre:'CHEM 1020 with C or better',co:'CHEM 2210L',restr:'Not open to first-year students'}]},{id:'ECON 1020',title:'Principles of Microeconomics',vers:[{v:2,cr:3,eff:'2023FA',st:'active',pre:'',co:'',restr:''}]},{id:'BUS 1400',title:'Organizational Behavior',vers:[{v:1,cr:3,eff:'2025FA',st:'active',pre:'',co:'',restr:''}]}],
 xlist:[{a:'ECON 3550',b:'PSCI 3550',kind:'cross-list',cap:'shared'},{a:'CHEM 1020',b:'CHEM 1020 (pre-2024)',kind:'equivalency',cap:'—'}],
 programs:[{id:'ECON-BA',n:'Economics BA',kind:'Major',cat:'2025',groups:[['Core',['ECON 1020','ECON 1030','ECON 3010']],['Methods',['ECON 3030']],['Electives (choose 4)',['ECON 3xxx']]]},{id:'CHEM-BS',n:'Chemistry BS',kind:'Major',cat:'2025',groups:[['Core',['CHEM 1020','CHEM 2210','CHEM 2220']]]},{id:'BUS-MINOR',n:'Business minor',kind:'Minor',cat:'2025',groups:[['Required',['BUS 1400']]]}],
 subs:[],proposals:[{id:'CP-301',course:'CHEM 2210',change:'Credits 4 → 3 (lab moves to CHEM 2210L)',st:'department',by:'Prof. Ortiz',eff:'2027FA',trail:[]}],
 snapshots:[{id:'CAT-2025',year:'2025–26',at:'2025-04-01',hash:'a3f9…11c2',st:'published'}],activations:[],log:[]};
let S=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(S0));const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const L=t=>S.log.unshift([new Date().toLocaleTimeString(),t]);
const chip=(t,c)=>'<span class="chip '+(c||'')+'">'+esc(t)+'</span>';const card=(h,b)=>'<div class="card"><h2>'+h+'</h2>'+b+'</div>';
const tbl=(hd,rows)=>'<div class="ox"><table><thead><tr>'+hd.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
function tree(n,d=0){return '<div style="padding-left:'+(d*18)+'px" class="sm">'+chip(n.k)+' <b>'+esc(n.n)+'</b></div>'+(n.c||[]).map(x=>tree(x,d+1)).join('')}
function impact(p,nv){return STUDENTS.map(s=>{let before,after;if(p.id==='POL-REPEAT'){before=s.repeat?('repeats count '+p.rule):'—';after=s.repeat?('repeats count '+nv):'—';return [s,before,after,s.repeat&&p.rule!==nv]}if(p.id==='POL-STANDING'){const b=s.gpa<p.thr?'Warning':'Good standing',a=s.gpa<nv?'Warning':'Good standing';return [s,b,a,a!==b]}const b=s.withdrawn>=p.max?'At limit':'Under limit',a=s.withdrawn>=nv?'At limit':'Under limit';return [s,b,a,a!==b]})}
const V={
A01:()=>card('Institution structure',tree(ORG)+'<div class="sm">Careers: '+ORG.careers.map(c=>chip(c)).join(' ')+'</div><span class="muted">Every record carries its owning school and department. Policies attach at the level they apply to; a lower level can only narrow, not loosen, a higher one.</span>'),
A02:()=>S.terms.map((t,i)=>card(t.n+' · '+t.code,'<div class="sm">'+t.start+' → '+t.end+' · '+chip(t.st,t.st==='open'?'ok':'')+'</div>'+tbl(['Session','Start','End'],t.sessions.map(x=>[x[0],x[1],x[2]]))+(t.st==='planned'?'<button class="btn" data-open="'+i+'">Open term for scheduling</button>':'')+'<span class="muted">Session dates drive add/drop, withdrawal and refund deadlines. Changing them after registration opens creates an impact review.</span>')).join(''),
A03:()=>card('Credit and contact hours',tbl(['Definition','Rule'],[['Lecture credit',S.credit.hourPerCredit],['Lab credit',S.credit.lab],['Online / hybrid',S.credit.online]])+'<span class="muted">The institution’s accreditor sets the federal credit-hour floor. Semester stores the definition the registrar approved and shows it on every course version.</span>'),
A04:()=>S.scales.map(sc=>card(sc.n+' · v'+sc.v,tbl(['Grade','Points'],sc.grades.map(g=>[g[0],g[1].toFixed(1)]))+'<div class="sm">Modes: '+sc.modes.map(m=>chip(m)).join(' ')+' · effective '+sc.eff+'</div><span class="muted">Pass/Fail and Audit carry no points. A scale change is a new version — posted grades keep the version they were posted under.</span>')).join(''),
A05:()=>card('Academic policies',tbl(['Policy','Version','Rule','Effective','Status',''],S.policies.map((p,i)=>[esc(p.n),'v'+p.v,esc(p.rule),p.eff,chip(p.st,'ok'),'<button class="btn" data-dr="'+i+'">Draft change</button>']))+(S.draft?'<div class="note">Draft in progress for '+esc(S.policies[S.draft.i].n)+' — see Policy-change impact.</div>':'')),
A06:()=>card('Residency',' <div class="sm">'+esc(S.residency.min)+'</div>')+card('Transfer equivalency rules',tbl(['From','Course','Counts as','Credits','Minimum','Status',''],S.transfer.map((t,i)=>[t.from,t.course,t.to,t.cr,t.min,chip(t.st,t.st==='approved'?'ok':'warn'),t.st!=='approved'?'<button class="btn" data-tr="'+i+'">Approve rule</button>':'']))+'<span class="muted">Only an approved rule turns transfer work into credit. Pending rules show as “transfer evaluation pending” in the degree audit.</span>'),
A07:()=>card('Catalog-year assignment','<div class="sm"><b>Rule:</b> '+esc(S.catYearRule)+'</div>'+tbl(['Student','Matriculated','Catalog','Election',''],STUDENTS.map(s=>{const e=S.catElections.find(x=>x.id===s.id);return [s.n,s.matric,e?e.to:'20'+s.matric.slice(2,4)+'–'+(+s.matric.slice(2,4)+1),e?chip('elected · advisor '+e.adv,'ok'):'—',e?'':'<button class="btn" data-el="'+s.id+'">Elect later catalog</button>']}))),
A08:()=>card('Effective-dated publication','<div class="sm">Every policy, scale, course and program version has an effective term. Records are evaluated against the version in force for the term they belong to — never the latest one by default.</div>'+tbl(['Item','Version','Effective'],[...S.policies.map(p=>[esc(p.n),'v'+p.v,p.eff]),...S.scales.map(s=>[esc(s.n),'v'+s.v,s.eff])])+(S.policies.some(p=>p.hist.length)?'<h3>History</h3>'+S.policies.filter(p=>p.hist.length).map(p=>p.hist.map(h=>'<div class="sm">'+esc(p.n)+' v'+h.v+' · '+esc(h.rule)+' · from '+h.eff+' (superseded)</div>').join('')).join(''):'')),
A09:()=>{if(!S.draft)return card('Policy-change impact','<span class="muted">Draft a change from Academic policies to see who it affects.</span>');const p=S.policies[S.draft.i],I=impact(p,S.draft.v),ch=I.filter(x=>x[3]);return card('Impact · '+esc(p.n)+' v'+(p.v+1),'<div class="row"><label class="sm">New value <input id="dv" value="'+esc(S.draft.v)+'" style="width:120px"></label><label class="sm">Effective <select id="de"><option>2027FA</option><option>2027SP</option></select></label></div>'+tbl(['Student','Now','Under draft','Changes?'],I.map(x=>[x[0].n,esc(x[1]),esc(x[2]),x[3]?chip('changes','warn'):'—']))+'<div class="note">'+ch.length+' of '+STUDENTS.length+' sample students change outcome. Existing posted records keep the version in force for their term.</div><div class="row"><button class="btn p" id="pub"'+(S.draft.ok?'':' disabled')+'>Publish v'+(p.v+1)+'</button><label class="row sm"><input type="checkbox" id="dok"'+(S.draft.ok?' checked':'')+'> Faculty senate / provost approval recorded</label><button class="btn" id="dx">Discard draft</button></div>')},
B01:()=>card('Course versions',tbl(['Course','Title','Version','Credits','Effective','Status'],S.courses.flatMap(c=>c.vers.map(v=>[c.id,esc(c.title),'v'+v.v,v.cr,v.eff,chip(v.st,v.st==='active'?'ok':'warn')])))+'<span class="muted">A course keeps one identity across versions. A section always points at the version in force for its term.</span>'),
B02:()=>card('Prerequisites and restrictions',tbl(['Course','Prerequisite','Corequisite','Restriction'],S.courses.map(c=>{const v=c.vers.find(x=>x.st==='active');return [c.id,esc(v.pre||'—'),esc(v.co||'—'),esc(v.restr||'—')]}))+'<span class="muted">Rules are evaluated at registration with source-backed grades; a planned course never satisfies a prerequisite. See the prerequisite evaluator in the governed workspace kit.</span>'),
B03:()=>card('Cross-listing and equivalencies',tbl(['Course','Linked','Kind','Capacity'],S.xlist.map(x=>[x.a,x.b,chip(x.kind),x.cap]))+'<span class="muted">Cross-listed sections share one meeting and one seat pool; equivalencies let an older version satisfy the same requirement.</span>'),
B04:()=>card('Programs',tbl(['Program','Kind','Catalog','Groups'],S.programs.map(p=>[esc(p.n),p.kind,p.cat,p.groups.length]))),
B05:()=>S.programs.map(p=>card(esc(p.n),p.groups.map(g=>'<div class="sm"><b>'+esc(g[0])+':</b> '+g[1].join(', ')+'</div>').join('')+'<div class="row"><input id="sub-'+p.id+'" placeholder="Substitution (e.g. PSCI 3550 for ECON 3xxx)" style="flex:1"><button class="btn" data-sub="'+p.id+'">Request substitution</button></div>'+S.subs.filter(s=>s.p===p.id).map((s,i)=>'<div class="sm">'+esc(s.t)+' · '+chip(s.st,s.st==='approved'?'ok':'warn')+(s.st==='pending'?' <button class="btn" data-sa="'+S.subs.indexOf(s)+'">Registrar approves</button>':'')+'</div>').join(''))).join(''),
B06:()=>card('Curriculum proposals',S.proposals.map((x,i)=>{const steps=['department','curriculum committee','registrar review','approved'];const k=steps.indexOf(x.st);return '<div class="sm"><b>'+x.id+'</b> · '+x.course+' · '+esc(x.change)+' · effective '+x.eff+'</div><div class="row">'+steps.map((s,j)=>chip(s,j<=k?'ok':'')).join('')+'</div>'+(k<3?'<button class="btn p" data-adv="'+i+'">Approve at '+steps[k]+'</button>':'<div class="note ok">Approved — creates CHEM 2210 v'+(S.courses[0].vers.length+1)+' as a draft version effective '+x.eff+'.</div>')+x.trail.map(t=>'<div class="muted">'+esc(t)+'</div>').join('')}).join('<hr>')+'<span class="muted">Approval creates a new version; it never edits the version students are enrolled under.</span>'),
B07:()=>card('Catalog snapshots',tbl(['Snapshot','Year','Published','Hash','Status'],S.snapshots.map(s=>[s.id,s.year,s.at,'<span class="mono">'+s.hash+'</span>',chip(s.st,'ok')]))+'<button class="btn p" id="snap">Publish 2026–27 catalog snapshot</button><span class="muted">A published snapshot is immutable. Students’ catalog year points at a snapshot, so later edits can’t change what they were promised.</span>'),
B08:()=>card('Effective-term activation',tbl(['Item','Version','Effective','State',''],S.courses.flatMap(c=>c.vers.filter(v=>v.st==='draft').map(v=>[c.id,'v'+v.v,v.eff,chip('draft','warn'),'<button class="btn" data-act="'+c.id+'|'+v.v+'">Schedule activation</button>'])).concat(S.activations.map(a=>[a.c,'v'+a.v,a.eff,chip('scheduled','ok'),''])))+'<span class="muted">Activation runs at the start of the effective term. Sections already scheduled for an earlier term keep their version.</span>')
};
function draw(){document.getElementById('rail').innerHTML='<div class="kicker" style="padding:4px 10px 10px">Registrar · policy & curriculum</div>'+PAGES.map(([k,l])=>'<button data-pg="'+k+'"'+(S.page===k?' aria-current="page"':'')+'><span class="mono" style="font-size:11px">'+k+'</span> '+l+'</button>').join('')+'<button class="btn" id="rst" style="margin:12px 10px 0">Reset</button>';
 document.getElementById('main').innerHTML='<div><div class="kicker">Vanderbilt University · Registrar · sample data</div><h1>'+PAGES.find(p=>p[0]===S.page)[1]+'</h1></div>'+V[S.page]()+(S.log.length?'<div class="card"><h3>Activity</h3>'+S.log.slice(0,6).map(l=>'<div class="sm"><span class="muted">'+l[0]+'</span> · '+esc(l[1])+'</div>').join('')+'</div>':'');bind();save()}
function bind(){const $=q=>document.querySelectorAll(q),g=id=>document.getElementById(id);$('[data-pg]').forEach(b=>b.onclick=()=>{S.page=b.dataset.pg;draw()});g('rst').onclick=()=>{localStorage.removeItem(KEY);location.reload()};
 $('[data-open]').forEach(b=>b.onclick=()=>{S.terms[+b.dataset.open].st='open';L('Opened '+S.terms[+b.dataset.open].n);draw()});
 $('[data-dr]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dr,p=S.policies[i];S.draft={i,v:p.id==='POL-REPEAT'?(p.rule==='last'?'best':'last'):p.id==='POL-STANDING'?2.25:2,ok:false};S.page='A09';draw()});
 if(g('dv'))g('dv').onchange=e=>{const p=S.policies[S.draft.i];S.draft.v=p.id==='POL-REPEAT'?e.target.value:+e.target.value;draw()};if(g('dok'))g('dok').onchange=e=>{S.draft.ok=e.target.checked;draw()};if(g('dx'))g('dx').onclick=()=>{S.draft=null;draw()};
 if(g('pub'))g('pub').onclick=()=>{const p=S.policies[S.draft.i];p.hist.unshift({v:p.v,rule:p.rule,eff:p.eff});p.v++;p.eff=g('de').value;if(p.id==='POL-REPEAT')p.rule=S.draft.v;else if(p.id==='POL-STANDING'){p.thr=S.draft.v;p.rule='warning below '+S.draft.v.toFixed(2)+' cumulative'}else{p.max=S.draft.v;p.rule='max '+S.draft.v+' W grades per career'}L('Published '+p.n+' v'+p.v+' effective '+p.eff);S.draft=null;S.page='A08';draw()};
 $('[data-tr]').forEach(b=>b.onclick=()=>{S.transfer[+b.dataset.tr].st='approved';L('Approved transfer rule '+S.transfer[+b.dataset.tr].course);draw()});
 $('[data-el]').forEach(b=>b.onclick=()=>{const a=prompt('Advisor approving the election');if(!a)return;S.catElections.push({id:b.dataset.el,to:'2026–27',adv:a});L('Catalog election '+b.dataset.el+' → 2026–27');draw()});
 $('[data-sub]').forEach(b=>b.onclick=()=>{const v=g('sub-'+b.dataset.sub).value.trim();if(!v)return;S.subs.push({p:b.dataset.sub,t:v,st:'pending'});L('Substitution requested: '+v);draw()});
 $('[data-sa]').forEach(b=>b.onclick=()=>{S.subs[+b.dataset.sa].st='approved';L('Substitution approved');draw()});
 $('[data-adv]').forEach(b=>b.onclick=()=>{const x=S.proposals[+b.dataset.adv];const steps=['department','curriculum committee','registrar review','approved'];const k=steps.indexOf(x.st);x.trail.push(steps[k]+' approved · '+new Date().toLocaleDateString());x.st=steps[k+1];if(x.st==='approved'){const c=S.courses.find(c=>c.id===x.course);const cur=c.vers[c.vers.length-1];c.vers.push({...cur,v:cur.v+1,cr:3,eff:x.eff,st:'draft'})}L(x.id+' → '+x.st);draw()});
 if(g('snap'))g('snap').onclick=()=>{if(S.snapshots.find(s=>s.id==='CAT-2026')){alert('Already published — snapshots are immutable.');return}S.snapshots.push({id:'CAT-2026',year:'2026–27',at:new Date().toISOString().slice(0,10),hash:Math.random().toString(16).slice(2,6)+'…'+Math.random().toString(16).slice(2,6),st:'published'});L('Published catalog 2026–27');draw()};
 $('[data-act]').forEach(b=>b.onclick=()=>{const [c,v]=b.dataset.act.split('|');const cv=S.courses.find(x=>x.id===c).vers.find(x=>x.v===+v);cv.st='scheduled';S.activations.push({c,v:+v,eff:cv.eff});L('Scheduled '+c+' v'+v+' for '+cv.eff);draw()})}
draw();
</script></body></html>
