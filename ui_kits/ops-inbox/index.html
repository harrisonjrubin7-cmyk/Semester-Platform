<!-- @dsCard group="Company & operations" viewport="1440x900" name="Operations Inbox" subtitle="Semester operators: one inbox for approvals, escalations, incidents, renewals, data requests, security alerts and lead SLAs — with My Work, SLA timers and controlled actions" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><script src="../platform/appearance.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><title>Semester — Operations Inbox</title>
<style>html,body,#root{height:100%}body{margin:0;overflow:hidden}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}.main{display:flex;flex-direction:column;min-width:0;height:100%}.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);min-height:0}@media(max-width:1000px){.body{grid-template-columns:minmax(0,1fr)}}.list{overflow:auto;border-right:1px solid var(--border-subtle)}.detail{overflow:auto;padding:18px 20px;display:grid;gap:12px;align-content:start;background:var(--surface-base)}.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-subtle);position:sticky;top:0;background:var(--surface-canvas);z-index:1}.tools select,.tools input{font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--border-default);border-radius:4px;background:var(--surface-base);color:inherit}.seg{display:flex;gap:4px}.seg button{all:unset;cursor:pointer;padding:5px 10px;border:1px solid var(--border-default);border-radius:4px;font-size:13px;background:var(--surface-base)}.seg button[aria-pressed=true]{background:var(--text-primary);color:var(--surface-base);border-color:var(--text-primary)}.seg button:focus-visible,.it:focus-visible{outline:2px solid var(--focus-color)}.it{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border-subtle)}.it:hover{background:var(--surface-sunken)}.it[aria-current=true]{background:var(--action-secondary)}.pri{width:8px;border-radius:4px}.t{font-weight:600;font-size:14.5px}.muted{color:var(--text-secondary);font-size:13px;margin:0}.chip{display:inline-flex;align-items:center;border:1px solid var(--border-default);border-radius:3px;padding:1px 7px;font-size:11.5px;white-space:nowrap}.sla{font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}.late{color:#a33b3b;font-weight:600}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 10px;font-size:13.5px}.kv b{font-weight:500;color:var(--text-secondary)}.pipe{display:grid;gap:3px;font-size:13px}.pipe div{padding:5px 9px;border:1px solid var(--border-subtle);border-radius:4px}.pipe div.done{background:var(--surface-sunken)}.pipe div.on{border-color:var(--text-primary);box-shadow:inset 3px 0 0 var(--text-primary)}.banner{border:1px solid var(--border-strong);background:var(--surface-sunken);border-radius:6px;padding:10px 12px;font-size:13px}.ok{color:#2f7a4f}.tok{font-family:ui-monospace,monospace;font-size:12px}.form{display:grid;gap:8px}.form label{display:grid;gap:4px;font-size:13px;color:var(--text-secondary)}.form textarea,.form select{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--border-default);border-radius:4px;background:var(--surface-base);color:inherit}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba; const KEY = 'sem-ops-inbox-v1';
const ME = 'Founder (you)';
const TYPES = { approval: ['Approval', '#4d6f91'], escalation: ['Support escalation', '#a5803a'], incident: ['Incident', '#a33b3b'], renewal: ['Renewal', '#2f7a4f'], dsr: ['Data request', '#7a6aa8'], security: ['Security alert', '#a33b3b'], lead: ['Lead SLA', '#416180'], vendor: ['Vendor review', '#8b8b90'] };
const PRI = { P1: '#a33b3b', P2: '#a5803a', P3: '#4d6f91', P4: '#b7b7ba' };
const hrs = (h) => Date.now() + h * 3600e3;
const SEED = () => [
  { id: 'OPS-118', type: 'approval', pri: 'P2', title: 'Enable community module for Campus A', tenant: 'Campus A University', who: 'Implementation', due: hrs(6), cap: 'tenant:configure', requester: 'Implementation operator', detail: 'Institution admin approved in their console. Cohort: all students. Kill switch ready.', state: 'open', owner: null, steps: 5 },
  { id: 'OPS-119', type: 'escalation', pri: 'P2', title: 'SSO loop for some students on Safari', tenant: 'Campus A University', who: 'Support L1', due: hrs(2), detail: 'Three tickets, same pattern. Repro on test campus pending. No student data needed.', state: 'open', owner: null },
  { id: 'OPS-120', type: 'incident', pri: 'P1', title: 'SIS sync delayed 3h (SEV2)', tenant: 'Campus A University', who: 'On-call', due: hrs(0.5), detail: 'Reconciliation paused. Students see "last synced 3h ago". Next notice due in 30 min.', state: 'open', owner: 'On-call SRE' },
  { id: 'OPS-121', type: 'renewal', pri: 'P3', title: 'Pilot renewal decision due in 45 days', tenant: 'Vanderbilt University', who: 'Customer success', due: hrs(24 * 45), detail: 'Pilot dates not set yet. Prepare success-plan review once measures are agreed.', state: 'open', owner: null },
  { id: 'OPS-122', type: 'dsr', pri: 'P2', title: 'Student export + deletion request', tenant: 'Campus A University', who: 'Privacy', due: hrs(24 * 28), detail: 'Request routed from the student\'s Privacy & data page. Institution confirms deletion; export already delivered self-serve.', state: 'open', owner: null },
  { id: 'OPS-123', type: 'security', pri: 'P2', title: 'Dependency advisory: high severity in image library', tenant: 'Platform', who: 'CI security job', due: hrs(72), detail: 'Patched version available. Not reachable from user input per triage notes; patch in next release.', state: 'open', owner: null },
  { id: 'OPS-124', type: 'lead', pri: 'P3', title: 'New pilot inquiry — Registrar, mid-size public', tenant: '—', who: 'Website form', due: hrs(20), detail: 'Use case: holds before priority registration. Follow-up consent given. Reply within 1 business day.', state: 'open', owner: null },
  { id: 'OPS-125', type: 'approval', pri: 'P2', title: 'Refund $6,200 (SLA credit)', tenant: 'Campus A University', who: 'Finance', due: hrs(30), cap: 'finance:approve_high', requester: 'Finance operator', detail: 'SLA credit per Order Form after March outage (sample). Over $5,000 → two approvers.', state: 'open', owner: null, steps: 5, approvalsNeeded: 2 },
  { id: 'OPS-126', type: 'vendor', pri: 'P4', title: 'Annual review: email delivery subprocessor', tenant: 'Platform', who: 'Vendor management', due: hrs(24 * 14), detail: 'Review SOC 2 report and DPA terms; no change in data shared.', state: 'open', owner: null }
];
const PATTERN = ['Request', 'Policy / capability check', 'Authoritative records', 'Impact preview', 'Approval', 'Idempotent command', 'Audit', 'Outbox + read models', 'Notify', 'Receipt + rollback path'];
function left(t) { const m = Math.round((t - Date.now()) / 60000); if (m < 0) return ['Overdue ' + fmt(-m), true]; return [fmt(m) + ' left', m < 60]; }
function fmt(m) { return m >= 2880 ? Math.round(m / 1440) + 'd' : m >= 120 ? Math.round(m / 60) + 'h' : m + 'm'; }
function Detail({ it, upd, log }) {
  const [note, setNote] = React.useState(''); const ty = TYPES[it.type];
  const approvals = it.approvals || []; const need = it.approvalsNeeded || 1;
  const approve = () => { if (it.requester === ME) return; const a = [...approvals, approvals.length ? 'CEO' : ME]; upd({ approvals: a, step: a.length >= need ? 6 : 5 }); log('action.approve', it.id); };
  const execute = () => { upd({ state: 'done', step: 10, receipt: { id: 'rcpt_' + Date.now().toString(36), at: new Date().toISOString() } }); log('action.executed', it.id); };
  return <><div><div className="kicker" style={{ color: ty[1] }}>{ty[0]} · {it.pri} · {it.id}</div><h2 style={{ margin: '4px 0 0', font: '700 24px var(--font-heading)' }}>{it.title}</h2></div>
    <div className="kv"><b>Tenant</b><span>{it.tenant}</span><b>From</b><span>{it.who}</span><b>Owner</b><span>{it.owner || 'Unassigned'}</span><b>Due</b><span className={left(it.due)[1] ? 'late' : ''}>{left(it.due)[0]}</span><b>Status</b><span>{it.state}</span></div>
    <p style={{ margin: 0, fontSize: 14.5 }}>{it.detail}</p>
    <div className="banner">Business and platform data only. To see student records, request an access grant from the institution — it is time-limited, logged, and shown to the student.</div>
    {it.cap && it.state !== 'done' && <div style={{ display: 'grid', gap: 8 }}><div className="kicker">Controlled action · <span className="tok">{it.cap}</span></div><div className="pipe">{PATTERN.map((p, i) => <div key={p} className={i < (it.step || 4) ? 'done' : i === (it.step || 4) ? 'on' : ''}>{i + 1}. {p}{i === 4 ? ' — ' + approvals.length + '/' + need + (need > 1 ? ' (two-person)' : '') : ''}</div>)}</div>
      {approvals.length < need ? <N.Button onClick={approve}>Approve as {approvals.length ? 'CEO (demo)' : ME}</N.Button> : <N.Button onClick={execute}>Execute</N.Button>}<p className="muted">Requested by {it.requester}. Requesters can't approve their own actions.</p></div>}
    {it.receipt && <p className="ok">Executed · receipt <span className="tok">{it.receipt.id}</span> · rollback path recorded.</p>}
    {it.state !== 'done' && <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>{!it.owner && <N.Button size="sm" variant="secondary" onClick={() => { upd({ owner: ME }); log('work.assigned', it.id); }}>Take it</N.Button>}<N.Button size="sm" variant="secondary" onClick={() => { upd({ due: it.due + 24 * 3600e3, snoozed: true }); log('work.snoozed', it.id); }}>Snooze 1 day</N.Button>{!it.cap && <N.Button size="sm" onClick={() => { upd({ state: 'done' }); log('work.resolved', it.id); }}>Resolve</N.Button>}</div>}
    <div className="form"><label>Note (internal)<textarea value={note} onChange={(e) => setNote(e.target.value)} placeholder="What you did, or what's next" /></label><N.Button size="sm" variant="ghost" disabled={!note.trim()} onClick={() => { upd({ notes: [...(it.notes || []), { at: new Date().toISOString(), by: ME, text: note }] }); setNote(''); }}>Add note</N.Button>{(it.notes || []).map((n, i) => <p key={i} className="muted">{n.at.slice(11, 16)} · {n.by}: {n.text}</p>)}</div></>;
}
function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } })();
  const [items, setItems] = React.useState(saved && saved.items ? saved.items : SEED()); const [view, setView] = React.useState(saved && saved.view || 'inbox'); const [sel, setSel] = React.useState(null); const [ty, setTy] = React.useState(''); const [q, setQ] = React.useState(''); const [audit, setAudit] = React.useState(saved && saved.audit || []);
  React.useEffect(() => { localStorage.setItem(KEY, JSON.stringify({ items, view, audit })); }, [items, view, audit]);
  const [, tick] = React.useState(0); React.useEffect(() => { const t = setInterval(() => tick((x) => x + 1), 30000); return () => clearInterval(t); }, []);
  const log = (a, t) => setAudit((x) => [{ at: new Date().toISOString(), a, t, by: ME }, ...x].slice(0, 100));
  const upd = (id) => (p) => setItems((xs) => xs.map((x) => x.id === id ? { ...x, ...p } : x));
  const rows = items.filter((i) => (view === 'done' ? i.state === 'done' : i.state !== 'done') && (view !== 'mine' || i.owner === ME) && (view !== 'approvals' || i.cap) && (!ty || i.type === ty) && (!q || (i.title + i.tenant).toLowerCase().includes(q.toLowerCase()))).sort((a, b) => a.pri.localeCompare(b.pri) || a.due - b.due);
  const it = items.find((i) => i.id === sel) || rows[0];
  const T = [['inbox', 'Operations Inbox', 'hub'], ['mine', 'My work', 'check'], ['approvals', 'Approvals', 'star'], ['done', 'Done', 'pane'], ['audit', 'Audit', 'sources']];
  const count = (v) => items.filter((i) => (v === 'done' ? i.state === 'done' : i.state !== 'done') && (v !== 'mine' || i.owner === ME) && (v !== 'approvals' || i.cap)).length;
  return <div className="shell"><N.SideRail current={view} onNavigate={(v) => { setView(v); setSel(null); }} groups={[{ label: 'Command Center', items: T.map(([id, label, icon]) => ({ id, label: label + ' (' + (id === 'audit' ? audit.length : count(id)) + ')', icon })) }]} foot={<button onClick={() => { setItems(SEED()); setAudit([]); setSel(null); }} style={{ all: 'unset', cursor: 'pointer', fontSize: 12, color: 'var(--chrome-text-secondary)' }}>Reset sample inbox</button>} />
    <div className="main"><N.SystemContextBar location={'Semester operations · ' + T.find((t) => t[0] === view)[1]} term="/app/ops/inbox" sync="device-only" />
      {view === 'audit' ? <div style={{ overflow: 'auto', padding: 20 }}><table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13.5 }}><tbody>{audit.length ? audit.map((a, i) => <tr key={i} style={{ borderBottom: '1px solid var(--border-subtle)' }}><td style={{ padding: 7 }} className="muted">{a.at.slice(11, 19)}</td><td className="tok">{a.a}</td><td>{a.t}</td><td>{a.by}</td></tr>) : <tr><td className="muted" style={{ padding: 7 }}>No actions yet.</td></tr>}</tbody></table></div> :
      <div className="body"><div className="list"><div className="tools"><input placeholder="Search" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Search" /><select value={ty} onChange={(e) => setTy(e.target.value)} aria-label="Type"><option value="">All types</option>{Object.entries(TYPES).map(([k, [l]]) => <option key={k} value={k}>{l}</option>)}</select><span className="muted">{rows.length} items · sorted by priority, then due</span></div>
        {rows.length ? rows.map((r) => { const [l, late] = left(r.due); return <button key={r.id} className="it" aria-current={it && it.id === r.id} onClick={() => setSel(r.id)}><span className="pri" style={{ background: PRI[r.pri] }} title={r.pri}></span><span style={{ display: 'grid', gap: 3, minWidth: 0 }}><span className="t">{r.title}</span><span className="muted">{TYPES[r.type][0]} · {r.tenant} · {r.owner || 'Unassigned'}{r.cap ? ' · needs approval' : ''}</span></span><span className={'sla' + (late ? ' late' : '')}>{r.state === 'done' ? 'Done' : l}</span></button>; }) : <p className="muted" style={{ padding: 16 }}>Nothing here. {view === 'mine' ? 'Take an item from the inbox.' : ''}</p>}</div>
        <div className="detail">{it ? <Detail key={it.id} it={it} upd={upd(it.id)} log={log} /> : <p className="muted">Select an item.</p>}</div></div>}</div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
