<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><title>Semester — Staff workspace</title>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.app{display:grid;grid-template-rows:auto 1fr;min-height:100vh}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:var(--surface-base);border-bottom:1px solid var(--border-subtle)}.brand{font-weight:700}.body{display:grid;grid-template-columns:230px minmax(0,1fr)}@media(max-width:820px){.body{grid-template-columns:minmax(0,1fr)}}.rail{background:var(--surface-base);color:var(--text-primary);border-right:1px solid var(--border-subtle);padding:12px 8px;display:grid;gap:2px;align-content:start}.rail button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:14px}.rail button[aria-current=page]{background:var(--surface-raised);font-weight:600}.rail button:focus-visible,.btn:focus-visible{outline:2px solid var(--action-primary)}.main{padding:18px 24px 48px;display:grid;gap:14px;align-content:start;min-width:0}h1{margin:0;font-size:22px}h2{margin:0;font-size:16px}h3{margin:0;font-size:13px}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px}.sm{font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{border:1px solid var(--border-subtle);border-radius:8px;padding:14px;background:var(--surface-base);display:grid;gap:8px;align-content:start;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tile{border:1px solid var(--border-subtle);border-radius:8px;padding:10px 12px;background:var(--surface-base)}.tile b{font-size:22px;display:block}.ox{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--border-subtle);font-size:13px;text-align:left;vertical-align:top}th{font-size:11px;color:var(--text-secondary);font-weight:600}.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border-subtle);white-space:nowrap}.ok{color:var(--status-success);border-color:currentColor}.bad{color:var(--status-danger);border-color:currentColor}.warn{color:var(--status-pending);border-color:currentColor}.btn{all:unset;cursor:pointer;justify-self:start;padding:6px 12px;border-radius:6px;border:1px solid var(--border-subtle);font-size:13px;background:var(--surface-base)}.btn.p{background:var(--action-primary);color:var(--text-on-action,#fff);border-color:var(--action-primary)}.btn[disabled]{opacity:.45;cursor:not-allowed}select,input,textarea{font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-base);color:var(--text-primary)}.note{border-left:3px solid var(--status-pending);padding:8px 10px;font-size:13px;background:var(--surface-raised);color:var(--text-primary)}.note.bad{border-left-color:var(--status-danger)}.note.ok{border-left-color:var(--status-success)}.zone{border:1px solid var(--border-subtle);border-radius:6px;padding:10px;display:grid;gap:4px}.zone.locked{border-style:dashed;color:var(--text-secondary)}.sw{position:relative}.menu[hidden]{display:none}.menu{position:absolute;top:110%;left:0;z-index:20;background:var(--surface-base);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px;min-width:260px;display:grid;gap:2px}.menu button{all:unset;cursor:pointer;padding:7px 10px;border-radius:5px;font-size:14px;display:flex;justify-content:space-between;gap:10px}.menu button:hover,.menu button:focus-visible{background:var(--surface-raised)}</style></head>
<body><div class="app"><div class="top"><span class="brand">Semester</span><span class="chip">Demo University · Fall 2026 · demo fixtures</span><div class="sw"><button class="btn" id="swb" aria-haspopup="menu" aria-expanded="false"></button><div class="menu" id="swm" role="menu" hidden></div></div><label class="sm row">Signed in as <select id="usr"></select></label><input placeholder="Search permitted records" aria-label="Search permitted records" style="flex:1;min-width:160px"></div><div class="body"><nav class="rail" id="rail" aria-label="Workspace"></nav><main class="main" id="main"></main></div></div>
<script src="model.js"></script>
<script>
const M=window.SW,esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let S={user:'u-sa1',role:'student_affairs',page:'home',caseId:null,unsaved:'',ref:{},refRes:null,req:null,log:[]};
const NAV={student_affairs:[['home','Overview'],['cases','My cases'],['intake','Intake queue'],['referrals','Referrals'],['matrix','Permission matrix'],['access','Request access'],['accept','Acceptance (16)']],advisor:[['home','Overview'],['caseload','Caseload'],['grades','Grade correction'],['matrix','Permission matrix'],['access','Request access'],['accept','Acceptance (16)']]};
const FLOW={faculty:['Draft','Faculty review','Ready','Released'],ta:['Assigned','Draft feedback','Faculty review','Completed'],advisor:['Draft','Student review','Agreed','Follow-up'],registrar:['Active','Evidence review','Approved','Released'],finance:['Draft','Submitted','Approved','Posted'],student_affairs:['Intake','Triage','Assigned','Active support','Resolved']};
const TASK={faculty:'Review assessment results',ta:'Review delegated submissions',advisor:'Review student progression plan',registrar:'Review registrar-owned hold',finance:'Review account adjustment',student_affairs:'Coordinate support referral'};
function stateView(st){return {loading:'<div class="card" aria-busy="true"><div class="muted">Loading assigned work…</div></div>',empty:'<div class="card"><h2>Nothing assigned</h2><div class="sm">No work is waiting in this workspace. New items appear here when they’re routed to you.</div></div>',error:'<div class="note bad"><b>Couldn’t load your queue.</b> Nothing was changed. Try again, or check Help if it keeps happening.</div>',forbidden:'<div class="note bad"><b>Forbidden.</b> This workspace isn’t granted to you for this record. No restricted details were loaded.</div>',offline:'<div class="note"><b>You’re offline.</b> Showing what was saved on this device. Actions that change records will wait until you’re back online.</div>'}[st]}
function flow(){const f=FLOW[S.role]||[];const i=Math.min(S.step||0,f.length-1);return '<div class="card"><h2>'+TASK[S.role]+'</h2><div class="row">'+f.map((x,k)=>'<span class="chip'+(k<=i?' ok':'')+'">'+(k+1)+'. '+x+'</span>').join('')+'</div><div class="row"><button class="btn" id="fstep"'+(i>=f.length-1?' disabled':'')+'>Advance (simulated)</button><button class="btn" id="freset">Reset</button></div><span class="muted">Demo record. Advancing re-checks authority each step; the consequential step needs its approval subrole.</span></div>'}
const LBL={student_affairs:'Student Affairs',advisor:'Advisor',faculty:'Faculty',ta:'TA',registrar:'Registrar',finance:'Finance'};
const grants=()=>M.USERS[S.user].grants.filter(g=>!g.until||g.until>Date.now()).map(g=>g.role);
const INTAKE=[['IN-201','Demo student C','Housing concern','2 h'],['IN-202','Demo student D','Academic support','1 d']];
function home(){if(S.role!=='advisor'&&S.role!=='student_affairs')return '<div><div class="kicker">'+LBL[S.role]+'</div><h1>'+LBL[S.role]+' overview</h1><div class="muted">Scope: '+({faculty:'assigned courses',ta:'assigned sections (draft only; escalate to Faculty)',registrar:'authorized academic records',finance:'assigned accounts'})[S.role]+'</div></div>'+flow();if(S.role==='advisor')return '<div><div class="kicker">Advisor</div><h1>Assigned caseload</h1></div>'+flow()+'<div class="tiles"><div class="tile"><span class="muted">Caseload</span><b>1</b></div><div class="tile"><span class="muted">Follow-ups due</span><b>1</b></div><div class="tile"><span class="muted">Referrals in</span><b>1</b></div></div>'+caseTable(['SA-1042']);
 return '<div><div class="kicker">Student Affairs</div><h1>Assigned support work and coordinated referrals</h1></div><div class="tiles"><div class="tile"><span class="muted">Assigned cases</span><b>'+M.USERS[S.user].grants[0].scope.cases.length+'</b></div><div class="tile"><span class="muted">Awaiting handoff</span><b>1</b></div><div class="tile"><span class="muted">Intake unassigned</span><b>'+INTAKE.length+'</b></div></div>'+flow()+'<div class="card"><h2>My work</h2>'+caseTable(Object.keys(M.RECORDS).filter(k=>M.RECORDS[k].type==='case'))+'</div><div class="card"><h2>Handoffs</h2><div class="sm">Advisor referral — recipient acceptance pending</div><div class="sm">Campus service request — response received</div></div>'}
function caseTable(ids){return '<div class="ox"><table><thead><tr><th>Case</th><th>Student</th><th>Status</th><th></th></tr></thead><tbody>'+ids.map(id=>{const a=M.authorize({user:S.user,role:S.role,cap:S.role==='student_affairs'?'student_affairs.case.read':'student_affairs.case.summary',recId:id});const r=M.RECORDS[id];return '<tr><td><b>'+id+'</b></td><td>'+(a.ok?'Demo student '+(r.student==='S-0418'?'A':'B'):'<span class="muted">—</span>')+'</td><td>'+(a.ok?r.status:'<span class="chip bad">Forbidden</span>')+'</td><td>'+(a.ok?'<button class="btn" data-open="'+id+'">Open →</button>':'<span class="muted">'+esc(a.why)+'</span>')+'</td></tr>'}).join('')+'</tbody></table></div>'}
function caseView(){const p=M.project(S.user,S.role,S.caseId);if(p.forbidden)return '<div class="note bad"><b>Forbidden.</b> '+esc(p.forbidden)+'. No case details were loaded.</div>';
 return '<div><div class="kicker">Student support case / '+p.id+'</div><h1>Academic support coordination</h1><div class="muted">Status: '+p.status+' · Owner: assigned worker · Visibility: case team · viewing as '+LBL[S.role]+'</div></div><div class="grid"><div class="zone"><h3>Student-facing summary</h3><div class="sm">'+esc(p.studentFacing)+'</div></div>'+('internal' in p?'<div class="zone"><h3>Internal coordination</h3><div class="sm">'+esc(p.internal)+'</div></div>':'<div class="zone locked"><h3>Internal coordination</h3><div class="sm">Not part of this workspace’s projection.</div></div>')+('restrictedNotes' in p?'<div class="zone"><h3>Restricted notes</h3><div class="sm">'+esc(p.restrictedNotes)+'</div></div>':'<div class="zone locked"><h3>Restricted notes</h3><div class="sm">Separate authorization required. Not sent to this browser.</div></div>')+'</div><div class="card"><h3>Other sections</h3><div class="sm">Finance details: not available in this workspace · Academic records: authorized summary only</div></div>'+(S.role==='student_affairs'?'<div class="card"><h2>Draft next step</h2><textarea id="draft" rows="2" aria-label="Next step draft">'+esc(S.unsaved)+'</textarea><span class="muted">Type here, then switch role to see the unsaved-work prompt.</span></div>'+refForm():'')}
function refForm(){return '<div class="card"><h2>Create referral</h2><span class="muted">Pick exactly what goes with it. Receiving a referral doesn’t open the whole case.</span>'+[...M.REFERRAL_FIELDS,'internal','restrictedNotes'].map(f=>'<label class="row sm"><input type="checkbox" data-rf="'+f+'"'+(S.ref[f]?' checked':'')+'> '+f.replace(/_/g,' ')+(M.REFERRAL_FIELDS.includes(f)?'':' <span class="chip bad">not approved for referrals</span>')+'</label>').join('')+'<button class="btn p" id="send">Send referral to Advising</button>'+(S.refRes?'<div class="note '+(S.refRes.ok?'ok':'bad')+'">'+(S.refRes.ok?'Sent: '+S.refRes.sent.join(', ')+'. Recipient acceptance pending.':esc(S.refRes.why))+'</div>':'')+'</div>'}
const MX=[['Assigned course roster','V','V','S','V','—','S'],['Draft assessment grades','E','E (delegated)','—','—','—','—'],['Release course grades','A','—','—','—','—','—'],['Published academic record','V (course)','S (assigned)','V','V','S','S'],['Correct authoritative record','—','—','Request','A','—','—'],['Advising plan','S','—','E','S','—','S'],['Registrar-owned hold','S','S','S','E/A','S','S'],['Financial account detail','—','—','S','S','V/E','S'],['Financial adjustment or refund','—','—','—','—','E/A','—'],['Assigned support case','Referral only','Referral only','S/E (assigned)','S','S','E'],['Restricted support notes','—','—','Separate grant','—','—','Separate grant'],['Create cross-role referral','E','E (delegated)','E','E','E','E'],['Bulk record export','Separate grant','—','Separate grant','Separate grant','Separate grant','Separate grant'],['Grant institutional permissions','—','—','—','—','—','—']];
function matrix(){return '<div class="card ox"><h2>Permission matrix (proposed defaults)</h2><table><thead><tr><th>Capability</th>'+['Faculty','TA','Advisor','Registrar','Finance','Student Affairs'].map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+MX.map(r=>'<tr><td><b>'+r[0]+'</b></td>'+r.slice(1).map(v=>'<td class="'+(v==='—'?'muted':'')+'">'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table><span class="muted">V view in scope · E create/edit in scope · A approve/release with an extra capability · S limited summary · — no default. Approval subroles (grades.release, adjustments.approve, records.publish, cases.reassign) are separate grants from workspace membership. Institutional policy decides actual authority.</span></div><div class="card"><h3>The one rule</h3><div class="sm">Allow only when identity is valid AND tenant membership is active AND the selected role grant is active AND the capability is granted AND the record is in scope AND the workflow state permits it AND access conditions are met. A browser-sent role is a request to evaluate, never proof.</div></div>'}
function access(){return '<div class="card"><h2>Request additional access</h2><span class="muted">Requesting doesn’t activate anything. You can’t approve your own request.</span><div class="grid"><label class="sm" style="display:grid;gap:3px">Capability<select id="rqc"><option>student_affairs.note.restricted.read</option><option>bulk export</option><option>registrar.hold.release (finance-owned)</option></select></label><label class="sm" style="display:grid;gap:3px">Record scope<input id="rqs" value="SA-1043"></label><label class="sm" style="display:grid;gap:3px">Business purpose<input id="rqp"></label><label class="sm" style="display:grid;gap:3px">Expires<input id="rqe" type="date"></label></div><button class="btn p" id="rq">Submit request</button>'+(S.req?'<div class="note">'+esc(S.req)+'</div>':'')+'<h3>Routes</h3><div class="sm">Missing course assignment → course owner · Missing advisee → advising lead · Restricted case → designated case owner or privacy authority (case, fields, purpose and duration limited) · Bulk export → data owner + policy reviewer · Suspected emergency → separate institution-approved procedure, no “override everything” button.</div></div>'}
function grades(){const v=M.gradeView(S.role);const R=S.role;const btn=(ev,l,extra)=>'<button class="btn" data-gc="'+ev+'"'+(extra||'')+'>'+l+'</button>';
 if(R==='advisor')return '<div class="card"><h2>BUS 1400 · Demo student A</h2><div class="sm">Published grade: <b>'+(v.published||'not released')+'</b></div><span class="muted">Advisors see the published result only — never a draft or a pending correction.</span></div>';
 return '<div class="card"><div class="row" style="justify-content:space-between"><h2>BUS 1400 · Demo student A</h2><span class="chip">'+v.state.replace(/_/g,' ')+' · v'+v.version+'</span></div><div class="row">'+['draft','released','correction_requested','correction_approved','corrected'].map(x=>'<span class="chip'+(x===v.state?' ok':'')+'">'+x.replace(/_/g,' ')+'</span>').join('')+'</div><div class="sm">Draft: <b>'+v.draft+'</b> · Published (student sees): <b>'+(v.published||'—')+'</b>'+(v.proposed?' · Proposed correction: <b>'+v.proposed+'</b> — “'+esc(v.reason)+'”':'')+'</div>'
 +(R==='faculty'||R==='ta'?'<div class="row"><label class="sm row">Draft grade <input id="gv" value="'+v.draft+'" style="width:60px"></label>'+btn('DRAFT','Save draft')+(R==='faculty'?btn('RELEASE','Release to student'):'')+'</div>':'')
 +(R==='faculty'?'<div class="row"><label class="sm row">Correct to <input id="gp" style="width:60px"></label><label class="sm row">Reason <input id="gr" style="width:220px"></label>'+btn('REQUEST_CORRECTION','Request correction')+'</div>':'')
 +(R==='registrar'?'<div class="row">'+btn('APPROVE_CORRECTION','Approve correction')+btn('PUBLISH_CORRECTION','Publish correction')+'</div><span class="muted">The requester can’t approve their own correction, even holding both roles.</span>':'')
 +'<label class="sm row"><input type="checkbox" id="gstale"> Act on a stale copy (v'+Math.max(1,v.version-1)+')</label>'+(S.gmsg?'<div class="note '+(S.gmsg.ok?'ok':'bad')+'">'+esc(S.gmsg.ok?'Done — now v'+S.gmsg.version:S.gmsg.why)+'</div>':'')+'<h3>History (never overwritten)</h3>'+(v.history.length?v.history.map(x=>'<div class="sm">v'+x.v+' · '+x.value+(x.supersedes?' supersedes '+x.supersedes+' — '+esc(x.reason):' released')+' · '+x.by+'</div>').join(''):'<span class="muted">Nothing published yet.</span>')+'<h3>Audit</h3>'+v.audit.slice(0,6).map(a=>'<div class="sm muted">'+a.at+' · '+a.user+' as '+a.role+' · '+a.ev+' → v'+a.v+'</div>').join('')+'<button class="btn" id="greset">Reset grade</button></div><span class="muted">Sign in as “Demo — all six roles” to walk the loop: Faculty releases and requests, Registrar approves and publishes, Advisor sees the result. Sign in as separate people to see the independent-approver rule pass.</span>'}
function accept(){const R=M.runAcceptance();const n=R.filter(r=>r[1]).length;return '<div class="card"><div class="row" style="justify-content:space-between"><h2>Acceptance scenarios</h2><span class="chip '+(n===R.length?'ok':'bad')+'">'+n+'/'+R.length+' pass</span></div>'+R.map(r=>'<div class="row sm"><span class="chip '+(r[1]?'ok':'bad')+'">'+(r[1]?'pass':'fail')+'</span>'+esc(r[0])+'</div>').join('')+'<span class="muted">Run live in this page against the same rule the screens use (model.js) — a prototype check, not database evidence. The repo still needs these as RLS + API tests.</span></div>'}
function draw(){const g=grants();if(!g.includes(S.role)){S.role=g[0];S.page='home'}document.getElementById('swb').textContent=LBL[S.role]+' ▾';document.getElementById('swb').setAttribute('aria-label','Acting workspace: '+LBL[S.role]+'. Switch workspace');
 document.getElementById('usr').innerHTML=Object.entries(M.USERS).map(([k,u])=>'<option value="'+k+'"'+(k===S.user?' selected':'')+'>'+u.name+'</option>').join('');
 document.getElementById('rail').innerHTML='<div class="kicker" style="padding:4px 10px">Acting workspace</div>'+(NAV[S.role]||[['home','Overview'],...(['faculty','ta','registrar'].includes(S.role)?[['grades','Grade correction']]:[]),['matrix','Permission matrix'],['access','Request access'],['accept','Acceptance (16)']]).map(([k,l])=>'<button data-pg="'+k+'"'+(S.page===k?' aria-current="page"':'')+'>'+l+'</button>').join('')+'<div class="muted" style="padding:10px">Scope: '+(S.role==='advisor'?'assigned caseload':S.role==='student_affairs'?'assigned cases':'role scope')+'</div>';
 const m=document.getElementById('main');const stSel='<label class="row sm" style="justify-content:flex-end">Screen state <select id="sst">'+['default','loading','empty','error','forbidden','offline'].map(x=>'<option'+(S.st===x?' selected':'')+'>'+x+'</option>').join('')+'</select></label>';m.innerHTML=stSel+(S.st&&S.st!=='default'?stateView(S.st):S.page==='case'?caseView():S.page==='matrix'?matrix():S.page==='access'?access():S.page==='accept'?accept():S.page==='grades'?grades():S.page==='intake'?'<div class="card"><h2>Intake queue</h2>'+INTAKE.map(i=>'<div class="row sm" style="justify-content:space-between"><span><b>'+i[0]+'</b> · '+i[1]+' · '+i[2]+'</span><span class="row"><span class="muted">waiting '+i[3]+'</span><button class="btn">Accept</button><button class="btn">Route</button></span></div>').join('')+'</div>':S.page==='referrals'?'<div class="card"><h2>Referrals</h2><div class="sm">REF-SA-1042 → Advising · Draft → Scope review → Sent → <b>awaiting acceptance</b></div></div>':S.page==='caseload'||S.page==='cases'?'<div class="card">'+caseTable(Object.keys(M.RECORDS).filter(k=>M.RECORDS[k].type==='case'))+'</div>':home());
 if(S.msg){m.insertAdjacentHTML('afterbegin','<div class="note">'+esc(S.msg)+'</div>');S.msg=null}bind()}
function openMenu(){const g=grants();const mm=document.getElementById('swm');mm.innerHTML='<div class="kicker" style="padding:4px 10px">Switch workspace</div>'+g.map(r=>'<button role="menuitem" data-sw="'+r+'"><span>'+(r===S.role?'✓ ':'')+LBL[r]+'</span><span class="muted">'+(r==='advisor'?'Assigned caseload':r==='student_affairs'?'Assigned cases':'')+'</span></button>').join('')+'<div style="border-top:1px solid var(--border-subtle);margin:4px 0"></div><button role="menuitem" data-sw="__req"><span>Request additional access →</span></button>';mm.hidden=false;document.getElementById('swb').setAttribute('aria-expanded','true');mm.querySelector('button').focus();
 mm.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{mm.hidden=true;document.getElementById('swb').setAttribute('aria-expanded','false');const to=b.dataset.sw;if(to==='__req'){S.page='access';draw();return}if(to===S.role)return;if(S.unsaved.trim()){const c=prompt('You have an unsaved draft. Type S to save it, D to discard, or anything else to cancel.','S');if(!c||!/^[sd]$/i.test(c))return;if(/d/i.test(c))S.unsaved='';else S.log.push('Draft saved')}
  const r=M.switchRole(S.user,S.role,to,{caseId:S.page==='case'?S.caseId:null});if(!r.ok){S.msg=r.why;draw();return}S.role=to;S.refRes=null;S.ref={};S.step=0;if(r.landed==='record'){S.page='case';S.msg='Switched to '+LBL[to]+'. Showing this workspace’s authorized projection of the same case; other content and cached responses were cleared.'}else{S.page='home';S.msg='Switched to '+LBL[to]+'. The open record isn’t in this workspace’s scope, so you’re at home.'}draw()})}
function bind(){const $=q=>document.querySelectorAll(q),g=id=>document.getElementById(id);$('[data-pg]').forEach(b=>b.onclick=()=>{S.page=b.dataset.pg;S.gmsg=null;draw()});$('[data-open]').forEach(b=>b.onclick=()=>{S.caseId=b.dataset.open;S.page='case';draw()});
 $('[data-gc]').forEach(b=>b.onclick=()=>{const v=M.GRADE.version;S.gmsg=M.gradeCommand(S.user,S.role,b.dataset.gc,{value:b.dataset.gc==='DRAFT'?g('gv').value.trim():g('gp')?g('gp').value.trim():'',reason:g('gr')?g('gr').value:'',expectedVersion:g('gstale').checked?v-1:v});draw()});if(g('greset'))g('greset').onclick=()=>{M.resetGrade();S.gmsg=null;draw()};if(g('sst'))g('sst').onchange=e=>{S.st=e.target.value;draw()};if(g('fstep'))g('fstep').onclick=()=>{S.step=(S.step||0)+1;draw()};if(g('freset'))g('freset').onclick=()=>{S.step=0;draw()};if(g('draft'))g('draft').oninput=e=>S.unsaved=e.target.value;$('[data-rf]').forEach(c=>c.onchange=()=>{S.ref[c.dataset.rf]=c.checked});if(g('send'))g('send').onclick=()=>{const f={};Object.entries(S.ref).forEach(([k,v])=>{if(v)f[k]=true});S.refRes=Object.keys(f).length?M.sendReferral(f):{ok:false,why:'Choose at least one field.'};draw()};
 if(g('rq'))g('rq').onclick=()=>{const p=g('rqp').value.trim(),e=g('rqe').value;if(!p||!e){S.req='Add a business purpose and an expiry.';draw();return}S.req='Requested '+g('rqc').value+' for '+g('rqs').value+' until '+e+' → routed to the designated case owner. Nothing is active until a different person approves.';draw()}}
document.getElementById('swb').onclick=e=>{e.stopPropagation();const mm=document.getElementById('swm');if(mm.hidden)openMenu();else{mm.hidden=true;document.getElementById('swb').setAttribute('aria-expanded','false')}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const mm=document.getElementById('swm');if(!mm.hidden){mm.hidden=true;document.getElementById('swb').setAttribute('aria-expanded','false');document.getElementById('swb').focus()}}});
document.addEventListener('click',e=>{const mm=document.getElementById('swm');if(!mm.hidden&&!mm.contains(e.target)){mm.hidden=true;document.getElementById('swb').setAttribute('aria-expanded','false')}});
document.getElementById('usr').onchange=e=>{S={...S,user:e.target.value,page:'home',caseId:null,unsaved:'',ref:{},refRes:null,req:null,gmsg:null};S.role=grants()[0];draw()};
draw();
</script></body></html>
