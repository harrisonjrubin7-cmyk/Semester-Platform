<!-- @dsCard group="Roles & journeys" viewport="1440x900" name="Every role, start to finish" subtitle="26 user roles and 21 Semester team roles through one 10-stage lifecycle: entry, first action, workspace, cross-role flows, permission decision, AI, offboarding" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><script src="../platform/appearance.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><title>Semester — Every role, start to finish</title>
<style>html,body,#root{height:100%}body{margin:0;overflow:hidden}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}.main{display:flex;flex-direction:column;min-width:0;height:100%}.scroll{flex:1;overflow:auto}.page{max-width:1240px;margin:0 auto;padding:22px var(--page-pad) 64px;display:grid;gap:18px}.ph{padding-bottom:14px;border-bottom:1px solid var(--border-subtle)}.ph h1{margin:2px 0 0;text-wrap:pretty}.lead{color:var(--text-secondary);max-width:78ch;margin:6px 0 0;line-height:1.55}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px;margin:0}.card{border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);padding:14px 16px;display:grid;gap:10px;align-content:start}.card h3{margin:0;font:600 17px var(--font-heading)}.split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}@media(max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}.roles{position:static;max-height:220px}}.roles{display:grid;gap:2px;position:sticky;top:0;max-height:calc(100vh - 120px);overflow:auto}.roles h4{margin:10px 0 4px;font:600 11px var(--font-body,'Barlow');letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.roles button{all:unset;cursor:pointer;padding:7px 10px;border-radius:4px;font-size:14px}.roles button:hover{background:var(--surface-sunken)}.roles button[aria-current=true]{background:var(--text-primary);color:var(--surface-base)}.roles button:focus-visible{outline:2px solid var(--focus-color)}.stages{display:grid;gap:0;container-type:inline-size}.stg{display:grid;grid-template-columns:34px minmax(120px,170px) minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--border-subtle);align-items:start}@container (max-width:560px){.stg{grid-template-columns:34px minmax(0,1fr);gap:4px 12px}.stg .v{grid-column:2}}.stg .n{width:26px;height:26px;border-radius:50%;background:var(--text-primary);color:var(--surface-base);display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums}.stg b{font-weight:600;font-size:14px}.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.flow span{border:1px solid var(--border-default);background:var(--surface-base);border-radius:4px;padding:5px 9px;font-size:13px}.flow i{font-style:normal;color:var(--text-secondary)}.layers{display:grid;gap:6px}.layer{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;border:1px solid var(--border-default);border-radius:6px;padding:10px 14px;background:var(--surface-base)}.layer:nth-child(odd){background:var(--surface-sunken)}@media(max-width:700px){.layer{grid-template-columns:minmax(0,1fr)}}.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{text-align:left;font-weight:500;color:var(--text-secondary);border-bottom:1px solid var(--border-strong);padding:6px 8px}.tbl td{border-bottom:1px solid var(--border-subtle);padding:7px 8px;vertical-align:top}.form{display:grid;gap:8px}.form label{display:flex;gap:8px;align-items:center;font-size:14px}.form select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--border-default);border-radius:4px;background:var(--surface-base);color:inherit}.verdict{font:700 26px var(--font-heading)}.ok{color:#2f7a4f}.bad{color:#a33b3b}.warn{color:#7a5d22}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}</style></head>
<body><div id="root"></div>
<script src="roleflow-data.js"></script>
<script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba; const X = window.ROLEFLOW; const KEY = 'sem-roleflow-v1';
const ALL = [...X.EXT, ...X.EMP];
function Chain({ steps }) { return <div className="flow">{steps.map((s, i) => <React.Fragment key={i}>{i > 0 && <i>→</i>}<span>{s}</span></React.Fragment>)}</div>; }
function stagesFor(r) {
  const emp = r.group === 'Semester team';
  return [r.enter, emp ? 'Employee identity, device enrollment, MFA' : /SSO/.test(r.enter) ? 'Institution SSO; Semester account created or linked' : /invit/i.test(r.enter) ? 'Secure invitation, then email/passkey' : 'Email, passkey or approved sign-in',
    emp ? 'Company tenant · role and capability grants · required training · no student records by default' : 'Membership, role, capabilities, relationship to resources, consent, entitlements and policy resolved server-side',
    emp ? 'Role onboarding and access checklist' : 'Versioned role journey, 3–5 steps, resumable, with support hand-off',
    r.first, r.ws, emp ? 'Works with institutions, partners and teammates through the Command Center, with controlled actions: ' + r.ctl : 'Shared workflows with other roles (see cross-role map)',
    emp ? 'Access reviews; every controlled action audited' : 'Support with minimum context; every sensitive action audited; AI governed by policy',
    emp ? 'Role change or elevation needs approval' : 'Role, term, caseload or scope changes re-resolve access', r.end];
}
function Roles({ sel, setSel }) {
  const r = ALL.find((x) => x.id === sel) || ALL[0]; const groups = [...new Set(ALL.map((x) => x.group))]; const st = stagesFor(r);
  return <div className="split"><nav className="roles" aria-label="Roles">{groups.map((g) => <React.Fragment key={g}><h4>{g}</h4>{ALL.filter((x) => x.group === g).map((x) => <button key={x.id} aria-current={x.id === r.id} onClick={() => setSel(x.id)}>{x.name}</button>)}</React.Fragment>)}</nav>
    <div style={{ display: 'grid', gap: 16 }}><div className="ph"><div className="kicker">{r.group}</div><h1>{r.name}</h1><p className="lead">Same system, same graph, same policy engine — a workspace built for this role.</p></div>
      <div className="card"><h3>Start to finish</h3><div className="stages">{X.STAGES.map((s, i) => <div className="stg" key={s}><span className="n">{i + 1}</span><b>{s}</b><span className="v">{st[i]}</span></div>)}</div>{r.kit && <a href={r.kit}>Open the {r.ws} prototype →</a>}</div>
      {r.flows.map((f) => <div className="card" key={f}><h3>{X.FLOWS[f][0]}</h3><Chain steps={X.FLOWS[f][1]} /></div>)}
      {r.group === 'Semester team' && <div className="card"><h3>Offboarding</h3><Chain steps={X.FLOWS.emp_off[1]} /></div>}</div></div>;
}
function System() {
  return <><div className="ph"><div className="kicker">Whole system</div><h1>One operating system, every role</h1><p className="lead">Discover / invite → identity → tenant, role, policy and consent → role onboarding → first meaningful action → daily workspace → cross-role workflows → support, audit and governance → lifecycle change → export, retention, offboarding or renewal. Not many dashboards: one native system over one authoritative graph.</p></div>
    <div className="layers">{X.LAYERS.map(([n, d]) => <div className="layer" key={n}><b style={{ font: '600 16px var(--font-heading)' }}>{n}</b><span style={{ fontSize: 14 }}>{d}</span></div>)}</div>
    <div className="card"><h3>Role journey map</h3><div style={{ overflowX: 'auto' }}><table className="tbl"><thead><tr><th>Role</th><th>Enters through</th><th>First meaningful action</th><th>Daily workspace</th><th>Lifecycle end</th></tr></thead><tbody>{X.EXT.map((r) => <tr key={r.id}><td style={{ fontWeight: 600 }}>{r.name}</td><td>{r.enter}</td><td>{r.first}</td><td>{r.kit ? <a href={r.kit}>{r.ws}</a> : r.ws}</td><td>{r.end}</td></tr>)}</tbody></table></div></div>
    <div className="card"><h3>Semester team</h3><div style={{ overflowX: 'auto' }}><table className="tbl"><thead><tr><th>Role</th><th>Provisioning</th><th>Daily console</th><th>Key controlled actions</th><th>Offboarding</th></tr></thead><tbody>{X.EMP.map((r) => <tr key={r.id}><td style={{ fontWeight: 600 }}>{r.name}</td><td>{r.enter}</td><td>{r.kit ? <a href={r.kit}>{r.ws}</a> : r.ws}</td><td>{r.ctl}</td><td>{r.end}</td></tr>)}</tbody></table></div><p className="muted">Support never has standing access to student records, finance records or institution administration — minimum context per case, with time-bound escalation.</p></div></>;
}
function Decide() {
  const F = [['session', 'Active account and session'], ['member', 'Tenant membership'], ['role', 'Role'], ['cap', 'Capability'], ['scope', 'Organizational scope'], ['rel', 'Relationship to the resource'], ['consent', 'Consent'], ['policy', 'Policy'], ['ent', 'Entitlement (module bought)'], ['wf', 'Workflow state allows it']];
  const [v, setV] = React.useState(Object.fromEntries(F.map(([k]) => [k, true]))); const [cls, setCls] = React.useState('internal'); const [impact, setImpact] = React.useState('normal');
  const fail = F.filter(([k]) => !v[k]);
  const verdict = fail.length ? ['Deny', 'bad', 'Missing: ' + fail.map((f) => f[1].toLowerCase()).join(', ') + '. Nothing about the resource is revealed.'] : impact === 'high' ? ['Require approval', 'warn', 'High-impact action: request → impact preview → second approver → idempotent command → audit.'] : cls === 'restricted' ? ['Require step-up authentication', 'warn', 'Restricted data: re-authenticate (passkey or MFA) before continuing.'] : ['Allow', 'ok', 'Logged with the inputs that allowed it.'];
  return <><div className="ph"><div className="kicker">Permission decision</div><h1>Can this person do this, to this, now?</h1><p className="lead">Every page, record, API call, file, AI tool action, export and workflow command applies the same decision. No role gets "everything" because the title says administrator.</p></div>
    <div className="grid"><div className="card form">{F.map(([k, l]) => <label key={k}><input type="checkbox" checked={v[k]} onChange={(e) => setV({ ...v, [k]: e.target.checked })} />{l}</label>)}<label>Data classification <select value={cls} onChange={(e) => setCls(e.target.value)}><option value="public">Public</option><option value="internal">Internal</option><option value="confidential">Confidential (education record)</option><option value="restricted">Restricted (financial, health-adjacent, disciplinary)</option></select></label><label>Action <select value={impact} onChange={(e) => setImpact(e.target.value)}><option value="normal">Normal</option><option value="high">High-impact (grade release, record change, refund, cutover)</option></select></label></div>
      <div className="card"><span className="kicker">Decision</span><span className={'verdict ' + verdict[1]}>{verdict[0]}</span><p style={{ margin: 0 }}>{verdict[2]}</p><p className="muted">Possible outcomes: allow · deny · require approval · require step-up authentication.</p></div></div></>;
}
function Cross() {
  return <><div className="ph"><div className="kicker">Cross-role workflows</div><h1>Who works with whom</h1><p className="lead">Actions move between people and departments through shared workflows — never by copying records into another tool.</p></div>
    <div className="grid">{X.CROSS.map(([who, rows]) => <div className="card" key={who}><h3>{who}</h3><table className="tbl"><tbody>{rows.map(([a, b]) => <tr key={a}><td style={{ fontWeight: 600, whiteSpace: 'nowrap' }}>↔ {a}</td><td>{b}</td></tr>)}</tbody></table></div>)}</div></>;
}
function Flows() {
  return <><div className="ph"><div className="kicker">Flow library</div><h1>Every flow</h1><p className="lead">AI can explain, plan, summarize, draft, search approved sources and route with permission. It cannot enroll, change records, issue grades, approve money, discipline or disclose protected data.</p></div>
    {Object.entries(X.FLOWS).map(([k, [n, s]]) => <div className="card" key={k}><h3>{n}</h3><Chain steps={s} /></div>)}</>;
}
function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
  const [v, setV] = React.useState(saved.v || 'roles'); const [sel, setSel] = React.useState(saved.sel || 'student');
  React.useEffect(() => { localStorage.setItem(KEY, JSON.stringify({ v, sel })); }, [v, sel]);
  React.useEffect(() => { const s = document.querySelector('.scroll'); if (s) s.scrollTop = 0; }, [v, sel]);
  const T = [['roles', 'Every role', 'sources'], ['system', 'Whole system', 'hub'], ['decide', 'Permission decision', 'check'], ['cross', 'Cross-role map', 'connect'], ['flows', 'Flow library', 'runway']];
  return <div className="shell"><N.SideRail current={v} onNavigate={setV} groups={[{ label: 'Role lifecycles', items: T.map(([id, label, icon]) => ({ id, label, icon })) }]} foot={<span style={{ fontSize: 12, color: 'var(--chrome-text-secondary)' }}>{X.EXT.length} user roles · {X.EMP.length} team roles</span>} />
    <div className="main"><N.SystemContextBar location={'Role lifecycles · ' + T.find((t) => t[0] === v)[1]} term="One Education OS" sync="device-only" /><div className="scroll"><div className="page">{v === 'roles' && <Roles sel={sel} setSel={setSel} />}{v === 'system' && <System />}{v === 'decide' && <Decide />}{v === 'cross' && <Cross />}{v === 'flows' && <Flows />}</div></div></div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
