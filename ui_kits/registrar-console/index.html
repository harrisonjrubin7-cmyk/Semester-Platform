<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><title>Semester — Registrar readiness console</title>
<style>html,body,#root{height:100%}body{margin:0;overflow:hidden}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}.main{display:flex;flex-direction:column;min-width:0;height:100%}.scroll{flex:1;overflow:auto}.page{max-width:1200px;margin:0 auto;padding:22px var(--page-pad) 64px;display:grid;gap:18px}.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border-subtle)}.ph h1{margin:2px 0 0}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px;margin:0}.card{border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);padding:14px 16px;display:grid;gap:10px;align-content:start}.card h3{margin:0;font:600 17px var(--font-heading)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.tile{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);padding:12px 14px;display:grid;gap:2px}.tile:hover,.tile:focus-visible{border-color:var(--blue-500,#597ea3);outline:none}.tile b{font:700 26px var(--font-heading);font-variant-numeric:tabular-nums}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:16px;align-items:start}@media(max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{text-align:left;font-weight:500;color:var(--text-secondary);border-bottom:1px solid var(--border-strong);padding:6px 8px}.tbl td{border-bottom:1px solid var(--border-subtle);padding:7px 8px;vertical-align:top}.num{text-align:right;font-variant-numeric:tabular-nums}.chip{display:inline-flex;align-items:center;border:1px solid var(--border-default);border-radius:3px;padding:1px 7px;font-size:12px;white-space:nowrap}.src{font-size:12px;color:var(--text-secondary);white-space:nowrap}.ok{color:#2f7a4f}.bad{color:#a33b3b}.warn{color:#7a5d22}.bar{display:flex;height:22px;border-radius:3px;overflow:hidden;border:1px solid var(--border-subtle)}.bar div{height:100%}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font-size:13px;color:var(--text-secondary)}.form input,.form select,.form textarea{font:inherit;font-size:14.5px;color:var(--text-primary,#1b1a17);padding:8px 10px;border:1px solid var(--border-default);border-radius:4px;background:var(--surface-base)}.banner{border:1px solid var(--border-strong);background:var(--surface-sunken,#efebe2);border-radius:6px;padding:10px 14px;font-size:13.5px}.tok{font-family:ui-monospace,monospace;font-size:12px}.stu{border:2px dashed var(--border-strong);border-radius:8px;padding:14px;display:grid;gap:8px;background:#fbfaf7}.row{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--border-subtle);border-radius:4px;padding:8px 10px;background:var(--surface-base)}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba; const KEY = 'sem-registrar-console-v1';
const TERM = { name: 'Spring 2027', opens: 'Nov 4, 2026', daysLeft: 30, total: 6120, synced: '2h ago' };
const STATUS = [['ready', 'Ready to register', '#2f7a4f'], ['hold', 'Blocked by a hold', '#a33b3b'], ['prereq', 'Prerequisite issue', '#a5803a'], ['advising', 'Advising required', '#4d6f91'], ['unplanned', 'No plan yet', '#b7b7ba']];
const BASE = { ready: 3410, hold: 1180, prereq: 420, advising: 690, unplanned: 420 };
const YEARS = [['First-year', { ready: 820, hold: 340, prereq: 60, advising: 290, unplanned: 140 }], ['Second-year', { ready: 900, hold: 310, prereq: 130, advising: 210, unplanned: 110 }], ['Third-year', { ready: 860, hold: 280, prereq: 140, advising: 120, unplanned: 90 }], ['Fourth-year+', { ready: 830, hold: 250, prereq: 90, advising: 70, unplanned: 80 }]];
const HOLDS0 = [{ id: 'adv', office: 'Advising', n: 690, oldest: 21, path: 'Meet your advisor; advisor clears in SIS', owner: 'Advising Center' }, { id: 'bur', office: 'Bursar', n: 520, oldest: 34, path: 'Pay or set up a payment plan', owner: 'Student Accounts' }, { id: 'hlth', office: 'Health records', n: 310, oldest: 12, path: 'Upload immunization record', owner: 'Student Health' }, { id: 'reg', office: 'Registrar', n: 210, oldest: 8, path: 'Update address / emergency contact', owner: 'Registrar' }, { id: 'lib', office: 'Library', n: 140, oldest: 45, path: 'Return or pay for overdue items', owner: 'Library' }];
const OVR0 = [{ id: 'PO-311', stu: 'S-1042', course: 'BIO 305', reason: 'Took equivalent course at transfer institution (BIO 2xx)', missing: 'BIO 201', status: 'pending' }, { id: 'PO-312', stu: 'S-2210', course: 'CHEM 220', reason: 'Concurrent enrollment in CHEM 112', missing: 'CHEM 112', status: 'pending' }, { id: 'PO-313', stu: 'S-0874', course: 'MATH 310', reason: 'Instructor permission attached', missing: 'MATH 250', status: 'pending' }];
const REC0 = [{ id: 'RC-71', stu: 'S-3301', field: 'Advising hold', sis: 'Released Oct 3', sem: 'Active', age: 1 }, { id: 'RC-72', stu: 'S-1190', field: 'Credits earned', sis: '58', sem: '61', age: 3 }, { id: 'RC-73', stu: 'S-0409', field: 'Program', sis: 'BS Biology', sem: 'BA Biology', age: 2 }];
const TICKETS = [['90+ credits', 'Nov 4 · 8:00'], ['60–89 credits', 'Nov 5 · 8:00'], ['30–59 credits', 'Nov 6 · 8:00'], ['0–29 credits', 'Nov 7 · 8:00'], ['Priority (athletes, accessibility, veterans)', 'Nov 3 · 8:00']];
const fresh = () => ({ counts: { ...BASE }, holds: HOLDS0.map((h) => ({ ...h })), ovr: OVR0.map((o) => ({ ...o })), rec: REC0.map((r) => ({ ...r })), ticketsPublished: false, sends: [], pending: null, audit: [] });
const pct = (n, t) => Math.round(n / t * 1000) / 10;
const now = () => new Date().toISOString();
function Head({ k, title, children }) { return <div className="ph"><div><div className="kicker">Campus A University · Registrar · {k}</div><h1>{title}</h1></div><div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>{children}</div></div>; }
function Bar({ c }) { const t = Object.values(c).reduce((a, b) => a + b, 0); return <div className="bar" role="img" aria-label={STATUS.map(([k, l]) => l + ' ' + c[k]).join(', ')}>{STATUS.map(([k, , col]) => <div key={k} style={{ width: (c[k] / t * 100) + '%', background: col }}></div>)}</div>; }
function Overview({ S, go }) {
  const c = S.counts;
  return <><Head k="Readiness" title={'Registration readiness · ' + TERM.name}><span className="src">◆ Official · SIS · synced {TERM.synced}</span></Head>
    <div className="banner">Registration opens <b>{TERM.opens}</b> — {TERM.daysLeft} days. Semester mirrors the SIS; the SIS stays authoritative. Every number below links to the students and the office that owns the fix.</div>
    <div className="tiles">{STATUS.map(([k, l, col]) => <button key={k} className="tile" onClick={() => go(k === 'hold' ? 'holds' : k === 'prereq' ? 'overrides' : 'students')}><span className="muted"><span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: 2, background: col, marginRight: 6 }}></span>{l}</span><b>{c[k].toLocaleString()}</b><span className="muted">{pct(c[k], TERM.total)}%</span></button>)}</div>
    <div className="card"><h3>All {TERM.total.toLocaleString()} continuing students</h3><Bar c={c} /><div className="legend">{STATUS.map(([k, l, col]) => <span key={k}><i style={{ background: col }}></i>{l}</span>)}</div></div>
    <div className="card"><h3>By class year</h3><table className="tbl"><thead><tr><th>Cohort</th><th style={{ width: '50%' }}>Readiness</th><th className="num">Ready</th><th className="num">Blocked</th></tr></thead><tbody>{YEARS.map(([y, v]) => { const t = Object.values(v).reduce((a, b) => a + b, 0); return <tr key={y}><td>{y}</td><td><Bar c={v} /></td><td className="num">{pct(v.ready, t)}%</td><td className="num">{(t - v.ready).toLocaleString()}</td></tr>; })}</tbody></table><p className="muted">A student is "blocked" if any one of hold, prerequisite, advising or plan applies; primary reason shown.</p></div>
    <div className="grid"><button className="tile" onClick={() => go('outreach')}><span className="muted">Next best action</span><span style={{ font: '600 17px var(--font-heading)' }}>Remind 690 students to see their advisor</span><span className="muted">Advising holds are the largest office-owned block</span></button><button className="tile" onClick={() => go('reconcile')}><span className="muted">Data quality</span><span style={{ font: '600 17px var(--font-heading)' }}>{S.rec.length} SIS mismatches to resolve</span><span className="muted">Oldest {Math.max(0, ...S.rec.map((r) => r.age))} days</span></button><button className="tile" onClick={() => go('tickets')}><span className="muted">Time tickets</span><span style={{ font: '600 17px var(--font-heading)' }}>{S.ticketsPublished ? 'Published to students' : 'Not yet published'}</span><span className="muted">Students see their window on Today</span></button></div></>;
}
function Holds({ S, set, go }) {
  const [sel, setSel] = React.useState(S.holds[0].id); const h = S.holds.find((x) => x.id === sel);
  const clear = (n) => set((s) => ({ ...s, holds: s.holds.map((x) => x.id === sel ? { ...x, n: Math.max(0, x.n - n) } : x), counts: { ...s.counts, hold: Math.max(0, s.counts.hold - n), ready: s.counts.ready + n }, audit: [{ at: now(), a: 'sis.sync.hold_released', t: h.office + ' ×' + n, by: 'SIS feed' }, ...s.audit] }));
  return <><Head k="Holds" title="Holds by office"><span className="src">◆ Official · SIS · {TERM.synced}</span></Head>
    <div className="two"><div className="card"><table className="tbl"><thead><tr><th>Office</th><th className="num">Students</th><th className="num">Oldest (days)</th><th>Release path students see</th></tr></thead><tbody>{S.holds.map((x) => <tr key={x.id} onClick={() => setSel(x.id)} style={{ cursor: 'pointer', outline: sel === x.id ? '2px solid var(--blue-500,#597ea3)' : 'none' }}><td style={{ fontWeight: 600 }}>{x.office}</td><td className="num">{x.n}</td><td className={'num ' + (x.oldest > 30 ? 'bad' : '')}>{x.oldest}</td><td>{x.path}</td></tr>)}</tbody></table><p className="muted">Holds are placed and released by the owning office in the SIS. Semester never releases a hold.</p></div>
      <aside className="card"><h3>{h.office}</h3><p style={{ margin: 0 }}>{h.n} students · owner: {h.owner}</p><div className="stu"><span className="kicker">What these students see on Today</span><div className="row"><span>{h.office} hold — {h.path.toLowerCase()}</span><span className="src">◆ {h.owner}</span></div><span className="muted">Links to {h.owner}'s page and hours. No reason codes or balances shown.</span></div><N.Button onClick={() => go('outreach', h.id)}>Remind these {h.n} students…</N.Button><N.Button variant="secondary" onClick={() => clear(Math.min(25, h.n))}>Simulate next SIS sync (25 released)</N.Button></aside></div></>;
}
function Overrides({ S, set }) {
  const [note, setNote] = React.useState({});
  const decide = (id, d) => { if (!(note[id] || '').trim()) return; set((s) => ({ ...s, ovr: s.ovr.map((o) => o.id === id ? { ...o, status: d } : o), counts: d === 'approved' ? { ...s.counts, prereq: s.counts.prereq - 1, ready: s.counts.ready + 1 } : s.counts, audit: [{ at: now(), a: 'record:approve · override.' + d, t: id, by: 'Registrar (you)', note: note[id] }, ...s.audit] })); };
  return <><Head k="Overrides" title="Prerequisite overrides" />
    <p className="muted">Approvals are written to the SIS as an override with your reason, then synced back. A reason is required.</p>
    {S.ovr.map((o) => <div key={o.id} className="card"><div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, flexWrap: 'wrap' }}><h3>{o.course} · <span className="tok">{o.stu}</span></h3><span className={'chip ' + (o.status === 'approved' ? 'ok' : o.status === 'denied' ? 'bad' : '')}>{o.status}</span></div><p style={{ margin: 0 }}>Missing: <b>{o.missing}</b>. Student says: {o.reason}</p>{o.status === 'pending' && <div className="form" style={{ gridTemplateColumns: 'minmax(0,1fr) auto auto', alignItems: 'end', display: 'grid', gap: 8 }}><label>Reason (shown to student)<input value={note[o.id] || ''} onChange={(e) => setNote({ ...note, [o.id]: e.target.value })} placeholder="e.g. Transfer course BIO 210 accepted as equivalent" /></label><N.Button size="sm" disabled={!(note[o.id] || '').trim()} onClick={() => decide(o.id, 'approved')}>Approve</N.Button><N.Button size="sm" variant="secondary" disabled={!(note[o.id] || '').trim()} onClick={() => decide(o.id, 'denied')}>Deny</N.Button></div>}</div>)}</>;
}
function Tickets({ S, set }) {
  const [confirm, setConfirm] = React.useState(false);
  const publish = () => { set((s) => ({ ...s, ticketsPublished: true, audit: [{ at: now(), a: 'registration_window:publish', t: TERM.name, by: 'Registrar (you)' }, ...s.audit] })); setConfirm(false); };
  return <><Head k="Time tickets" title="Registration windows">{!S.ticketsPublished ? <N.Button size="sm" onClick={() => setConfirm(true)}>Publish to students…</N.Button> : <span className="chip ok">Published</span>}</Head>
    <div className="card"><table className="tbl"><thead><tr><th>Group</th><th>Window opens</th></tr></thead><tbody>{TICKETS.map(([g, t]) => <tr key={g}><td>{g}</td><td>{t}</td></tr>)}</tbody></table><span className="src">◆ Official · SIS registration windows</span></div>
    {confirm && <div className="card" role="dialog" aria-label="Publish time tickets" style={{ borderColor: '#1b1a17' }}><h3>Publish windows to {TERM.total.toLocaleString()} students?</h3><ul style={{ margin: 0, paddingLeft: 18, fontSize: 14 }}><li>Each student sees their own window on Today, with a calendar option.</li><li>Students with an active hold see it next to their window.</li><li>You can unpublish; changes after publishing notify affected students.</li></ul><div style={{ display: 'flex', gap: 8 }}><N.Button onClick={publish}>Publish</N.Button><N.Button variant="ghost" onClick={() => setConfirm(false)}>Cancel</N.Button></div></div>}</>;
}
function Reconcile({ S, set }) {
  const act = (id, how) => set((s) => ({ ...s, rec: s.rec.filter((r) => r.id !== id), audit: [{ at: now(), a: how === 'sis' ? 'reconciliation.accept_sis' : 'reconciliation.flag_source', t: id, by: 'Registrar (you)' }, ...s.audit] }));
  return <><Head k="Reconciliation" title="SIS vs Semester" />
    {S.rec.length === 0 ? <div className="card"><h3 className="ok">No mismatches</h3><p className="muted">Next sync in about 1 hour.</p></div> : <div className="card"><table className="tbl"><thead><tr><th>Student</th><th>Field</th><th>SIS (official)</th><th>Semester</th><th className="num">Age</th><th></th></tr></thead><tbody>{S.rec.map((r) => <tr key={r.id}><td className="tok">{r.stu}</td><td>{r.field}</td><td style={{ fontWeight: 600 }}>{r.sis}</td><td>{r.sem}</td><td className="num">{r.age}d</td><td><div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}><N.Button size="sm" onClick={() => act(r.id, 'sis')}>Accept SIS</N.Button><N.Button size="sm" variant="secondary" onClick={() => act(r.id, 'flag')}>SIS is wrong — flag office</N.Button></div></td></tr>)}</tbody></table><p className="muted">Semester never overwrites the SIS. Target: nothing older than 2 business days.</p></div>}</>;
}
function Students() {
  const [id, setId] = React.useState('S-1042');
  const P = { 'S-1042': { year: 'Third-year', credits: 64, window: 'Nov 5 · 8:00', items: [['Advising hold — meet your advisor', '◆ Advising Center', 'bad'], ['BIO 305 needs BIO 201 — override requested', '◆ Registrar · pending', 'warn'], ['Planned courses: 4 of 5', '○ Student plan', '']] }, 'S-2210': { year: 'Second-year', credits: 41, window: 'Nov 6 · 8:00', items: [['No holds', '◆ SIS', 'ok'], ['CHEM 220 needs CHEM 112 — override requested', '◆ Registrar · pending', 'warn'], ['Planned courses: 5 of 5', '○ Student plan', 'ok']] }, 'S-3301': { year: 'Fourth-year', credits: 98, window: 'Nov 4 · 8:00', items: [['Advising hold released Oct 3', '◆ SIS (Semester mismatch under review)', 'ok'], ['Planned courses: 3 of 4', '○ Student plan', '']] } };
  const p = P[id];
  return <><Head k="Student view" title="Look up a student" />
    <div className="banner">Registrar access to this view is logged and appears in the student's access history.</div>
    <div className="two"><div className="card form"><label>Student ID<select value={id} onChange={(e) => setId(e.target.value)}>{Object.keys(P).map((k) => <option key={k}>{k}</option>)}</select></label><table className="tbl"><tbody><tr><td>Class year</td><td>{p.year}</td></tr><tr><td>Credits earned</td><td>{p.credits} <span className="src">◆ SIS</span></td></tr><tr><td>Window</td><td>{p.window} <span className="src">◆ SIS</span></td></tr></tbody></table></div>
      <aside className="stu"><span className="kicker">Exactly what {id} sees on Today</span>{p.items.map(([a, b, c]) => <div className="row" key={a}><span className={c}>{a}</span><span className="src">{b}</span></div>)}<span className="muted">Each item links to the owning office.</span></aside></div></>;
}
function Outreach({ S, set, arg }) {
  const [hid, setHid] = React.useState(arg || 'adv'); const h = S.holds.find((x) => x.id === hid);
  const [msg, setMsg] = React.useState(''); const [when, setWhen] = React.useState('Tomorrow 9:00');
  React.useEffect(() => { setMsg('Registration for ' + TERM.name + ' opens ' + TERM.opens + '. You have a ' + h.office.toLowerCase() + ' hold. ' + h.path + '. Questions? Contact ' + h.owner + '.'); }, [hid]);
  const optedOut = Math.round(h.n * 0.04); const send = h.n - optedOut; const needsApproval = send > 200;
  const request = () => set((s) => ({ ...s, pending: { id: 'OUT-' + Date.now().toString(36).slice(-4), office: h.office, n: send, msg, when, by: 'Registrar (you)' }, audit: [{ at: now(), a: 'outreach.requested', t: h.office + ' ×' + send, by: 'Registrar (you)' }, ...s.audit] }));
  const approve = () => set((s) => ({ ...s, sends: [{ ...s.pending, approvedBy: 'Associate Registrar' }, ...s.sends], pending: null, audit: [{ at: now(), a: 'outreach.approved', t: s.pending.id, by: 'Associate Registrar' }, ...s.audit] }));
  return <><Head k="Outreach" title="Remind students" />
    <div className="two"><div className="card form"><label>Audience<select value={hid} onChange={(e) => setHid(e.target.value)}>{S.holds.map((x) => <option key={x.id} value={x.id}>{x.office} hold ({x.n})</option>)}</select></label><label>Message<textarea value={msg} onChange={(e) => setMsg(e.target.value)} style={{ minHeight: 110 }} /></label><label>Send<select value={when} onChange={(e) => setWhen(e.target.value)}><option>Tomorrow 9:00</option><option>Now</option><option>Oct 20, 9:00</option></select></label>
      {!S.pending ? <N.Button disabled={!msg.trim()} onClick={request}>{needsApproval ? 'Request approval to send' : 'Send'}</N.Button> : <div className="banner"><b>{S.pending.id}</b> waiting for a second approver ({S.pending.n} students). <N.Button size="sm" onClick={approve}>Approve as Associate Registrar (demo)</N.Button></div>}</div>
      <aside className="card"><h3>Impact preview</h3><p style={{ margin: 0 }}>{send} students receive this · {optedOut} opted out of non-required messages are skipped.</p>{needsApproval && <p className="warn" style={{ margin: 0 }}>Over 200 recipients — needs a second approver (requester can't approve).</p>}<p className="muted">Channels follow each student's notification settings. No balances, reason codes or health details in messages.</p>{S.sends.length > 0 && <><div className="kicker">Sent / scheduled</div>{S.sends.map((x) => <p key={x.id} style={{ margin: 0, fontSize: 14 }}>{x.id} · {x.office} · {x.n} · {x.when} · approved by {x.approvedBy}</p>)}</>}</aside></div></>;
}
function Metrics({ S }) {
  const ready = pct(S.counts.ready, TERM.total);
  return <><Head k="Pilot metrics" title="Pilot measures" />
    <div className="banner">Sample data. Measures, baseline and reporting are agreed with the pilot sponsor before launch; only approved aggregates leave the institution.</div>
    <div className="grid"><div className="card"><span className="muted">Students ready at window open</span><b style={{ font: '700 32px var(--font-heading)' }}>{ready}%</b><span className="muted">Baseline (last spring, from SIS): 49.0% · target agreed with sponsor</span></div><div className="card"><span className="muted">Median days a hold stays open</span><b style={{ font: '700 32px var(--font-heading)' }}>14</b><span className="muted">Baseline: 22</span></div><div className="card"><span className="muted">Registration-day help-desk tickets</span><b style={{ font: '700 32px var(--font-heading)' }}>—</b><span className="muted">Measured on Nov 4–7</span></div></div></>;
}
function Audit({ S }) {
  return <><Head k="Audit" title="Audit trail" /><div className="card">{S.audit.length ? <table className="tbl"><thead><tr><th>When</th><th>Action</th><th>Target</th><th>By</th></tr></thead><tbody>{S.audit.map((a, i) => <tr key={i}><td className="muted">{a.at.slice(11, 19)}</td><td className="tok">{a.a}</td><td>{a.t}{a.note ? ' — ' + a.note : ''}</td><td>{a.by}</td></tr>)}</tbody></table> : <p className="muted">No actions yet in this session.</p>}</div></>;
}
function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } })();
  const [S, set] = React.useState(saved && saved.S ? saved.S : fresh()); const [v, setV] = React.useState(saved && saved.v || 'overview'); const [arg, setArg] = React.useState(null);
  React.useEffect(() => { localStorage.setItem(KEY, JSON.stringify({ S, v })); }, [S, v]);
  React.useEffect(() => { const s = document.querySelector('.scroll'); if (s) s.scrollTop = 0; }, [v]);
  const go = (x, a) => { setArg(a || null); setV(x); };
  const T = [['overview', 'Readiness', 'today'], ['holds', 'Holds by office', 'spam'], ['overrides', 'Overrides', 'check'], ['tickets', 'Time tickets', 'runway'], ['reconcile', 'Reconciliation', 'connect'], ['students', 'Student view', 'sources'], ['outreach', 'Outreach', 'ask'], ['metrics', 'Pilot metrics', 'analyse'], ['audit', 'Audit', 'pane']];
  const cur = T.find((t) => t[0] === v) || T[0]; const P = { S, set, go, arg };
  const view = { overview: <Overview {...P} />, holds: <Holds {...P} />, overrides: <Overrides {...P} />, tickets: <Tickets {...P} />, reconcile: <Reconcile {...P} />, students: <Students />, outreach: <Outreach key={arg || 'x'} {...P} />, metrics: <Metrics {...P} />, audit: <Audit {...P} /> }[v];
  return <div className="shell"><N.SideRail current={v} onNavigate={(x) => go(x)} groups={[{ label: 'Registrar · ' + TERM.name, items: T.map(([id, label, icon]) => ({ id, label, icon })) }]} foot={<button onClick={() => { set(fresh()); go('overview'); }} style={{ all: 'unset', cursor: 'pointer', fontSize: 12, color: 'var(--chrome-text-secondary)' }}>Reset sample data</button>} />
    <div className="main"><N.SystemContextBar location={'Registrar · ' + cur[1]} term={TERM.name} sync="device-only" /><div className="scroll"><div className="page">{view}</div></div></div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
