<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><script src="../platform/appearance.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><title>Semester — Company workflows</title>
<style>
body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}
.top{display:flex;align-items:center;gap:18px;padding:0 18px;background:#090a0e;color:#eceef2;min-height:48px;flex-wrap:wrap}.tt{font-family:var(--font-heading);font-weight:600;font-size:16px}
.page{max-width:1240px;margin:0 auto;padding:24px 20px 64px;display:grid;gap:18px}
h1{margin:4px 0 0;font-family:var(--font-heading);font-weight:600;font-size:28px;letter-spacing:-.015em;line-height:1.15;text-wrap:pretty}.h2{margin:2px 0 4px;font-family:var(--font-heading);font-weight:600;font-size:21px}
.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);line-height:1.4}.muted{color:var(--text-secondary);font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px;align-items:start}
.card{border:1px solid var(--border-default);border-radius:6px;padding:14px 16px;display:grid;gap:10px;background:var(--surface-base);min-width:0}.card>*{min-width:0}
.seg-field{display:grid;gap:4px;justify-items:start;min-width:0}.seg-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}
.scrollx{overflow-x:auto}.lanes{display:grid;min-width:max-content}
.lh{font-size:12px;font-weight:600;padding:10px 8px;border-top:1px solid var(--border-subtle);background:var(--surface-canvas);position:sticky;left:0;z-index:1}
.lc{border-top:1px solid var(--border-subtle);border-left:1px dashed var(--border-subtle);padding:6px;min-height:58px}
.node{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:3px;width:100%;padding:7px 8px;border:1px solid var(--border-default);border-radius:3px;background:var(--surface-base);font-size:12.5px;line-height:1.3}
.node:hover{border-color:var(--border-strong)}.node[aria-pressed=true]{border-color:var(--action-primary);background:var(--action-secondary);font-weight:500}.node[data-done]{border-left:3px solid var(--status-success-line)}.node:focus-visible{outline:2px solid var(--action-primary);outline-offset:2px}
.ni{font-size:10.5px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}.nd{font-size:11px;color:var(--text-link)}
.cl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
</style></head>
<body><div id="root"></div>
<script src="cwf-data.js"></script>
<script type="text/babel" src="Workflows.jsx"></script>
</body></html>
