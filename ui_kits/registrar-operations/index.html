<!-- @dsCard group="Product domains" viewport="1280x880" name="Registrar operations workbench" subtitle="Area I of the registrar register, designed end to end on one shared record: unified work queue with office and person ownership, service targets, approvals with delegation, reconciliation, policy exceptions, data correction (two-person), disclosure-controlled messages, report definitions, audit trail, term open/close and year-end archival" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><title>Semester — Registrar operations</title>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}.rail{background:var(--surface-base);border-right:1px solid var(--border-subtle);padding:14px 8px;display:grid;gap:2px;align-content:start}.rail button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:14px;color:var(--text-primary)}.rail button[aria-current=page]{background:var(--surface-raised);font-weight:600}.rail button:focus-visible,.btn:focus-visible{outline:2px solid var(--action-primary)}.main{padding:20px 26px 56px;display:grid;gap:14px;align-content:start;min-width:0}h1{margin:0;font-size:22px}h2{margin:0;font-size:16px}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px}.sm{font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{border:1px solid var(--border-subtle);border-radius:8px;padding:14px;background:var(--surface-base);display:grid;gap:8px;align-content:start;min-width:0}.ox{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--border-subtle);font-size:13px;text-align:left;vertical-align:top}th{font-size:11px;color:var(--text-secondary);font-weight:600}.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border-subtle);white-space:nowrap}.ok{color:var(--status-success);border-color:currentColor}.bad{color:var(--status-danger);border-color:currentColor}.warn{color:var(--status-pending);border-color:currentColor}.btn{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;border:1px solid var(--border-subtle);font-size:13px;background:var(--surface-base);color:var(--text-primary)}.btn.p{background:var(--action-primary);color:var(--text-on-action,#fff);border-color:var(--action-primary)}input,select,textarea{font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-base);color:var(--text-primary)}label.f{display:grid;gap:3px;font-size:12px;color:var(--text-secondary)}.note{border-left:3px solid var(--status-pending);padding:8px 10px;font-size:13px;background:var(--surface-raised);color:var(--text-primary)}.note.bad{border-left-color:var(--status-danger)}.note.ok{border-left-color:var(--status-success)}</style></head>
<body><div class="app"><nav class="rail" id="rail" aria-label="Registrar operations"></nav><main class="main" id="main" aria-live="polite"></main></div>
<script>
const KEY='sem-reg-ops',esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const NOW=Date.parse('2026-10-14T15:00:00');const H=36e5;
const S0={me:'L. Park',page:'I01',items:[
 {id:'RQ-101',kind:'Readiness review',student:'Demo student A',office:'Registrar',person:'L. Park',opened:NOW-30*H,target:48,state:'Open'},
 {id:'RQ-102',kind:'Hold release request',student:'Demo student B',office:'Bursar',person:null,opened:NOW-60*H,target:48,state:'Open'},
 {id:'RQ-103',kind:'Grade correction',student:'Demo student A',office:'Registrar',person:'M. Ito',opened:NOW-10*H,target:72,state:'Awaiting approval'},
 {id:'RQ-104',kind:'Prerequisite exception',student:'Demo student C',office:'Registrar',person:null,opened:NOW-90*H,target:72,state:'Open'},
 {id:'RQ-105',kind:'Data correction',student:'Demo student D',office:'Registrar',person:'L. Park',opened:NOW-4*H,target:24,state:'Open'}],
 deleg:[],recon:[{id:'REC-7',field:'Hold 77 status',semester:'active',source:'cleared',sourceAt:'2026-10-14 09:12',state:'Open'},{id:'REC-8',field:'CHEM 2210 seats',semester:'2',source:'0',sourceAt:'2026-10-14 08:40',state:'Open'}],
 exc:[{id:'EX-21',rule:'CHEM 2210 prerequisite',student:'Demo student C',why:'Equivalent course at Nashville State',by:'Advisor K. Brown',state:'Requested',expires:'2026-12-18'}],
 corr:[],msgs:[],term:{},year:{},audit:[]};
let S={...S0,...JSON.parse(localStorage.getItem(KEY)||'{}')};const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const log=(what,ref)=>{S.audit.unshift({at:new Date().toISOString().slice(0,16).replace('T',' '),who:S.me,what,ref})};
const OFFICES={'Registrar':['L. Park','M. Ito'],'Bursar':['R. Singh'],'Advising':['K. Brown']};
const DIRHOLD={'Demo student B':true};
const PAGES=[['I01','Unified work queue'],['I02','Office and person ownership'],['I03','Service targets'],['I04','Approvals and delegation'],['I05','Reconciliation workbench'],['I06','Policy exceptions'],['I07','Data correction workbench'],['I08','Disclosure-controlled communication'],['I09','Reporting definitions'],['I10','Audit and evidence'],['I11','Term open and close'],['I12','Year-end and archival']];
const age=i=>(NOW-i.opened)/H, sla=i=>{const a=age(i),t=i.target;return a>t?['bad','Past target by '+Math.round(a-t)+' h']:a>t*0.75?['warn',Math.round(t-a)+' h left']:['ok',Math.round(t-a)+' h left']};
const authority=(who,act)=>{const d=S.deleg.find(d=>d.to===who&&d.act===act&&d.until>=new Date(NOW).toISOString().slice(0,10));return who==='L. Park'||!!d};
function I01(){return '<div class="card ox"><table><thead><tr><th>Ref</th><th>Work</th><th>Student</th><th>Office · person</th><th>Target</th><th>State</th><th></th></tr></thead><tbody>'+S.items.map(i=>{const s=sla(i);return '<tr><td><b>'+i.id+'</b></td><td>'+i.kind+'</td><td>'+i.student+'</td><td>'+i.office+' · '+(i.person||'<span class="chip warn">unassigned</span>')+'</td><td><span class="chip '+s[0]+'">'+s[1]+'</span></td><td>'+i.state+'</td><td>'+(i.state!=='Done'?'<button class="btn" data-done="'+i.id+'">Complete</button>':'')+'</td></tr>'}).join('')+'</tbody></table><span class="muted">One queue across offices; each item stays owned by an office and, once taken, a person. Completing needs a resolution code (prompt).</span></div>'}
function I02(){return '<div class="card ox"><table><thead><tr><th>Ref</th><th>Owning office</th><th>Person</th><th></th></tr></thead><tbody>'+S.items.map(i=>'<tr><td><b>'+i.id+'</b> · '+i.kind+'</td><td><select data-off="'+i.id+'">'+Object.keys(OFFICES).map(o=>'<option'+(o===i.office?' selected':'')+'>'+o+'</option>').join('')+'</select></td><td><select data-per="'+i.id+'"><option value="">Unassigned</option>'+OFFICES[i.office].map(p=>'<option'+(p===i.person?' selected':'')+'>'+p+'</option>').join('')+'</select></td><td>'+(i.person?'':'<button class="btn" data-take="'+i.id+'">Take it</button>')+'</td></tr>').join('')+'</tbody></table><span class="muted">Moving an item to another office clears its person; the office decides who takes it. Every change is in the audit trail.</span></div>'}
function I03(){const by={};S.items.forEach(i=>{const s=sla(i)[0];by[i.kind]=by[i.kind]||{ok:0,warn:0,bad:0,t:i.target};by[i.kind][s]++});return '<div class="card ox"><table><thead><tr><th>Work type</th><th>Target (h)</th><th>On track</th><th>At risk</th><th>Past</th></tr></thead><tbody>'+Object.entries(by).map(([k,v])=>'<tr><td>'+k+'</td><td><input type="number" min="1" data-tg="'+esc(k)+'" value="'+v.t+'" style="width:70px" aria-label="Target hours for '+esc(k)+'"></td><td>'+v.ok+'</td><td>'+v.warn+'</td><td>'+v.bad+'</td></tr>').join('')+'</tbody></table><span class="muted">Targets are set per work type by the office, not by Semester. Changing a target applies to open items immediately and is logged.</span></div>'}
function I04(){return '<div class="card"><h2>Delegations</h2>'+(S.deleg.length?S.deleg.map((d,k)=>'<div class="row sm">'+d.from+' → <b>'+d.to+'</b> may '+d.act+' until '+d.until+' <button class="btn" data-undel="'+k+'">Revoke</button></div>').join(''):'<span class="muted">None.</span>')+'<div class="row"><label class="f">To<select id="dto"><option>M. Ito</option></select></label><label class="f">Action<select id="dact"><option>approve grade corrections</option><option>approve data corrections</option></select></label><label class="f">Until<input id="dun" type="date"></label><button class="btn p" id="dadd">Delegate</button></div><span class="muted">Delegations are time-bound and can’t be re-delegated. A delegate still can’t approve their own request.</span></div>'}
function I05(){return '<div class="card ox"><table><thead><tr><th>Case</th><th>Field</th><th>Semester shows</th><th>Source of record</th><th>State</th><th></th></tr></thead><tbody>'+S.recon.map(r=>'<tr><td><b>'+r.id+'</b></td><td>'+r.field+'</td><td>'+r.semester+'</td><td>'+r.source+' <span class="muted">('+r.sourceAt+')</span></td><td><span class="chip '+(r.state==='Resolved'?'ok':'warn')+'">'+r.state+'</span></td><td>'+(r.state==='Open'?'<button class="btn" data-rec="'+r.id+'">Accept source</button>':'')+'</td></tr>').join('')+'</tbody></table><span class="muted">The source of record wins. Accepting supersedes Semester’s copy with a reason; it never edits the source.</span></div>'}
function I06(){return '<div class="card ox"><table><thead><tr><th>Ref</th><th>Rule</th><th>Student</th><th>Reason</th><th>Requested by</th><th>Expires</th><th>State</th><th></th></tr></thead><tbody>'+S.exc.map(e=>'<tr><td><b>'+e.id+'</b></td><td>'+e.rule+'</td><td>'+e.student+'</td><td>'+esc(e.why)+'</td><td>'+e.by+'</td><td>'+e.expires+'</td><td><span class="chip '+(e.state==='Approved'?'ok':e.state==='Denied'?'bad':'warn')+'">'+e.state+'</span></td><td>'+(e.state==='Requested'?'<button class="btn" data-ex="'+e.id+'|Approved">Approve</button> <button class="btn" data-ex="'+e.id+'|Denied">Deny</button>':'')+'</td></tr>').join('')+'</tbody></table><span class="muted">An exception names one rule, one student, one term and an expiry. It never changes the rule.</span></div>'}
function I07(){return '<div class="card"><h2>Request a correction</h2><div class="row"><label class="f">Student<select id="cst"><option>Demo student D</option><option>Demo student A</option></select></label><label class="f">Field<select id="cfd"><option>Preferred name</option><option>Program of study</option><option>Residency</option></select></label><label class="f">New value<input id="cnv"></label><label class="f">Evidence<input id="cev" placeholder="document reference"></label><button class="btn p" id="cadd">Submit</button></div></div><div class="card ox"><table><thead><tr><th>Ref</th><th>Change</th><th>Requested by</th><th>State</th><th></th></tr></thead><tbody>'+(S.corr.map(c=>'<tr><td><b>'+c.id+'</b></td><td>'+c.student+' · '+c.field+' → '+esc(c.nv)+'</td><td>'+c.by+'</td><td><span class="chip '+(c.state==='Applied'?'ok':'warn')+'">'+c.state+'</span></td><td>'+(c.state==='Awaiting approval'?'<button class="btn" data-capp="'+c.id+'">Approve as '+S.me+'</button>':'')+'</td></tr>').join('')||'<tr><td colspan="5" class="muted">None.</td></tr>')+'</tbody></table><div class="row"><span class="muted">Acting as</span><select id="me"><option'+(S.me==='L. Park'?' selected':'')+'>L. Park</option><option'+(S.me==='M. Ito'?' selected':'')+'>M. Ito</option></select><span class="muted">Two people: the requester can’t approve; M. Ito needs a delegation (I04).</span></div><div id="cerr"></div></div>'}
function I08(){return '<div class="card"><h2>Message a student or a third party</h2><div class="row"><label class="f">About<select id="mst"><option>Demo student A</option><option>Demo student B</option></select></label><label class="f">Recipient<select id="mto"><option value="student">The student</option><option value="third">Parent or third party</option></select></label><label class="f">Content<select id="mct"><option value="directory">Directory information only</option><option value="record">Education record detail</option></select></label><button class="btn p" id="msend">Check and send</button></div><div id="mres"></div><span class="muted">Sending to anyone but the student needs written consent on file or a listed exception. A directory-information hold blocks even directory details. Every disclosure is recorded.</span></div><div class="card"><h2>Disclosure record</h2>'+(S.msgs.map(m=>'<div class="sm">'+m.at+' · '+m.st+' → '+m.to+' · '+m.ct+' · <b>'+m.res+'</b></div>').join('')||'<span class="muted">None.</span>')+'</div>'}
const RDEF=[['Headcount','students with ≥1 active enrollment on census date','census-date snapshot','Registrar'],['Unresolved holds','active holds at period end','holds table, owner office','Registrar + Bursar'],['Queue time','opened → done, median by work type','work queue','Registrar'],['Exceptions granted','approved exceptions by rule and term','exception register','Registrar']];
function I09(){return '<div class="card ox"><table><thead><tr><th>Report</th><th>Definition</th><th>Source + snapshot</th><th>Owner</th></tr></thead><tbody>'+RDEF.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>').join('')+'</tbody></table><span class="muted">A figure shown anywhere names its definition and snapshot. Cells under 10 show “fewer than 10”.</span></div>'}
function I10(){return '<div class="card"><h2>Audit trail</h2>'+(S.audit.slice(0,30).map(a=>'<div class="sm"><span class="muted">'+a.at+'</span> · '+a.who+' · '+esc(a.what)+(a.ref?' · '+a.ref:'')+'</div>').join('')||'<span class="muted">Act on any page to create entries.</span>')+'<div class="row"><button class="btn" id="aexp">Export evidence (CSV)</button></div><span class="muted">Append-only. Export is itself recorded.</span></div>'}
const TERM=[['Calendar and parts of term published','calendar'],['Schedule published','schedule'],['Registration windows set','windows'],['Census date snapshot taken','census'],['Grades posted','grades'],['Incompletes recorded with deadlines','inc'],['Academic standing run','standing'],['Term closed (no further routine changes)','close']];
function seq(list,store,name){const st=S[store];const nx=list.findIndex(x=>!st[x[1]]);return '<div class="card"><h2>'+name+'</h2>'+list.map((x,k)=>'<label class="row sm" style="opacity:'+(nx>=0&&k>nx?.5:1)+'"><input type="checkbox" data-sq="'+store+'|'+x[1]+'"'+(st[x[1]]?' checked':'')+(nx>=0&&k>nx?' disabled':'')+'> '+(k+1)+'. '+x[0]+'</label>').join('')+'<span class="muted">Steps run in order. After close, changes go through grade-change or data-correction requests.</span></div>'}
const YEAR=[['All terms closed','terms'],['Degrees conferred for the year','conferral'],['Record snapshot sealed','snapshot'],['Retention schedule applied','retention'],['Legal holds checked before any deletion','holds'],['Archive verified (restore test)','verify']];
function draw(){document.getElementById('rail').innerHTML='<div class="kicker" style="padding:4px 10px 10px">Registrar operations · area I</div>'+PAGES.map(([k,l])=>'<button data-pg="'+k+'"'+(S.page===k?' aria-current="page"':'')+'>'+k+' · '+l+'</button>').join('')+'<button class="btn" id="rst" style="margin:12px 10px 0">Reset demo</button>';
 const T=PAGES.find(p=>p[0]===S.page);document.getElementById('main').innerHTML='<div><div class="kicker">'+T[0]+' · Demo University · sample data</div><h1>'+T[1]+'</h1></div>'+({I01,I02,I03,I04,I05,I06,I07,I08,I09,I10,I11:()=>seq(TERM,'term','Fall 2026 term'),I12:()=>seq(YEAR,'year','2026–27 year end')})[S.page]();bind();save()}
function bind(){const $=q=>document.querySelectorAll(q),g=id=>document.getElementById(id);$('[data-pg]').forEach(b=>b.onclick=()=>{S.page=b.dataset.pg;draw()});g('rst').onclick=()=>{S=JSON.parse(JSON.stringify(S0));draw()};
 $('[data-done]').forEach(b=>b.onclick=()=>{const c=prompt('Resolution code (e.g. resolved, routed, no action)');if(!c)return;const i=S.items.find(x=>x.id===b.dataset.done);i.state='Done';log('Completed '+i.kind+' — '+c,i.id);draw()});
 $('[data-off]').forEach(s=>s.onchange=()=>{const i=S.items.find(x=>x.id===s.dataset.off);i.office=s.value;i.person=null;log('Moved to '+s.value,i.id);draw()});
 $('[data-per]').forEach(s=>s.onchange=()=>{const i=S.items.find(x=>x.id===s.dataset.per);i.person=s.value||null;log('Assigned to '+(s.value||'nobody'),i.id);draw()});
 $('[data-take]').forEach(b=>b.onclick=()=>{const i=S.items.find(x=>x.id===b.dataset.take);if(!OFFICES[i.office].includes(S.me)){alert(S.me+' isn’t in '+i.office+'.');return}i.person=S.me;log('Took',i.id);draw()});
 $('[data-tg]').forEach(n=>n.onchange=()=>{S.items.filter(i=>i.kind===n.dataset.tg).forEach(i=>i.target=Math.max(1,+n.value));log('Target for '+n.dataset.tg+' → '+n.value+' h');draw()});
 if(g('dadd'))g('dadd').onclick=()=>{if(!g('dun').value){alert('Set an end date.');return}S.deleg.push({from:'L. Park',to:g('dto').value,act:g('dact').value,until:g('dun').value});log('Delegated '+g('dact').value+' to '+g('dto').value+' until '+g('dun').value);draw()};
 $('[data-undel]').forEach(b=>b.onclick=()=>{const d=S.deleg.splice(+b.dataset.undel,1)[0];log('Revoked delegation to '+d.to);draw()});
 $('[data-rec]').forEach(b=>b.onclick=()=>{const r=S.recon.find(x=>x.id===b.dataset.rec);const w=prompt('Reason for accepting the source value');if(!w)return;r.semester=r.source;r.state='Resolved';log('Accepted source for '+r.field+' — '+w,r.id);draw()});
 $('[data-ex]').forEach(b=>b.onclick=()=>{const [id,st]=b.dataset.ex.split('|');const e=S.exc.find(x=>x.id===id);e.state=st;log(st+' exception for '+e.rule,id);draw()});
 if(g('me'))g('me').onchange=e=>{S.me=e.target.value;draw()};
 if(g('cadd'))g('cadd').onclick=()=>{if(!g('cnv').value.trim()||!g('cev').value.trim()){g('cerr').innerHTML='<div class="note bad">Add the new value and the evidence.</div>';return}const id='DC-'+(S.corr.length+1);S.corr.push({id,student:g('cst').value,field:g('cfd').value,nv:g('cnv').value.trim(),ev:g('cev').value.trim(),by:S.me,state:'Awaiting approval'});log('Requested correction '+g('cfd').value,id);draw()};
 $('[data-capp]').forEach(b=>b.onclick=()=>{const c=S.corr.find(x=>x.id===b.dataset.capp);if(c.by===S.me){g('cerr').innerHTML='<div class="note bad">You requested this one — a second person has to approve it.</div>';return}if(!authority(S.me,'approve data corrections')){g('cerr').innerHTML='<div class="note bad">'+S.me+' has no authority to approve data corrections. Ask L. Park for a delegation (I04).</div>';return}c.state='Applied';log('Approved + applied '+c.field+' (previous value kept as history)',c.id);draw()});
 if(g('msend'))g('msend').onclick=()=>{const st=g('mst').value,to=g('mto').value,ct=g('mct').value;let res;if(to==='student')res='Sent';else if(DIRHOLD[st])res='Blocked — directory-information hold';else if(ct==='record')res='Blocked — no written consent on file';else res='Sent (directory information)';S.msgs.unshift({at:new Date().toISOString().slice(11,16),st,to:to==='student'?'student':'third party',ct:ct==='record'?'education record':'directory info',res});log('Disclosure check: '+res,st);draw()};
 if(g('aexp'))g('aexp').onclick=()=>{const csv='at,who,what,ref\n'+S.audit.map(a=>[a.at,a.who,'"'+a.what.replace(/"/g,'""')+'"',a.ref||''].join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='registrar-audit.csv';a.click();log('Exported audit evidence');save()};
 $('[data-sq]').forEach(c=>c.onchange=()=>{const [st,k]=c.dataset.sq.split('|');S[st][k]=c.checked;log((c.checked?'Completed ':'Reopened ')+k,st);draw()})}
draw();
</script></body></html>
