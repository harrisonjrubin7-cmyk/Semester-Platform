<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><script src="../platform/appearance.js"></script><title>Semester — Developer portal</title>
<style>body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}.side{background:var(--surface-base);border-right:1px solid var(--border-subtle);padding:16px 10px;display:grid;gap:3px;align-content:start}.side button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-size:14px;display:flex;gap:8px;align-items:center}.side button[aria-current=page]{background:var(--surface-raised);font-weight:600}.side button:focus-visible,.btn:focus-visible{outline:2px solid var(--action-primary)}.n{font-size:11px;color:var(--text-secondary);min-width:16px}.main{padding:20px 28px 64px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;min-width:0}h1{margin:0;font-size:24px}h2{margin:0;font-size:17px}h3{margin:0;font-size:14px}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px}.sm{font-size:13px}.mono{font-family:var(--font-mono);font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:16px}@media(max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}.card{border:1px solid var(--border-subtle);border-radius:8px;padding:14px;background:var(--surface-base);display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start;min-width:0}.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border-subtle);white-space:nowrap}.ok{color:var(--status-success);border-color:currentColor}.bad{color:var(--status-danger);border-color:currentColor}.warn{color:var(--status-pending);border-color:currentColor}.btn{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;border:1px solid var(--border-subtle);font-size:13px;background:var(--surface-base);justify-self:start}.btn.p{background:var(--action-primary);color:var(--text-on-action,#fff);border-color:var(--action-primary)}.btn[disabled]{opacity:.45;cursor:not-allowed}input,select,textarea{font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--surface-base);color:var(--text-primary)}label.f{display:grid;gap:3px;font-size:12px;color:var(--text-secondary)}.note{border-left:3px solid var(--status-pending);padding:8px 10px;font-size:13px;background:var(--surface-raised);color:var(--text-primary)}.note.bad{border-left-color:var(--status-danger)}.note.ok{border-left-color:var(--status-success)}.ox{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--border-subtle);font-size:13px;text-align:left;vertical-align:top}th{font-size:11px;color:var(--text-secondary);font-weight:600}.states{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}@media(max-width:700px){.states{grid-template-columns:minmax(0,1fr)}}.state{border:1px solid var(--border-subtle);border-radius:6px;padding:8px}.layer{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;font-size:13px;padding:3px 0}pre{margin:0;white-space:pre-wrap;font-family:var(--font-mono);font-size:12px;background:var(--surface-raised);padding:10px;border-radius:6px}</style></head>
<body><div class="app"><nav class="side" id="nav" aria-label="Developer portal"></nav><main class="main" id="main" tabindex="-1"></main></div>
<script src="reference.js"></script><script>
const KEY='sem-devportal',esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const PERMS=[{k:'deadlines.read',cap:'Read approved assignment deadlines',purpose:'Synchronize a student’s authorized planning view',data:'Assignment identifier, deadline, course reference',ex:'Grades, submissions, private notes',auth:'Institution installation + the student’s consent',dur:'90 days, renewable',rev:'Access stops; downstream deletion job starts',risk:'low'},{k:'tasks.write',cap:'Create tasks in a student’s Action Center',purpose:'Add study reminders the student asked for',data:'Task title (student-entered), due date, source link',ex:'Anything about other students',auth:'The student’s consent',dur:'Until revoked',rev:'New writes refused; existing tasks stay, labelled with the app',risk:'medium'},{k:'grades.read',cap:'Read released course grades',purpose:'Show grade trends',data:'Released grade, course, term',ex:'Unreleased grades, instructor comments',auth:'Institution installation + named approver + student consent',dur:'30 days',rev:'Access stops; export + deletion confirmation required',risk:'high'}];
const SCEN=[['Two tenants share an external course id','Isolation'],['Course moved to a new section mid-term','Change'],['Two sources disagree on a deadline','Conflict'],['Student withdrew; membership inactive','Membership'],['Source record missing and stale','Freshness'],['Deadline across a daylight-saving change','Time'],['Webhook delivered twice and out of order','Delivery'],['Grant revoked while a job is queued','Revocation'],['Connector down for 40 minutes','Outage'],['Import half-applied, then failed','Reconciliation']];
const REVIEW=['Functional contract conformance','Tenant isolation','Permission enforcement','Credential handling','Data minimization and retention','Accessibility','Failure recovery and reconciliation','Support and incident readiness','Export and deletion','AI restrictions (if applicable)'];
const S0={step:0,app:null,perms:{'deadlines.read':true},sandbox:false,fixtures:'v3',scen:{},calls:[],grant:'active',hooks:[],queue:[],diag:null,review:{},release:'draft',install:'none',log:[]};
let S={...S0,...JSON.parse(localStorage.getItem(KEY)||'{}')};{const RM={'approved (r2)':'certified','submitted (r2)':'submitted','none':'draft'},IM={'consent collected':'approved','mappings validated':'approved','reconciled':'pilot','production-enabled':'enabled'};if(RM[S.release])S.release=RM[S.release];if(IM[S.install])S.install=IM[S.install];}const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const L=t=>S.log.unshift([new Date().toLocaleTimeString(),t]);
const appState=()=>!S.app?'draft':S.suspended?'suspended':S.install==='enabled'?'active':S.sandbox?'sandbox-enabled':'draft';
const STEPS=[['create','Create application'],['perms','Declare permissions'],['sandbox','Synthetic sandbox'],['explorer','First request'],['events','Events & webhooks'],['diag','Diagnose a failure'],['revoke','Revoke the grant'],['review','Evidence-bound review'],['activate','Institutional activation']];
function tasks(){const t=[];if(!S.app)t.push(['Create your first application','create']);else{if(!S.sandbox)t.push(['Provision a synthetic sandbox','sandbox']);if(S.hooks.some(h=>h.st==='failing'))t.push(['A webhook subscription is failing','events']);if(S.hooks.some(h=>h.st==='dead'))t.push(['Investigate a dead-lettered delivery','diag']);if(S.review.decision==='changes')t.push(['Resolve review findings','review']);if(S.grant==='expiring')t.push(['A grant expires in 6 days','perms'])}return t}
function nav(){document.getElementById('nav').innerHTML='<div class="kicker" style="padding:4px 10px 10px">Semester developers · sandbox</div>'+STEPS.map(([k,l],i)=>(i===9?'<div class="kicker" style="padding:12px 10px 4px">Reference · Learning Studio</div>':'')+'<button data-s="'+i+'"'+(S.step===i?' aria-current="page"':'')+'><span class="n">'+(i+1)+'</span>'+l+'</button>').join('')+'<div class="card" style="margin-top:12px;padding:10px"><b class="sm">Action Center</b>'+(tasks().map(t=>'<button class="btn" data-go="'+t[1]+'" style="font-size:12px;padding:4px 8px">'+esc(t[0])+'</button>').join('')||'<span class="muted">Nothing needs you.</span>')+'</div><button class="btn" id="rst" style="margin:10px">Reset</button>'}
function header(){return '<div><div class="kicker">'+(S.app?esc(S.app.name)+' · '+esc(S.app.id):'No application yet')+'</div><h1>'+STEPS[S.step][1]+'</h1></div><div class="states"><div class="state"><span class="muted">Application</span><br><b>'+appState()+'</b></div><div class="state"><span class="muted">Release</span><br><b>'+S.release+'</b></div><div class="state"><span class="muted">Installation (Vanderbilt)</span><br><b>'+S.install+'</b></div></div><span class="muted">Three separate lifecycles. App: draft → sandbox-enabled → active → suspended → retired. Release: draft → submitted → changes-required → certified → withdrawn. Installation: requested → approved → pilot → enabled → revoked → offboarded.</span>'}
function vCreate(){if(S.app)return '<div class="card"><h2>'+esc(S.app.name)+'</h2><table><tbody>'+[['Application id',S.app.id+' (immutable)'],['Publisher','Northbeam Study Co. · contacts verified'],['Technical owner',S.app.tech],['Support owner',S.app.support],['Incident contact',S.app.incident],['Educational purpose',S.app.purpose],['Hosting','Northbeam (US-East) · subprocessors: none declared'],['Retention','Deletes synced data 30 days after uninstall']].map(r=>'<tr><td class="muted">'+r[0]+'</td><td>'+esc(r[1])+'</td></tr>').join('')+'</tbody></table><button class="btn p" data-next>Next: declare permissions</button></div>';
 return '<div class="card"><label class="f">Application name<input id="an" value="Study Planner Sync"></label><label class="f">Educational purpose<input id="ap" value="Show a student their authorized deadlines alongside their study plan"></label><div class="row"><label class="f">Technical owner<input id="at" value="dev@northbeam.example"></label><label class="f">Support owner<input id="as" value="support@northbeam.example"></label><label class="f">Incident contact<input id="ai" value="oncall@northbeam.example"></label></div><div class="note">Owning an application doesn’t let you approve its installation at any school. That’s the institution’s decision.</div><button class="btn p" id="mk">Create application</button></div>'}
function vPerms(){return '<div class="card"><h2>Request the minimum</h2><span class="muted">Each permission says what it reads, what it never reads, who must agree, and what happens on revocation. Names are illustrative, not published scopes.</span></div>'+PERMS.map(p=>'<div class="card"><div class="row" style="justify-content:space-between"><label class="row sm"><input type="checkbox" data-pm="'+p.k+'"'+(S.perms[p.k]?' checked':'')+(S.review.submitted?' disabled':'')+'> <b>'+p.cap+'</b></label><span class="chip '+(p.risk==='high'?'bad':p.risk==='medium'?'warn':'ok')+'">'+p.risk+' risk</span></div><table><tbody>'+[['Purpose',p.purpose],['Data',p.data],['Never',p.ex],['Authority',p.auth],['Duration',p.dur],['On revocation',p.rev]].map(r=>'<tr><td class="muted" style="width:120px">'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</tbody></table></div>').join('')+(S.review.submitted?'<div class="note">Permissions are frozen with the submitted release. Adding one needs a new release and a new review — existing grants never expand silently.</div>':'')+'<button class="btn p" data-next>Next: sandbox</button>'}
function vSandbox(){return '<div class="two"><div class="card"><div class="row" style="justify-content:space-between"><h2>Synthetic sandbox</h2>'+(S.sandbox?'<span class="chip ok">provisioned · fixtures '+S.fixtures+'</span>':'')+'</div>'+(S.sandbox?'<table><thead><tr><th>Seeded scenario</th><th>Area</th><th>Your app</th></tr></thead><tbody>'+SCEN.map((s,i)=>'<tr><td>'+s[0]+'</td><td>'+s[1]+'</td><td>'+(S.scen[i]==='pass'?'<span class="chip ok">passed</span>':S.scen[i]==='fail'?'<span class="chip bad">failed</span>':'<button class="btn" data-sc="'+i+'" style="padding:2px 8px">Run</button>')+'</td></tr>').join('')+'</tbody></table><div class="row"><button class="btn" id="reset">Deterministic reset</button><span class="muted">Same fixtures, same ids, every time.</span></div>':'<span class="muted">Two synthetic schools, three terms, 40 students, 12 courses. No real student data, and these credentials can’t reach production.</span><button class="btn p" id="prov">Provision sandbox</button>')+'</div><div class="card"><h3>Differs from production</h3><div class="sm">• No real SIS — sources are simulated and can be made stale or missing<br>• Webhooks deliver to your test endpoint only<br>• Rate limits are lower<br>• Production cloning is off; it needs a separately reviewed process</div></div></div>'+(S.sandbox?'<button class="btn p" data-next>Next: first request</button>':'')}
const LAYERS=['Authenticated principal','Application identity','Environment (sandbox key ↔ sandbox)','Tenant membership or authorized installation','Active permission grant','Resource-level policy','Purpose and data restrictions','Human approval for consequential actions'];
function decide(req){const r=[];r.push([true,'Signed-in student: synthetic-student-07']);r.push([true,S.app?S.app.id:'—']);r.push([req.env==='sandbox','Key environment: sandbox · requested: '+req.env]);r.push([req.tenant==='synthetic-u-a',req.tenant==='synthetic-u-a'?'synthetic-u-a (installed)':'Caller-supplied tenant '+req.tenant+' — not installed; a tenant id in the request is never proof']);r.push([S.grant!=='revoked'&&!!S.perms[req.perm],S.grant==='revoked'?'Grant revoked':S.perms[req.perm]?'Grant '+req.perm+' active':'No grant for '+req.perm]);r.push([req.res!=='other-student','Resource: '+(req.res==='other-student'?'another student’s record':'this student’s course deadlines')]);r.push([req.perm!=='grades.read'||req.purpose,'Purpose: '+(req.purpose?'declared purpose matches':'n/a')]);r.push([req.method==='GET'||req.confirmed,req.method==='GET'?'Read — no approval needed':req.confirmed?'Write confirmed by the user':'Write needs the user to confirm']);const fail=r.findIndex(x=>!x[0]);return {r,fail}}
function vExplorer(){const q=S.req||{method:'GET',path:'/v1/deadlines',perm:'deadlines.read',env:'sandbox',tenant:'synthetic-u-a',res:'own',purpose:true,confirmed:false};const d=decide(q);return '<div class="two"><div class="card"><h2>API explorer</h2><div class="row"><label class="f">Request<select id="rq">'+[['GET /v1/deadlines','deadlines.read'],['POST /v1/tasks','tasks.write'],['GET /v1/grades','grades.read']].map(x=>'<option'+(q.path===x[0].split(' ')[1]?' selected':'')+'>'+x[0]+'</option>').join('')+'</select></label><label class="f">Environment<select id="re"><option'+(q.env==='sandbox'?' selected':'')+'>sandbox</option><option'+(q.env==='production'?' selected':'')+'>production</option></select></label><label class="f">Tenant header<select id="rt"><option'+(q.tenant==='synthetic-u-a'?' selected':'')+'>synthetic-u-a</option><option'+(q.tenant==='synthetic-u-b'?' selected':'')+'>synthetic-u-b</option></select></label><label class="f">Resource<select id="rr"><option value="own"'+(q.res==='own'?' selected':'')+'>This student</option><option value="other-student"'+(q.res==='other-student'?' selected':'')+'>Another student</option></select></label></div>'+(q.method==='POST'?'<label class="row sm"><input type="checkbox" id="rc"'+(q.confirmed?' checked':'')+'> The student confirmed: “Add 3 study reminders to my Action Center”</label>':'')+'<button class="btn p" id="send">Send</button>'+(S.lastResp?'<pre>'+esc(S.lastResp)+'</pre>':'')+'<span class="muted">Examples use synthetic data only. No live secrets or student records ever appear here.</span></div><div class="card"><h3>Authorization, checked on every request</h3>'+d.r.map((x,i)=>'<div class="layer"><span class="chip '+(i<d.fail||d.fail<0?'ok':i===d.fail?'bad':'')+'">'+(i+1)+'</span><span><b>'+LAYERS[i]+'</b><br><span class="muted">'+esc(x[1])+'</span></span></div>').join('')+'</div></div>'+(S.calls.some(c=>c.ok)?'<button class="btn p" data-next>Next: events</button>':'')}
function vEvents(){return '<div class="two"><div class="card"><h2>Subscription: task.created → https://hooks.northbeam.example/semester</h2><div class="row"><span class="chip '+(S.grant==='revoked'?'bad':'ok')+'">'+(S.grant==='revoked'?'paused — grant revoked':'verified · signing key v2')+'</span><button class="btn" id="ev">Emit a synthetic event</button><button class="btn" id="dup">Deliver it twice</button><button class="btn" id="down">Endpoint returns 503</button></div><div class="ox"><table><thead><tr><th>Event</th><th>Attempt</th><th>Result</th><th>Your receipt</th></tr></thead><tbody>'+(S.hooks.map(h=>'<tr><td class="mono">'+h.id+'</td><td>'+h.att+'</td><td><span class="chip '+(h.st==='delivered'?'ok':h.st==='dead'?'bad':'warn')+'">'+h.st+'</span></td><td>'+esc(h.rcpt||'—')+'</td></tr>').join('')||'<tr><td colspan="4" class="muted">No deliveries yet.</td></tr>')+'</tbody></table></div><span class="muted">Payload: event id, type, resource id and version only. Fetch details through the API, which rechecks authorization.</span></div><div class="card"><h3>Delivery contract</h3><div class="sm">• Duplicates happen — dedupe on the event id<br>• No global ordering — use the resource version<br>• Retries back off; 5 failures park the delivery<br>• Replays recheck the grant first<br>• Destinations are validated: no internal addresses</div></div></div>'+(S.hooks.length?'<button class="btn p" data-next>Next: diagnose</button>':'')}
function vDiag(){const dead=S.hooks.find(h=>h.st==='dead'||h.st==='failing');return '<div class="card"><h2>Diagnostics</h2>'+(dead?'<table><tbody>'+[['Request id','req_8f2c41a9'],['Trace','corr-dev-'+dead.id.slice(-6)],['Classification','destination_unavailable (HTTP 503)'],['Attempts',dead.att+' of 5'],['Request metadata','POST /semester · 412 bytes · content-type application/json'],['Payload','Not shown. Diagnostics never expose payloads.'],['Since release','r2 · 3 failures in 10 min']].map(r=>'<tr><td class="muted" style="width:150px">'+r[0]+'</td><td>'+esc(r[1])+'</td></tr>').join('')+'</tbody></table><div class="row"><button class="btn p" id="retry">Retry now</button><button class="btn" id="recon">Reconcile: list events since last success</button></div>'+(S.diag?'<div class="note '+(S.diag.ok?'ok':'bad')+'">'+esc(S.diag.t)+'</div>':''):'<span class="muted">No failing deliveries. In Events, make the endpoint return 503 to see one.</span>')+'</div><button class="btn p" data-next>Next: revoke</button>'}
function vRevoke(){return '<div class="card"><h2>Revoke the grant</h2><span class="muted">What a student sees when they click “Remove Study Planner Sync” in their account.</span>'+(S.grant==='revoked'?'<table><tbody>'+[['New API requests','Refused (401 grant_revoked)'],['Queued jobs','Cancelled before they run'],['Webhook retries','Stopped; subscription paused'],['Replay','Refused — replay rechecks the grant'],['Synced data at the app','Deletion job opened; app must confirm within 30 days']].map(r=>'<tr><td>'+r[0]+'</td><td><span class="chip ok">'+r[1]+'</span></td></tr>').join('')+'</tbody></table><button class="btn" id="tryafter">Try a request after revocation</button>'+(S.after?'<div class="note bad">'+esc(S.after)+'</div>':''):'<button class="btn p" id="rv">Revoke Study Planner Sync</button>')+'</div>'+(S.grant==='revoked'?'<button class="btn p" data-next>Next: review</button>':'')}
function vReview(){const R=S.review;const done=REVIEW.filter((_,i)=>(R.ev||{})[i]).length;return '<div class="card"><div class="row" style="justify-content:space-between"><h2>Submit release r2 for review</h2><span class="chip">'+done+'/10 with evidence</span></div><span class="muted">Certification binds to this release, its permission set ('+Object.keys(S.perms).filter(k=>S.perms[k]).join(', ')+'), hosting and data practices. A material change reopens review.</span><table><tbody>'+REVIEW.map((r,i)=>'<tr><td>'+(i+1)+'. '+r+'</td><td><input data-rv="'+i+'" value="'+esc((R.ev||{})[i]||(i===1&&S.calls.some(c=>c.fail===3)?'explorer: tenant header refused':i===6&&S.diag&&S.diag.ok?'reconciled after 503':''))+'" placeholder="evidence ref" style="width:220px"'+(R.submitted?' disabled':'')+'></td></tr>').join('')+'</tbody></table>'+(R.submitted?(R.decision?'<div class="note '+(R.decision==='certified'?'ok':'bad')+'">'+(R.decision==='certified'?'Certified for release r2. That doesn’t install it anywhere.':'Changes required: accessibility evidence missing.')+'</div>':'<div class="row"><span class="chip warn">review pending</span><button class="btn" id="dc">Reviewer: certify</button><button class="btn" id="dx">Reviewer: request changes</button></div>'):'<button class="btn p" id="sub"'+(done<8?' disabled title="Attach evidence for at least 8 criteria"':'')+'>Submit for review</button>')+'</div>'+(R.decision==='certified'?'<button class="btn p" data-next>Next: institutional activation</button>':'')}
const ACT=['Submit installation request to Vanderbilt','Institution approval (named approver)','Student consent where required','Validate mappings and source authority','Limited pilot','Reconcile expected vs observed','Enable production within approved limits'];
// Lifecycles (from the portal spec): app draft→sandbox-enabled→active→suspended→retired · release draft→submitted→changes-required→certified→withdrawn · installation requested→approved→pilot→enabled→revoked→offboarded
function vActivate(){const a=S.act||{};const n=ACT.findIndex((_,i)=>!a[i]);return '<div class="card"><h2>Institutional activation</h2>'+ACT.map((x,i)=>'<label class="row sm" style="opacity:'+(n>=0&&i>n?.5:1)+'"><input type="checkbox" data-ac="'+i+'"'+(a[i]?' checked':'')+(n>=0&&i>n?' disabled':'')+(i===1?' title="Only a Vanderbilt approver can tick this"':'')+'> '+(i+1)+'. '+x+'</label>').join('')+'<div class="note">'+(n<0?'Production-enabled for the approved cohort.':'This is the institution’s decision. Certification and accepted terms don’t replace it.')+'</div></div><div class="card"><h3>Activity</h3>'+S.log.slice(0,12).map(l=>'<div class="sm"><span class="muted">'+l[0]+'</span> · '+esc(l[1])+'</div>').join('')+'</div>'}
STEPS.push(...window.DP_REF.steps);const V=[vCreate,vPerms,vSandbox,vExplorer,vEvents,vDiag,vRevoke,vReview,vActivate,...window.DP_REF.views];
function draw(){nav();document.getElementById('main').innerHTML=(S.step<9?header():'<div><div class="kicker">Proposed contract — not a published API</div><h1>'+STEPS[S.step][1]+'</h1></div>')+V[S.step]();bind();if(S.step>=9)window.DP_REF.bind();save()}
window.DP_DRAW=draw;
function bind(){const $=q=>document.querySelectorAll(q),g=id=>document.getElementById(id);
 $('[data-s]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.s;draw();g('main').focus()});$('[data-go]').forEach(b=>b.onclick=()=>{S.step=STEPS.findIndex(s=>s[0]===b.dataset.go);draw()});$('[data-next]').forEach(b=>b.onclick=()=>{S.step=Math.min(8,S.step+1);draw();g('main').focus()});
 if(g('rst'))g('rst').onclick=()=>{if(confirm('Reset the workflow?')){S=JSON.parse(JSON.stringify(S0));draw()}};
 if(g('mk'))g('mk').onclick=()=>{S.app={id:'app_'+Math.random().toString(36).slice(2,10),name:g('an').value.trim()||'Untitled',purpose:g('ap').value,tech:g('at').value,support:g('as').value,incident:g('ai').value};L('Created '+S.app.name);draw()};
 $('[data-pm]').forEach(c=>c.onchange=()=>{S.perms[c.dataset.pm]=c.checked;draw()});
 if(g('prov'))g('prov').onclick=()=>{S.sandbox=true;L('Sandbox provisioned (fixtures v3)');draw()};if(g('reset'))g('reset').onclick=()=>{S.scen={};L('Sandbox reset to fixtures v3');draw()};
 $('[data-sc]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sc;S.scen[i]=i===5?'fail':'pass';L('Scenario: '+SCEN[i][0]+' → '+S.scen[i]);draw()});
 const rd=()=>{const [m,p]=g('rq').value.split(' ');const perm={'/v1/deadlines':'deadlines.read','/v1/tasks':'tasks.write','/v1/grades':'grades.read'}[p];S.req={method:m,path:p,perm,env:g('re').value,tenant:g('rt').value,res:g('rr').value,purpose:true,confirmed:g('rc')?g('rc').checked:false};S.lastResp=null;draw()};['rq','re','rt','rr','rc'].forEach(id=>{if(g(id))g(id).onchange=rd});
 if(g('send'))g('send').onclick=()=>{const q=S.req||{method:'GET',path:'/v1/deadlines',perm:'deadlines.read',env:'sandbox',tenant:'synthetic-u-a',res:'own',purpose:true};const d=decide(q);const codes=[401,401,403,403,403,404,403,409];S.lastResp=d.fail<0?(q.method==='GET'?'200 OK\n{"data":[{"assignmentId":"a-102","due":"2026-11-10T23:59:00-06:00","course":"synthetic-ECON-1020","source":{"system":"synthetic-lms","observedAt":"2026-10-14T12:00:00Z"}}],"requestId":"req_31c0"}':'201 Created\n{"receiptId":"rcpt_77a1","created":3,"requestId":"req_31c1"}'):codes[d.fail]+' '+['unauthenticated','unknown_app','wrong_environment','tenant_not_installed','grant_missing','not_found','purpose_mismatch','confirmation_required'][d.fail]+'\n{"requestId":"req_31c2","explanation":"'+LAYERS[d.fail]+' failed"}';S.calls.push({ok:d.fail<0,fail:d.fail});L(q.method+' '+q.path+' → '+S.lastResp.split('\n')[0]);draw()};
 let n=S.hooks.length;if(g('ev'))g('ev').onclick=()=>{if(S.grant==='revoked'){alert('Subscription paused: the grant is revoked.');return}S.hooks.unshift({id:'evt_'+(1000+n),att:1,st:'delivered',rcpt:'processed'});L('Delivered evt_'+(1000+n));draw()};
 if(g('dup'))g('dup').onclick=()=>{const h=S.hooks[0];if(!h)return;S.hooks.unshift({id:h.id,att:h.att+1,st:'delivered',rcpt:'duplicate — already processed, no second task'});L('Duplicate '+h.id+' deduplicated by event id');draw()};
 if(g('down'))g('down').onclick=()=>{S.hooks.unshift({id:'evt_'+(1000+n),att:5,st:'dead',rcpt:'—'});L('evt_'+(1000+n)+' parked after 5 attempts (503)');draw()};
 if(g('retry'))g('retry').onclick=()=>{const h=S.hooks.find(x=>x.st==='dead');if(S.grant==='revoked'){S.diag={ok:false,t:'Retry refused: the grant was revoked. Replay rechecks authorization.'}}else if(h){h.st='delivered';h.rcpt='processed';h.att+=1;S.diag={ok:true,t:'Delivered on manual retry. Your receipt shows it processed once.'}}L('Manual retry');draw()};
 if(g('recon'))g('recon').onclick=()=>{S.diag={ok:true,t:'Reconciled after 503: 1 event since last success, now delivered; nothing duplicated.'};L('Reconciliation run');draw()};
 if(g('rv'))g('rv').onclick=()=>{S.grant='revoked';L('Grant revoked by synthetic-student-07');draw()};if(g('tryafter'))g('tryafter').onclick=()=>{S.after='401 grant_revoked · req_31d9 — this app no longer has access to this student.';draw()};
 $('[data-rv]').forEach(i=>i.onchange=()=>{S.review.ev={...(S.review.ev||{}),[i.dataset.rv]:i.value};draw()});
 if(g('sub'))g('sub').onclick=()=>{S.review.submitted=true;S.release='submitted';L('Release r2 submitted for review');draw()};
 if(g('dc'))g('dc').onclick=()=>{S.review.decision='certified';S.release='certified';L('Reviewer certified r2');draw()};if(g('dx'))g('dx').onclick=()=>{S.review.decision='changes';S.review.submitted=false;S.release='changes-required';L('Reviewer requested changes');draw()};
 $('[data-ac]').forEach(c=>c.onchange=()=>{S.act={...(S.act||{}),[c.dataset.ac]:c.checked};const k=+c.dataset.ac;S.install=['requested','approved','approved','approved','pilot','pilot','enabled'][k]||S.install;L('Activation: '+ACT[k]);draw()})}
draw();
</script></body></html>
