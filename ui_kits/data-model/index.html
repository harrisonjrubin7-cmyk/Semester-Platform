<style>
body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}
.top{display:flex;align-items:center;gap:18px;padding:0 18px;background:#090a0e;color:#eceef2;min-height:48px;flex-wrap:wrap}.tt{font-family:var(--font-heading);font-weight:600;font-size:16px}
.page{max-width:1280px;margin:0 auto;padding:24px 20px 64px;display:grid;gap:18px}
h1{margin:4px 0 0;font-family:var(--font-heading);font-weight:600;font-size:28px;letter-spacing:-.015em;line-height:1.15;text-wrap:pretty}.h2{margin:0;font-family:var(--font-heading);font-weight:600;font-size:21px;overflow-wrap:anywhere}
.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);line-height:1.4}.muted{color:var(--text-secondary);font-size:13px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}code{font-family:ui-monospace,Menlo,monospace;font-size:12px;overflow-wrap:anywhere}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:14px;min-width:0}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.split{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:14px;align-items:start}@media (max-width:820px){.split{grid-template-columns:1fr}}
.card{border:1px solid var(--border-default);border-radius:6px;padding:14px 16px;display:grid;align-content:start;gap:10px;background:var(--surface-base);min-width:0}.card>*{min-width:0}
.side{position:sticky;top:12px}.tlist{display:grid;max-height:60vh;overflow:auto}
.tlist button{all:unset;cursor:pointer;padding:6px 8px;border-radius:3px;overflow-wrap:anywhere}.tlist button:hover{background:var(--surface-canvas)}.tlist button[aria-current]{background:var(--action-secondary);font-weight:600}.tlist button:focus-visible,.tchip:focus-visible,.lnk:focus-visible{outline:2px solid var(--action-primary);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{all:unset;cursor:pointer;font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:3px 8px;border:1px solid var(--border-default);border-radius:3px;background:var(--surface-base);overflow-wrap:anywhere}.tchip:hover{border-color:var(--border-strong)}
.tchip[data-rw=w]{border-color:var(--action-primary);color:var(--text-link)}.tchip:disabled{cursor:default;opacity:.7}
.lnk{all:unset;cursor:pointer;color:var(--text-link);text-decoration:underline}
.scrollx{overflow-x:auto}table.cols{width:100%;border-collapse:collapse;font-size:13px}table.cols th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);font-weight:600;border-bottom:1px solid var(--border-strong);padding:6px 8px}table.cols td{border-bottom:1px solid var(--border-subtle);padding:6px 8px;vertical-align:top}
ul.plain{margin:0;padding-left:16px;display:grid;gap:3px}
ol.fl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.seg-field{display:grid;gap:4px;justify-items:start;min-width:0}.seg-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}
.cxs{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid}.cxs[data-state=confirmed]{color:var(--status-success);border-color:var(--status-success-line)}.cxs[data-state=blocked]{color:var(--status-danger);border-color:var(--status-danger-line)}
.top .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}@media (max-width:900px){.top .muted{display:none}}
.fhead{display:grid;gap:4px}.fhead b{min-width:0}.fhead code{overflow-wrap:anywhere}
</style></head>
