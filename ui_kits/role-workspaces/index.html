<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><title>Semester — Role workspaces</title>
<style>html,body,#root{height:100%}body{margin:0;overflow:hidden}a{color:var(--text-link)}a:hover{color:var(--text-primary)}.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}.main{display:flex;flex-direction:column;min-width:0;height:100%}.scroll{flex:1;overflow:auto}.page{max-width:1160px;margin:0 auto;padding:22px var(--page-pad) 64px;display:grid;gap:16px}.ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;padding-bottom:14px;border-bottom:1px solid var(--border-subtle)}.ph h1{margin:2px 0 0}.kicker{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}.muted{color:var(--text-secondary);font-size:13px;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.tile{border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);padding:12px 14px;display:grid;gap:2px}.tile b{font:700 24px var(--font-heading);font-variant-numeric:tabular-nums}.card{border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base);padding:14px 16px;display:grid;gap:10px;align-content:start}.card h3{margin:0;font:600 17px var(--font-heading)}.first{border:2px solid var(--action-primary)}.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{text-align:left;font-weight:500;color:var(--text-secondary);border-bottom:1px solid var(--border-strong);padding:6px 8px}.tbl td{border-bottom:1px solid var(--border-subtle);padding:8px;vertical-align:top}.tbl tr.sel td{background:var(--action-secondary)}.tbl tr{cursor:pointer}.chip{display:inline-flex;border:1px solid var(--border-default);border-radius:3px;padding:1px 7px;font-size:12px;white-space:nowrap}.ok{color:#2f7a4f}.warn{color:#7a5d22}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}.pick{display:flex;gap:6px;flex-wrap:wrap;padding:10px var(--page-pad);border-bottom:1px solid var(--border-subtle);overflow-x:auto}.banner{border:1px solid var(--border-strong);background:var(--surface-sunken);border-radius:6px;padding:9px 12px;font-size:13px}</style></head>
<body><div id="root"></div>
<script src="rw-data.js"></script>
<script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba; const R = window.RW; const KEY = 'sem-role-workspaces-v1';
const ICON = ['today', 'check', 'sources', 'pane', 'hub', 'apps', 'analyse', 'runway', 'connect', 'star', 'ask', 'spam', 'courses', 'today', 'connect', 'apps'];
function Workspace({ r, S, set }) {
  const [sel, setSel] = React.useState(0); const [confirm, setConfirm] = React.useState(false); const done = (S.done || {})[r.id];
  const doIt = () => { set((s) => ({ ...s, done: { ...(s.done || {}), [r.id]: { at: new Date().toISOString(), receipt: r.first.receipt } } })); setConfirm(false); };
  return <><div className="ph"><div><div className="kicker">{r.scope}</div><h1>{r.ws}</h1></div><div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>{r.caps.map((c) => <span key={c} className="chip" title="Repo capability">{c}</span>)}</div></div>
    <div className="banner">Sample data. Every item shows its source; the system that owns it stays official.</div>
    {!done ? <section className="card first" aria-label="Your first step"><span className="kicker">Your first step</span><h3 style={{ fontSize: 22 }}>{r.first.label}</h3>{r.first.high && !confirm && <p className="muted">High-impact: you'll see who's affected and it may need a second approver.</p>}
      {confirm ? <div style={{ display: 'grid', gap: 8 }}><p style={{ margin: 0 }}><b>Impact preview.</b> {r.first.receipt.split('·').slice(1).join('·').trim() || 'Affects one record.'}</p><div style={{ display: 'flex', gap: 8 }}><N.Button onClick={doIt}>Confirm</N.Button><N.Button variant="ghost" onClick={() => setConfirm(false)}>Cancel</N.Button></div></div>
      : <div><N.Button onClick={() => r.first.high ? setConfirm(true) : doIt()}>{r.first.high ? 'Review and continue…' : 'Do it'}</N.Button></div>}</section>
    : <section className="card" style={{ borderColor: '#2f7a4f' }} aria-live="polite"><h3 className="ok">Done — first meaningful action recorded</h3><p style={{ margin: 0 }}>{done.receipt}</p><p className="muted">Receipt {done.at.slice(0, 16).replace('T', ' ')} · audit event written</p></section>}
    <div className="tiles">{r.tiles.map(([l, v]) => <div className="tile" key={l}><span className="muted">{l}</span><b>{v}</b></div>)}</div>
    <div className="card"><h3>{r.queueTitle}</h3><div style={{ overflowX: 'auto' }}><table className="tbl"><thead><tr>{r.cols.map((c) => <th key={c}>{c}</th>)}</tr></thead><tbody>{r.rows.map((row, i) => <tr key={i} className={sel === i ? 'sel' : ''} onClick={() => setSel(i)} tabIndex={0} onKeyDown={(e) => { if (e.key === 'Enter') setSel(i); }}>{row.map((c, j) => <td key={j} style={j === 0 ? { fontWeight: 600 } : null}>{c}</td>)}</tr>)}</tbody></table></div><p className="muted">Selected: {r.rows[sel][0]} — next: {r.rows[sel][r.rows[sel].length - 1]}</p></div>
    {r.panels.length > 0 && <div className="grid">{r.panels.map(([t, b]) => <div className="card" key={t}><h3>{t}</h3><p style={{ margin: 0, fontSize: 14 }}>{b}</p></div>)}</div>}</>;
}
function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
  const fromHash = (location.hash.match(/role=([a-z_]+)/) || [])[1];
  const [id, setId] = React.useState(fromHash || saved.id || R[0].id); const [S, set] = React.useState(saved.S || {});
  React.useEffect(() => { localStorage.setItem(KEY, JSON.stringify({ id, S })); }, [id, S]);
  React.useEffect(() => { const s = document.querySelector('.scroll'); if (s) s.scrollTop = 0; }, [id]);
  const r = R.find((x) => x.id === id) || R[0]; const n = Object.keys(S.done || {}).length;
  return <div className="shell"><N.SideRail current={id} onNavigate={setId} groups={[{ label: 'Role workspaces', items: R.map((x, i) => ({ id: x.id, label: x.name, icon: ICON[i] || 'apps' })) }]} foot={<button onClick={() => set({})} style={{ all: 'unset', cursor: 'pointer', fontSize: 12, color: 'var(--chrome-text-secondary)' }}>{n}/{R.length} first actions · reset</button>} />
    <div className="main"><N.SystemContextBar location={'Semester · ' + r.name} term="Fall 2026" sync="device-only" /><div className="scroll"><div className="page"><Workspace key={r.id} r={r} S={S} set={set} /></div></div></div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
