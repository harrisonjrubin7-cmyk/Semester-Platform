<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semester — Student</title><link rel="stylesheet" href="../../styles.css"><script src="../platform/appearance.js"></script>

<style>html,body,#root{height:100%}body{overflow:hidden}.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}.main{display:flex;flex-direction:column;min-width:0;height:100%}.scroll{flex:1;overflow:auto}.page{max-width:var(--layout-operational);margin:0 auto;padding:28px var(--page-pad) 64px}.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:32px}@media(max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}.stack{display:grid;gap:12px;align-content:start}.sec{margin-top:28px}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--border-subtle);margin-bottom:24px}.row-item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--border-subtle)}.mail-grid{display:grid;grid-template-columns:minmax(140px,180px) minmax(220px,340px) minmax(280px,1fr)}@media(max-width:1100px){.mail-grid{grid-template-columns:minmax(0,1fr)}.mail-grid>*{border-right:0!important;border-bottom:1px solid var(--border-subtle)}}</style></head>

<!-- Precompiled from the .jsx files in this folder. After editing any .jsx, rebuild student.compiled.js (same order as before: data.jsx … StudentApp.jsx). -->
<script>/* Loads student.compiled.json: precompiled .jsx (see note), each file run as its own classic script in order. */fetch('student.compiled.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(C){for(var i=0;i<C.length;i++){var s=document.createElement('script');s.text=C[i][1]+'\n//# sourceURL=student/'+C[i][0];document.body.appendChild(s)}}).catch(function(e){document.body.insertAdjacentHTML('beforeend','<p style="padding:24px">Couldn’t load this workspace ('+e.message+'). Open index.babel.html instead.</p>')});</script>
</body></html>
