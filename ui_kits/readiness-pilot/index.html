<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><script src="../platform/appearance.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><title>Semester — Registration readiness pilot</title>
<style>
html,body,#root{height:100%}body{margin:0;overflow:hidden;background:var(--surface-canvas);color:var(--text-primary);font-family:var(--font-body)}a{color:var(--text-link)}a:hover{color:var(--text-primary)}
.app{display:flex;flex-direction:column;height:100%}.top{display:flex;align-items:center;gap:18px;padding:0 18px;background:#090a0e;color:#eceef2;min-height:48px;flex-wrap:wrap}.tt{font-family:var(--font-heading);font-weight:600;font-size:16px}.ctx{margin-left:auto;display:flex;gap:14px;font-size:11.5px;color:rgba(236,238,242,.64);flex-wrap:wrap}
.bar{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:8px 18px;border-bottom:1px solid var(--border-default);background:var(--surface-base);flex-wrap:wrap}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:4px;flex-wrap:wrap}.steps button{all:unset;cursor:pointer;font-size:13px;padding:5px 10px;border-radius:3px;color:var(--text-secondary)}.steps li[data-s=now] button{background:var(--action-secondary);color:var(--text-primary);font-weight:500}.steps li[data-s=done] button{color:var(--status-success)}.steps button:disabled{opacity:.45;cursor:default}.steps button:focus-visible{outline:2px solid var(--action-primary)}
.screen{flex:1;overflow:auto}.page{max-width:760px;margin:0 auto;padding:28px 20px 64px}.page.withside{max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}@media (max-width:960px){.page.withside{grid-template-columns:1fr}}
h1{margin:4px 0 0;font-family:var(--font-heading);font-weight:600;font-size:28px;letter-spacing:-.015em;line-height:1.15;text-wrap:pretty}.kicker{line-height:1.4;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)}
.lead{margin:0;font-size:17px;max-width:60ch;text-wrap:pretty}.muted{color:var(--text-secondary);font-size:13.5px}.stack{display:grid;gap:16px;align-content:start;min-width:0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{display:grid;gap:16px;padding:12px 0}.hero h1{font-size:36px}
.card{border:1px solid var(--border-default);border-radius:6px;padding:14px 16px;display:grid;gap:10px;background:var(--surface-base)}
.check{list-style:none;margin:0;padding:0;display:grid;gap:8px}.check button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;gap:4px;padding:12px 14px;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-base)}.check button:hover{border-color:var(--border-strong)}.check button[aria-pressed=true]{border-color:var(--action-primary);background:var(--action-secondary)}.check button:focus-visible{outline:2px solid var(--action-primary);outline-offset:2px}
.ch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline}.src{font-size:12px;color:var(--text-tertiary)}
.side{background:#0f1117;color:#eceef2;border-radius:10px;padding:16px;position:sticky;top:0;font-size:13px}.sc{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid rgba(236,238,242,.12)}.sc pre{margin:0;font-family:var(--font-mono,ui-monospace,monospace);font-size:11.5px;line-height:1.55;color:#c9d1dc;white-space:pre-wrap}.sc ol,.sc ul{margin:0;padding-left:18px;display:grid;gap:3px;color:rgba(236,238,242,.64)}.sc li[data-on]{color:#eceef2}
.seg-field{display:grid;gap:4px;justify-items:start;min-width:0}.seg-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);line-height:1.4}
</style></head>
