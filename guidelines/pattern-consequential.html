<!-- @dsCard group="Components & patterns · Trust patterns" viewport="980x760" name="Consequential action" subtitle="Review → preview → confirm → receipt. Reversible work gets Undo instead" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script><style>body{padding:20px 24px;background:var(--surface-canvas)}.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:6px}.col{display:grid;gap:12px;align-content:start}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.step{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13px}.num{width:20px;height:20px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums}.seg{display:inline-flex;gap:4px;flex-wrap:wrap}.seg button{all:unset;cursor:pointer;padding:4px 10px;border-radius:999px;border:1px solid var(--border-default);background:var(--surface-base);font-size:12px}.seg button[aria-pressed=true]{border-color:var(--action-primary);font-weight:600;background:var(--action-secondary)}.seg button:focus-visible{outline:2px solid var(--focus-color);outline-offset:2px}.rl{display:grid;gap:5px;font-size:12.5px;line-height:1.5;margin:0;padding-left:18px}.do{color:var(--status-success);font-weight:600}.no{color:var(--status-danger);font-weight:600}table.t2{border-collapse:collapse;width:100%;font-size:12px}table.t2 td,table.t2 th{text-align:left;padding:5px 7px;border-bottom:1px solid var(--border-subtle);vertical-align:top}table.t2 th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);font-weight:600}.hl{outline:2px solid var(--action-primary);outline-offset:3px;border-radius:4px}.mono{font-family:var(--font-mono);font-size:11px}@media (max-width:760px){.two{grid-template-columns:1fr!important}}</style></head><body><div id="root"></div><script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba;
function Seg({v,set,opts,label}){return <div className="seg" role="group" aria-label={label}>{opts.map(o=>{const [k,l]=Array.isArray(o)?o:[o,o];return <button key={k} type="button" aria-pressed={v===k} onClick={()=>set(k)}>{l}</button>})}</div>}

const KINDS={record:{t:'Withdraw from CHEM 101',subject:'CHEM 101 · Section 03',says:'You leave CHEM 101 and a W is recorded on your transcript.',exactly:'Effective today, Oct 7. Refund: 40% of tuition for this course ($612).',affects:'Registrar, Bursar, your advisor (notified)',dont:'Your other courses and aid status (13 credits, full-time) stay as they are.',rec:{kind:'none',how:'Ask the Registrar if this was a mistake.'},destructive:true},request:{t:'Request a prerequisite override',subject:'CHEM 3010',says:'Sends a request to the Chemistry department. Nothing changes until they approve.',exactly:'Your advisor’s note is attached.',affects:'Chemistry department reviewer',dont:'Your current schedule',rec:{kind:'request',how:'withdraw the request while it’s pending.'},destructive:false},reversible:{t:'Archive “Lab 3 notes”',reversible:true}};
function Demo(){const [k,setK]=React.useState('record');const [step,setStep]=React.useState(0);const [toast,setToast]=React.useState(false);const [arch,setArch]=React.useState(false);const [busy,setBusy]=React.useState(false);const K=KINDS[k];
const pick=(v)=>{setK(v);setStep(0);setToast(false);setArch(false)};const ST=['Review','Preview','Confirm','Receipt'];
return <div style={{display:'grid',gap:14}}><div className="row"><span className="lbl" style={{margin:0}}>Kind of action</span><Seg v={k} set={pick} label="Kind of action" opts={[['record','Changes an official record'],['request','Sends a request'],['reversible','Reversible']]}/></div>
<div className="two" style={{display:'grid',gridTemplateColumns:'1.35fr 1fr',gap:20}}><div className="col">{K.reversible?<><div className="state"><div className="state-title">Lab 3 notes</div><p className="state-body">{arch?'Archived. Find it under Archive.':'Your private notes for BIO 210 Lab 3.'}</p><div className="state-actions"><N.Button size="sm" disabled={arch} onClick={()=>{setArch(true);setToast(true)}}>Archive</N.Button></div></div>{toast&&<N.UndoToast message="Archived “Lab 3 notes”." onUndo={()=>{setArch(false);setToast(false)}} onDismiss={()=>setToast(false)}/>}<p style={{fontSize:12.5,color:'var(--text-secondary)',margin:0}}>No dialog. Do it, say what happened, offer Undo for at least 6 seconds.</p></>
:<><ol className="row" style={{margin:0,padding:0,listStyle:'none',gap:8,fontSize:12}}>{ST.map((s,i)=><li key={s} style={{color:i===step?'var(--text-primary)':'var(--text-tertiary)',fontWeight:i===step?600:400}}>{i+1}. {s}</li>)}</ol>
{step===0&&<div className="state"><div className="state-title">{K.subject}</div><p className="state-body">{k==='record'?'4 credits · Section 03 · Dr. Alvarez · you’re at 17 credits':'You need CHEM 2220 first; you’re taking it in spring.'}</p><div className="state-actions"><N.Button size="sm" variant={k==='record'?'secondary':'primary'} onClick={()=>setStep(1)}>{K.t}…</N.Button></div></div>}
{step>=1&&step<3&&<N.Dialog inline title={K.t+'?'} confirmLabel={busy?'Working…':(k==='record'?'Withdraw: confirm':'Send request')} destructive={K.destructive} cancelLabel={k==='record'?'Keep CHEM 101':'Don’t send'} onCancel={()=>setStep(0)} onConfirm={()=>{setStep(2);setBusy(true);setTimeout(()=>{setBusy(false);setStep(3)},900)}}><N.ActionPreview subject={K.subject} says={K.says} exactly={K.exactly} affects={K.affects} doesNotChange={K.dont} recovery={K.rec} subjectTo="Subject to your school’s official records."/></N.Dialog>}
{step===3&&<N.SuccessState title={k==='record'?'Withdrawal submitted · confirmed by the Registrar':'Request sent to Chemistry'} body={k==='record'?'Receipt REG-88213 · Oct 7, '+new Date().toTimeString().slice(0,5)+'. A W is recorded; your schedule is 13 credits. Refund posts in 5–7 days.':'Request REQ-5531 · you’ll hear within 3 business days. Withdraw it from Requests while it’s pending.'} nextLabel="Back to my schedule"/>}
{step>0&&<button className="lnk" style={{all:'unset',cursor:'pointer',fontSize:12,color:'var(--text-link)'}} onClick={()=>setStep(0)}>Restart</button>}</>}</div>
<div className="col"><div className="lbl">Choose the pattern</div><table className="t2"><thead><tr><th>If the action…</th><th>Use</th></tr></thead><tbody><tr><td>Can be undone by the user</td><td>Do it + UndoToast</td></tr><tr><td>Asks someone else to decide</td><td>Preview + Send; status until decided</td></tr><tr><td>Changes a record, money or access</td><td>Review → preview → confirm → receipt</td></tr><tr><td>Outcome unknown (timeout)</td><td>“Checking…”; never offer a blind retry</td></tr></tbody></table><div className="lbl">Rules</div><ul className="rl"><li>Name the object in the title and both buttons.</li><li>Focus lands on the safe choice.</li><li>Destructive = red ink and hairline, never a red fill.</li><li>State recovery: undo · on request · can’t be undone.</li><li>A receipt says who confirmed it and when, with an ID.</li><li>Submitted isn’t confirmed: show both when they differ.</li></ul></div></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
