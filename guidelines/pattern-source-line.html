<script src="../_ds_bundle.js"></script><style>body{padding:20px 24px;background:var(--surface-canvas)}.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:6px}.col{display:grid;gap:12px;align-content:start}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.step{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13px}.num{width:20px;height:20px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums}.seg{display:inline-flex;gap:4px;flex-wrap:wrap}.seg button{all:unset;cursor:pointer;padding:4px 10px;border-radius:999px;border:1px solid var(--border-default);background:var(--surface-base);font-size:12px}.seg button[aria-pressed=true]{border-color:var(--action-primary);font-weight:600;background:var(--action-secondary)}.seg button:focus-visible{outline:2px solid var(--focus-color);outline-offset:2px}.rl{display:grid;gap:5px;font-size:12.5px;line-height:1.5;margin:0;padding-left:18px}.do{color:var(--status-success);font-weight:600}.no{color:var(--status-danger);font-weight:600}table.t2{border-collapse:collapse;width:100%;font-size:12px}table.t2 td,table.t2 th{text-align:left;padding:5px 7px;border-bottom:1px solid var(--border-subtle);vertical-align:top}table.t2 th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);font-weight:600}.hl{outline:2px solid var(--action-primary);outline-offset:3px;border-radius:4px}.mono{font-family:var(--font-mono);font-size:11px}@media (max-width:760px){.two{grid-template-columns:1fr!important}}</style></head><body><div id="root"></div><script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba;
function Seg({v,set,opts,label}){return <div className="seg" role="group" aria-label={label}>{opts.map(o=>{const [k,l]=Array.isArray(o)?o:[o,o];return <button key={k} type="button" aria-pressed={v===k} onClick={()=>set(k)}>{l}</button>})}</div>}

const SRC={official:['Registrar','Oct 3, 2026','You need 26 more credits to graduate.'],connected:['Google Calendar','Oct 7, 08:10','Your Thursday afternoon is free.'],made:['Built from your syllabus','Oct 1','Lab report 3 is 40% of your BIO 210 grade.']};
function Demo(){const [s,setS]=React.useState('official');const [has,setHas]=React.useState(true);const [m,setM]=React.useState('screen');const [by,when,txt]=SRC[s];
const size={screen:34,deck:46,report:22}[m];
return <div style={{display:'grid',gap:14}}><div className="row"><Seg v={s} set={setS} label="Source" opts={[['official','Official'],['connected','Connected'],['made','App-made']]}/><Seg v={m} set={setM} label="Medium" opts={[['screen','Screen'],['deck','Deck'],['report','Report']]}/><label className="row" style={{fontSize:12.5}}><input type="checkbox" checked={has} onChange={e=>setHas(e.target.checked)}/>A real, openable source exists</label></div>
<div style={{padding:m==='deck'?'28px 32px':'18px 20px',border:'1px solid var(--border-subtle)',borderRadius:8,background:m==='deck'?'var(--ink-900,#090a0e)':'var(--surface-base)',color:m==='deck'?'#f4f1ea':'inherit',minHeight:140,display:'grid',alignContent:'center'}}>{has?<N.SourceLine source={s} by={by} when={when}><p className="editorial" style={{fontSize:size,lineHeight:1.12,margin:0}}>{txt}</p></N.SourceLine>:<p className="editorial" style={{fontSize:size,lineHeight:1.12,margin:0,opacity:.9}}>{txt}</p>}</div>
<p style={{fontSize:12.5,color:'var(--text-secondary)',margin:0}}>{has?'Statement → rule → chip. The chip carries the meaning in words; the line only reinforces it.':'No source, no line. The statement stands alone; it isn’t dressed up as verified.'}</p>
<div className="two" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}><div><div className="lbl"><span className="do">✓</span> Use for</div><ul className="rl"><li>One headline fact per view that a source backs.</li><li>Decks, social cards and reports quoting a real record.</li><li>Facts the reader might act on: credits, deadlines, balances.</li></ul></div><div><div className="lbl"><span className="no">✕</span> Never</div><ul className="rl"><li>As decoration, a divider or a brand flourish.</li><li>For personal or sample data dressed as authority.</li><li>For AI output without a source the reader can open.</li><li>More than one per region.</li></ul></div></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
