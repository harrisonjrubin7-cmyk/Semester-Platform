<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script><style>body{padding:20px 24px;background:var(--surface-canvas)}.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:6px}.col{display:grid;gap:12px;align-content:start}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.step{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13px}.num{width:20px;height:20px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums}.seg{display:inline-flex;gap:4px;flex-wrap:wrap}.seg button{all:unset;cursor:pointer;padding:4px 10px;border-radius:999px;border:1px solid var(--border-default);background:var(--surface-base);font-size:12px}.seg button[aria-pressed=true]{border-color:var(--action-primary);font-weight:600;background:var(--action-secondary)}.seg button:focus-visible{outline:2px solid var(--focus-color);outline-offset:2px}.rl{display:grid;gap:5px;font-size:12.5px;line-height:1.5;margin:0;padding-left:18px}.do{color:var(--status-success);font-weight:600}.no{color:var(--status-danger);font-weight:600}table.t2{border-collapse:collapse;width:100%;font-size:12px}table.t2 td,table.t2 th{text-align:left;padding:5px 7px;border-bottom:1px solid var(--border-subtle);vertical-align:top}table.t2 th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);font-weight:600}.hl{outline:2px solid var(--action-primary);outline-offset:3px;border-radius:4px}.mono{font-family:var(--font-mono);font-size:11px}@media (max-width:760px){.two{grid-template-columns:1fr!important}}</style></head><body><div id="root"></div><script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba;
function Seg({v,set,opts,label}){return <div className="seg" role="group" aria-label={label}>{opts.map(o=>{const [k,l]=Array.isArray(o)?o:[o,o];return <button key={k} type="button" aria-pressed={v===k} onClick={()=>set(k)}>{l}</button>})}</div>}

const REG={grades:{t:'Grades',empty:['No released grades yet','Scores appear when your instructor releases them.'],stale:'Canvas grades may be 6 hours old.',err:['Canvas didn’t answer','Your last released grades are still shown.'],perm:['Grades are hidden by your instructor','Released after the exam window closes.'],ok:['Quiz 4 released','18 / 20 · feedback attached']},schedule:{t:'Schedule',empty:['No classes this week','Fall break. Classes resume Monday.'],stale:'Room changes may be 3 hours old.',err:['The Registrar didn’t answer','Your saved schedule is shown.'],perm:['Only your advisor can edit this plan','Set by the Registrar.'],ok:['Registration submitted','Confirmed for spring · 14 credits']},housing:{t:'Housing',empty:['No housing assignment yet','Assignments post Nov 1.'],stale:'Room data may be 6 hours old.',err:['Housing portal didn’t answer','Your request is safe.'],perm:['Room swaps need Residential Life approval','Ask your RA.'],ok:['Swap request sent','Residential Life replies in 2 days']}};
const S=[['loading','Loading','Skeleton in the final shape. No spinner-only screens.'],['empty','Empty','Say why it’s empty and what happens next. One action if there is one.'],['partial','Partial / stale','Show what you have and how old it is. Never hide stale data.'],['offline','Offline','Last saved data + what’s queued. Writes wait, they aren’t lost.'],['error','Error','What failed, what’s safe, how to retry. No codes.'],['permission','No permission','Who decides and why. Never a dead end.'],['success','Success','What changed, confirmed by whom, what’s next.']];
function Demo(){const [r,setR]=React.useState('grades');const [s,setS]=React.useState('all');const R=REG[r];
const render=(k)=>({loading:<N.LoadingState bars={[14,10,40]}/>,empty:<N.EmptyState title={R.empty[0]} body={R.empty[1]}/>,partial:<N.Notice head={R.t}>{R.stale}</N.Notice>,offline:<N.OfflineStrip queued={2}/>,error:<N.ErrorState title={R.err[0]} body={R.err[1]} recoverLabel="Retry"/>,permission:<N.PermissionNotice changed={R.perm[0]} why={R.perm[1]}/>,success:<N.SuccessState title={R.ok[0]} body={R.ok[1]}/>}[k]);
return <div style={{display:'grid',gap:14}}><div className="row"><span className="lbl" style={{margin:0}}>Region</span><Seg v={r} set={setR} label="Region" opts={[['grades','Grades'],['schedule','Schedule'],['housing','Housing']]}/><span className="lbl" style={{margin:'0 0 0 10px'}}>State</span><Seg v={s} set={setS} label="State" opts={[['all','All seven'],...S.map(([k,l])=>[k,l])]}/></div>
{s==='all'?<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(270px,1fr))',gap:12,fontSize:12}}>{S.map(([k,l])=><div key={k}><div className="lbl">{l}</div>{render(k)}</div>)}</div>:<div className="two" style={{display:'grid',gridTemplateColumns:'1.2fr 1fr',gap:20}}><div>{render(s)}</div><div><div className="lbl">{S.find(x=>x[0]===s)[1]} must…</div><p style={{fontSize:13,margin:0}}>{S.find(x=>x[0]===s)[2]}</p></div></div>}
<table className="t2"><thead><tr><th>State</th><th>Must say</th><th>Component</th></tr></thead><tbody>{S.map(([k,l,m])=><tr key={k}><td><b>{l}</b></td><td>{m}</td><td className="mono">{{loading:'LoadingState',empty:'EmptyState',partial:'Notice + SourceBadge stale',offline:'OfflineStrip',error:'ErrorState',permission:'PermissionNotice',success:'SuccessState'}[k]}</td></tr>)}</tbody></table>
<p style={{fontSize:12.5,color:'var(--text-secondary)',margin:0}}>Every region in every screen ships all seven. Preview them across the app in <a href="../ui_kits/semester-app/All%20Screens.html" style={{color:'var(--text-link)'}}>All Screens</a>.</p></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
