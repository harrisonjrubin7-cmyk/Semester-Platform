<!-- @dsCard group="Components & patterns · Trust patterns" viewport="980x760" name="AI answer anatomy" subtitle="Label · scope · sources · uncertainty · cost · policy · human-confirmed action" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script><style>body{padding:20px 24px;background:var(--surface-canvas)}.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:6px}.col{display:grid;gap:12px;align-content:start}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.step{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13px}.num{width:20px;height:20px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums}.seg{display:inline-flex;gap:4px;flex-wrap:wrap}.seg button{all:unset;cursor:pointer;padding:4px 10px;border-radius:999px;border:1px solid var(--border-default);background:var(--surface-base);font-size:12px}.seg button[aria-pressed=true]{border-color:var(--action-primary);font-weight:600;background:var(--action-secondary)}.seg button:focus-visible{outline:2px solid var(--focus-color);outline-offset:2px}.rl{display:grid;gap:5px;font-size:12.5px;line-height:1.5;margin:0;padding-left:18px}.do{color:var(--status-success);font-weight:600}.no{color:var(--status-danger);font-weight:600}table.t2{border-collapse:collapse;width:100%;font-size:12px}table.t2 td,table.t2 th{text-align:left;padding:5px 7px;border-bottom:1px solid var(--border-subtle);vertical-align:top}table.t2 th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);font-weight:600}.hl{outline:2px solid var(--action-primary);outline-offset:3px;border-radius:4px}.mono{font-family:var(--font-mono);font-size:11px}@media (max-width:760px){.two{grid-template-columns:1fr!important}}</style></head><body><div id="root"></div><script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba;
function Seg({v,set,opts,label}){return <div className="seg" role="group" aria-label={label}>{opts.map(o=>{const [k,l]=Array.isArray(o)?o:[o,o];return <button key={k} type="button" aria-pressed={v===k} onClick={()=>set(k)}>{l}</button>})}</div>}

const PARTS=[['label','Label','Always “AI-assisted”. Never a name, face or persona.'],['scope','Scope','Exactly which data it was allowed to read. Nothing else.'],['sources','Sources','Numbered, each with its own provenance chip. No source, no claim.'],['uncertainty','Uncertainty','Confidence in words, and what it can’t know.'],['cost','Cost','This request and what’s left of the allowance.'],['policy','Policy','The course or institution rule that applies, by name.'],['action','Human-confirmed action','Suggestions only. Anything that changes a record opens a preview first.']];
function Demo(){const [st,setSt]=React.useState('done');const [pol,setPol]=React.useState('allowed');const [hi,setHi]=React.useState(null);const [prop,setProp]=React.useState(null);const [fb,setFb]=React.useState(null);
const refused=pol==='blocked';const state=refused?'refused':st;
return <div style={{display:'grid',gap:14}}><div className="row"><span className="lbl" style={{margin:0}}>State</span><Seg v={st} set={setSt} label="Answer state" opts={[['streaming','Streaming'],['done','Done'],['error','Error']]}/><span className="lbl" style={{margin:'0 0 0 10px'}}>Course policy</span><Seg v={pol} set={setPol} label="Course policy" opts={[['allowed','Outlining allowed'],['blocked','AI not allowed on this task']]}/></div>
<div className="two" style={{display:'grid',gridTemplateColumns:'1.35fr 1fr',gap:20}}><div className={hi?'':''}><N.AIResponse state={state} model="Semester gateway · tier B" generatedAt="Oct 7, 14:02" scope={['BIO 210 materials','Your calendar']} confidence="Moderate. Time estimates are mine; I can’t see your other commitments." cost="1 request · 14 left this week" policy={refused?'BIO 210: no AI help on graded lab reports':'BIO 210: outlining allowed, drafting not'} refusal="BIO 210 doesn’t allow AI help on graded lab reports. I can explain the rubric or point you to the writing center." error="The gateway didn’t answer in time. Nothing was saved." onRetry={()=>setSt('done')} onFeedback={setFb} sources={[{title:'BIO 210 Syllabus §4 · lab report rubric',kind:'official'},{title:'Your lab notes, Oct 1',kind:'personal'},{title:'Calendar · this week',kind:'connected'}]} proposals={refused?[]:[{label:'Add 3 study blocks this week',onConfirm:()=>setProp('preview'),onDecline:()=>setProp('declined')}]}><p>About 3 hours remain on Lab report 3<span className="ai-cite">1</span>. Results is the largest gap<span className="ai-cite">2</span>; Thursday and Friday afternoons are free<span className="ai-cite">3</span>.</p></N.AIResponse>
{prop==='preview'&&<div style={{marginTop:12}}><N.ActionPreview subject="Your calendar" says="Adds three private 60-minute study blocks: Wed 15:00, Thu 14:00, Fri 14:00." affects="Only you" doesNotChange="Your submission, grades and course calendar" recovery={{kind:'undo',how:'delete any block from Calendar.'}}/><div className="row" style={{marginTop:8}}><N.Button size="sm" onClick={()=>setProp(null)}>Cancel</N.Button><N.Button size="sm" variant="primary" onClick={()=>setProp('done')}>Add 3 blocks</N.Button></div></div>}
{prop==='done'&&<div style={{marginTop:12}}><N.SuccessState title="3 study blocks added" body="Receipt SB-2291 · confirmed by you, not the assistant."/></div>}
{prop==='declined'&&<p style={{fontSize:12.5,color:'var(--text-secondary)'}}>Declined. Nothing changed.</p>}
{fb&&<p style={{fontSize:12.5,color:'var(--text-secondary)'}}>Feedback “{fb}” recorded with the answer’s sources and model version.</p>}</div>
<div className="col" style={{gap:6}}><div className="lbl">Seven parts · hover to locate</div>{PARTS.map(([k,l,m],i)=><div key={k} className="step" onMouseEnter={()=>setHi(k)} onMouseLeave={()=>setHi(null)} onFocus={()=>setHi(k)} onBlur={()=>setHi(null)} tabIndex={0} style={{padding:'4px 6px',borderRadius:6,background:hi===k?'var(--action-secondary)':'transparent'}}><span className="num">{i+1}</span><span><b>{l}.</b> {m}</span></div>)}</div></div>
<div className="two" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}><div><div className="lbl">Do</div><ul className="rl"><li>Refuse by naming the policy and offering an allowed alternative.</li><li>Say “I can’t see …” when scope limits the answer.</li><li>Keep the answer when an action is declined.</li><li>Log feedback with sources and model version.</li></ul></div><div><div className="lbl">Don’t</div><ul className="rl"><li>Give the assistant a name, avatar or “I think you’ll love…”.</li><li>Cite a source the user can’t open.</li><li>Run any action from the answer without a preview.</li><li>Use student records outside the stated scope.</li></ul></div></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
