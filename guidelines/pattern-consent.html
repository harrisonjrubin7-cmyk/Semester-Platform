<!-- @dsCard group="Components & patterns · Trust patterns" viewport="980x760" name="Consent & sharing" subtitle="One decision at a time · default private · visible history · revoke anywhere" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script><style>body{padding:20px 24px;background:var(--surface-canvas)}.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:6px}.col{display:grid;gap:12px;align-content:start}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.step{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13px}.num{width:20px;height:20px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums}.seg{display:inline-flex;gap:4px;flex-wrap:wrap}.seg button{all:unset;cursor:pointer;padding:4px 10px;border-radius:999px;border:1px solid var(--border-default);background:var(--surface-base);font-size:12px}.seg button[aria-pressed=true]{border-color:var(--action-primary);font-weight:600;background:var(--action-secondary)}.seg button:focus-visible{outline:2px solid var(--focus-color);outline-offset:2px}.rl{display:grid;gap:5px;font-size:12.5px;line-height:1.5;margin:0;padding-left:18px}.do{color:var(--status-success);font-weight:600}.no{color:var(--status-danger);font-weight:600}table.t2{border-collapse:collapse;width:100%;font-size:12px}table.t2 td,table.t2 th{text-align:left;padding:5px 7px;border-bottom:1px solid var(--border-subtle);vertical-align:top}table.t2 th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);font-weight:600}.hl{outline:2px solid var(--action-primary);outline-offset:3px;border-radius:4px}.mono{font-family:var(--font-mono);font-size:11px}@media (max-width:760px){.two{grid-template-columns:1fr!important}}</style></head><body><div id="root"></div><script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba;
function Seg({v,set,opts,label}){return <div className="seg" role="group" aria-label={label}>{opts.map(o=>{const [k,l]=Array.isArray(o)?o:[o,o];return <button key={k} type="button" aria-pressed={v===k} onClick={()=>set(k)}>{l}</button>})}</div>}

const WHO=['Jonas Lindqvist (guardian)','Dr. Kendra Lee (advisor)','Ryman Health (employer)'];const WHAT=[['final','Final grades','Course letter grades once posted. Not scores, feedback or notes.'],['schedule','Schedule','Class times and rooms this term.'],['bill','Bill and payments','Balance, due dates, receipts.']];const HOW=[['term','Until end of term (Dec 19)'],['30','30 days'],['open','Until I turn it off']];
function Demo(){const [step,setStep]=React.useState(0);const [who,setWho]=React.useState(null);const [what,setWhat]=React.useState(null);const [how,setHow]=React.useState(null);const [st,setSt]=React.useState('private');const [log,setLog]=React.useState([{title:'Account created · everything private',who:'System',when:'Aug 20 · 09:00'}]);
const W=WHAT.find(x=>x[0]===what);const H=HOW.find(x=>x[0]===how);const add=(t)=>setLog(l=>[{title:t,who:'You',when:'Oct 7 · '+new Date().toTimeString().slice(0,5)},...l]);
const reset=()=>{setStep(0);setWho(null);setWhat(null);setHow(null)};
const steps=['Who','What','How long','Review'];
return <div className="two" style={{display:'grid',gridTemplateColumns:'1.15fr 1fr',gap:22}}><div className="col"><div className="row"><span className="lbl" style={{margin:0}}>Share something</span><ol className="row" style={{margin:0,padding:0,listStyle:'none',gap:6,fontSize:12}}>{steps.map((s,i)=><li key={s} style={{color:i===step?'var(--text-primary)':'var(--text-tertiary)',fontWeight:i===step?600:400}}>{i+1}. {s}</li>)}</ol></div>
<div className="state" style={{display:'grid',gap:10}}>{step===0&&<><div className="state-title">Who are you sharing with?</div>{WHO.map(w=><label key={w} className="row" style={{fontSize:13}}><input type="radio" name="who" checked={who===w} onChange={()=>setWho(w)}/>{w}</label>)}<div className="state-actions"><N.Button size="sm" variant="primary" disabled={!who} onClick={()=>setStep(1)}>Next</N.Button></div></>}
{step===1&&<><div className="state-title">What can {who.split(' (')[0]} see?</div><p className="state-body" style={{margin:0}}>Pick one. Add others as separate decisions.</p>{WHAT.map(([k,l,m])=><label key={k} style={{display:'grid',gridTemplateColumns:'20px 1fr',gap:6,fontSize:13}}><input type="radio" name="what" checked={what===k} onChange={()=>setWhat(k)}/><span><b>{l}</b><br/><span style={{color:'var(--text-secondary)'}}>{m}</span></span></label>)}<div className="state-actions"><N.Button size="sm" onClick={()=>setStep(0)}>Back</N.Button><N.Button size="sm" variant="primary" disabled={!what} onClick={()=>setStep(2)}>Next</N.Button></div></>}
{step===2&&<><div className="state-title">For how long?</div>{HOW.map(([k,l])=><label key={k} className="row" style={{fontSize:13}}><input type="radio" name="how" checked={how===k} onChange={()=>setHow(k)}/>{l}</label>)}<div className="state-actions"><N.Button size="sm" onClick={()=>setStep(1)}>Back</N.Button><N.Button size="sm" variant="primary" disabled={!how} onClick={()=>setStep(3)}>Review</N.Button></div></>}
{step===3&&<><div className="state-title">Share {W[1].toLowerCase()} with {who.split(' (')[0]}?</div><p className="state-body" style={{margin:0}}>{W[2]} {H[1]}. They’re notified; you can turn it off any time and they lose access at once.</p><div className="state-actions"><N.Button size="sm" onClick={()=>setStep(2)}>Back</N.Button><N.Button size="sm" variant="primary" onClick={()=>{setSt(how==='30'?'expiring':'shared');add('You shared '+W[1].toLowerCase()+' with '+who.split(' (')[0]+' · '+H[1].toLowerCase());setStep(4)}}>Share {W[1].toLowerCase()}</N.Button><N.Button size="sm" onClick={reset}>Not now</N.Button></div></>}
{step===4&&<><N.ConsentBadge state={st} recipient={who} scope={W[1]} purpose="Family visibility" expires={how==='open'?undefined:H[1].replace('Until ','')} onManage={()=>{}}/><div className="state-actions">{st!=='revoked'?<N.Button size="sm" onClick={()=>{setSt('revoked');add('You turned off '+W[1].toLowerCase()+' for '+who.split(' (')[0])}}>Turn off sharing</N.Button>:<N.Button size="sm" onClick={reset}>Share something else</N.Button>}</div></>}</div>
<div className="lbl">Revoke from anywhere</div><table className="t2"><tbody>{[['The shared item itself','Turn off sharing on the badge'],['Me → Sharing','Every active share in one list'],['Notification','“Jonas viewed final grades” has Turn off'],['Account deletion / graduation','All shares end; history kept']].map(([a,b])=><tr key={a}><td><b>{a}</b></td><td>{b}</td></tr>)}</tbody></table></div>
<div className="col"><div className="lbl">History · visible to you, always</div><N.DecisionTrail items={st==='shared'||st==='expiring'?[{title:(who||'').split(' (')[0]+' viewed '+(W?W[1].toLowerCase():''),who:'Recipient',when:'just now'},...log]:log}/><div className="lbl">Rules</div><ul className="rl"><li>Default private. Nothing is shared by onboarding or by role.</li><li>One recipient, one scope, one duration per decision. No bundles.</li><li>Name exactly what’s included and what isn’t.</li><li>Revoking takes effect at once in screens, exports, search and caches.</li><li>FERPA: college records belong to the student; guardians see only what’s shared.</li></ul></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
