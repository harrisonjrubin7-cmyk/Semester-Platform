<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script><style>body{padding:20px 24px;background:var(--surface-canvas)}.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:6px}.col{display:grid;gap:12px;align-content:start}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.step{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13px}.num{width:20px;height:20px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums}.seg{display:inline-flex;gap:4px;flex-wrap:wrap}.seg button{all:unset;cursor:pointer;padding:4px 10px;border-radius:999px;border:1px solid var(--border-default);background:var(--surface-base);font-size:12px}.seg button[aria-pressed=true]{border-color:var(--action-primary);font-weight:600;background:var(--action-secondary)}.seg button:focus-visible{outline:2px solid var(--focus-color);outline-offset:2px}.rl{display:grid;gap:5px;font-size:12.5px;line-height:1.5;margin:0;padding-left:18px}.do{color:var(--status-success);font-weight:600}.no{color:var(--status-danger);font-weight:600}table.t2{border-collapse:collapse;width:100%;font-size:12px}table.t2 td,table.t2 th{text-align:left;padding:5px 7px;border-bottom:1px solid var(--border-subtle);vertical-align:top}table.t2 th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);font-weight:600}.hl{outline:2px solid var(--action-primary);outline-offset:3px;border-radius:4px}.mono{font-family:var(--font-mono);font-size:11px}@media (max-width:760px){.two{grid-template-columns:1fr!important}}</style></head><body><div id="root"></div><script type="text/babel">
const N = window.SemesterDesignSystem_e9f3ba;
function Seg({v,set,opts,label}){return <div className="seg" role="group" aria-label={label}>{opts.map(o=>{const [k,l]=Array.isArray(o)?o:[o,o];return <button key={k} type="button" aria-pressed={v===k} onClick={()=>set(k)}>{l}</button>})}</div>}

const L=[['official','Your institution’s own record, read from its system.'],['connected','From a calendar or account you connected, checked recently.'],['made','The app built this from sources you gave it.'],['personal','You entered this yourself. Nothing has checked it.'],['sample','Shipped as a demonstration. Not your semester.'],['stale','From a connection not checked lately. It may have moved.']];
const R=Object.fromEntries(L.map(([k],i)=>[k,i]));
const FACT={official:'Thu 9:30, Stevenson 1210',connected:'Thu 9:30, Stevenson 1210',made:'Thu 9:30 (from your syllabus PDF)',personal:'Thu 10:00 (you typed this)',sample:'Mon 8:00 (demo)',stale:'Thu 9:00, Stevenson 2201 (last checked 9 days ago)'};
function Demo(){const [a,setA]=React.useState('stale');const [b,setB]=React.useState('personal');const win=R[a]<=R[b]?a:b;const lose=win===a?b:a;
return <div className="two" style={{display:'grid',gridTemplateColumns:'1fr 1.05fr',gap:22}}><div className="col"><div className="lbl">The ladder</div><ol style={{margin:0,padding:0,listStyle:'none',display:'grid',gap:8}}>{L.map(([k,m],i)=><li key={k} style={{display:'grid',gridTemplateColumns:'20px 150px 1fr',gap:10,alignItems:'baseline',fontSize:13,padding:'3px 6px',borderRadius:6,background:k===a||k===b?'var(--action-secondary)':'transparent'}}><span className="mono" style={{color:'var(--text-tertiary)'}}>{i}</span><N.SourceBadge source={k}/><span style={{color:'var(--text-secondary)'}}>{m}</span></li>)}</ol>
<p style={{fontSize:12.5,color:'var(--text-secondary)',margin:0}}>Stale sits below yours on purpose: an old feed shouldn’t silently overrule something you just typed. Sample never outranks anything real.</p></div>
<div className="col"><div className="lbl">Two sources disagree · which is shown?</div><div className="row"><label className="row" style={{fontSize:12.5}}>A <select value={a} onChange={e=>setA(e.target.value)}>{L.map(([k])=><option key={k}>{k}</option>)}</select></label><label className="row" style={{fontSize:12.5}}>B <select value={b} onChange={e=>setB(e.target.value)}>{L.map(([k])=><option key={k}>{k}</option>)}</select></label></div>
<div className="state" style={{display:'grid',gap:8}}><div className="state-title">CHEM 210 lecture</div><div style={{fontSize:15}}>{FACT[win]}</div><N.ProvenanceChips origin={win} cues={win===lose?[]:['1 other source disagrees']} age={win==='stale'?'9 days':win==='official'?'12 min':undefined}/>{win!==lose&&<details style={{fontSize:12.5}}><summary style={{cursor:'pointer'}}>Also seen: {FACT[lose]}</summary><p style={{margin:'6px 0 0',color:'var(--text-secondary)'}}>Ranked lower ({lose}, rung {R[lose]}). Kept, not deleted. Report it if the shown value is wrong.</p></details>}{a===b&&<p style={{fontSize:12.5,color:'var(--text-secondary)',margin:0}}>Same rung: newest wins; ties show both.</p>}</div>
<table className="t2"><tbody>{[['Show the winner','with its chip; never blend two values'],['Keep the loser','one tap away, with its rung'],['Official vs yours','official wins, but your note stays visible'],['Stale official','drops below yours until re-checked'],['AI-made','never above connected; never presented as official']].map(([x,y])=><tr key={x}><td><b>{x}</b></td><td>{y}</td></tr>)}</tbody></table></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
